    } else if (t.status === 'slot'){
      x = L.trayX + pad + (t.si + .04) * cell;
      y = L.trayY + pad + .01 * cell;
      s = k;
      zi = 400 + t.si;
    } else if (t.status === 'hold'){
      const col = G.hold[t.hc];
      x = L.holdX + (t.hc * 1.08 + .04) * cell;
      y = L.holdY - t.hd * 5;
      s = k;
      zi = 300 + t.hd;
      blocked = col[col.length - 1] !== t;
    }
    if (t.status !== 'gone'){
      if (!REDUCED && t.prev && t.prev !== t.status && t.prev !== 'gone' && t.px !== undefined) flyArc(t, t.px, t.py, t.ps, x, y, +s);
      el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s})`;
      el.style.zIndex = zi;
      el.classList.remove('hide');
      if (t.prev === 'gone' && !REDUCED) replay(el, 'back');
      t.px = x;
      t.py = y;
      t.ps = +s;
    }
    t.prev = t.status;
    el.classList.toggle('blocked', blocked);
    el.classList.toggle('onboard', t.status === 'board');
    el.classList.toggle('inslot', t.status === 'slot');
    el.classList.toggle('gone', t.status === 'gone');
    el.classList.toggle('pending', t.pending);
    const live = (t.status === 'board' || t.status === 'hold') && !blocked;
    el.tabIndex = live ? 0 : -1;
    el.setAttribute('aria-label', ICONS[t.type].n + (t.bomb > 0 ? `，炸弹 ${t.bomb}` : '') + (t.status === 'slot' ? '，在口袋里' : blocked ? '，被压住了' : ''));
    if (t.bomb > 0 || t.fuseEl){
      if (!t.fuseEl){
        t.fuseEl = document.createElement('b');
        t.fuseEl.className = 'fuse';
        t.art.parentElement.appendChild(t.fuseEl);
      }
      t.fuseEl.hidden = !(t.bomb > 0);
      if (t.bomb > 0){
        t.fuseEl.textContent = t.bomb;
        t.fuseEl.classList.toggle('hot', t.status === 'slot' && t.bomb <= 2);
      }
    }
  }
  hud();
  syncBlind();
  saveSoon();
}
// 蒙眼：口袋里的牌扣着；刚放进来的那张、消掉一组后剩下的牌会亮一会儿；输了全部翻开
let blindTimer = 0;
function syncBlind(){
  const blind = !!(G.rule && G.rule.blind) && !G.over && !G.won, now = performance.now();
  let next = Infinity;
  for (const t of G.tiles){
    if (!t.el) continue;
    const showing = now < (t.revealUntil || 0);
    const down = blind && t.status === 'slot' && !t.pending && !showing;
    if (t.el.classList.contains('facedown') !== down){
      t.el.classList.toggle('facedown', down);
      if (!REDUCED && t.status === 'slot'){
        t.el.style.setProperty('--fd', '0ms');
        replay(t.el, 'flip');
      }
    }
    if (blind && t.status === 'slot' && showing) next = Math.min(next, t.revealUntil);
  }
  clearTimeout(blindTimer);
  if (next < Infinity) blindTimer = setTimeout(syncBlind, next - now + 20);
}

function hud(){
  const total = G.tiles.length;
  let left = 0;
  for (const t of G.tiles) if (t.status !== 'gone') left++;
  const p = total ? ((total - left) / total).toFixed(4) : 0;
  const daily = G.mode === 'daily' || G.mode === 'trial';
  $('lvlPre').hidden = daily;
  $('lvlPost').hidden = daily;
  $('lvlNum').textContent = G.mode === 'trial' ? '练习' : daily ? '每日' : G.level;
  $('left').textContent = left;
  $('layoutName').textContent = G.cfg.intro ? '' : `${G.label} · `;
  $('needle').style.left = `calc((100% - 40px) * ${p})`;
  $('sewn').style.width = `calc((100% - 40px) * ${p} + 6px)`;
  const n = G.slot.length;
  $('meterText').textContent = `口袋 ${n}/${G.cap}`;
  pips.forEach((pip, i) => { pip.classList.toggle('on', i < n); pip.hidden = i >= G.cap; });
  meter.classList.toggle('hot', n >= G.cap - 2);
  [...trough.children].forEach((c, i) => c.classList.toggle('dead', i >= G.cap));
  trough.classList.toggle('bombs', !!(G.rule && G.rule.bomb));
  toolState('toolOut', 'nOut', G.tools.out, '移出');
  toolState('toolUndo', 'nUndo', G.tools.undo, '撤回');
  toolState('toolShuffle', 'nShuffle', G.tools.shuffle, '洗牌');
  shelf.hidden = !G.hold.some(c => c.length);
}
function toolState(id, nid, n, name){
  const b = $(id);
  b.disabled = n <= 0;
  const nEl = $(nid);
  if (nEl.textContent !== String(n)){
    if (+nEl.textContent > n && !REDUCED) replay(nEl, 'bump');
    nEl.textContent = n;
  }
  b.setAttribute('aria-label', n > 0 ? `${name}，还能用 ${n} 次` : `${name}，这一局已经用完`);
}

function mountTiles(deal){
  homeEl.hidden = true;
  computeHeights(G.tiles);
  for (const el of stage.querySelectorAll('.tile:not(.leaving)')){
    if (REDUCED || !deal) el.remove();
    else { el.classList.add('leaving'); setTimeout(() => el.remove(), 300); }
  }
  const frag = document.createDocumentFragment();
  const order = G.tiles.slice().sort((a, b) => a.y - b.y || a.x - b.x || a.z - b.z);
  const maxZ = Math.max(1, ...G.tiles.map(t => t.z));
  for (const t of order){
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'tile';
    if (t.pile) el.classList.add('pile');
    const face = document.createElement('span');
    face.className = 'face';
    face.setAttribute('aria-hidden', 'true');
    const art = document.createElement('i');
    art.className = 'art';
    face.appendChild(art);
    el.appendChild(face);
    el.addEventListener('click', () => onTile(t));
    if (deal){
      el.style.setProperty('--d', Math.round(t.z / maxZ * 700 + Math.random() * 110) + 'ms');
      el.style.setProperty('--r', (Math.random() * 12 - 6).toFixed(1) + 'deg');
    }
    if (t.status === 'gone') el.classList.add('gone', 'hide');
    t.el = el;
    t.art = art;
    t.shown = -1;
    frag.appendChild(el);
  }
  stage.appendChild(frag);
  bed.hidden = !!G.cfg.intro || !G.tiles.some(t => Math.abs(t.y - 7.62) < .01);
  stage.classList.add('instant');
  stage.classList.toggle('dealing', !!deal);
  render();
  void stage.offsetWidth;
  stage.classList.remove('instant');
  clearTimeout(mountTiles.timer);
  if (deal) mountTiles.timer = setTimeout(() => stage.classList.remove('dealing'), 1500);
}

function startLevel(level, seed){
  let built = buildLevel(level, seed);
  for (let i = 0; !built && i < 3; i++){ seed = newSeed(); built = buildLevel(level, seed); }
  if (!built){ level = 1; seed = newSeed(); built = buildLevel(1, seed); }
  G.epoch++;
  Object.assign(G, {
    mode: 'normal', day: '', rule: null, cap: CAP, level, seed, cfg: built.cfg, tiles: built.tiles, label: built.label, slot: [], hold: [[], [], []],
    tools: {out: 1, undo: 1, shuffle: 1}, history: [], moves: 0,
    over: false, won: false, pending: 0, acc: 0, running: false
  });
  savePrefs(built.cfg.intro ? {level, mode: 'normal'} : {level, mode: 'normal', lastArch: archOf(seed).id});
  closeDialog();
  mountTiles(true);
  startClock();
  toast(level === 1 ? '点亮着的牌，凑齐 3 张一样的就会消掉'
    : level === FINAL ? `最后一关 · ${G.label} · ${G.tiles.length} 张牌`
    : level > FINAL ? `无尽模式 · 第 ${level} 关 · ${G.tiles.length} 张牌`
    : `第 ${level}/${FINAL} 关 · ${G.label} · ${G.tiles.length} 张牌`);
  if (level >= 2 && !prefs.peekTold){
    savePrefs({peekTold: true});
    setTimeout(() => toast('看不清怎么叠的？按住口袋上方的层次按钮，或两指在牌堆上拖', 3600), 2300);
  }
}

/* ---------- 点牌 ---------- */
function onTile(t){
  if (G.tiles[t.id] !== t || G.over || G.won) return;
  if (performance.now() < (G.flipUntil || 0)) return;
  if ((peekSrc && peekSrc !== 'gyro') || performance.now() - peekEndedAt < 350) return;
  if (t.status === 'board'){
    if (!isFree(t)) return nudge(t);
  } else if (t.status === 'hold'){
    const col = G.hold[t.hc];
    if (col[col.length - 1] !== t) return;
  } else return;
  if (G.slot.length >= G.cap) return;

  snapshot();
  if (t.status === 'hold'){
    const col = G.hold[t.hc];
    col.splice(col.indexOf(t), 1);
  }
  t.status = 'slot';
  let at = G.slot.length;
  for (let i = G.slot.length - 1; i >= 0; i--){
    if (G.slot[i].type === t.type && !G.slot[i].pending){ at = i + 1; break; }
  }
  G.slot.splice(at, 0, t);
  t.revealUntil = performance.now() + 900;
  G.moves++;
  Sound.tap();

  // 口袋里别的炸弹各走一步（刚放进来的这颗从下一步开始数），记下这一步数到 0 的
  const lit = [];
  if (G.rule && G.rule.bomb){
    for (const b of G.slot){
      if (b === t || !(b.bomb > 0) || b.pending) continue;
      b.bomb--;
      if (b.bomb === 0) lit.push(b);
    }
  }
  const same = G.slot.filter(s => s.type === t.type && !s.pending);
  if (same.length >= 3){
    for (const s of same.slice(0, 3)) s.pending = true;
    G.pending += 3;
    const ep = G.epoch;
    setTimeout(() => settle(ep), REDUCED ? 220 : 340);
  }
  // 数到 0 还没凑齐的炸弹爆炸；正好这一步凑齐的就算拆掉了
  for (const b of lit) if (!b.pending) explode(b);
  if (!G.pending && G.slot.length >= G.cap){
    render();
    lose();
    return;
  }
  render();
}
// 炸弹爆炸：炸坏最右边一格口袋；炸弹本身变回普通牌，还留在口袋里
function explode(b){
  b.bomb = -1;
  G.cap = Math.max(1, G.cap - 1);
  Sound.boom();
  if (b.px !== undefined) burst(b.px + L.cell * .46, b.py + L.cell * .46);
  shakePocket();
  toast(`轰！炸坏了一格口袋，还剩 ${G.cap} 格`);
}

function settle(ep){
  if (ep !== G.epoch) return;
  const done = G.slot.filter(s => s.pending);
  if (!done.length) return;
  const groups = {};
  for (const s of done) (groups[s.type] = groups[s.type] || []).push(s);
  if (!REDUCED && stage.animate){
    for (const g of Object.values(groups)){
      const mid = g[Math.floor(g.length / 2)];
      for (const s of g){
        if (s === mid) continue;
        if (s.anim) s.anim.cancel();
        s.anim = s.el.animate([{transform: tf(s.px, s.py, s.ps)}, {transform: tf(mid.px, mid.py, mid.ps)}],
          {duration: 150, easing: 'cubic-bezier(.55,0,.8,.3)', fill: 'forwards'});
      }
    }
    setTimeout(() => finishSettle(ep, done, groups), 150);
  } else finishSettle(ep, done, groups);
}
function finishSettle(ep, done, groups){
  if (ep !== G.epoch) return;
  G.slot = G.slot.filter(s => !done.includes(s));
  for (const g of Object.values(groups)){
    const mid = g[Math.floor(g.length / 2)];
    for (const s of g){
      if (s.anim){ s.anim.cancel(); s.anim = null; }
      s.el.classList.remove('flying');
      s.el.style.transform = tf(mid.px, mid.py, mid.ps);
      s.pending = false;
      s.status = 'gone';
    }
    burst(mid.px + L.cell * .46, mid.py + L.cell * .46);
  }
  G.pending = 0;
  if (G.rule && G.rule.blind) for (const t of G.slot) t.revealUntil = performance.now() + 2000;
  Sound.match();
  render();
  if (G.tiles.every(t => t.status === 'gone')) win();
  else if (G.slot.length >= G.cap && !G.pending) lose();
}

function nudge(t){
  replay(t.el, 'nope');
  Sound.bump();
  if (REDUCED) return;
  const above = t.coveredBy.filter(a => a.status === 'board');
  const tops = above.filter(isFree);
  for (const a of (tops.length ? tops : above)) replay(a.el, 'hint');
}

/* ---------- 撤回用的快照 ---------- */
function snapshot(){
  G.history.push({
    st: G.tiles.map(t => (t.pending ? 3 : ST[t.status])),
    ty: G.tiles.map(t => t.type),
    slot: G.slot.filter(t => !t.pending).map(t => t.id),
    hold: G.hold.map(c => c.map(t => t.id)),
    bm: G.tiles.map(t => t.bomb || 0), cap: G.cap
  });
  if (G.history.length > 80) G.history.shift();
}
function restoreSnap(s){
  G.epoch++;
  G.pending = 0;
  G.tiles.forEach((t, i) => { t.status = STN[s.st[i]]; t.type = s.ty[i]; t.pending = false; });
  G.slot = s.slot.map(id => G.tiles[id]);
  G.hold = s.hold.map(c => c.map(id => G.tiles[id]));
  if (s.bm) G.tiles.forEach((t, i) => { t.bomb = s.bm[i]; });
  if (s.cap) G.cap = s.cap;
}

/* ---------- 道具 ---------- */
function revive(){ if (G.over){ G.over = false; startClock(); } }
function busyToast(){ toast('等这一组消完再用道具'); }

function useOut(){
  if (G.won) return;
  if (G.pending) return busyToast();
  if (G.tools.out <= 0) return toast(G.rule && G.rule.bare ? '今天是「空手」：三个道具都不能用' : '「移出」这一局已经用过了');
  if (!G.slot.length) return toast('口袋是空的，没有牌可以移出');
  snapshot();
  G.slot.splice(0, 3).forEach((t, i) => { t.status = 'hold'; G.hold[i].push(t); });
  G.tools.out--;
  revive();
  Sound.tool();
  render();
}

function useUndo(){
  if (G.won) return;
  if (G.pending) return busyToast();
  if (G.tools.undo <= 0) return toast(G.rule && G.rule.bare ? '今天是「空手」：三个道具都不能用' : '「撤回」这一局已经用过了');
  if (!G.history.length) return toast('还没有可以撤回的一步');
  restoreSnap(G.history.pop());
  G.tools.undo--;
  revive();
  Sound.tool();
  render();
}

// 洗牌时也按“能走通”的方式重新分配图案，走不通才退回随机打乱
function reshuffle(pool){
  const supply = {};
  for (const t of pool) supply[t.type] = (supply[t.type] || 0) + 1;
  const res = plan(pool, {
    supply, slot: G.slot.map(t => t.type), hold: G.hold.flat().map(t => t.type),
    interleave: .2, maxSlot: Math.min(4, G.cap - 2), cap: G.cap, rng: Math.random
  });
  if (res){
    for (const t of pool) t.type = res.assign.get(t.id);
    return;
  }
  const types = shuffled(pool.map(t => t.type), Math.random);
  pool.forEach((t, i) => { t.type = types[i]; });
}

function useShuffle(){
  if (G.won) return;
  if (G.pending) return busyToast();
  if (G.tools.shuffle <= 0) return toast(G.rule && G.rule.bare ? '今天是「空手」：三个道具都不能用' : '「洗牌」这一局已经用过了');
  if (G.over) return toast('口袋已经满了，洗牌帮不上忙');
  const pool = G.tiles.filter(t => t.status === 'board');
  if (pool.length < 3) return toast('场上的牌不多了，不用洗');
  snapshot();
  reshuffle(pool);
  G.tools.shuffle--;
  if (!REDUCED){
    const base = Math.min(...pool.map(t => t.x + t.y));
    let last = 0;
    pool.forEach(t => t.el.classList.remove('flip'));
    void stage.offsetWidth;
    for (const t of pool){
      const d = Math.round((t.x + t.y - base) * 22);
      last = Math.max(last, d);
      t.artLock = true;
      t.el.style.setProperty('--fd', d + 'ms');
      t.el.classList.add('flip');
      setTimeout(() => { t.artLock = false; updateArt(t); }, d + 180);
    }
    G.flipUntil = performance.now() + last + 380;
  }
  Sound.tool();
  render();
}

/* ---------- 输赢 ---------- */
function lose(){
  G.over = true;
  stopClock();
  saveGame();
  syncBlind();
  Sound.lose();
  const ep = G.epoch;
  setTimeout(shakePocket, REDUCED ? 0 : 330);
  setTimeout(() => { if (G.over && ep === G.epoch) showLose(); }, REDUCED ? 450 : 900);
}
function showLose(){
  const left = G.tiles.filter(t => t.status !== 'gone').length;
  const actions = [];
  if (G.tools.out > 0) actions.push({label: '用「移出」腾出 3 格，接着玩', primary: true, run: () => { closeDialog(); useOut(); }});
  if (G.tools.undo > 0 && G.history.length) actions.push({label: '撤回最后一步', primary: !actions.length, run: () => { closeDialog(); useUndo(); }});
  if (G.mode === 'trial'){
    actions.push({label: '同样的模式再来一副', primary: !actions.length, run: () => startTrial(...trialPick)});
    actions.push({label: '换个模式', run: showTrialPicker});
    actions.push({label: backLabel(), run: backToLevels});
  } else if (G.mode === 'daily'){
    actions.push({label: '重玩今天这一局', primary: !actions.length, run: startDaily});
    actions.push({label: backLabel(), run: backToLevels});
  } else {
    actions.push({label: '重玩这一副牌', primary: !actions.length, run: () => startLevel(G.level, G.seed)});
    actions.push({label: '换一副新牌', run: () => startLevel(G.level, freshSeed(G.level))});
  }
  openDialog({kind: 'lose', art: 'sad', title: '口袋满了', body: `7 格都塞满了，还没凑出 3 张一样的。场上还剩 ${left} 张牌。`, actions});
}

function win(){
  G.won = true;
  stopClock();
  saveGame();
  if (G.mode === 'daily') return winDaily();
  if (G.mode === 'trial') return winTrial();
  const secs = Math.round(elapsed() / 1000), lv = G.level;
  const best = (prefs.best || {})[lv];
  const record = !best || secs < best;
  if (record) savePrefs({best: Object.assign({}, prefs.best, {[lv]: secs})});
  if (lv === FINAL) return celebrateFinal(secs);
  Sound.win();
  confetti();
  savePrefs({level: lv + 1});
  setTimeout(() => {
    if (lv === 1){
      openDialog({kind: 'win', art: 'hop', title: '热身完成', body: '第 2 关才是正题：牌多、压得深。放心，发牌前已经算好了一条能清空的路线。', actions: [
        {label: '进入第 2 关', primary: true, run: () => startLevel(2, freshSeed(2))}
      ]});
    } else {
      openDialog({kind: 'win', art: 'hop', title: lv > FINAL ? `无尽模式第 ${lv} 关通关` : `第 ${lv} 关通关！`,
        body: `用时 ${fmt(secs)}，点了 ${G.moves} 次。` + (record ? '这是你这一关最快的一次。' : `这一关最快 ${fmt(best)}。`),
        actions: [
          {label: lv + 1 === FINAL ? `挑战最后一关（第 ${FINAL} 关）` : lv >= FINAL ? `继续无尽模式第 ${lv + 1} 关` : `挑战第 ${lv + 1} 关`,
            primary: true, run: () => startLevel(lv + 1, freshSeed(lv + 1))},
          {label: `再来一副第 ${lv} 关`, run: () => startLevel(lv, freshSeed(lv))}
        ]});
    }
  }, REDUCED ? 520 : 800);
}

function celebrateFinal(secs){
  const n = (prefs.finished || 0) + 1;
  savePrefs({level: 1, finished: n});
  Sound.fanfare();
  confetti();
  if (!REDUCED){ setTimeout(confetti, 650); setTimeout(confetti, 1300); }
  const best = prefs.best || {};
  const grid = document.createElement('div');
  grid.className = 'final-stats';
  for (let l = 1; l <= FINAL; l++){
    const cell = document.createElement('div');
    const k = document.createElement('span');
    k.textContent = `第 ${l} 关`;
    const v = document.createElement('b');
    v.textContent = best[l] ? fmt(best[l]) : '—';
    cell.append(k, v);
    grid.appendChild(cell);
  }
  setTimeout(() => {
    openDialog({kind: 'final', art: 'herd', title: '全部通关！',
      body: `${FINAL} 关全部清空，羊群都回家了。最后一关用时 ${fmt(secs)}，点了 ${G.moves} 次。` + (n > 1 ? `这是你第 ${n} 次通关。` : ''),
      extra: grid,
      actions: [
        {label: '从第 1 关再玩一遍', primary: true, run: () => startLevel(1, freshSeed(1))},
        {label: `继续无尽模式（第 ${FINAL + 1} 关起）`, run: () => startLevel(FINAL + 1, freshSeed(FINAL + 1))}
      ]});
  }, REDUCED ? 520 : 1100);
}

/* ---------- 弹窗与提示 ---------- */
let dlgKind = '';
function openDialog(o){
  dlgKind = o.kind || '';
  const art = $('dlgArt');
  art.replaceChildren();
  if (o.art){
    const wrap = document.createElement('div');
    wrap.className = o.art;
    for (let k = 0; k < (o.art === 'herd' ? 5 : 1); k++){
      const sheep = document.createElement('i');
      sheep.className = 'art ic-5';
      sheep.style.setProperty('--k', k);
      wrap.appendChild(sheep);
    }
    art.appendChild(wrap);
  }
  art.hidden = !o.art;
  $('dlgTitle').textContent = o.title;
  const body = $('dlgBody');
  body.textContent = o.body || '';
  body.hidden = !o.body;
  const ul = $('dlgList');
  ul.replaceChildren(...(o.list || []).map(s => { const li = document.createElement('li'); li.textContent = s; return li; }));
  ul.hidden = !o.list;
  const ex = $('dlgExtra');
  ex.replaceChildren(...(o.extra ? [o.extra] : []));
  ex.hidden = !o.extra;
  const box = $('dlgActions');
  box.replaceChildren();
  for (const [i, a] of o.actions.entries()){
    const b = document.createElement('button');

  [...day.slice(8, 10)].forEach((ch, k) => {
    DIGITS[ch].forEach((line, r) => [...line].forEach((v, c) => {
      if (v !== 'X') return;
      for (const dr of [0, 1]) for (const dc of [0, 1]) rows[2 + r * 2 + dr][(k ? 8 : 0) + c * 2 + dc] = 'X';
    }));
  });

// 按网格一层层往上摞：每层整体错开半张，越往上越稀
function buildShape(rng, cfg, grid){
  const H = grid.length, W = grid[0].length;
  const on = (r, c) => r >= 0 && c >= 0 && r < H && c < W && grid[r][c] === 'X';
  const fits = (x, y) => on(y * 2, x * 2) && on(y * 2, x * 2 + 1) && on(y * 2 + 1, x * 2) && on(y * 2 + 1, x * 2 + 1);
  const out = [];
  for (let z = 0; out.length < cfg.target && z < cfg.maxZ; z++){
    const [ox, oy] = OFFSETS[z % 4];
    const dens = Math.max(cfg.minDens, cfg.dens - z * .03);
    for (let y = oy; (y + 1) * 2 <= H && out.length < cfg.target; y++){
      for (let x = ox; (x + 1) * 2 <= W && out.length < cfg.target; x++){
        if (fits(x, y) && rng() < dens) out.push({x, y, z});
      }

}

    const cells = [['rk', String(rank)], ['nm', r.name], ['tm', fmtMs(r.ms)], ['mv', toolsLabel(r.tools || 0)]];

      span.className = cls;
      span.textContent = text;

  }
  async function load(){
    const req = ++boardReq;

    list.replaceChildren();
    if (!BOARD.url){
      note.textContent = '排行榜还没接上服务器，成绩先记在你手机上。';
      return;
    }
    let mine = null;
    try {
      const pend = prefs.pendingScore;
      if (pend && pend.day < beijingDay(-1)) savePrefs({pendingScore: null});
      else if (pend && prefs.name){
        const res = await submitScore(pend);
        savePrefs({pendingScore: null});
        if (pend.day === day) mine = res;
      }
      const rows = await fetchBoard(day);
      if (req !== boardReq) return;
      const meIn = rows.some(r => r.tag === prefs.tag);
      if (!rows.length) note.textContent = day === today ? '今天还没有人上榜，第一个就是你。' : '这一天没有人上榜。';
      else if (mine) note.textContent = `你排第 ${mine.rank} 名，一共 ${mine.total} 人。`;
      else note.textContent = `${dayLabel(day)} · ${rows.length >= 50 ? '前 50 名' : `${rows.length} 人上榜`}`;
      if (!prefs.name && o.result) note.textContent = '起个名字才能上榜，成绩先记在你手机上。';
      rows.forEach((r, i) => list.appendChild(row(i + 1, r, r.tag === prefs.tag)));
      if (mine && !meIn){
        const gap = document.createElement('li');

        gap.textContent = '…';
        list.appendChild(gap);
        list.appendChild(row(mine.rank, {name: prefs.name, ms: mine.best, tools: mine.tools}, true));

    } catch (e) {
      if (req !== boardReq) return;
      note.textContent = '连不上排行榜，检查一下网络，过一会儿再点开看看。' + (prefs.pendingScore ? '你的成绩已经记下了，连上以后会自动交。' : '');
    }

}

/* ---------- 看层次：越高的牌往倾斜方向挪得越多，像把一叠牌捻开 ---------- */
const tilt = {x: 0, y: 0};
const peekBtn = $('btnPeek');
let peekSrc = null, peekEndedAt = -1e9, tiltRaf = 0, relaxRaf = 0, sweepRaf = 0;

// 每张牌底下最多压着几层（沿覆盖关系的最长链），决定它挪多远
function computeHeights(tiles){
  const memo = new Map();
  const h = t => {
    if (memo.has(t.id)) return memo.get(t.id);
    let m = 0;
    for (const c of t.covers) m = Math.max(m, h(c));
    memo.set(t.id, m + 1);
    return m + 1;
  };
  for (const t of tiles) t.h = h(t);
}
const lift = t => Math.min(t.h || 1, 12) * L.unit * .075;
const TILT_MAX = 2.4;
function boardPose(t){
  const k = lift(t);
  return {x: L.boardX + (t.x + .04) * L.unit + tilt.x * k, y: L.boardY + (t.y + .01) * L.unit + tilt.y * k, s: 1};
}

function applyTilt(){
  for (const t of G.tiles){
    if (t.status !== 'board' || !t.el) continue;
    const p = boardPose(t);
    t.el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) scale(${p.s.toFixed(3)})`;
  }
}
function setTilt(x, y){
  const m = Math.hypot(x, y), f = m > TILT_MAX ? TILT_MAX / m : 1;
  tilt.x = x * f;
  tilt.y = y * f;
  if (!tiltRaf) tiltRaf = requestAnimationFrame(() => { tiltRaf = 0; applyTilt(); });
}
function startPeek(src){
  cancelAnimationFrame(relaxRaf);
  relaxRaf = 0;
  peekSrc = src;
  stage.classList.add('tilting');
  peekBtn.classList.toggle('on', src === 'button');
}
function endPeek(src){
  if (peekSrc !== src) return;
  peekSrc = null;
  if (src !== 'gyro') peekEndedAt = performance.now();
  peekBtn.classList.remove('on');
  cancelAnimationFrame(sweepRaf);
  sweepRaf = 0;
  const x0 = tilt.x, y0 = tilt.y, t0 = performance.now();
  const step = now => {
    if (peekSrc){ relaxRaf = 0; return; }
    const p = Math.min(1, (now - t0) / 260), e = 1 - Math.pow(1 - p, 3);
    setTilt(x0 * (1 - e), y0 * (1 - e));
    if (p < 1) relaxRaf = requestAnimationFrame(step);
    else { relaxRaf = 0; stage.classList.remove('tilting'); }
  };
  relaxRaf = requestAnimationFrame(step);
}

// 按住按钮：视角绕一圈慢慢转，每个方向都看得到
function sweep(){
  const t0 = performance.now();
  const step = now => {
    if (peekSrc !== 'button') return;
    const s = (now - t0) / 1000, amp = 1.7 * Math.min(1, s / .45), a = Math.PI / 4 + s * 1.5;
    setTilt(Math.cos(a) * amp, Math.sin(a) * amp);
    sweepRaf = requestAnimationFrame(step);
  };
  sweepRaf = requestAnimationFrame(step);
}
peekBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { peekBtn.setPointerCapture(e.pointerId); } catch (err) {}
  enableGyro();
  startPeek('button');
  sweep();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => peekBtn.addEventListener(n, () => endPeek('button')));
peekBtn.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && !e.repeat){ e.preventDefault(); startPeek('button'); sweep(); }
});
peekBtn.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') endPeek('button'); });
peekBtn.addEventListener('contextmenu', e => e.preventDefault());

// 两根手指在牌堆上拖：跟着手指的方向倾斜
const touches = new Map();
let touchStart = null;
const touchMid = () => {
  let x = 0, y = 0;
  for (const p of touches.values()){ x += p.x; y += p.y; }
  return {x: x / touches.size, y: y / touches.size};
};
stage.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (touches.size === 2 && peekSrc !== 'button'){
    startPeek('touch');
    touchStart = touchMid();
  }
});
stage.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (peekSrc === 'touch' && touches.size >= 2){
    const m = touchMid();
    setTilt((m.x - touchStart.x) / 50, (m.y - touchStart.y) / 50);
  }
});
const dropTouch = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) endPeek('touch');
};
stage.addEventListener('pointerup', dropTouch);
stage.addEventListener('pointercancel', dropTouch);

// 陀螺仪：手机倾斜超过 7° 才开始动，拿稳时慢慢把当前角度当成“平放”
const gyro = {tried: false, b0: null, g0: null};
function onOrient(e){
  if (e.beta == null || e.gamma == null) return;
  if (gyro.b0 == null){ gyro.b0 = e.beta; gyro.g0 = e.gamma; }
  const f = d => Math.sign(d) * Math.min(TILT_MAX, Math.max(0, Math.abs(d) - 7) / 10);
  const tx = f(e.gamma - gyro.g0), ty = f(e.beta - gyro.b0);
  if (!tx && !ty){ gyro.b0 += (e.beta - gyro.b0) * .03; gyro.g0 += (e.gamma - gyro.g0) * .03; }
  if (peekSrc === 'button' || peekSrc === 'touch') return;
  if (tx || ty){
    if (peekSrc !== 'gyro') startPeek('gyro');
    setTilt(tx, ty);
  } else if (peekSrc === 'gyro') endPeek('gyro');
}
function enableGyro(){
  if (gyro.tried) return;
  gyro.tried = true;
  const D = window.DeviceOrientationEvent;
  if (!D) return;
  const on = () => window.addEventListener('deviceorientation', onOrient);
  // iPhone 要在点按的那一刻申请权限；其他设备直接监听
  if (typeof D.requestPermission === 'function') D.requestPermission().then(r => { if (r === 'granted') on(); }).catch(() => {});
  else on();
}
if (window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission !== 'function') enableGyro();

/* ---------- 存档：刷新页面、从后台清掉再打开，都接着上次的进度 ---------- */
const saveKey = mode => (mode === 'daily' ? 'mielegemie:daily' : 'mielegemie:game');
let saveTimer = 0;
// 摆牌的指纹：每张牌的位置和层数算一个哈希
function layoutSig(tiles){
  let h = 2166136261;
  for (const t of tiles){
    for (const v of [t.x, t.y, t.z]){
      h ^= Math.round(v * 100);
      h = Math.imul(h, 16777619);
    }
  }
  return h >>> 0;
}
function saveGame(){
  clearTimeout(saveTimer);
  saveTimer = 0;
  if (G.mode === 'trial') return;
  try {
    const key = saveKey(G.mode);
    if (G.won || !G.tiles.length) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(serialize()));
  } catch (e) {}
}
function saveSoon(){
  if (!saveTimer) saveTimer = setTimeout(saveGame, 250);
}
function loadGame(mode = 'normal'){
  try { return JSON.parse(localStorage.getItem(saveKey(mode))); } catch (e) { return null; }
}

/* ---------- 页面更新时保留对局 ---------- */
function serialize(){
  return {
    v: 1, mode: G.mode, day: G.day, level: G.level, seed: G.seed, n: G.tiles.length,
    st: G.tiles.map(t => (t.pending ? 3 : ST[t.status])), ty: G.tiles.map(t => t.type),
    slot: G.slot.filter(t => !t.pending).map(t => t.id), hold: G.hold.map(c => c.map(t => t.id)),
    tools: Object.assign({}, G.tools), moves: G.moves, ms: elapsed(), over: G.over, won: G.won,
    sig: layoutSig(G.tiles), hist: G.history.slice(-1), bm: G.tiles.map(t => t.bomb || 0), cap: G.cap
  };
}
function resume(s){
  if (!s || s.v !== 1 || s.won || s.mode === 'trial') return false;
  const mode = s.mode === 'daily' ? 'daily' : 'normal';
  // 过了零点，昨天没打完的每日挑战就不接着打了
  if (mode === 'daily' && s.day !== beijingDay()) return false;
  const built = mode === 'daily' ? buildDaily(s.day) : buildLevel(s.level, s.seed);
  if (!built || built.tiles.length !== s.n || (mode === 'daily' && built.seed !== s.seed)) return false;
  // 游戏更新后摆牌方式可能变了，同一个种子摆出来的牌对不上就不恢复
  if (s.sig != null && s.sig !== layoutSig(built.tiles)) return false;
  G.epoch++;
  Object.assign(G, {
    mode, day: mode === 'daily' ? s.day : '', rule: mode === 'daily' ? built.rule : null, cap: built.cfg.cap || CAP,
    level: s.level, seed: s.seed, cfg: built.cfg, tiles: built.tiles, label: built.label, slot: [], hold: [[], [], []],
    tools: s.tools, history: [], moves: s.moves, over: false, won: false, pending: 0, acc: s.ms || 0, running: false
  });
  restoreSnap(s);
  G.history = (Array.isArray(s.hist) ? s.hist : []).filter(h => h && Array.isArray(h.st) && h.st.length === s.n);
  if (G.tiles.every(t => t.status === 'gone')) return false;
  mountTiles(false);
  if (s.over && G.slot.length >= G.cap){ G.over = true; showLose(); } else startClock();
  return true;
}

      bodyStyle.backgroundSize = `100% 100%, ${kn.w}px ${kn.h}px`;
    },
    sw: {bg: '#22366b', tile: 'background:#f5ead2;border-radius:16%;box-shadow:0 4px 0 #c9b288'}
  },
  pixel: {
    group: '经典', name: '掌机', desc: '绿屏 · 方块像素', draw: rows => pixelIcon(rows),
    paint(){
      bodyStyle.backgroundImage = 'radial-gradient(120% 90% at 50% 40%, rgba(255,255,220,.16), rgba(28,51,24,.2) 100%), linear-gradient(rgba(28,51,24,.07) 1px, rgba(28,51,24,0) 1px), linear-gradient(90deg, rgba(28,51,24,.07) 1px, rgba(28,51,24,0) 1px)';
      bodyStyle.backgroundSize = '100% 100%, 3px 3px, 3px 3px';
    },
    sw: {bg: '#a3bd4f', tile: 'background:#e2edb3;box-shadow:inset 0 0 0 2px #1c3318,inset 3px 3px 0 rgba(255,255,255,.4),inset -3px -3px 0 rgba(28,51,24,.16),3px 3px 0 #1c3318'}
  },
  riso: {
    group: '经典', name: '孔版', desc: '粉蓝双色 · 套色错位', draw: (rows, i) => risoIcon(rows, i),
    paint(){
      bodyStyle.backgroundImage = `url(${grainTexture()}), radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,.35), rgba(0,0,0,.05) 100%)`;
      bodyStyle.backgroundSize = '180px 180px, 100% 100%';
    },
    sw: {bg: '#ebe9e3', tile: 'background:#fbfaf6;border-radius:10%;box-shadow:inset 0 0 0 1.5px #0078bf,3px 3px 0 #ff48b0'}
  },
  bauhaus: {
    group: '前卫', name: '构成', desc: '红黄蓝黑 · 几何抽象', draw: (rows, i) => bauhausIcon(i),
    paint(){
      // 几何形只放在四个角，不压在文字和牌堆后面
      bodyStyle.backgroundImage = 'radial-gradient(circle at 100% 0, #d6322b 0 22vmin, rgba(214,50,43,0) 22.3vmin), radial-gradient(circle at 0 100%, #f2c230 0 26vmin, rgba(242,194,48,0) 26.3vmin), linear-gradient(#151515, #151515), linear-gradient(#1e4fa3, #1e4fa3)';
      bodyStyle.backgroundSize = '100% 100%, 100% 100%, 30vmin 2vmin, 1.6vmin 24vmin';
      bodyStyle.backgroundPosition = '0 0, 0 0, 100% calc(100% - 5vmin), 3vmin 0';
      bodyStyle.backgroundRepeat = 'no-repeat';
    },
    sw: {bg: 'radial-gradient(circle at 100% 0, #d6322b 0 26px, rgba(0,0,0,0) 27px), #e9e7e1', tile: 'background:#fff;box-shadow:inset 0 0 0 2.5px #151515,3px 3px 0 #151515'}
  },
  type: {
    group: '前卫', name: '铅字', desc: '只印字 · 纯黑白', draw: null,
    paint(){
      bodyStyle.backgroundImage = 'none';
      bodyStyle.backgroundSize = 'auto';
    },
    sw: {bg: '#f3f3f0', char: '羊', tile: 'background:#fff;box-shadow:inset 0 0 0 1.5px #111,3px 3px 0 #111;color:#111;font-family:"ZCOOL QingKe HuangYou",sans-serif'}
  }
};
const iconCache = {};
const iconsFor = id => iconCache[id] || (iconCache[id] = ICONS.map((ic, i) => (SKINS[id].draw ? SKINS[id].draw(ic.m, i) : '')));
let skin = 'knit';

function applySkin(id){
  if (!SKINS[id]) id = 'knit';
  skin = id;
  document.documentElement.dataset.skin = id;
  iconsFor(id).forEach((u, i) => (u ? bodyStyle.setProperty(`--ic-${i}`, `url(${u})`) : bodyStyle.removeProperty(`--ic-${i}`)));
  bodyStyle.backgroundPosition = '';
  bodyStyle.backgroundRepeat = '';
  SKINS[id].paint();
  savePrefs({skin: id});
}

function showSkins(){
  const wrap = document.createElement('div');
  wrap.className = 'skins';
  let lastGroup = '';
  for (const [id, sk] of Object.entries(SKINS)){
    if (sk.group !== lastGroup){
      const h = document.createElement('div');
      h.className = 'skin-group';
      h.textContent = sk.group;
      wrap.appendChild(h);
      lastGroup = sk.group;
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'skin-opt';
    b.setAttribute('aria-pressed', String(id === skin));
    b.setAttribute('aria-label', `${sk.name}：${sk.desc}`);
    const sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = sk.sw.bg;
    const tile = document.createElement('span');
    tile.className = 'sw-tile';
    tile.style.cssText = sk.sw.tile;
    if (sk.sw.char){
      const ch = document.createElement('span');
      ch.className = 'sw-char';
      ch.textContent = sk.sw.char;
      tile.appendChild(ch);
    } else {
      const img = document.createElement('img');
      img.alt = '';
      img.src = iconsFor(id)[5];
      tile.appendChild(img);
    }
    sw.appendChild(tile);
    const nm = document.createElement('span');
    nm.className = 'sk-name';
    nm.textContent = sk.name;
    const ds = document.createElement('span');
    ds.className = 'sk-desc';
    ds.textContent = sk.desc;
    b.append(sw, nm, ds);
    b.addEventListener('click', () => {
      applySkin(id);
      closeDialog();
      relayout();
      toast(`换成「${sk.name}」了`);
    });
    wrap.appendChild(b);
  }
  openDialog({kind: 'menu', title: '换个风格', body: '只换外观，这一局的牌和进度都不变。', extra: wrap, actions: [{label: '关闭', run: closeDialog}]});
}

function boot(data){
  layout();
  syncSound();
  const lv = Math.min(Math.max(Number(prefs.level) || 1, 1), 99);
  if (resume(data && data.game)) return;
  let resumed = false;
  for (const mode of prefs.mode === 'daily' ? ['daily', 'normal'] : ['normal']){
    if (resume(loadGame(mode))){
      resumed = true;
      break;
    }
  }
  if (!resumed) startLevel(lv, freshSeed(lv));
  showHome();
}
applySkin(prefs.skin);
try {
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({game: serialize()}));
} catch (e) {}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>

</body>
