<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="三消小游戏，一共 6 关，每一副牌都保证有解；九种摆法、五种外观，按住或倾斜手机看清牌是怎么叠的。">
<title>咩了个咩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@900&family=Silkscreen&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 四套外观，靠 <html data-skin="…"> 切换。每套都自己画背景，不跟随系统深浅色。
   默认（毛线）：靛蓝粗毛衣上的实心绣 */
:root{
  color-scheme:dark;
  --bg:#22366b;
  --ink:#fff4de;
  --ink-soft:#c3cde8;
  --tile:#f5ead2;
  --tile-hi:rgba(255,255,255,.28);
  --dim:brightness(.52) saturate(.55);
  --btn:#f5ead2;
  --btn-ink:#2b2f45;
  --btn-soft:#5a5c6e;
  --btn-edge:#c9b288;
  --tray:#1d2e5e;
  --tray-2:#15224a;
  --tray-line:rgba(240,181,69,.72);
  --tray-cell:rgba(0,0,0,.2);
  --thread:#f0b545;
  --track:rgba(195,205,232,.16);
  --accent:#bf3b2c;
  --accent-deep:#842419;
  --accent-ink:#fff;
  --badge:#f0b545;
  --badge-ink:#1b2344;
  --paper:#f7eed9;
  --paper-ink:#2b2f45;
  --paper-soft:#5a5c6e;
  --paper-edge:#c9b288;
  --ghost-line:rgba(43,47,69,.2);
  --scrim:rgba(8,12,30,.62);
  --focus:#ffd772;
  --pip-off:rgba(195,205,232,.45);
  --pip-on:#f0b545;
  --warn:#f06a52;
  --warn-ink:#ffb4a4;
  --bed:rgba(8,14,40,.16);
  --shelf:rgba(240,181,69,.55);
  --toast:#15224a;
  --toast-ink:#fff4de;
  --brand-shadow:0 3px 0 #111c43;
  --font-display:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Silkscreen",ui-monospace,"SF Mono",Menlo,monospace;
}
/* 掌机：绿色液晶屏，四阶绿，方块像素 */
:root[data-skin="pixel"]{
  color-scheme:light;
  --bg:#a3bd4f;
  --ink:#1c3318;
  --ink-soft:#35552a;
  --tile:#e2edb3;
  --tile-hi:rgba(255,255,255,0);
  --dim:none;
  --btn:#e2edb3;
  --btn-ink:#1c3318;
  --btn-soft:#1c3318;
  --btn-edge:#1c3318;
  --tray:#8eaa40;
  --tray-2:#8eaa40;
  --tray-line:#1c3318;
  --tray-cell:rgba(28,51,24,.12);
  --thread:#1c3318;
  --track:rgba(28,51,24,.28);
  --accent:#1c3318;
  --accent-deep:#0b170a;
  --accent-ink:#d6e5a0;
  --badge:#1c3318;
  --badge-ink:#d6e5a0;
  --paper:#c7da85;
  --paper-ink:#1c3318;
  --paper-soft:#2f4b24;
  --paper-edge:#1c3318;
  --ghost-line:#1c3318;
  --scrim:rgba(28,51,24,.5);
  --focus:#1c3318;
  --pip-off:rgba(28,51,24,.3);
  --pip-on:#1c3318;
  --warn:#1c3318;
  --warn-ink:#1c3318;
  --bed:rgba(28,51,24,.08);
  --shelf:#1c3318;
  --toast:#1c3318;
  --toast-ink:#d6e5a0;
  --brand-shadow:3px 3px 0 rgba(28,51,24,.25);
}
/* 孔版：荧光粉 + 蓝两色油墨，故意套色不准 */
:root[data-skin="riso"]{
  color-scheme:light;
  --bg:#ebe9e3;
  --ink:#1b2a86;
  --ink-soft:#44509a;
  --tile:#fbfaf6;
  --tile-hi:rgba(255,255,255,0);
  --dim:grayscale(1) brightness(.8) contrast(.85);
  --btn:#fbfaf6;
  --btn-ink:#1b2a86;
  --btn-soft:#0078bf;
  --btn-edge:#0078bf;
  --tray:#0078bf;
  --tray-2:#006aa9;
  --tray-line:#ff48b0;
  --tray-cell:rgba(255,255,255,.16);
  --thread:#ff48b0;
  --track:rgba(0,120,191,.28);
  --accent:#ff48b0;
  --accent-deep:#0078bf;
  --accent-ink:#141844;
  --badge:#ff48b0;
  --badge-ink:#141844;
  --paper:#fbfaf6;
  --paper-ink:#141844;
  --paper-soft:#3e4575;
  --paper-edge:#0078bf;
  --ghost-line:#0078bf;
  --scrim:rgba(40,44,70,.42);
  --focus:#ff48b0;
  --pip-off:rgba(0,120,191,.35);
  --pip-on:#0078bf;
  --warn:#e0237a;
  --warn-ink:#c81d6c;
  --bed:rgba(0,120,191,.06);
  --shelf:#ff48b0;
  --toast:#1b2a86;
  --toast-ink:#fbfaf6;
  --brand-shadow:3px 2px 0 #ff48b0;
  --font-display:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--bg)}
body{min-height:100%;margin:0;overflow-x:hidden;overflow-x:clip;background-color:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.icon-btn:focus-visible,.tool:focus-visible,.btn:focus-visible,.skin-opt:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.dialog .btn:focus-visible,.dialog .skin-opt:focus-visible{outline-color:var(--paper-ink)}
.num{font-family:var(--font-num);font-weight:400;letter-spacing:.02em}

.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px 22px;display:flex;flex-direction:column;gap:10px}

/* 顶栏 */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.lvl{position:relative;display:inline-flex;align-items:baseline;gap:4px;padding:6px 12px 5px;border-radius:4px;background:var(--btn);color:var(--btn-ink);
  font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 var(--btn-edge),0 3px 0 1px rgba(0,0,0,.28)}
.lvl b{font-family:var(--font-num);font-weight:400;font-size:17px;line-height:1;color:var(--accent)}
.brand{margin:0;text-align:center;font-family:var(--font-display);font-weight:400;font-size:clamp(21px,6.2vw,32px);line-height:1.05;
  letter-spacing:.08em;white-space:nowrap;color:var(--ink);text-shadow:var(--brand-shadow)}
.acts{display:flex;gap:6px}
@media (max-width:380px){.bar{gap:6px}.lvl{padding-inline:9px}.acts{gap:3px}.acts .icon-btn{width:31px;height:31px}.acts .icon-btn svg{width:18px;height:18px}}
.icon-btn{width:36px;height:36px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
  background:var(--btn);color:var(--btn-ink);
  box-shadow:inset 0 0 0 3px var(--btn),inset 0 0 0 4.5px rgba(120,90,50,.3),0 3px 0 var(--btn-edge),0 3px 0 1px rgba(0,0,0,.28)}
.icon-btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 3px var(--btn),inset 0 0 0 4.5px rgba(120,90,50,.3),0 1px 0 var(--btn-edge)}
.icon-btn span{display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:400px){
  .acts{gap:5px}
  .icon-btn{width:33px;height:33px}
  .icon-btn svg{width:17px;height:17px}
}

/* 进度线 */
.rail{display:flex;align-items:center;gap:12px}
.thread{position:relative;flex:1;height:26px}
.thread::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;
  background:repeating-linear-gradient(90deg,var(--track) 0 2px,transparent 2px 9px)}
.sewn{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:6px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--thread) 0 6px,transparent 6px 9px);transition:width .6s cubic-bezier(.3,.7,.3,1)}
.needle{position:absolute;top:50%;left:0;width:40px;height:10px;margin-top:-5px;transition:left .6s cubic-bezier(.3,.7,.3,1)}
.needle svg{display:block;width:100%;height:100%}
.count{margin:0;font-size:14px;font-weight:700;white-space:nowrap;color:var(--ink-soft)}
.count .num{color:var(--ink);font-size:15px}

/* 牌桌 */
.stage{position:relative;isolation:isolate;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.stage.tilting .tile.onboard{transition:none}
/* 牌摞里被压住的牌只露出一窄条；有硬投影的外观里，上一张的影子会正好盖住这一条，所以只留边框 */
:root[data-skin="pixel"] .tile.pile.blocked .face{box-shadow:inset 0 0 0 2px #1c3318}
:root[data-skin="riso"] .tile.pile.blocked .face{box-shadow:inset 0 0 0 1.5px #0078bf}
:root[data-skin="bauhaus"] .tile.pile.blocked .face{box-shadow:inset 0 0 0 2.5px #151515}
:root[data-skin="type"] .tile.pile.blocked .face{box-shadow:inset 0 0 0 1.5px #111}
/* 捻开看层次时只看结构：被压住的牌一律扣成背面，松手后再翻回来 */
.stage.tilting .tile.blocked.onboard .art{opacity:0}
/* 每日挑战「蒙眼」：口袋里的牌扣着，只露出一个缝线方框 */
.stage .tile.facedown .art{opacity:0}
#trough.bombs i.dead{opacity:1;background:linear-gradient(45deg,transparent 43%,rgba(0,0,0,.6) 43% 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,rgba(0,0,0,.6) 43% 57%,transparent 57%),radial-gradient(circle,#2a1a10 30%,#6b3a1c 58%,var(--tray-cell) 75%);box-shadow:none}
/* 定时炸弹：牌角上的倒计时，快炸了会变红跳动 */
.fuse{position:absolute;top:-10%;right:-10%;z-index:2;display:grid;place-items:center;width:44%;height:44%;border-radius:50%;
  background:#2b2f45;color:#fff4de;font:400 calc(var(--ts) * .25)/1 var(--font-num);box-shadow:0 0 0 calc(var(--ts) * .035) var(--tile),0 2px 4px rgba(0,0,0,.35)}
.fuse::before{content:"";position:absolute;top:-16%;right:6%;width:22%;height:26%;border-radius:40%;background:#f0b545;box-shadow:0 0 5px 2px rgba(240,181,69,.75)}
.fuse.hot{background:var(--accent);animation:pulse .7s ease-in-out infinite}
.stage .tile.facedown .face::after{content:"";position:absolute;inset:20%;border-radius:18%;border:2px dashed var(--paper-soft);opacity:.45}
.peek{width:30px;height:30px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;
  background:var(--btn);color:var(--btn-ink);box-shadow:0 2px 0 var(--btn-edge),0 2px 0 1px rgba(0,0,0,.2);
  touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.peek svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.peek.on{background:var(--accent);color:var(--accent-ink);box-shadow:none;transform:translateY(2px)}
.peek:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
:root[data-skin="pixel"] .peek,:root[data-skin="bauhaus"] .peek,:root[data-skin="type"] .peek{border-radius:0}
.bed{position:absolute;z-index:0;border-radius:12px;background:var(--bed);pointer-events:none}
.shelf{position:absolute;z-index:0;border:2px dashed var(--shelf);border-radius:12px}
.meter{position:absolute;z-index:0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.pips{display:flex;gap:3px}
.pips i{display:block;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--pip-off)}
.pips i.on{background:var(--pip-on);box-shadow:none}
.meter.hot{color:var(--warn-ink)}
.meter.hot .pips i.on{background:var(--warn)}

/* 七格口袋 */
.trough{position:absolute;z-index:0;display:grid;grid-template-columns:repeat(7,1fr);padding:var(--pad);border-radius:calc(var(--cell) * .24);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px),linear-gradient(180deg,var(--tray),var(--tray-2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 0 rgba(5,9,28,.55),0 14px 26px rgba(0,0,0,.32)}
.trough::before{content:"";position:absolute;inset:4px;border:2px dashed var(--tray-line);border-radius:calc(var(--cell) * .18);pointer-events:none}
.trough i{display:block;margin:calc(var(--cell) * .05);border-radius:calc(var(--cell) * .14);background:var(--tray-cell);box-shadow:inset 0 2px 5px rgba(0,0,0,.38)}

/* 牌 */
.tile{position:absolute;left:0;top:0;width:var(--ts);height:var(--ts);margin:0;padding:0;border:0;background:none;transform-origin:0 0;
  transition:transform .26s cubic-bezier(.3,.75,.3,1);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tile:focus{outline:none}
.face{position:absolute;inset:0;border-radius:16%;
  background:radial-gradient(circle at 28% 18%,var(--tile-hi),rgba(255,255,255,0) 58%),var(--tile);
  box-shadow:inset 0 0 0 1px rgba(120,86,40,.2),0 calc(var(--ts) * .07) 0 #c9b288,0 calc(var(--ts) * .07 + 1.5px) 0 rgba(6,10,30,.55);
  transition:filter .2s,translate .15s}
.art{position:absolute;inset:7%;background:center/contain no-repeat}
/* 图案图片由脚本按当前外观画好，放进 --ic-N 变量 */
.ic-0{background-image:var(--ic-0)}.ic-1{background-image:var(--ic-1)}.ic-2{background-image:var(--ic-2)}.ic-3{background-image:var(--ic-3)}
.ic-4{background-image:var(--ic-4)}.ic-5{background-image:var(--ic-5)}.ic-6{background-image:var(--ic-6)}.ic-7{background-image:var(--ic-7)}
.ic-8{background-image:var(--ic-8)}.ic-9{background-image:var(--ic-9)}.ic-10{background-image:var(--ic-10)}.ic-11{background-image:var(--ic-11)}
.ic-12{background-image:var(--ic-12)}.ic-13{background-image:var(--ic-13)}.ic-14{background-image:var(--ic-14)}.ic-15{background-image:var(--ic-15)}
.tile.blocked{cursor:default}
.tile.blocked .face{filter:var(--dim)}
.tile.hide{visibility:hidden}
.tile:focus-visible .face{outline:3px solid var(--focus);outline-offset:2px}
.stage .tile.inslot{transition:transform .3s cubic-bezier(.3,1.35,.5,1)}
.stage.instant .tile{transition:none}
.stage.dealing .tile .face{animation:drop .5s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:var(--d,0ms)}
.stage .tile.nope .face{animation:nope .25s ease}
.stage .tile.mix .face{animation:wob .4s ease}
.stage .tile.hint .face{animation:hint .55s ease}
.stage .tile.shake .face{animation:shake .42s ease}
.stage .tile.flip .face{animation:flip .36s ease-in-out both;animation-delay:var(--fd,0ms)}
.stage .tile.back .face{animation:back .28s cubic-bezier(.3,1.4,.5,1)}
.stage .tile.pending .face{filter:brightness(1.12)}
.stage .tile.gone{pointer-events:none}
.stage .tile.gone .face{animation:poof .3s ease forwards}
.stage .tile.leaving{pointer-events:none}
.stage .tile.leaving .face{animation:leave .26s ease-in forwards}
/* ---- 动效 ---- */
.tile.flying{z-index:900!important;transition:none!important}
.spark{position:absolute;z-index:950;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;pointer-events:none}
.spark.confetti{width:8px;height:12px;margin:-6px 0 0 -4px;border-radius:2px}
:root[data-skin="pixel"] .spark,:root[data-skin="bauhaus"] .spark,:root[data-skin="type"] .spark{border-radius:0}
.trough.shake{animation:shake .42s ease}
/* 每日挑战「少一格」：第 7 格用线缝死；「定时炸弹」炸坏的格子是焦黑的 */
#trough i.dead{opacity:.75;background:linear-gradient(45deg,transparent 44%,var(--tray-line) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--tray-line) 44% 56%,transparent 56%),var(--tray-cell);box-shadow:none}
.tool .n.bump{animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
.dlg-actions .btn{animation:rise .32s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i, 0) * 55ms + 120ms)}
@media (hover:hover){
  .tile.onboard:not(.blocked):hover .face{translate:0 -2px}
}


/* 道具 */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;
  background:var(--btn);color:var(--btn-ink);box-shadow:0 5px 0 var(--btn-edge),0 5px 0 1px rgba(0,0,0,.3);
  font-family:var(--font-display);font-size:18px;line-height:1.1;letter-spacing:.1em}
.tool svg{width:24px;height:24px;fill:none;stroke:var(--btn-soft);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--btn-edge),0 2px 0 1px rgba(0,0,0,.3)}
.tool .n{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;display:grid;place-items:center;
  background:var(--badge);color:var(--badge-ink);font:400 12px/1 var(--font-num);letter-spacing:0;box-shadow:0 0 0 2.5px var(--bg)}
.tool:disabled{cursor:default;opacity:.42;filter:grayscale(.8)}
.tool:disabled .n{display:none}

/* 弹窗 */
/* 主菜单：盖在牌桌上，背后的牌桌虚化 */
.home{position:fixed;inset:0;z-index:45;display:grid;place-items:center;overflow:auto;padding:24px 16px;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--scrim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.home-card{width:min(360px,100%);padding:22px 22px 18px;border-radius:20px;background:var(--paper);color:var(--paper-ink);text-align:center;
  box-shadow:0 8px 0 var(--paper-edge),0 8px 0 1px rgba(0,0,0,.3),0 22px 44px rgba(0,0,0,.45);animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}
.home-title{margin:4px 0 2px;font:400 46px/1.05 var(--font-display);letter-spacing:.08em}
.dialog .home-sub,.home-sub{margin:0 0 18px;color:var(--paper-soft);font-size:14px}
.home-list{display:flex;flex-direction:column;gap:10px}
.home-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.home-item .hi-sub{font-size:12.5px;font-weight:400;line-height:1.45;opacity:.85;text-wrap:balance}
.home-foot{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:16px}
.home-foot button{padding:7px 14px;border:0;border-radius:999px;background:transparent;color:var(--paper-soft);font:700 14px/1.2 var(--font-body);box-shadow:inset 0 0 0 1.5px var(--ghost-line);cursor:pointer}
.home-foot button:focus-visible,.home-item:focus-visible{outline:3px solid var(--paper-ink);outline-offset:2px}
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px 16px;background:var(--scrim)}
.dialog{position:relative;width:min(350px,100%);max-height:100%;overflow:auto;padding:22px 22px 20px;border-radius:18px;background:var(--paper);color:var(--paper-ink);text-align:center;
  box-shadow:0 8px 0 var(--paper-edge),0 8px 0 1px rgba(0,0,0,.3),0 22px 44px rgba(0,0,0,.45);animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}
.dlg-art{display:grid;place-items:center;margin-bottom:4px}
.dlg-art .art{position:static;display:block;width:88px;height:88px}
.dlg-art .hop{animation:hop .9s ease-in-out infinite}
.dlg-art .sad{transform:rotate(-12deg) translateY(4px);filter:saturate(.6)}
.dlg-art .herd{display:flex;align-items:flex-end;gap:2px}
.dlg-art .herd .art{width:48px;height:48px;animation:hop .8s ease-in-out infinite;animation-delay:calc(var(--k, 0) * 120ms)}
.dlg-art .herd .art:nth-child(3){width:64px;height:64px}
:root[data-skin="type"] .dlg-art .herd .art{width:40px;height:48px;font-size:36px!important}
:root[data-skin="type"] .dlg-art .herd .art:nth-child(3){width:52px;height:64px;font-size:48px!important}

.dialog h2{margin:2px 0 8px;font:400 29px/1.15 var(--font-display);letter-spacing:.06em;text-wrap:balance}

/* 每日挑战排行榜 */
.board-tabs{display:flex;justify-content:center;gap:6px;margin:0 0 10px}

.board-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--paper-ink)}

.board-list li.gap{display:block;padding:0;box-shadow:none;text-align:center;color:var(--paper-soft)}
.board-link{margin:10px 0 0;padding:4px;border:0;background:none;color:var(--paper-soft);font:700 13px/1.2 var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

.dlg-actions{position:relative;display:flex;flex-direction:column;gap:10px}
.btn{position:relative;border:0;border-radius:12px;padding:12px 14px;font:700 16px/1.25 var(--font-body);cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-deep)}

/* 换风格 */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin-opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 10px;border:0;border-radius:12px;background:transparent;color:var(--paper-ink);
  box-shadow:inset 0 0 0 2px var(--ghost-line);cursor:pointer;touch-action:manipulation}

.sw{display:grid;place-items:center;width:100%;height:66px;margin-bottom:4px;border-radius:8px}

.toast{position:fixed;left:50%;top:calc(116px + env(safe-area-inset-top,0px));z-index:60;max-width:calc(100% - 32px);
  transform:translate(-50%,-12px);opacity:0;pointer-events:none;padding:8px 16px;border-radius:999px;
  background:var(--toast);color:var(--toast-ink);border:0;box-shadow:0 8px 20px rgba(0,0,0,.35);
  font-size:14px;font-weight:700;text-align:center;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- 掌机的形状：全部方角、硬投影，被压住的牌用网点而不是变暗 ---- */
:root[data-skin="pixel"] .face{border-radius:0;box-shadow:inset 0 0 0 2px #1c3318,inset 4px 4px 0 rgba(255,255,255,.4),inset -4px -4px 0 rgba(28,51,24,.16),3px 3px 0 #1c3318}

/* ---- 孔版的形状：纸片 + 蓝线框 + 粉色错位的影子 ---- */

:root[data-skin="riso"] .needle{display:none}

/* ---- 构成的形状 ---- */
:root[data-skin="bauhaus"] .face{border-radius:0;box-shadow:inset 0 0 0 2.5px #151515,4px 4px 0 #151515}
:root[data-skin="bauhaus"] .tile.blocked .face::after{content:"";position:absolute;inset:0;

:root[data-skin="bauhaus"] .btn,:root[data-skin="bauhaus"] .skin-opt,:root[data-skin="bauhaus"] .sw,:root[data-skin="bauhaus"] .toast,

:root[data-skin="type"] body::before{content:"咩";position:fixed;right:-14vmin;bottom:-22vmin;z-index:0;pointer-events:none;

:root[data-skin="type"] .brand{font-weight:900;letter-spacing:-.02em;font-size:clamp(23px,6.8vw,34px)}
:root[data-skin="type"] .dialog h2{font-weight:900;letter-spacing:0}
:root[data-skin="type"] .lvl{background:#111;color:#fff;border-radius:0;box-shadow:none}
:root[data-skin="type"] .lvl b{color:#fff}
:root[data-skin="type"] .icon-btn{box-shadow:inset 0 0 0 1.5px #111}

:root[data-skin="type"] .btn,:root[data-skin="type"] .skin-opt,:root[data-skin="type"] .sw,:root[data-skin="type"] .toast,
:root[data-skin="type"] .shelf,:root[data-skin="type"] .bed,:root[data-skin="type"] .tool .n,:root[data-skin="type"] .pips i{border-radius:0}
:root[data-skin="type"] .btn.primary{box-shadow:4px 4px 0 rgba(17,17,17,.3)}
:root[data-skin="type"] .needle{display:none}

:root[data-skin="type"] .meter.hot .pips i.on{animation:blink .6s steps(1) infinite}
/* 铅字用的字 */
/* 字形尽量错开：只有花、菇带草字头；简单的字用装饰字体，复杂的字用清楚的宋体、黑体 */
.ic-0{--ch:"心"}.ic-1{--ch:"星"}.ic-2{--ch:"花"}.ic-3{--ch:"卜"}.ic-4{--ch:"叶"}.ic-5{--ch:"羊"}.ic-6{--ch:"线"}.ic-7{--ch:"鱼"}
.ic-8{--ch:"手"}.ic-9{--ch:"水"}.ic-10{--ch:"菇"}.ic-11{--ch:"瓜"}.ic-12{--ch:"音"}.ic-13{--ch:"梨"}.ic-14{--ch:"雨"}.ic-15{--ch:"樱"}

/* 换风格面板的分组标题 */
.skin-group{grid-column:1/-1;margin:4px 0 -2px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--paper-soft)}
.sw-char{font-size:28px;line-height:1}


@keyframes drop{from{transform:translateY(-38px) rotate(var(--r,0deg)) scale(.9);opacity:0}70%{opacity:1}to{transform:none;opacity:1}}
@keyframes hint{0%,100%{transform:none}30%{transform:translateY(-5px)}60%{transform:translateY(0)}80%{transform:translateY(-2px)}}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0)}}
@keyframes back{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-7px)}35%{transform:translateX(6px)}55%{transform:translateX(-4px)}75%{transform:translateX(2px)}}
@keyframes leave{to{transform:translateY(26px) scale(.86);opacity:0}}
@keyframes bump{50%{transform:scale(1.35)}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@keyframes poof{0%{transform:scale(1);opacity:1}40%{transform:scale(1.14) rotate(-6deg);opacity:1}100%{transform:scale(.2) rotate(35deg);opacity:0}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes wob{50%{transform:rotate(10deg) scale(.88)}}
@keyframes pop{from{transform:scale(.86);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{50%{opacity:.2}}

<script>
(() => {
'use strict';

const BW = 7, BH = 8.72, CAP = 7;
const FINAL = 6; // 打通第 6 关就算通关，之后是无尽模式
const ST = {board: 0, slot: 1, hold: 2, gone: 3};
const STN = ['board', 'slot', 'hold', 'gone'];

/* ---------- 刺绣图案：每个图案是 11×11 的针脚格 ---------- */
const PAL = {
  R: '#d8433b', r: '#9c2340', P: '#ee93b3', Y: '#eaa934', O: '#e8762c', o: '#b9521a',
  G: '#4c9445', g: '#a6c63d', W: '#ffffff', L: '#aab4c8', K: '#3a3740', U: '#8d56a8',
  u: '#c294d6', T: '#2b9c93', t: '#7fd0c4', B: '#3b5bb0', S: '#57aee0', N: '#93623a', n: '#d6ab74'
};
const ICONS = [
  {n: '爱心', m: ['...........', '.RRR...RRR.', 'RRPRR.RRRRR', 'RPRRRRRRRRR', 'RRRRRRRRRRR', '.RRRRRRRRR.', '..RRRRRRR..', '...RRRRR...', '....RRR....', '.....R.....', '...........']},
  {n: '星星', m: ['.....Y.....', '....YYY....', '....YYY....', 'YYYYYYYYYYY', '.YYYYYYYYY.', '..YYYYYYY..', '..YYYYYYY..', '.YYYY.YYYY.', '.YYY...YYY.', 'YY.......YY', '...........']},
  {n: '小花', m: ['...PP.PP...', '..PPPPPPP..', '.PPPYYYPPP.', '.PPYYYYYPP.', '.PPPYYYPPP.', '..PPPPPPP..', '...PP.PP...', '.....G.....', '.GG..G..GG.', '..GGGGGGG..', '.....G.....']},
  {n: '胡萝卜', m: ['...G.G.G...', '...GGGGG...', '....GGG....', '..OOOOOOO..', '..OOOOoOO..', '...OOOOO...', '...OoOOO...', '....OOO....', '....OoO....', '.....O.....', '.....O.....']},
  {n: '四叶草', m: ['..GG...GG..', '.GGGG.GGGG.', '.GGGGGGGGG.', '..GGGgGGG..', '.GGGGGGGGG.', '.GGGG.GGGG.', '..GG.G.GG..', '.....G.....', '......G....', '.......G...', '...........']},
  {n: '小羊', m: ['...........', '..LLLLLLL..', '.LWWWWWWWL.', 'LWWWWWWWWWL', 'LWWKKKKKWWL', 'KKWKKKKKWKK', '.K.KWKWK.K.', '...KKKKK...', '...KKKKK...', '....KPK....', '...........']},
  {n: '毛线团', m: ['...UUUUU...', '..UuUUUuU..', '.UUuUUuUUU.', 'UUUUuuUUUuU', 'UuUUUUuUuUU', 'UUuUUUUuUUU', 'UUUuUUuUUuU', '.UUUuuUUUU.', '..UUUUUuU..', '...UUUUU..u', '........uu.']},
  {n: '小鱼', m: ['...........', '...........', '....TTTTT..', 'T..TTTTTTT.', 'TT.TTTTTKTT', 'TTTTTtTTTTT', 'TT.TTtTTTT.', 'T..TTTTTTT.', '....TTTTT..', '...........', '...........']},
  {n: '手套', m: ['...........', '.....BBBB..', '....BBBBBB.', '....BBBBBB.', '..B.BBBBBB.', '.BBBBBBBBB.', '.BBBYBYBBB.', '..BBBBBBBB.', '...LLLLLLL.', '...LWLWLWL.', '...........']},
  {n: '水滴', m: ['.....S.....', '.....S.....', '....SSS....', '....SSS....', '...SSSSS...', '..SSSSSSS..', '..SWSSSSS..', '..SWSSSSS..', '..SSSSSSS..', '...SSSSS...', '....SSS....']},
  {n: '蘑菇', m: ['...........', '...NNNNN...', '..NNWNNNN..', '.NNNNNNWNN.', 'NNWNNNNNNNN', 'NNNNNNNNNNN', '...nnnnn...', '...nnnnn...', '...nnnnn...', '..nnnnnnn..', '...........']},
  {n: '西瓜', m: ['...........', '...........', 'RRRRRRRRRRR', 'WRRKRRRKRRW', 'GWRRRRRRRWG', '.GWRRKRRWG.', '..GWRRRWG..', '...GWWWG...', '....GGG....', '...........', '...........']},
  {n: '音符', m: ['...........', '......KK...', '......KKK..', '......K.KK.', '......K..K.', '......K....', '......K....', '...KKKK....', '..KKKKK....', '..KKKK.....', '...........']},
  {n: '梨', m: ['.....N.....', '.....NGG...', '....ggg....', '....ggg....', '...ggggg...', '..ggggggg..', '.gWggggggg.', '.gWggggggg.', '.ggggggggg.', '..ggggggg..', '...ggggg...']},
  {n: '雨云', m: ['...........', '....LLL....', '...LWWWL...', '.LLWWWWWLL.', 'LWWWWWWWWWL', 'LWWWWWWWWWL', '.LLLLLLLLL.', '...........', '..S..S..S..', '.S..S..S...', '...........']},
  {n: '樱桃', m: ['......GG...', '.....G.G...', '....G...G..', '...G....G..', '..G.....G..', '.rrr...rrr.', 'rPrrr.rPrrr', 'rrrrr.rrrrr', 'rrrrr.rrrrr', '.rrr...rrr.', '...........']}
];

function shade(hex, k){
  const v = parseInt(hex.slice(1), 16);
  const f = c => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
  return `rgb(${f(v >> 16)},${f((v >> 8) & 255)},${f(v & 255)})`;
}

// 实心绣：每一格填满线色、圆一点角，只留一道很淡的斜针。一格是一块，远看不会变成一片小点
function roundRectPath(x, a, b, w, hh, r){
  x.beginPath();
  x.moveTo(a + r, b); x.lineTo(a + w - r, b); x.quadraticCurveTo(a + w, b, a + w, b + r);
  x.lineTo(a + w, b + hh - r); x.quadraticCurveTo(a + w, b + hh, a + w - r, b + hh);
  x.lineTo(a + r, b + hh); x.quadraticCurveTo(a, b + hh, a, b + hh - r);
  x.lineTo(a, b + r); x.quadraticCurveTo(a, b, a + r, b);
  x.closePath();
}
function stitchIcon(rows){
  const {c, x, cell, n} = gridCanvas();
  const cells = [];
  for (let r = 0; r < n; r++){
    for (let q = 0; q < n; q++){
      if (rows[r][q] !== '.') cells.push([r, q, PAL[rows[r][q]]]);
    }
  }
  x.fillStyle = 'rgba(60,35,10,.16)';
  for (const [r, q] of cells) x.fillRect(q * cell, r * cell + 1.6, cell, cell);
  for (const [r, q, col] of cells){
    x.fillStyle = col;
    roundRectPath(x, q * cell + .35, r * cell + .35, cell - .7, cell - .7, 2.2);
    x.fill();
  }
  x.lineCap = 'round';
  x.lineWidth = 1.2;
  x.strokeStyle = 'rgba(255,255,255,.2)';
  for (const [r, q] of cells){
    x.beginPath();
    x.moveTo(q * cell + cell * .78, r * cell + cell * .22);
    x.lineTo(q * cell + cell * .22, r * cell + cell * .78);
    x.stroke();
  }
  return c.toDataURL('image/png');
}

// 靛蓝粗毛衣的平针纹理：每一针是一个 V，针脚放大 2.4 倍，一屏横着只有八针左右
function knitTexture(){
  const w = 48, h = 40.8, cols = 4, rows = 4, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const c = document.createElement('canvas');
  c.width = w * cols * dpr;
  c.height = h * rows * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  x.fillStyle = '#1e3066';
  x.fillRect(0, 0, w * cols, h * rows);
  const rnd = rngFrom(5), tone = [];
  for (let i = 0; i < cols * rows; i++) tone.push(rnd() * .04 - .02);
  for (let r = -1; r <= rows; r++){
    for (let q = -1; q <= cols; q++){
      const k = tone[((r % rows + rows) % rows) * cols + ((q % cols + cols) % cols)];
      for (const side of [-1, 1]){
        const cx = q * w + w / 2 + side * w * .22, cy = r * h + h * .5;
        const g = x.createLinearGradient(cx, cy - h * .55, cx, cy + h * .55);
        g.addColorStop(0, shade('#2f4a8c', k + .02));
        g.addColorStop(1, shade('#253d7c', k));
        x.fillStyle = g;
        x.beginPath();
        x.ellipse(cx, cy, h * .56, w * .19, -side * 1.08, 0, Math.PI * 2);
        x.fill();
      }
    }
  }
  return {url: c.toDataURL('image/png'), w: w * cols, h: h * rows};
}

/* ---------- 另外三套外观的画法（共用同一套 11×11 图案） ---------- */
// 掌机只有四个深浅：每种线色事先指定落在第几阶
const TONE = {R: 1, r: 0, P: 3, Y: 2, O: 1, o: 0, G: 1, g: 2, W: 3, L: 2, K: 0, U: 1, u: 2, T: 1, t: 3, B: 1, S: 2, N: 1, n: 2};
function gridCanvas(){
  const cell = 12, n = 11, size = cell * n, dpr = 2;
  const c = document.createElement('canvas');
  c.width = c.height = size * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  return {c, x, cell, n, size};
}

function pixelIcon(rows){
  const {c, x, cell, n} = gridCanvas();
  const shades = ['#0e200f', '#2f5b22', '#6d9636', '#a8c45a'];
  for (let r = 0; r < n; r++){
    for (let q = 0; q < n; q++){
      const ch = rows[r][q];
      if (ch === '.') continue;
      x.fillStyle = shades[TONE[ch]];
      x.fillRect(q * cell + .5, r * cell + .5, cell - 1, cell - 1);
    }
  }
  return c.toDataURL('image/png');
}

// 孔版：每种颜色拆成黄、粉、蓝三版油墨，各带颗粒、各自错开一点，再叠印
const INK = {y: '255,226,0', p: '255,72,176', b: '0,120,191'};
const RISO = {
  R: {p: 1, y: .75}, r: {p: 1, b: .45}, P: {p: .55}, Y: {y: 1, p: .2}, O: {y: 1, p: .65}, o: {y: 1, p: 1},
  G: {b: .8, y: 1}, g: {y: 1, b: .35}, W: {}, L: {b: .4}, K: {b: 1, p: .85}, U: {b: .8, p: .8}, u: {b: .35, p: .35},
  T: {b: .9, y: .45}, t: {b: .4, y: .25}, B: {b: 1, p: .25}, S: {b: .6}, N: {p: .6, y: .8, b: .5}, n: {y: .5, p: .28}
};
function risoIcon(rows, seed){
  const {c, x, cell, n, size} = gridCanvas();
  const rnd = rngFrom(seed * 131 + 7);
  const offs = {y: [0, 0], p: [1.4, -1], b: [-1.1, 1.2]};
  x.globalCompositeOperation = 'multiply';
  for (const k of ['y', 'p', 'b']){
    const lay = document.createElement('canvas');
    lay.width = lay.height = c.width;
    const lx = lay.getContext('2d');
    lx.scale(2, 2);
    let any = false;
    for (let r = 0; r < n; r++){
      for (let q = 0; q < n; q++){
        const ch = rows[r][q];
        const a = ch === '.' ? 0 : (RISO[ch][k] || 0);
        if (!a) continue;
        any = true;
        lx.fillStyle = `rgba(${INK[k]},${a})`;
        lx.fillRect(q * cell, r * cell, cell, cell);
      }
    }
    if (!any) continue;
    lx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 170; i++){
      lx.fillStyle = `rgba(0,0,0,${.2 + rnd() * .45})`;
      lx.fillRect(rnd() * size, rnd() * size, .7 + rnd() * 1.3, .7 + rnd() * 1.3);
    }
    x.drawImage(lay, offs[k][0] * (rnd() < .5 ? 1 : -1), offs[k][1], size, size);
  }
  x.globalCompositeOperation = 'source-over';
  return c.toDataURL('image/png');
}

// 构成：每种图案重新设计成红黄蓝黑的几何构成（坐标以 100 为边长）
function bauhausIcon(i){
  const {c, x, size} = gridCanvas();
  x.scale(size / 100, size / 100);
  const R = '#d6322b', Y = '#f2c230', B = '#1e4fa3', K = '#151515', W = '#ffffff';
  const circ = (cx, cy, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); };
  const rect = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  const tri = (pts, col) => { x.fillStyle = col; x.beginPath(); pts.forEach(([a, b], k) => (k ? x.lineTo(a, b) : x.moveTo(a, b))); x.closePath(); x.fill(); };
  const half = (cx, cy, r, a0, a1, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, r, a0, a1); x.closePath(); x.fill(); };
  const line = (a, b, p, q, w, col) => { x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'butt'; x.beginPath(); x.moveTo(a, b); x.lineTo(p, q); x.stroke(); };
  const ring = (cx, cy, r, w, col, a0 = 0, a1 = Math.PI * 2) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.arc(cx, cy, r, a0, a1); x.stroke(); };
  const PI = Math.PI;
  switch (i){
    case 0: circ(33, 40, 19, R); circ(67, 40, 19, R); tri([[15, 47], [85, 47], [50, 88]], R); break;
    case 1: tri([[50, 8], [88, 72], [12, 72]], Y); tri([[50, 92], [12, 28], [88, 28]], Y); circ(50, 50, 8, K); break;
    case 2: circ(50, 26, 17, B); circ(50, 74, 17, B); circ(26, 50, 17, B); circ(74, 50, 17, B); circ(50, 50, 13, Y); break;
    case 3: tri([[28, 30], [72, 30], [50, 94]], Y); rect(36, 44, 22, 4, K); rect(44, 60, 16, 4, K); rect(38, 8, 6, 20, K); rect(56, 8, 6, 20, K); break;
    case 4: circ(34, 34, 15, K); circ(66, 34, 15, K); circ(34, 66, 15, K); circ(66, 66, 15, K); rect(43, 43, 14, 14, R); break;
    case 5: circ(50, 46, 37, Y); rect(37, 38, 26, 44, K); circ(44, 52, 4, W); circ(56, 52, 4, W); break;
    case 6: circ(48, 48, 38, B); ring(48, 48, 26, 4, K, .2 * PI, 1.3 * PI); ring(48, 48, 13, 4, K, 1.1 * PI, 2.1 * PI); line(76, 76, 94, 94, 4, K); break;
    case 7: x.fillStyle = B; x.beginPath(); x.ellipse(44, 50, 30, 19, 0, 0, PI * 2); x.fill(); tri([[68, 50], [92, 30], [92, 70]], B); circ(32, 46, 4.5, W); break;
    case 8: rect(30, 20, 40, 52, K); circ(50, 20, 20, K); circ(24, 52, 10, K); rect(28, 72, 44, 14, Y); break;
    case 9: circ(50, 62, 27, B); tri([[50, 8], [26, 52], [74, 52]], B); circ(41, 62, 6, W); break;
    case 10: half(50, 56, 40, PI, 2 * PI, K); rect(40, 56, 20, 34, R); circ(34, 42, 5, W); circ(62, 34, 5, W); break;
    case 11: half(50, 30, 42, 0, PI, K); half(50, 30, 35, 0, PI, R); circ(38, 44, 3.5, K); circ(50, 52, 3.5, K); circ(62, 44, 3.5, K); break;
    case 12: circ(37, 72, 14, K); rect(45, 14, 6, 60, K); tri([[51, 14], [80, 28], [51, 40]], K); break;
    case 13: circ(50, 66, 26, Y); circ(50, 38, 16, Y); rect(48, 8, 5, 18, K); tri([[53, 16], [72, 8], [66, 22]], K); break;
    case 14: ring(32, 52, 14, 4, K); ring(51, 42, 17, 4, K); ring(69, 54, 13, 4, K); rect(18, 66, 64, 4, K); rect(32, 76, 4, 14, B); rect(49, 80, 4, 14, B); rect(66, 76, 4, 14, B); break;

  }
  return c.toDataURL('image/png');
}

// 孔版纸张的颗粒
function grainTexture(){
  const S = 180, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const c = document.createElement('canvas');
  c.width = c.height = S * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  const rnd = rngFrom(11);
  for (let i = 0; i < 900; i++){
    x.fillStyle = rnd() < .5 ? `rgba(0,120,191,${.05 + rnd() * .12})` : `rgba(255,72,176,${.05 + rnd() * .12})`;
    x.fillRect(rnd() * S, rnd() * S, .6 + rnd() * 1.1, .6 + rnd() * 1.1);

const Sound = {

/* ---------- 背景音乐：《老麦克唐纳有块地》（英美童谣，早已是公版），全部现场合成 ---------- */
const Music = (() => {
  const VOL = .09;          // 比点牌的音效轻
  const BPM = 132;
  let out = null, master = null, noiseBuf = null, timer = 0, step = 0, next = 0, playing = false;
  const C = () => Sound.ctx;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function vca(t, peak, a, hold, rel){
    const g = C().createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + a + hold);
    g.gain.exponentialRampToValueAtTime(.0001, t + a + hold + rel);
    return g;
  }
  function osc(type, f, t, end){
    const o = C().createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    o.start(t);
    o.stop(end);
    return o;
  }
  function noise(t, end){
    const n = C().createBufferSource();
    n.buffer = noiseBuf;
    n.loop = true;
    n.start(t, Math.random() * .5);
    n.stop(end);
    return n;
  }
  function filt(type, f, q = 1){

    g.gain.value = v;

  }
  function chain(...nodes){

  }

  // 乐器：大号、拨弦、梆子、底鼓、沙锤、口哨，还有小羊
  const I = {
    kick(t, v){
      const o = osc('sine', 150, t, t + .32);
      o.frequency.exponentialRampToValueAtTime(44, t + .11);
      chain(o, vca(t, .95 * v, .003, .02, .24), out);
    },
    shaker(t, v){
      chain(noise(t, t + .1), filt('highpass', 5500, .7), vca(t, .07 * v, .006, 0, .05), out);
    },
    block(t, m, v){
      const f = mtof(m), o = osc('sine', f, t, t + .1);
      o.frequency.exponentialRampToValueAtTime(f * .94, t + .06);
      chain(o, vca(t, .3 * v, .001, 0, .06), out);
      chain(osc('triangle', f * 2.63, t, t + .05), vca(t, .06 * v, .001, 0, .025), out);
    },
    tuba(t, m, dur, v){
      const o = osc('sawtooth', mtof(m), t, t + dur + .1), lp = filt('lowpass', 260, 1.5);
      lp.frequency.setValueAtTime(260, t);
      lp.frequency.linearRampToValueAtTime(560, t + .05);
      chain(o, lp, vca(t, .5 * v, .03, dur * .5, dur * .4 + .05), out);
    },
    pizz(t, ms){
      for (const m of ms){
        const f = mtof(m), lp = filt('lowpass', 2600, .8), g2 = gain(.3);
        osc('triangle', f, t, t + .3).connect(lp);
        osc('sawtooth', f, t, t + .3).connect(g2);
        g2.connect(lp);
        chain(lp, vca(t, .07, .003, 0, .18), out);
      }
    },
    whistle(t, m, dur){
      const f = mtof(m), end = t + dur + .06, o = osc('sine', f * .97, t, end);
      o.frequency.exponentialRampToValueAtTime(f, t + .04);
      const l = osc('sine', 6, t, end), d = gain(f * .01);
      l.connect(d);
      d.connect(o.frequency);
      chain(o, vca(t, .16, .02, Math.max(0, dur - .05), .05), out);
      chain(noise(t, end), filt('bandpass', f * 2, 8), vca(t, .05, .02, Math.max(0, dur - .05), .05), out);
    },
    // 羊叫：锯齿波过三个元音共振峰，每秒抖十七下，开头嘴闭着像「m」
    baa(t, m, dur){
      const f0 = mtof(m), end = t + dur + .06;
      const o = osc('sawtooth', f0 * 1.06, t, end);
      o.frequency.linearRampToValueAtTime(f0, t + .08);
      o.frequency.linearRampToValueAtTime(f0 * .9, end);
      const trem = osc('sine', 17, t, end), am = gain(.55), amDepth = gain(.45), wob = gain(f0 * .025);
      trem.connect(amDepth);
      amDepth.connect(am.gain);
      trem.connect(wob);
      wob.connect(o.frequency);

      lp.frequency.setValueAtTime(350, t);
      lp.frequency.exponentialRampToValueAtTime(5000, t + .07);
      o.connect(am);
      am.connect(lp);
      const sum = gain(1.6);
      for (const [f, q, lv] of [[560, 5, 1], [1750, 7, .7], [2600, 8, .3]]){
        const b = filt('bandpass', f, q), g = gain(lv);

      env.gain.setValueAtTime(.0001, t);
      env.gain.exponentialRampToValueAtTime(.9, t + .03);
      env.gain.setValueAtTime(.9, t + Math.max(.035, dur * .7));
      env.gain.exponentialRampToValueAtTime(.0001, end);
      chain(sum, env, out);
    }
  };

  // 记谱：每小节 16 格，一格一个十六分音符。「.」休止，「-」延长上一个音，带「*」的音由小羊来唱
  function nm(x){
    const r = /^([A-G])(#|b)?(-?\d)$/.exec(x);
    return {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11}[r[1]] + (r[2] === '#' ? 1 : r[2] === 'b' ? -1 : 0) + (+r[3] + 1) * 12;
  }
  function bar(str){
    const tok = str.trim().split(/\s+/), ev = [];
    tok.forEach((x, i) => {
      if (x === '.') return;
      if (x === '-'){
        const e = ev[ev.length - 1];
        if (e && e.step + e.len === i) e.len++;
        return;
      }
      ev.push({step: i, m: nm(x.replace('*', '')), len: 1, baa: x[0] === '*'});
    });
    ev.forEach((e, k) => {
      const nx = k + 1 < ev.length ? ev[k + 1].step : 16;
      e.len = Math.max(e.len, Math.min(3, nx - e.step));
    });
    const at = {};
    for (const e of ev) at[e.step] = e;
    return at;
  }
  const VERSE = [
    'G5 - . . G5 - . . G5 - . . D5 - . .',
    'E5 - . . E5 - . . D5 - - - - - . .',
    'B5 - . . B5 - . . A5 - . . A5 - . .'
  ];
  const SONG = [
    ...VERSE, 'G5 - - - - - - - - - - - . . . .',
    ...VERSE, 'G5 - - - - - - - - - - . D5 . D5 .',
    '*G4 - - . *G4 - - . G5 - - . D5 . D5 .',
    '*G4 - - . *G4 - - . G5 - - - - - - .',
    'G5 . G5 . *G4 - - . G5 . G5 . *G4 - - .',
    'G5 . G5 . G5 . G5 . *G4 - - . *G4 - - .',
    ...VERSE, 'G5 - - - - - - - - - - - . . . .'
  ].map(bar);
  const HALVES = [[43, 43], [48, 43], [43, 38], [43, 43]];
  const CHORD = {43: [62, 67, 71], 48: [60, 64, 67], 38: [62, 66, 69]};

  function play(b, s, t, d){
    const root = (b >= 8 && b < 12 ? (b === 11 ? [43, 38] : [43, 43]) : HALVES[b % 4])[s < 8 ? 0 : 1];
    if (s === 0 || s === 8){
      I.tuba(t, root, d * 3, s ? .9 : 1);
      I.kick(t, .45);
    }
    if (s === 4 || s === 12){
      I.pizz(t, CHORD[root]);
      I.block(t, 76, .45);
    }
    if (s % 2 === 0) I.shaker(t, s % 4 ? .7 : 1);
    const e = SONG[b][s];
    if (e){
      if (e.baa) I.baa(t, e.m, e.len * d * .95);
      else I.whistle(t, e.m, e.len * d);
    }
  }
  function pump(){
    const c = C(), d = 60 / BPM / 4;
    while (next < c.currentTime + .15){
      play(Math.floor(step / 16) % SONG.length, step % 16, next, d);
      next += d;
      step++;
    }
  }
  function setup(c){
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 8;
    comp.ratio.value = 4;
    comp.attack.value = .003;
    comp.release.value = .18;
    out = c.createGain();
    master = c.createGain();
    master.gain.value = 0;
    out.connect(comp);
    comp.connect(master);
    master.connect(c.destination);
    const len = c.sampleRate, d = (noiseBuf = c.createBuffer(1, len, len)).getChannelData(0), rnd = rngFrom(3);
    for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
  }
  function fade(to, secs){
    const now = C().currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(to, now + secs);
  }
  return {
    // 浏览器要等玩家点一下才让出声，所以每次点屏幕都试着开一次
    start(){
      if (!Sound.on) return;
      try {
        const c = Sound.ctx || (Sound.ctx = new (window.AudioContext || window.webkitAudioContext)());
        if (c.state === 'suspended' && document.visibilityState === 'visible') c.resume();
        if (playing) return;
        if (!master) setup(c);
        playing = true;
        fade(VOL, 1.2);
        next = c.currentTime + .1;
        timer = setInterval(pump, 25);
        pump();
      } catch (e) {}
    },
    stop(){
      if (!playing) return;
      playing = false;
      clearInterval(timer);
      fade(0, .3);
    }
  };
})();

/* ---------- 随机数（同一个种子永远发出同一副牌） ---------- */
function rngFrom(seed){
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const newSeed = () => 1 + Math.floor(Math.random() * 2147483000);
// 新开一局：尽量不和上一局用同一种摆法
function freshSeed(level){
  let s = newSeed();
  for (let i = 0; level > 1 && i < 12 && archOf(s).id === prefs.lastArch; i++) s = newSeed();
  return s;
}
const pickOne = (arr, rng) => arr[Math.floor(rng() * arr.length)];
function shuffled(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 摆牌：坐标以一张牌的边长为 1 ---------- */
function introLayout(){
  const out = [];
  for (let z = 0; z < 3; z++)
    for (const y of [1.9, 3.15, 4.4])
      for (const x of [1.75, 3, 4.25]) out.push({x, y: y - (2 - z) * .17, z});
  return out;
}

const OFFSETS = [[0, 0], [.5, .5], [.5, 0], [0, .5]];
function layerShape(rng){
  const kind = pickOne(['rect', 'rect', 'twin', 'frame', 'diamond', 'cross'], rng);
  if (kind === 'rect'){
    const hw = pickOne([1, 1.5, 2, 2.5, 3], rng) + .01, top = .5 + rng() * 2, bot = 6.5 - rng() * 2;
    return (dx, dy, cy) => dx <= hw && cy >= top && cy <= bot;
  }
  if (kind === 'twin'){
    const inner = pickOne([.5, 1, 1.5], rng) - .01, outer = inner + pickOne([1.5, 2], rng) + .02;
    const top = .5 + rng() * 2.5, bot = 6.5 - rng() * 2.5;
    return (dx, dy, cy) => dx >= inner && dx <= outer && cy >= top && cy <= bot;
  }
  if (kind === 'frame'){
    const hw = pickOne([2.5, 3], rng) + .01, hh = pickOne([2.5, 3], rng) + .01;
    return (dx, dy) => dx <= hw && dy <= hh && (dx >= hw - 1.05 || dy >= hh - 1.05);
  }
  if (kind === 'diamond'){
    const a = pickOne([2.5, 3, 3.5], rng), b = pickOne([2.5, 3, 3.5], rng);
    return (dx, dy) => dx / a + dy / b <= 1.02;
  }
  const w = pickOne([.5, 1], rng) + .01;
  return (dx, dy) => dx <= w || dy <= w;
}

/* ---------- 九种摆法：每局先抽一种大轮廓，再在里面随机 ---------- */
const snap = v => Math.round(v * 2) / 2;

// 按左右对称生成一层；keep(dx, cy, cx) 决定某个位置要不要放牌
function symLayer(rng, z, ox, oy, keep, dens){
  const cols = ox ? 6 : 7, rows = oy ? 6 : 7, out = [];
  for (let r = 0; r < rows; r++){
    const y = r + oy, cy = y + .5;
    for (let c = 0; c < Math.ceil(cols / 2); c++){
      const x = c + ox, mx = cols - 1 - c + ox, cx = x + .5;
      if (!keep(Math.abs(cx - 3.5), cy, cx) || rng() > dens) continue;
      out.push({x, y, z});
      if (mx !== x) out.push({x: mx, y, z});
    }
  }
  return out;
}

// 方阵：每层随机一种形状，相邻两层错开半张
function buildBlock(rng, cfg){
  const out = [];
  let prev = 0, z = 0, tries = 0;
  while (z < cfg.maxLayers && out.length < cfg.target && tries++ < 80){
    let oi = 0;
    if (z > 0){
      oi = Math.floor(rng() * 4);
      if (oi === prev) oi = (oi + 1 + Math.floor(rng() * 3)) % 4;
    }
    const [ox, oy] = OFFSETS[oi];
    const shape = layerShape(rng);
    const layer = symLayer(rng, z, ox, oy, (dx, cy) => shape(dx, Math.abs(cy - 3.5), cy), cfg.density);
    if (layer.length < 6) continue;
    out.push(...layer);
    prev = oi;
    z++;
  }
  return out;
}

// 金字塔：一层比一层小，中间最深
function buildPyramid(rng, cfg){
  const out = [], w0 = pickOne([3, 3.5], rng), h0 = pickOne([2.5, 3, 3.5], rng);
  const rep = rng() < .6 ? 2 : 1, step = pickOne([.5, .6, .75], rng);
  let z = 0, lvl = 0;
  while (out.length < cfg.target && z < 18){
    const hw = w0 - lvl * step, hh = h0 - lvl * step;
    if (hw < .45 || hh < .45){ lvl = Math.max(0, lvl - 3); continue; }
    const [ox, oy] = z % 2 ? [.5, .5] : [0, 0];
    out.push(...symLayer(rng, z, ox, oy, (dx, cy) => dx <= hw + .01 && Math.abs(cy - 3.5) <= hh + .01, .93));
    z++;
    if (z % rep === 0) lvl++;
  }
  return out;
}

// 双塔：左右两根高柱，底下偶尔搭一道桥
function buildTowers(rng, cfg){
  const out = [], mid = pickOne([1.5, 2, 2.5], rng), w = pickOne([.5, 1], rng) + .01;
  const top = .5 + rng() * 1.5, bot = 6.5 - rng() * 1.5, bridge = rng() < .7;
  let z = 0;
  while (out.length < cfg.target && z < 20){
    const [ox, oy] = OFFSETS[[0, 1, 2, 1][z % 4]];
    out.push(...symLayer(rng, z, ox, oy, (dx, cy) =>
      (Math.abs(dx - mid) <= w && cy >= top && cy <= bot) || (bridge && z < 2 && Math.abs(cy - 3.5) <= .6), .92));
    z++;
  }
  return out;
}

// 回环：中空的方框，有时中心再立一根深柱
function buildRing(rng, cfg){
  const out = [], core = rng() < .55, th = pickOne([1, 1.5], rng), hh = pickOne([2.5, 3], rng) + .01;
  let z = 0;
  while (out.length < cfg.target && z < 16){
    const [ox, oy] = z % 2 ? [.5, .5] : [0, 0];
    const hw = 3 - (z % 3) * .5 + .01;
    out.push(...symLayer(rng, z, ox, oy, (dx, cy) => {
      const dy = Math.abs(cy - 3.5);
      return (dx <= hw && dy <= hh && (dx >= hw - th || dy >= hh - th)) || (core && dx <= .6 && dy <= .6);
    }, .9));
    z++;
  }
  return out;
}

// 群岛：散落的小堆，不对称；每个小堆的每一层都有自己的层号
function buildIslands(rng, cfg){
  const out = [], sizes = [[1, 1], [2, 1], [1, 2], [2, 2], [3, 2], [2, 3]];
  let z = 0, guard = 0;
  while (out.length < cfg.target && guard++ < 40){
    const [w, h] = pickOne(sizes, rng);
    const bx = snap(rng() * (6.5 - w)), by = snap(rng() * (7 - h));
    const depth = 3 + Math.floor(rng() * 5);
    for (let d = 0; d < depth; d++){
      const ox = d % 2 ? pickOne([.5, -.5], rng) : 0, oy = d % 2 ? pickOne([.5, 0], rng) : 0;
      for (let r = 0; r < h; r++){
        for (let c = 0; c < w; c++){
          const x = bx + c + ox, y = by + r + oy;
          if (x < 0 || x > 6 || y < 0 || y > 6.5 || rng() > .9) continue;
          out.push({x, y, z});
        }
      }
      z++;
    }
  }
  return out;
}

// 漩涡：一块牌沿着圆圈一层层挪位置往上盘
function buildSwirl(rng, cfg){
  const out = [], R = 1 + rng() * .9, dir = rng() < .5 ? 1 : -1, t0 = rng() * Math.PI * 2, dt = .55 + rng() * .35;
  const w = pickOne([3, 4], rng), h = pickOne([3, 4], rng);
  let z = 0;
  while (out.length < cfg.target && z < 26){
    const a = t0 + dir * z * dt;
    const x0 = snap(3.5 + R * Math.cos(a) - w / 2), y0 = snap(3.75 + R * .9 * Math.sin(a) - h / 2);
    for (let r = 0; r < h; r++){
      for (let c = 0; c < w; c++){
        const x = x0 + c, y = y0 + r;
        if (x < 0 || x > 6 || y < 0 || y > 6.5 || rng() > .9) continue;
        out.push({x, y, z});
      }
    }
    z++;
  }
  return out;
}

// 千层：九个位置各叠一摞很深的牌，全部朝同一个方向错开
function buildColumns(rng, cfg){
  const out = [], [ddx, ddy] = pickOne([[.055, 0], [0, .055], [.045, .035], [-.045, .035]], rng);
  const slots = [];
  for (const y of [0, 2.3, 4.6]) for (const x of [0, 2.4, 4.8]) slots.push([x + (ddx < 0 ? 1.16 : 0), y]);
  for (const [bx, by] of shuffled(slots, rng)){
    if (out.length >= cfg.target) break;
    const depth = 10 + Math.floor(rng() * 12);
    for (let d = 0; d < depth; d++) out.push({x: bx + d * ddx, y: by + d * ddy, z: d});
  }
  return out;
}

// 剪影：按轮廓叠，轮廓左右对称
const MASKS = [
  ['羊头', ['X.....X', 'XXXXXXX', '.XXXXX.', '.XXXXX.', '..XXX..', '..XXX..', '...X...']],
  ['爱心', ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...']],
  ['山', ['...X...', 'X..X..X', 'X..X..X', 'X..X..X', 'XXXXXXX', 'XXXXXXX', '.......']]
];
function buildMask(rng, cfg, meta){
  const [name, m] = pickOne(MASKS, rng);
  meta.label = '剪影·' + name;
  const on = (r, c) => r >= 0 && c >= 0 && r < 7 && c < 7 && m[r][c] === 'X';
  const out = [];
  let z = 0;
  while (out.length < cfg.target && z < 14){
    const [ox, oy] = [[0, 0], [.5, .5], [.5, 0], [0, .5]][z % 4];
    const dens = Math.max(.6, .95 - z * .04);
    const cols = ox ? 6 : 7, rows = oy ? 6 : 7;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < Math.ceil(cols / 2); c++){
        const ok = on(r, c) && (!ox || on(r, c + 1)) && (!oy || on(r + 1, c)) && (!ox || !oy || on(r + 1, c + 1));
        if (!ok || rng() > dens) continue;
        const mc = cols - 1 - c;
        out.push({x: c + ox, y: r + oy, z});
        if (mc !== c) out.push({x: mc + ox, y: r + oy, z});
      }
    }
    z++;
  }
  return out;
}

// 砖墙：一行错开半张，像砌砖；宽而浅
function buildBricks(rng, cfg){
  const out = [], top = snap(rng() * 1.5), bot = 6.5 - snap(rng() * 1.5);
  let z = 0;
  while (out.length < cfg.target && z < 10){
    const oy = (z % 4 >= 2) ? .5 : 0, holes = .05 + rng() * .15;
    for (let y = top + oy, row = 0; y <= bot; y += 1, row++){
      const ox = ((row + z) % 2) * .5, cols = ox ? 6 : 7;
      for (let c = 0; c < cols; c++){
        if (rng() < holes) continue;
        out.push({x: c + ox, y, z});
      }
    }
    z++;
  }
  return out;
}

const ARCHES = [
  {id: 'block', name: '方阵', build: buildBlock},
  {id: 'pyramid', name: '金字塔', build: buildPyramid},
  {id: 'towers', name: '双塔', build: buildTowers},
  {id: 'ring', name: '回环', build: buildRing},
  {id: 'islands', name: '群岛', build: buildIslands, flip: true},
  {id: 'swirl', name: '漩涡', build: buildSwirl, flip: true},
  {id: 'columns', name: '千层', build: buildColumns, flip: true},
  {id: 'mask', name: '剪影', build: buildMask},
  {id: 'bricks', name: '砖墙', build: buildBricks}
];
const archOf = seed => ARCHES[Math.floor(rngFrom((seed ^ 0x2c1b3c6d) >>> 0)() * ARCHES.length)];

// 底部的牌摞：0～3 摞，只有最上面一张能拿
function pilePlan(rng, amount){
  const r = rng();
  const n = r < .18 ? 0 : r < .42 ? 1 : r < .85 ? 2 : 3;
  const cap = [0, 24, 20, 11][n], out = [];
  for (let i = 0; i < n; i++){
    const each = Math.round(amount / n * (.75 + rng() * .45));
    out.push({slot: n === 1 ? 'mid' : n === 2 ? (i ? 'right' : 'left') : ['left', 'mid', 'right'][i], n: Math.max(4, Math.min(cap, each))});
  }
  return out;
}
function pilePositions(piles){
  const out = [];
  for (const p of piles){
    const x0 = p.slot === 'mid' ? (piles.length === 1 ? 3 - (p.n - 1) * .105 / 2 : 2.45) : 0;
    for (let i = 0; i < p.n; i++){
      const x = p.slot === 'right' ? 6 - i * .105 : p.slot === 'left' ? i * .105 : x0 + i * .105;
      out.push({x, y: 7.62, z: i, pile: true});
    }
  }
  return out;
}

// 把主牌堆挪到牌桌正中（有牌摞时只用上面 7.5 格高）
function centerMain(pos, hasPiles){
  if (!pos.length) return pos;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of pos){
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x + 1);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y + 1);
  }
  const availH = hasPiles ? 7.5 : 8.6;
  const dx = (BW - (x1 - x0)) / 2 - x0, dy = Math.max(0, (availH - (y1 - y0)) / 2) - y0;
  return pos.map(p => ({x: p.x + dx, y: p.y + dy, z: p.z}));
}

function makeLayout(rng, cfg, arch){
  const piles = cfg.fixedPiles ? cfg.fixedPiles.map(p => Object.assign({}, p)) : pilePlan(rng, cfg.piles * 2);
  const pileSum = piles.reduce((s, p) => s + p.n, 0);
  const meta = {label: arch.name};
  let main = arch.build(rng, Object.assign({}, cfg, {target: cfg.target + cfg.piles * 2 - pileSum}), meta);
  if (arch.flip){
    if (rng() < .5) main = main.map(p => ({x: 6 - p.x, y: p.y, z: p.z}));
    if (rng() < .5) main = main.map(p => ({x: p.x, y: 6.5 - p.y, z: p.z}));
  }
  main = centerMain(main, piles.length > 0);
  const extra = (3 - (main.length + pileSum) % 3) % 3;
  if (piles.length) piles[piles.length - 1].n += extra;
  else if (extra) main = main.sort((a, b) => a.z - b.z).slice(0, main.length - (3 - extra));
  return {pos: main.concat(pilePositions(piles)), label: meta.label};
}

function makeTiles(pos){
  const tiles = pos.map((p, id) => ({
    id, x: p.x, y: p.y, z: p.z, pile: !!p.pile, type: -1, status: 'board', pending: false,
    covers: [], coveredBy: [], el: null, art: null, shown: -1, si: 0, hc: 0, hd: 0
  }));
  for (let i = 0; i < tiles.length; i++){
    const a = tiles[i];
    for (let j = i + 1; j < tiles.length; j++){
      const b = tiles[j];
      if (a.z === b.z || Math.abs(a.x - b.x) > .999 || Math.abs(a.y - b.y) > .999) continue;
      const hi = a.z > b.z ? a : b, lo = hi === a ? b : a;
      hi.covers.push(lo);
      lo.coveredBy.push(hi);
    }
  }
  return tiles;
}

/* ---------- 保证有解：先模拟一条通关路线，再按路线给每张牌定图案 ----------
   每一步从“此刻没被压住”的牌里挑一张，决定它是什么图案，模拟把它放进口袋。
   只要模拟过程中口袋从不放满，这条路线就是一条真实可走的通关路线。 */
function plan(pool, o){
  const rng = o.rng, full = o.cap || CAP, cap = Math.min(o.maxSlot, full - 1);
  const inPool = new Set(pool.map(t => t.id));
  const cnt = new Map(), free = [];
  for (const t of pool){
    let c = 0;
    for (const a of t.coveredBy) if (inPool.has(a.id)) c++;
    cnt.set(t.id, c);
    if (!c) free.push(t);
  }
  const supply = new Map(Object.entries(o.supply).map(([k, v]) => [Number(k), v]));
  const hold = o.hold.slice();
  const slot = new Map();
  let slotLen = 0;
  for (const ty of o.slot){ slot.set(ty, (slot.get(ty) || 0) + 1); slotLen++; }
  const assign = new Map(), order = [];
  let left = pool.length;
  const avail = ty => (supply.get(ty) || 0) + hold.filter(h => h === ty).length;

  while (left > 0 || hold.length){
    const twos = [], ones = [], opens = [];
    for (const [ty, c] of slot) if (avail(ty) > 0) (c === 2 ? twos : ones).push(ty);
    const seen = new Set(slot.keys());
    for (const ty of [...supply.keys(), ...hold]){
      if (seen.has(ty)) continue;
      seen.add(ty);
      if (avail(ty) > 0) opens.push(ty);
    }
    const canOpen = opens.length > 0 && slotLen + 1 <= cap;
    let ty;
    if (canOpen && (slotLen === 0 || rng() < o.interleave)){
      let w = 0;
      for (const t of opens) w += avail(t);
      let r = rng() * w;
      ty = opens[opens.length - 1];
      for (const t of opens){ r -= avail(t); if (r < 0){ ty = t; break; } }
    } else if (twos.length) ty = pickOne(twos, rng);
    else if (ones.length && slotLen + 1 < full) ty = pickOne(ones, rng);
    else if (canOpen) ty = pickOne(opens, rng);
    else return null;

    const hi = hold.indexOf(ty);
    if (hi >= 0){
      hold.splice(hi, 1);
      order.push(-1);
    } else {
      if (!free.length) return null;
      const i = Math.floor(rng() * free.length), t = free[i];
      free[i] = free[free.length - 1];
      free.pop();
      assign.set(t.id, ty);
      supply.set(ty, supply.get(ty) - 1);
      left--;
      order.push(t.id);
      for (const b of t.covers){
        if (!inPool.has(b.id)) continue;
        const c = cnt.get(b.id) - 1;
        cnt.set(b.id, c);
        if (!c) free.push(b);
      }
    }
    const c = (slot.get(ty) || 0) + 1;
    if (c === 3){ slot.delete(ty); slotLen -= 2; } else { slot.set(ty, c); slotLen++; }
    if (slotLen >= full) return null;
  }
  return {assign, order};
}

// 按真实规则把路线走一遍，确认能清空
function verify(tiles, order, full = CAP){
  const onBoard = new Set(tiles.map(t => t.id));
  const slot = [];
  for (const id of order){
    const t = tiles[id];
    if (!t || !onBoard.has(id) || t.coveredBy.some(a => onBoard.has(a.id))) return false;
    onBoard.delete(id);
    slot.push(t.type);
    if (slot.filter(x => x === t.type).length === 3){
      for (let k = 0; k < 3; k++) slot.splice(slot.indexOf(t.type), 1);
    } else if (slot.length >= full) return false;
  }
  return onBoard.size === 0 && slot.length === 0;
}

// 定时炸弹：沿着算好的通关路线走一遍，看每张牌从进口袋到被消掉隔了几步；
// 只挑隔 2～8 步的牌当炸弹，倒数的数字再多留一两步，保证照这条路线走一颗都不会炸
function pickBombs(tiles, order, rng, count){
  const slot = [], at = new Map(), gone = new Map();
  order.forEach((id, i) => {
    const t = tiles[id];
    at.set(id, i);
    slot.push(t);
    const same = slot.filter(x => x.type === t.type);
    if (same.length === 3) for (const x of same){ gone.set(x.id, i); slot.splice(slot.indexOf(x), 1); }
  });
  const cands = shuffled(tiles.filter(t => {
    const d = gone.get(t.id) - at.get(t.id);
    return !t.pile && d >= 2 && d <= 8;
  }), rng);
  for (const t of cands.slice(0, count)) t.bomb = Math.min(9, gone.get(t.id) - at.get(t.id) + 1 + (rng() < .4 ? 1 : 0));
}

/* ---------- 关卡 ---------- */
function levelCfg(level){
  if (level <= 1) return {intro: true, interleave: 0, maxSlot: 3};
  const k = Math.min(level - 2, 4);
  return {
    intro: false, types: Math.min(12 + 2 * k, 16), target: 150 + 20 * k, maxLayers: 8 + k,
    density: .85, piles: 10 + 2 * k, interleave: .3 + .06 * k, maxSlot: k ? 5 : 4
  };
}

function buildLevel(level, seed){
  return buildWith(levelCfg(level), seed, archOf(seed));
}
function buildWith(cfg, seed, arch){
  for (let attempt = 0; attempt < 40; attempt++){
    const rng = rngFrom(seed + attempt * 7919);
    let pos, types;
    let label = '热身';
    if (cfg.intro){
      pos = introLayout();
      types = [0, 1, 4];
    } else {
      const lay = makeLayout(rng, cfg, arch);
      pos = lay.pos;
      label = lay.label;
      const tc = Math.max(10, Math.min(16, cfg.types + pickOne([-1, 0, 0, 1], rng)));
      types = shuffled(ICONS.map((_, i) => i), rng).slice(0, tc);
    }
    const tiles = makeTiles(pos);
    const supply = {};
    for (let i = 0; i < tiles.length / 3; i++){
      const ty = types[i % types.length];
      supply[ty] = (supply[ty] || 0) + 3;
    }
    const res = plan(tiles, {supply, slot: [], hold: [], interleave: cfg.interleave, maxSlot: cfg.maxSlot, cap: cfg.cap, rng});
    if (!res) continue;
    for (const t of tiles) t.type = res.assign.get(t.id);
    if (!verify(tiles, res.order, cfg.cap || CAP)) continue;
    if (cfg.bombs) pickBombs(tiles, res.order, rng, cfg.bombs);
    return {tiles, cfg, label};
  }
  return null;
}

/* ---------- 对局状态 ---------- */

const L = {unit: 40, cell: 40, pad: 6, boardX: 0, boardY: 2, trayX: 0, trayY: 0, trayW: 0, holdX: 0, holdY: 0};

function elapsed(){ return G.acc + (G.running ? performance.now() - G.t0 : 0); }
function startClock(){ if (!G.running){ G.t0 = performance.now(); G.running = true; } }

const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

/* ---------- 动效小工具 ---------- */
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const tf = (x, y, s) => `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(+s).toFixed(3)})`;
function replay(el, cls){
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}
function updateArt(t){
  if (t.shown === t.type) return;
  t.art.className = 'art ic-' + t.type;
  t.el.dataset.ty = t.type;
  t.shown = t.type;
}
// 牌在牌堆、口袋、架子之间移动时走一道弧线：先抬起、在空中略放大，落下时轻轻一顿
function flyArc(t, x0, y0, s0, x1, y1, s1){
  const el = t.el;
  if (!el.animate) return;
  if (t.anim){ t.anim.cancel(); t.anim = null; }
  const lift = Math.min(64, 14 + Math.hypot(x1 - x0, y1 - y0) * .16), ms = Math.max(s0, s1) * 1.1;
  el.classList.add('flying');
  const shadow = k => `drop-shadow(0 ${(10 * k).toFixed(1)}px ${(12 * k).toFixed(1)}px rgba(0,0,0,${(.28 * k).toFixed(3)}))`;
  const a = el.animate([
    {transform: tf(x0, y0, s0), filter: shadow(0)},
    {transform: tf((x0 + x1) / 2, (y0 + y1) / 2 - lift, ms), filter: shadow(1), offset: .5},
    {transform: tf(x1, y1 + 2, s1 * 1.05), filter: shadow(.25), offset: .86},
    {transform: tf(x1, y1, s1), filter: shadow(0)}
  ], {duration: 320, easing: 'cubic-bezier(.3,.6,.35,1)'});
  t.anim = a;
  const done = () => { if (t.anim === a){ t.anim = null; el.classList.remove('flying'); } };
  a.onfinish = done;
  a.oncancel = done;
  setTimeout(() => { if (t.anim === a) el.classList.remove('flying'); }, 380);
}
// 消掉时从中间迸出一圈小碎片，颜色跟着当前外观走
function burst(cx, cy){

    p.style.top = cy + 'px';
    p.style.background = `var(${vars[i % 3]})`;

    const ang = i / 10 * Math.PI * 2 + Math.random() * .6, d = L.cell * (.55 + Math.random() * .6);
    const a = p.animate([
      {transform: 'translate(0,0) scale(1)', opacity: 1},
      {transform: `translate(${(Math.cos(ang) * d).toFixed(1)}px,${(Math.sin(ang) * d).toFixed(1)}px) scale(.2)`, opacity: 0}
    ], {duration: 420 + Math.random() * 180, easing: 'cubic-bezier(.2,.7,.3,1)'});
