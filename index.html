}

function render(){
  const {unit, cell, pad} = L, k = (cell / unit).toFixed(4), dig = G.mode === 'dig' && G.run;
  if (dig) digCones();
  G.slot.forEach((t, i) => { t.si = i; });
  G.hold.forEach((col, c) => col.forEach((t, d) => { t.hc = c; t.hd = d; }));
  for (const t of G.tiles){
    const el = t.el;
    if (!el) continue;
    if (t.shown !== t.type && !t.artLock) updateArt(t);
    let x = 0, y = 0, s = 1, zi = 0, blocked = false;
    if (t.status === 'board'){
      const p = boardPose(t);
      x = p.x;
      y = p.y;
      s = p.s.toFixed(3);
      zi = 10 + Math.min(t.z, 280);
      blocked = !isFree(t);
    } else if (t.status === 'slot'){
      x = L.trayX + pad + (t.si + .04) * cell;
      y = L.trayY + pad + .01 * cell;
      s = k;
      zi = 400 + t.si;
    } else if (t.status === 'hold'){
      const col = G.hold[t.hc];
      x = L.holdX + (t.hc * 1.08 + .04) * cell;
      y = L.holdY - t.hd * 5;
      s = k;
      zi = 300 + t.hd;
      blocked = col[col.length - 1] !== t;
    }
    if (t.status !== 'gone'){
      if (!REDUCED && t.prev && t.prev !== t.status && t.prev !== 'gone' && t.px !== undefined) flyArc(t, t.px, t.py, t.ps, x, y, +s);
      // 往下挖钻层的时候，牌堆的位置交给 3D 动画
      if (!(G.anim && t.status === 'board')){
        el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s})`;
        el.style.zIndex = zi;
      }
      el.classList.remove('hide');
      if (t.prev === 'gone' && !REDUCED) replay(el, 'back');
      t.px = x;
      t.py = y;
      t.ps = +s;
    }
    t.prev = t.status;
    if (dig) digTileState(t, el);
    el.classList.toggle('blocked', blocked);
    el.classList.toggle('onboard', t.status === 'board');
    el.classList.toggle('inslot', t.status === 'slot');
    el.classList.toggle('gone', t.status === 'gone');
    el.classList.toggle('pending', t.pending);
    const live = (t.status === 'board' || t.status === 'hold') && !blocked;
    el.tabIndex = live ? 0 : -1;
    el.setAttribute('aria-label', (t.hatch ? `出口，${t.hlab ? t.hlab.textContent : ''}` : tyName(t.type)) + (t.bomb > 0 ? `，炸弹 ${t.bomb}` : '') + (t.status === 'slot' ? '，在口袋里' : blocked ? '，被压住了' : ''));
    if (t.bomb > 0 || t.fuseEl){
      if (!t.fuseEl){
        t.fuseEl = document.createElement('b');
        t.fuseEl.className = 'fuse';
        t.art.parentElement.appendChild(t.fuseEl);
      }
      t.fuseEl.hidden = !(t.bomb > 0);
      if (t.bomb > 0){
        t.fuseEl.textContent = t.bomb;
        t.fuseEl.classList.toggle('hot', t.status === 'slot' && t.bomb <= 2);
      }
    }
  }
  digSync();
  if (G.anim && G.anim.redraw) G.anim.redraw();
  hud();
  syncBlind();
  saveSoon();
}
// 蒙眼：口袋里的牌扣着；刚放进来的那张、消掉一组后剩下的牌会亮一会儿；输了全部翻开
let blindTimer = 0;
function syncBlind(){
  const blind = !!(G.rule && G.rule.blind) && !G.over && !G.won, now = performance.now();
  let next = Infinity;
  for (const t of G.tiles){
    if (!t.el) continue;
    const showing = now < (t.revealUntil || 0);
    const down = blind && t.status === 'slot' && !t.pending && !showing;
    if (t.el.classList.contains('facedown') !== down){
      t.el.classList.toggle('facedown', down);
      if (!REDUCED && t.status === 'slot'){
        t.el.style.setProperty('--fd', '0ms');
        replay(t.el, 'flip');
      }
    }
    if (blind && t.status === 'slot' && showing) next = Math.min(next, t.revealUntil);
  }
  clearTimeout(blindTimer);
  if (next < Infinity) blindTimer = setTimeout(syncBlind, next - now + 20);
}

function hud(){
  const dig = G.mode === 'dig' && G.run;
  let total = G.tiles.length, left = 0;
  if (dig){
    // 往下挖：只数这一层还在牌桌上的牌（不算洞口）
    total = G.run.fl.total || 0;
    for (const t of G.tiles) if (t.status === 'board' && !t.hatch) left++;
  } else for (const t of G.tiles) if (t.status !== 'gone') left++;
  const p = total ? ((total - left) / total).toFixed(4) : 0;
  const daily = G.mode === 'daily' || G.mode === 'trial';
  $('lvlPre').hidden = daily;
  $('lvlPost').hidden = daily;
  $('lvlPost').textContent = dig ? '层' : '关';
  $('lvlNum').textContent = G.mode === 'trial' ? '练习' : daily ? '每日' : G.level;
  $('left').textContent = left;
  $('layoutName').textContent = G.cfg.intro ? '' : `${G.label} · `;
  $('needle').style.left = `calc((100% - 40px) * ${p})`;
  $('sewn').style.width = `calc((100% - 40px) * ${p} + 6px)`;
  const n = G.slot.length;
  $('meterText').textContent = `口袋 ${n}/${G.cap}`;
  pips.forEach((pip, i) => { pip.classList.toggle('on', i < n); pip.hidden = i >= G.cap; });
  meter.classList.toggle('hot', n >= G.cap - 2);
  [...trough.children].forEach((c, i) => c.classList.toggle('dead', i >= G.cap));
  trough.classList.toggle('bombs', !!(G.rule && G.rule.bomb));
  toolState('toolOut', 'nOut', G.tools.out, '移出');
  toolState('toolUndo', 'nUndo', G.tools.undo, '撤回');
  toolState('toolShuffle', 'nShuffle', G.tools.shuffle, '洗牌');
  shelf.hidden = !G.hold.some(c => c.length);
}
function toolState(id, nid, n, name){
  const b = $(id);
  b.disabled = n <= 0;
  const nEl = $(nid);
  if (nEl.textContent !== String(n)){
    if (+nEl.textContent > n && !REDUCED) replay(nEl, 'bump');
    nEl.textContent = n;
  }
  b.setAttribute('aria-label', n > 0 ? `${name}，还能用 ${n} 次` : `${name}，这一局已经用完`);
}

// 造一张牌的按钮（往下挖的牌多三条边，好在 3D 里看出厚度；洞口多一行小字）
function tileEl(t){
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'tile';
  if (t.pile) el.classList.add('pile');
  const face = document.createElement('span');
  face.className = 'face';
  face.setAttribute('aria-hidden', 'true');
  const art = document.createElement('i');
  art.className = 'art';
  face.appendChild(art);
  el.appendChild(face);
  if (G.mode === 'dig'){
    for (const k of ['f', 'l', 'r']){
      const side = document.createElement('span');
      side.className = 'side ' + k;
      side.setAttribute('aria-hidden', 'true');
      el.appendChild(side);
    }
    if (t.hatch){
      el.classList.add('hatch');
      art.style.setProperty('--k', `var(--da-${G.run.exits.length ? nextArt(G.run.floor + 1) : 'normal'})`);
      t.hlab = document.createElement('span');
      t.hlab.className = 'hlab';
      el.appendChild(t.hlab);
    }
  }
  el.addEventListener('click', () => onTile(t));
  if (t.status === 'gone') el.classList.add('gone', 'hide');
  t.el = el;
  t.art = art;
  t.shown = t.hatch ? t.type : -1;
  return el;
}

function mountTiles(deal){
  homeEl.hidden = true;
  // 换局时把深渊留下的状态清掉；正掉进下一层的话动画还要接着用（换了一局就停掉）
  if (G.mode !== 'dig'){ G.slots = CAP; G.run = null; G.aim = null; G.armed = null; }
  if (!(G.anim && G.anim.keep && D && D.ep === G.epoch)){
    if (D) diveAbort();
    G.anim = null;
    G.zooming = false;
    stage.classList.remove('zooming', 'three');
  }
  layout();
  computeHeights(G.tiles);
  // 口袋里带下来的牌原样留着，别的旧牌拿走
  const keep = new Set(G.tiles.map(t => t.el).filter(Boolean));
  for (const el of stage.querySelectorAll('.tile:not(.leaving)')){
    if (keep.has(el)) continue;
    if (REDUCED || !deal) el.remove();
    else { el.classList.add('leaving'); setTimeout(() => el.remove(), 300); }
  }
  const frag = document.createDocumentFragment();
  const order = G.tiles.filter(t => !t.el || !t.el.isConnected).sort((a, b) => a.y - b.y || a.x - b.x || a.z - b.z);
  const maxZ = Math.max(1, ...G.tiles.map(t => t.z));
  for (const t of order){
    const el = tileEl(t);
    if (deal){
      el.style.setProperty('--d', Math.round(Math.max(0, t.z) / maxZ * 700 + Math.random() * 110) + 'ms');
      el.style.setProperty('--r', (Math.random() * 12 - 6).toFixed(1) + 'deg');
    }
    frag.appendChild(el);
  }
  stage.appendChild(frag);
  bed.hidden = !!G.cfg.intro || !G.tiles.some(t => Math.abs(t.y - 7.62) < .01);
  stage.classList.add('instant');
  stage.classList.toggle('dealing', !!deal);
  render();
  void stage.offsetWidth;
  stage.classList.remove('instant');
  clearTimeout(mountTiles.timer);
  if (deal) mountTiles.timer = setTimeout(() => stage.classList.remove('dealing'), 1500);
}

function startLevel(level, seed){
  let built = buildLevel(level, seed);
  for (let i = 0; !built && i < 3; i++){ seed = newSeed(); built = buildLevel(level, seed); }
  if (!built){ level = 1; seed = newSeed(); built = buildLevel(1, seed); }
  G.epoch++;
  Object.assign(G, {
    mode: 'normal', day: '', rule: null, cap: CAP, level, seed, cfg: built.cfg, tiles: built.tiles, label: built.label, slot: [], hold: [[], [], []],
    tools: {out: 1, undo: 1, shuffle: 1}, history: [], moves: 0,
    over: false, won: false, pending: 0, acc: 0, running: false
  });
  savePrefs(built.cfg.intro ? {level, mode: 'normal'} : {level, mode: 'normal', lastArch: archOf(seed).id});
  closeDialog();
  mountTiles(true);
  startClock();
  toast(level === 1 ? '点亮着的牌，凑齐 3 张一样的就会消掉'
    : level === FINAL ? `最后一关 · ${G.label} · ${G.tiles.length} 张牌`
    : level > FINAL ? `无尽模式 · 第 ${level} 关 · ${G.tiles.length} 张牌`
    : `第 ${level}/${FINAL} 关 · ${G.label} · ${G.tiles.length} 张牌`);
  if (level >= 2 && !prefs.peekTold){
    savePrefs({peekTold: true});
    setTimeout(() => toast('看不清怎么叠的？按住口袋上方的层次按钮，或两指在牌堆上拖', 3600), 2300);
  }
}

/* ---------- 点牌 ---------- */
function onTile(t){
  if (G.tiles[t.id] !== t || G.over || G.won || G.zooming) return;
  if (performance.now() < (G.flipUntil || 0)) return;
  if ((peekSrc && peekSrc !== 'gyro') || performance.now() - peekEndedAt < 350) return;
  // 往下挖：洞口、小铲子和炸药先处理
  const dig = G.mode === 'dig' && G.run;
  if (dig && digTap(t)) return;
  if (t.status === 'board'){
    if (!isFree(t)) return nudge(t);
  } else if (t.status === 'hold'){
    const col = G.hold[t.hc];
    if (col[col.length - 1] !== t) return;
  } else return;
  if (G.slot.length >= G.cap) return;

  snapshot();
  if (t.status === 'hold'){
    const col = G.hold[t.hc];
    col.splice(col.indexOf(t), 1);
  }
  t.status = 'slot';
  const queue = !!(G.rule && G.rule.queue);
  let at = G.slot.length;
  if (!queue) for (let i = G.slot.length - 1; i >= 0; i--){
    if (G.slot[i].type === t.type && !G.slot[i].pending){ at = i + 1; break; }
  }
  G.slot.splice(at, 0, t);
  t.revealUntil = performance.now() + 900;
  G.moves++;
  t.inAt = G.moves;
  Sound.tap();
  // 磁铁：场上露着的同款跟着飞进来一张
  if (dig && has('magnet') && G.slot.length < G.cap){
    const twin = G.tiles.find(u => u !== t && u.status === 'board' && !u.hatch && !(u.chain > 0) && u.type === t.type && isFree(u));
    if (twin){
      twin.status = 'slot';
      G.slot.splice(G.slot.indexOf(t) + 1, 0, twin);
      twin.revealUntil = t.revealUntil;
    }
  }

  // 口袋里别的炸弹各走一步（刚放进来的这颗从下一步开始数），记下这一步数到 0 的
  const lit = [];
  if ((G.rule && G.rule.bomb) || dig){
    for (const b of G.slot){
      if (b === t || !(b.bomb > 0) || b.pending) continue;
      b.bomb--;
      if (b.bomb === 0) lit.push(b);
    }
  }
  const live = G.slot.filter(s => !s.pending), tail = live.slice(-3);
  let same = !queue ? live.filter(s => s.type === t.type)
    : tail.length === 3 && tail.every(s => s.type === t.type) ? tail : [];
  // 金羊顶替第三张
  if (dig && same.length === 2){
    const w = live.find(s => s.wild);
    if (w){ w.joinType = t.type; same = same.concat(w); }
  }
  if (same.length >= 3){
    for (const s of same.slice(0, 3)) s.pending = true;
    G.pending += 3;
    const ep = G.epoch;
    setTimeout(() => settle(ep), REDUCED ? 220 : 340);
  }
  // 数到 0 还没凑齐的炸弹爆炸；正好这一步凑齐的就算拆掉了
  for (const b of lit) if (!b.pending) explode(b);
  // 深渊：先看自己这一步有没有撑破口袋，再让怪和险境走一步（怪塞进来的骨头也可能撑破）
  if (dig){
    if (!G.pending && G.slot.length >= G.cap){ render(); digOverflow(); }
    if (!G.over) digAfterPick();
    if (!G.over && !G.pending && G.slot.length >= G.cap){ render(); digOverflow(); }
    if (!G.over) render();
    return;
  }
  if (!G.pending && G.slot.length >= G.cap){
    render();
    lose();
    return;
  }
  render();
}
// 炸弹爆炸：炸坏最右边一格口袋；炸弹本身变回普通牌，还留在口袋里
function explode(b){
  b.bomb = -1;
  G.cap = Math.max(1, G.cap - 1);
  Sound.boom();
  if (b.px !== undefined) burst(b.px + L.cell * .46, b.py + L.cell * .46);
  shakePocket();
  toast(`轰！炸坏了一格口袋，还剩 ${G.cap} 格`);
}

function settle(ep){
  if (ep !== G.epoch) return;
  // 几组前后脚凑成时，每组各排了一次 settle：先到的那次认领，后面的不再重复结算
  const done = G.slot.filter(s => s.pending && !s.claimed);
  if (!done.length) return;
  for (const s of done) s.claimed = true;
  const groups = {};
  for (const s of done){ const k = s.wild ? s.joinType : s.type; (groups[k] = groups[k] || []).push(s); }
  if (!REDUCED && stage.animate){
    for (const g of Object.values(groups)){
      const mid = g[Math.floor(g.length / 2)];
      for (const s of g){
        if (s === mid) continue;
        if (s.anim) s.anim.cancel();
        s.anim = s.el.animate([{transform: tf(s.px, s.py, s.ps)}, {transform: tf(mid.px, mid.py, mid.ps)}],
          {duration: 150, easing: 'cubic-bezier(.55,0,.8,.3)', fill: 'forwards'});
      }
    }
    setTimeout(() => finishSettle(ep, done, groups), 150);
  } else finishSettle(ep, done, groups);
}
function finishSettle(ep, done, groups){
  if (ep !== G.epoch) return;
  G.slot = G.slot.filter(s => !done.includes(s));
  for (const g of Object.values(groups)){
    const mid = g[Math.floor(g.length / 2)];
    for (const s of g){
      if (s.anim){ s.anim.cancel(); s.anim = null; }
      s.el.classList.remove('flying');
      s.el.style.transform = tf(mid.px, mid.py, mid.ps);
      s.pending = false;
      s.claimed = false;
      s.status = 'gone';
    }
    burst(mid.px + L.cell * .46, mid.py + L.cell * .46);
  }
  G.pending = Math.max(0, G.pending - done.length);
  if (G.rule && G.rule.blind) for (const t of G.slot) t.revealUntil = performance.now() + 2000;
  Sound.match();
  if (G.mode === 'dig' && G.run) digAfterSettle(groups);
  render();
  if (G.tiles.every(t => t.status === 'gone')) win();
  else if (G.slot.length >= G.cap && !G.pending) lose();
}

function nudge(t){
  replay(t.el, 'nope');
  Sound.bump();
  if (REDUCED) return;
  const above = t.coveredBy.filter(a => a.status === 'board');
  const tops = above.filter(isFree);
  for (const a of (tops.length ? tops : above)) replay(a.el, 'hint');
}

/* ---------- 撤回用的快照 ---------- */
function snapshot(){
  G.history.push({
    st: G.tiles.map(t => (t.pending ? 3 : ST[t.status])),
    ty: G.tiles.map(t => t.type),
    slot: G.slot.filter(t => !t.pending).map(t => t.id),
    hold: G.hold.map(c => c.map(t => t.id)),
    bm: G.tiles.map(t => t.bomb || 0), cap: G.cap,
    dig: G.mode === 'dig' && G.run ? JSON.stringify({foes: G.run.foes, fl: G.run.fl, wool: G.run.wool, hearts: G.run.hearts, bell: G.run.bell || 0, stats: G.run.stats, charge: G.run.charge, target: G.run.target || 0, ch: G.tiles.map(t => t.chain || 0), bn: G.tiles.map(t => t.burn || 0), bg: G.tiles.map(t => t.badge || 0), xy: G.tiles.map(t => [t.x, t.y, t.z])}) : null
  });
  if (G.history.length > 80) G.history.shift();
}
function restoreSnap(s){
  G.epoch++;
  G.pending = 0;
  G.tiles.forEach((t, i) => {
    t.pending = false;
    t.claimed = false;
    if (i >= s.st.length){ t.status = 'gone'; return; }
    t.status = STN[s.st[i]];
    t.type = s.ty[i];
  });
  G.slot = s.slot.map(id => G.tiles[id]);
  G.hold = s.hold.map(c => c.map(id => G.tiles[id]));
  if (s.bm) G.tiles.forEach((t, i) => { t.bomb = s.bm[i]; });
  if (s.cap) G.cap = s.cap;
  if (s.dig && G.run){
    const o = JSON.parse(s.dig);
    Object.assign(G.run, {foes: o.foes, fl: o.fl, wool: o.wool, hearts: o.hearts, bell: o.bell, stats: o.stats, charge: o.charge, target: o.target});
    G.tiles.forEach((t, i) => {
      t.chain = o.ch[i] || 0;
      t.burn = (o.bn && o.bn[i]) || 0;
      t.badge = o.bg[i] || null;
      t.melted = false;
      t.ash = false;
      // 被巫妖传送走的出口、被偷回牌堆的牌放回原处
      const p = o.xy[i];
      if (p && t.status === 'board' && (p[0] !== t.x || p[1] !== t.y || p[2] !== t.z)) relink(t, p[0], p[1], p[2]);
    });
    computeHeights(G.tiles);
  }
}

/* ---------- 道具 ---------- */
function revive(){ if (G.over){ G.over = false; startClock(); } }
function busyToast(){ toast('等这一组消完再用道具'); }

function useOut(){
  if (G.won || G.zooming || (G.mode === 'dig' && G.over)) return;
  if (G.pending) return busyToast();
  if (G.tools.out <= 0) return toast(G.rule && G.rule.bare ? '今天是「空手」：三个道具都不能用' : G.mode === 'dig' ? '「移出」用完了，黑市有卖' : '「移出」这一局已经用过了');
  if (!G.slot.length) return toast('口袋是空的，没有牌可以移出');
  snapshot();
  G.slot.splice(0, 3).forEach((t, i) => { t.status = 'hold'; G.hold[i].push(t); });
  G.tools.out--;
  revive();
  Sound.tool();
  render();
}

function useUndo(){
  if (G.won || G.zooming || (G.mode === 'dig' && G.over)) return;
  if (G.pending) return busyToast();
  if (G.tools.undo <= 0) return toast(G.rule && G.rule.bare ? '今天是「空手」：三个道具都不能用' : G.mode === 'dig' ? '「撤回」用完了，黑市有卖' : '「撤回」这一局已经用过了');
  if (!G.history.length) return toast('还没有可以撤回的一步');
  restoreSnap(G.history.pop());
  G.tools.undo--;
  revive();
  Sound.tool();
  render();
}

// 洗牌时也按“能走通”的方式重新分配图案，走不通才退回随机打乱
function reshuffle(pool){
  const supply = {};
  for (const t of pool) supply[t.type] = (supply[t.type] || 0) + 1;
  const res = plan(pool, {
    supply, slot: G.slot.map(t => t.type), hold: G.hold.flat().map(t => t.type),
    interleave: .2, maxSlot: Math.min(4, G.cap - 2), cap: G.cap, queue: !!(G.rule && G.rule.queue), rng: Math.random
  });
  if (res){
    for (const t of pool) t.type = res.assign.get(t.id);
    return;
  }
  const types = shuffled(pool.map(t => t.type), Math.random);
  pool.forEach((t, i) => { t.type = types[i]; });
}

function useShuffle(){
  if (G.won || G.zooming || (G.mode === 'dig' && G.over)) return;
  if (G.pending) return busyToast();
  if (G.rule && G.rule.mirror) return toast('「倒影」不能洗牌，洗了左右就对不上了');
  if (G.tools.shuffle <= 0) return toast(G.rule && G.rule.bare ? '今天是「空手」：三个道具都不能用' : G.mode === 'dig' ? '「洗牌」用完了，黑市有卖' : '「洗牌」这一局已经用过了');
  if (G.over) return toast('口袋已经满了，洗牌帮不上忙');
  const pool = G.tiles.filter(t => t.status === 'board' && !t.hatch && t.type < NTYPE);
  if (pool.length < 3) return toast('场上的牌不多了，不用洗');
  snapshot();
  reshuffle(pool);
  G.tools.shuffle--;
  if (!REDUCED){
    const base = Math.min(...pool.map(t => t.x + t.y));
    let last = 0;
    pool.forEach(t => t.el.classList.remove('flip'));
    void stage.offsetWidth;
    for (const t of pool){
      const d = Math.round((t.x + t.y - base) * 22);
      last = Math.max(last, d);
      t.artLock = true;
      t.el.style.setProperty('--fd', d + 'ms');
      t.el.classList.add('flip');
      setTimeout(() => { t.artLock = false; updateArt(t); }, d + 180);
    }
    G.flipUntil = performance.now() + last + 380;
  }
  Sound.tool();
  render();
}

function win(){
  if (G.mode === 'dig') return;

  if (G.mode === 'daily') return winDaily();
  if (G.mode === 'trial') return winTrial();

// 把当天几号画成两个大数字，比如 29 号就是「29」，5 号是「05」
function dateGrid(day){
  const rows = Array.from({length: 14}, () => Array(14).fill('.'));
  [...day.slice(8, 10)].forEach((ch, k) => {
    DIGITS[ch].forEach((line, r) => [...line].forEach((v, c) => {
      if (v !== 'X') return;
      for (const dr of [0, 1]) for (const dc of [0, 1]) rows[2 + r * 2 + dr][(k ? 8 : 0) + c * 2 + dc] = 'X';
    }));
  });
  return rows.map(r => r.join(''));
}
// 按网格一层层往上摞：每层整体错开半张，越往上越稀
function buildShape(rng, cfg, grid){
  const H = grid.length, W = grid[0].length;
  const on = (r, c) => r >= 0 && c >= 0 && r < H && c < W && grid[r][c] === 'X';
  const fits = (x, y) => on(y * 2, x * 2) && on(y * 2, x * 2 + 1) && on(y * 2 + 1, x * 2) && on(y * 2 + 1, x * 2 + 1);
  const out = [];
  for (let z = 0; out.length < cfg.target && z < cfg.maxZ; z++){
    const [ox, oy] = OFFSETS[z % 4];
    const dens = Math.max(cfg.minDens, cfg.dens - z * .03);
    for (let y = oy; (y + 1) * 2 <= H && out.length < cfg.target; y++){
      for (let x = ox; (x + 1) * 2 <= W && out.length < cfg.target; x++){
        if (fits(x, y) && rng() < dens) out.push({x, y, z});
      }
    }
  }
  return out;
}
const dayIndex = day => Math.floor(Date.parse(day + 'T00:00:00Z') / 864e5);

  const shape = DAILY_SHAPES[si != null ? si : dayIndex(day) % DAILY_SHAPES.length];
  const cfg = {intro: false, types: 16, target: 240, piles: 16, interleave: .55, maxSlot: 5, cap: CAP,
    density: .9, dens: .92, minDens: .5, maxZ: 22};
  if (rule.cap){
    cfg.cap = rule.cap;
    cfg.maxSlot = 4;
  }
  if (rule.bomb) cfg.bombs = 12;
  if (rule.big) Object.assign(cfg, {target: 285, maxZ: 32});
  // 千层这天不用当天的形状，牌桌就是闯关里的千层九摞
  if (rule.columns) return {rule, shape, cfg, arch: ARCHES.find(a => a.id === 'columns'), label: rule.name};
  const grid = shape.grid || dateGrid(day);
  const arch = {id: 'daily', name: shape.name, build: (rng, c) => buildShape(rng, c, grid)};
  return {rule, shape, cfg, arch, label: `${rule.name}·${shape.name}`};
}
function buildDaily(day, seed0 = newSeed()){

}

function submitScore(sc){
  ident();
  return api('rpc/submit_daily', {p_day: sc.day, p_player: prefs.pid, p_tag: prefs.tag, p_name: prefs.name, p_ms: sc.ms, p_moves: sc.moves, p_tools: sc.tools || 0});
}
const toolsLabel = n => (n ? `道具 ×${n}` : '无道具');
const betterScore = (a, b) => (a.tools || 0) < (b.tools || 0) || ((a.tools || 0) === (b.tools || 0) && a.ms < b.ms);
const scoreText = sc => `${fmtMs(sc.ms)} · ${toolsLabel(sc.tools || 0)}`;

function startDaily(){
  startDailyFor(beijingDay());
}
function startDailyFor(day){
  if (G.mode === 'dig' ? !G.over : (G.mode !== 'daily' && G.tiles.length && !G.won)) saveGame();
  const built = buildDaily(day);
  if (!built) return toast('今天的挑战没排出来，过一会儿再试');
  const r = built.rule;
  G.epoch++;
  Object.assign(G, {
    mode: 'daily', day, rule: r, cap: built.cfg.cap || CAP, level: DAILY_LEVEL, seed: built.seed, cfg: built.cfg,
    tiles: built.tiles, label: built.label, slot: [], hold: [[], [], []],
    tools: r.bare ? {out: 0, undo: 0, shuffle: 0} : {out: 1, undo: 1, shuffle: 1}, history: [], moves: 0,
    over: false, won: false, pending: 0, acc: 0, running: false
  });
  savePrefs({mode: 'daily'});
  closeDialog();
  mountTiles(true);
  startClock();
  toast(`每日挑战 · 今天是「${r.name}」：${r.desc}`, 3600);
}
function enterDaily(){
  if (!prefs.name && !prefs.namePrompted){
    savePrefs({namePrompted: true});
    return askName(enterDaily, {skip: '先不起', body: '每日挑战的成绩会上排行榜，起个名字吧，最多 12 个字。以后可以在排行榜里改。'});
  }
  if (G.mode === 'dig' ? !G.over : (G.mode !== 'daily' && G.tiles.length && !G.won)) saveGame();
  if (resume(loadGame('daily'))){
    savePrefs({mode: 'daily'});
    closeDialog();
    toast('接着今天的每日挑战');
  } else startDaily();
}
function backLabel(){
  const s = loadGame('normal');
  return `回到第 ${(s && s.level) || prefs.level || 1} 关`;
}
function backToLevels(){
  if ((G.mode === 'daily' && !G.won) || (G.mode === 'dig' && !G.over)) saveGame();
  closeDialog();
  if (resume(loadGame('normal'))){
    savePrefs({mode: 'normal'});
    if (!G.over) toast(`回到第 ${G.level} 关`);
    return;
  }
  const lv = Math.min(Math.max(Number(prefs.level) || 1, 1), 99);
  startLevel(lv, freshSeed(lv));
}

function winDaily(){
  const ms = Math.round(elapsed()), day = G.day, moves = G.moves;
  const tools = G.rule && G.rule.bare ? 0 : 3 - (G.tools.out + G.tools.undo + G.tools.shuffle);
  const sc = {day, ms, moves, tools};
  Sound.win();
  confetti();
  const prev = prefs.dailyBest && prefs.dailyBest.day === day ? prefs.dailyBest : null;
  const record = !prev || betterScore(sc, prev);
  if (record) savePrefs({dailyBest: sc});
  // 先记下来等着交；断网了下次打开排行榜再交
  const pend = prefs.pendingScore;
  if (!pend || pend.day !== day || betterScore(sc, pend)) savePrefs({pendingScore: sc});
  setTimeout(() => {
    const go = () => showBoard({day, result: {ms, moves, tools, record, prev}});
    if (prefs.name || prefs.namePrompted) go();
    else {
      savePrefs({namePrompted: true});
      askName(go);
    }
  }, REDUCED ? 520 : 800);
}

function askName(then, o = {}){
  const wrap = document.createElement('div');
  const input = document.createElement('input');
  input.className = 'name-field';
  input.type = 'text';
  input.maxLength = 12;
  input.placeholder = '比如：咩咩大王';
  input.value = prefs.name || '';
  input.autocomplete = 'nickname';
  input.enterKeyHint = 'done';
  input.setAttribute('aria-label', '昵称');
  const err = document.createElement('p');
  err.className = 'name-err';
  err.setAttribute('role', 'alert');
  wrap.append(input, err);
  const ok = () => {
    const name = input.value.trim().slice(0, 12);
    if (!name){
      err.textContent = '先起个名字';
      input.focus();
      return;
    }
    const renamed = prefs.name && prefs.name !== name;
    savePrefs({name});
    ident();
    if (renamed && BOARD.url) api('rpc/rename_daily', {p_player: prefs.pid, p_name: name}).catch(() => {});
    then();
  };
  // 回车只算一次：不拦住的话，这一下还会按到下一个弹窗里的按钮
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    e.preventDefault();
    ok();
  });
  openDialog({kind: 'name', title: prefs.name ? '改个名字' : '起个名字上榜', body: o.body || '排行榜上显示这个名字，最多 12 个字。', extra: wrap, actions: [
    {label: '好了', primary: true, run: ok},
    {label: o.skip || (prefs.name ? '不改了' : '先不上榜'), run: then}
  ]});
  setTimeout(() => input.focus(), 60);
}

let boardReq = 0;
function showBoard(o = {}){
  const today = beijingDay();
  let day = o.day || today;
  const wrap = document.createElement('div');
  const tabs = document.createElement('div');
  tabs.className = 'board-tabs';
  const note = document.createElement('p');
  note.className = 'board-note';
  note.setAttribute('aria-live', 'polite');
  const list = document.createElement('ol');
  list.className = 'board-list';
  const tabBtns = [[today, '今天'], [beijingDay(-1), '昨天']].map(([d, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.addEventListener('click', () => { day = d; sync(); load(); });
    tabs.appendChild(b);
    return [d, b];
  });
  const sync = () => tabBtns.forEach(([d, b]) => b.setAttribute('aria-pressed', String(d === day)));
  wrap.append(tabs, note, list);
  const link = document.createElement('button');
  link.type = 'button';
  link.className = 'board-link';
  link.textContent = prefs.name ? `改名（现在叫「${prefs.name}」）` : '起个名字上榜';
  link.addEventListener('click', () => askName(() => showBoard(o)));
  wrap.appendChild(link);

  const spec = dailySpec(today);
  let title = '每日挑战', body = `${dayLabel(today)} · 今天是「${spec.rule.name}」：${spec.rule.desc}${spec.rule.columns ? '' : `；牌堆摆成「${spec.shape.name}」`}。每局都是新的一副牌，没用道具的排前面，同样再比谁清得快。`, actions;
  if (o.result){
    const r = o.result;
    title = '每日挑战完成！';
    body = `用时 ${fmtMs(r.ms)}，${r.tools ? `用了 ${r.tools} 个道具` : '没用道具'}。` + (r.record ? (r.prev ? '比你今天之前的成绩更好。' : '') : `你今天最好是 ${scoreText(r.prev)}。`);
    actions = [{label: '再挑战一次', primary: true, run: startDaily}, {label: backLabel(), run: backToLevels}];
  } else if (G.mode === 'daily' && !G.won && G.day === today){
    actions = [{label: '接着玩', primary: true, run: closeDialog}, {label: '重开今天这一局', run: startDaily}, {label: backLabel(), run: backToLevels}];
  } else {
    const saved = loadGame('daily');
    const going = saved && saved.day === today && !saved.won;
    const best = prefs.dailyBest && prefs.dailyBest.day === today ? prefs.dailyBest : null;
    if (best) body += `你今天最好 ${scoreText(best)}。`;
    actions = [{label: going ? '接着今天的挑战' : best ? '再挑战一次' : '挑战今天这一局', primary: true, run: enterDaily}, {label: '关闭', run: closeDialog}];
  }
  openDialog({kind: o.result ? 'win' : 'menu', art: o.result ? 'hop' : null, title, body, extra: wrap, actions});
  sync();
  load();

  function row(rank, r, me){
    const li = document.createElement('li');
    if (me) li.className = 'me';
    const cells = [['rk', String(rank)], ['nm', r.name], ['tm', fmtMs(r.ms)], ['mv', toolsLabel(r.tools || 0)]];
    for (const [cls, text] of cells){
      const span = document.createElement('span');
      span.className = cls;
      span.textContent = text;
      li.appendChild(span);
    }
    return li;
  }
  async function load(){
    const req = ++boardReq;
    note.textContent = '正在读取排行榜…';
    list.replaceChildren();
    if (!BOARD.url){
      note.textContent = '排行榜还没接上服务器，成绩先记在你手机上。';
      return;
    }
    let mine = null;
    try {
      const pend = prefs.pendingScore;
      if (pend && pend.day < beijingDay(-1)) savePrefs({pendingScore: null});
      else if (pend && prefs.name){
        const res = await submitScore(pend);
        savePrefs({pendingScore: null});
        if (pend.day === day) mine = res;
      }
      const rows = await fetchBoard(day);
      if (req !== boardReq) return;
      const meIn = rows.some(r => r.tag === prefs.tag);
      if (!rows.length) note.textContent = day === today ? '今天还没有人上榜，第一个就是你。' : '这一天没有人上榜。';
      else if (mine) note.textContent = `你排第 ${mine.rank} 名，一共 ${mine.total} 人。`;
      else note.textContent = `${dayLabel(day)} · ${rows.length >= 50 ? '前 50 名' : `${rows.length} 人上榜`}`;
      if (!prefs.name && o.result) note.textContent = '起个名字才能上榜，成绩先记在你手机上。';
      rows.forEach((r, i) => list.appendChild(row(i + 1, r, r.tag === prefs.tag)));
      if (mine && !meIn){
        const gap = document.createElement('li');
        gap.className = 'gap';
        gap.textContent = '…';
        list.appendChild(gap);
        list.appendChild(row(mine.rank, {name: prefs.name, ms: mine.best, tools: mine.tools}, true));
      }
      const me = list.querySelector('.me');
      if (me) me.scrollIntoView({block: 'nearest'});
    } catch (e) {
      if (req !== boardReq) return;
      note.textContent = '连不上排行榜，检查一下网络，过一会儿再点开看看。' + (prefs.pendingScore ? '你的成绩已经记下了，连上以后会自动交。' : '');
    }
  }
}

/* ---------- 练习：任选每日挑战的一条规则和一个形状开一局，不计成绩、不存档 ---------- */
let trialPick = null;
function startTrial(ri, si){
  trialPick = [ri, si];
  const day = beijingDay(), spec = dailySpec(day, ri, si);
  let seed = newSeed(), built = null;
  for (let k = 0; k < 20 && !built; k++){
    built = buildWith(spec.cfg, seed + k, spec.arch);
    if (built) seed += k;
  }
  if (!built) return toast('这一局没排出来，再点一次');
  // 先把正在打的闯关或每日挑战存好
  if (G.mode === 'dig' ? !G.over : (G.mode !== 'trial' && G.tiles.length && !G.won)) saveGame();
  const r = spec.rule;
  G.epoch++;
  Object.assign(G, {
    mode: 'trial', day, rule: r, cap: spec.cfg.cap || CAP, level: DAILY_LEVEL, seed, cfg: built.cfg,
    tiles: built.tiles, label: spec.label, slot: [], hold: [[], [], []],
    tools: r.bare ? {out: 0, undo: 0, shuffle: 0} : {out: 1, undo: 1, shuffle: 1}, history: [], moves: 0,
    over: false, won: false, pending: 0, acc: 0, running: false
  });
  closeDialog();
  mountTiles(true);
  startClock();
  toast(`练习「${r.name}」：${r.desc}`, 3200);
}
function startLab(i){
  const m = LAB_MODES[i], cfg = Object.assign(levelCfg(5), m.cfg);
  let seed = newSeed(), built = null;
  for (let k = 0; k < 20 && !built; k++){
    built = m.build ? m.build(cfg, seed + k) : buildWith(cfg, seed + k, archOf(seed + k));
    if (built) seed += k;
  }
  if (!built) return toast('这一局没排出来，再点一次');
  if (G.mode === 'dig' ? !G.over : (G.mode !== 'trial' && G.tiles.length && !G.won)) saveGame();
  trialPick = ['lab', i];
  G.epoch++;
  Object.assign(G, {
    mode: 'trial', day: beijingDay(), rule: Object.assign({name: m.name, desc: m.desc}, m.rule), cap: CAP, level: DAILY_LEVEL, seed, cfg: built.cfg,
    tiles: built.tiles, label: m.build ? m.name : `${m.name}·${built.label}`, slot: [], hold: [[], [], []],
    tools: {out: 1, undo: 1, shuffle: m.rule.mirror ? 0 : 1}, history: [], moves: 0,
    over: false, won: false, pending: 0, acc: 0, running: false
  });
  closeDialog();
  mountTiles(true);
  startClock();
  toast(`试玩「${m.name}」：${m.desc}`, 3600);
}
const againTrial = () => (trialPick[0] === 'lab' ? startLab(trialPick[1]) : startTrial(...trialPick));
function showTrialPicker(){
  const today = dailySpec(beijingDay()), tp = trialPick && trialPick[0] !== 'lab' ? trialPick : null;
  let ri = tp ? tp[0] : DAILY_RULES.indexOf(today.rule);
  let si = tp ? tp[1] : DAILY_SHAPES.indexOf(today.shape);
  const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const wrap = document.createElement('div');
  const group = (title, labels, get, set) => {
    const h = document.createElement('p');
    h.className = 'board-note';
    h.textContent = title;
    const box = document.createElement('div');
    box.className = 'board-tabs';
    box.style.flexWrap = 'wrap';
    const btns = labels.map((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.addEventListener('click', () => { set(i); sync(); });
      box.appendChild(b);
      return b;
    });
    const sync = () => btns.forEach((b, i) => b.setAttribute('aria-pressed', String(i === get())));
    sync();
    wrap.append(h, box);
    return [h, box];
  };
  const desc = document.createElement('p');
  desc.className = 'board-note';
  let shapeEls = [];
  const upd = () => {
    desc.textContent = `「${DAILY_RULES[ri].name}」：${DAILY_RULES[ri].desc}`;
    shapeEls.forEach(el => { el.hidden = !!DAILY_RULES[ri].columns; });  // 千层不用形状
  };
  group('规则', DAILY_RULES.map((r, i) => `${WEEK[i]} ${r.name}`), () => ri, i => { ri = i; upd(); });
  wrap.appendChild(desc);
  shapeEls = group('形状', DAILY_SHAPES.map(x => x.name), () => si, i => { si = i; });
  upd();
  if (LAB){
    const h = document.createElement('p');
    h.className = 'board-note';
    h.textContent = '新玩法（还在试，点一下直接开一局）';
    const box = document.createElement('div');
    box.className = 'board-tabs';
    box.style.flexWrap = 'wrap';
    LAB_MODES.forEach((a, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = a.name;
      b.addEventListener('click', () => startLab(i));
      box.appendChild(b);
    });
    wrap.append(h, box);
  }
  const practicing = G.mode === 'trial' && !G.won;
  openDialog({kind: 'menu', title: '练习', body: '挑一条规则、一个形状开一局，不计成绩，每次都是新的一副牌。', extra: wrap, actions: [
    ...(practicing ? [{label: `继续刚才那局（${G.label}）`, primary: true, run: () => { closeDialog(); hideHome(); }}] : []),
    {label: '开始练习', primary: !practicing, run: () => startTrial(ri, si)},
    {label: '关闭', run: closeDialog}
  ]});
}
function winTrial(){
  const ms = Math.round(elapsed());
  Sound.win();
  confetti();
  setTimeout(() => openDialog({kind: 'win', art: 'hop', title: '练习通关！', body: `「${G.rule.name}」用时 ${fmtMs(ms)}，点了 ${G.moves} 次。练习不计入排行榜。`, actions: [
    {label: '同样的模式再来一副', primary: true, run: againTrial},
    {label: '换个模式', run: showTrialPicker},
    {label: backLabel(), run: backToLevels}
  ]}), REDUCED ? 520 : 800);
}

// 把这些小图画好，放进 CSS 变量（--da-名字、--ic-16 起的特殊牌）。深渊里一律用针脚的画法
function digArt(){
  const draw = skin === 'pixel' ? pixelIcon : stitchIcon;
  for (const [k, m] of Object.entries(DIG_ART)) bodyStyle.setProperty(`--da-${k}`, `url(${draw(m)})`);
  XICONS.forEach((ic, i) => {
    const url = skin === 'type' ? '' : skin === 'riso' ? risoIcon(ic.m, NTYPE + i) : draw(ic.m);
    if (url) bodyStyle.setProperty(`--ic-${NTYPE + i}`, `url(${url})`);
    else bodyStyle.removeProperty(`--ic-${NTYPE + i}`);
  });
}

/* ---- 难度：越往下牌越多、图案越多、能走通的路越窄 ---- */
function floorCfg(f, kind){
  const d = f - 1;
  const cfg = Object.assign({}, levelCfg(5), {
    target: Math.round(42 + Math.min(d, 20) * 5.5),
    piles: 4 + Math.min(10, d),
    types: Math.min(NTYPE, 8 + Math.ceil(d * .6 - .001)),
    interleave: Math.min(.62, .32 + d * .025),
    maxSlot: d < 2 ? 5 : 6,
    maxLayers: Math.min(14, 6 + Math.floor(d / 1.5))
  });
  // 恶魔层牌多一点、图案多一种；难的主要是那只恶魔
  if (kind === 'elite'){
    cfg.target = Math.round(cfg.target * 1.12);
    cfg.types = Math.min(NTYPE, cfg.types + 1);
    cfg.interleave = Math.min(.66, cfg.interleave + .03);
  }
  // Boss 层牌多一点；Boss 自己的招已经够难，图案不再加
  if (kind === 'boss') cfg.target = Math.round(cfg.target * 1.1);
  return cfg;
}
function digArch(rng){
  const pool = ARCHES.filter(a => a.id !== 'columns');
  let r = rng() * pool.reduce((s, a) => s + archW(a), 0);
  for (const a of pool){ r -= archW(a); if (r < 0) return a; }
  return pool[0];
}
function digCapFor(run){
  const slots = CAP + run.relics.filter(r => r === 'bag').length - (run.relics.includes('greedy') ? 1 : 0);
  return {slots, cap: slots};
}
// 一个位置上面一共压着几张：顺着“谁压着谁”一路往上数
function coneAt(tiles, x, y, live){
  const set = new Set();
  const stack = tiles.filter(t => !t.hatch && t.z > -2 && (!live || t.status === 'board') && Math.abs(t.x - x) < .999 && Math.abs(t.y - y) < .999);
  while (stack.length){
    const t = stack.pop();
    if (set.has(t)) continue;
    set.add(t);
    for (const a of t.coveredBy) if (!a.hatch && (!live || a.status === 'board') && !set.has(a)) stack.push(a);
  }
  return set;
}
// 洞口能放在哪：主牌堆最底下两层的位置
function hatchSpots(tiles){
  const seen = new Set(), out = [];
  for (const t of tiles){
    if (t.pile || t.z > 1) continue;
    const key = Math.round(t.x * 3) + ',' + Math.round(t.y * 3);
    if (seen.has(key)) continue;
    seen.add(key);
    const cone = coneAt(tiles, t.x, t.y).size;
    if (cone >= 5) out.push({x: t.x, y: t.y, cone});
  }
  return out;
}
// 出口：越往下埋得越深（前几层挑中等深度的位置，地狱挑最深的那一批）；Boss 层放在中间附近
function chooseHatches(spots, n, central, rng, f = 1){
  if (!spots.length) return null;
  const s = spots.slice().sort((a, b) => b.cone - a.cone);
  const [a0, a1] = f === 1 ? [.5, .85] : f <= 5 ? [.3, .7] : f <= 10 ? [.15, .55] : [0, .35];
  const top = s.slice(Math.floor(s.length * a0), Math.max(Math.floor(s.length * a0) + 1, Math.ceil(s.length * a1)));
  const c = central ? top.filter(p => Math.abs(p.x - 3) < 1.7) : top;
  return [pickOne(c.length ? c : top, rng)];
}
// 上一层没挖完塌下来的牌：东一张西一张散在牌堆最上面，每张都压着点别的
function rubblePos(pos, n, rng){
  const out = [];
  for (let tries = 0; out.length < n && tries < n * 30; tries++){
    const x = Math.round(rng() * 18) / 3, y = Math.round(rng() * 20) / 3;
    if (out.some(p => Math.abs(p.x - x) < .999 && Math.abs(p.y - y) < .999)) continue;
    const under = pos.filter(p => !p.pile && Math.abs(p.x - x) < .999 && Math.abs(p.y - y) < .999);
    if (!under.length) continue;
    out.push({x, y, z: 1 + Math.max(...under.map(p => p.z)), rubble: true});
  }
  return out;
}
// 蝙蝠窝、棺材：藏在只被一两张压着的牌上（记号从边上露出来，细心能看见），挖开的那一刻发作；几个之间隔开一点
function placeBadges(board, kind, n, rng){
  const cands = shuffled(board.filter(t => !t.pile && !t.rubble && t.type < NTYPE && t.coveredBy.length >= 1 && t.coveredBy.length <= 2), rng), out = [];
  for (const t of cands){
    if (out.length >= n) break;
    if (out.some(u => Math.hypot(u.x - t.x, u.y - t.y) < 2.4)) continue;
    t.badge = kind;
    out.push(t);
  }
}
// 发一层牌：先摆形状、撒上塌下来的牌、放出口，再按“带下来的口袋 + 这一层”算一条能清空的路线给每张牌定图案
function digBuild(run, f, kind, mod, slotTy, holdTy, cap, seed, rubbleN, hz, nCoffin = 3){
  const cfg = floorCfg(f, kind), boss = kind === 'boss';
  hz = hz || [];
  // 带下来的牌，这一层要给它们配齐
  const counts = new Map();
  for (const ty of [...slotTy, ...holdTy]) counts.set(ty, (counts.get(ty) || 0) + 1);
  const supply0 = {};
  let need = 0;
  for (const [ty, c] of counts){
    const k = (3 - c % 3) % 3;
    if (k){ supply0[ty] = k; need += k; }
  }
  let spare = null;
  for (let attempt = 0; attempt < 40; attempt++){
    const rng = rngFrom((seed + attempt * 7919) >>> 0);
    let pos = makeLayout(rng, cfg, digArch(rng)).pos;
    if (rubbleN) pos = pos.concat(rubblePos(pos, rubbleN, rng));
    // 张数对齐：除去要配的，剩下的得是 3 的倍数，从主牌堆最底下拿掉一两张
    const extra = (pos.length - need) % 3;
    if (extra){
      const drop = new Set(pos.filter(p => !p.pile && !p.rubble).sort((a, b) => a.z - b.z).slice(0, extra));
      pos = pos.filter(p => !drop.has(p));
    }
    const picks = chooseHatches(hatchSpots(makeTiles(pos)), 1, boss, rng, f);
    if (!picks) continue;
    const tiles = makeTiles(pos.concat(picks.map(p => ({x: p.x, y: p.y, z: -1}))));
    const board = tiles.slice(0, pos.length);
    board.forEach((t, i) => { if (pos[i].rubble) t.rubble = true; });
    const h = tiles[pos.length];
    h.type = -1;
    h.hatch = {i: 0, kind};
    if (boss) h.sealed = true;
    const types = shuffled([...Array(NTYPE).keys()], rng).slice(0, cfg.types), supply = Object.assign({}, supply0);
    for (let i = 0; i < (board.length - need) / 3; i++) supply[types[i % types.length]] = (supply[types[i % types.length]] || 0) + 3;
    // 同一个摆法多试几次路线；越往后试，路线越“稳”（少开新的一种），总能排出来
    let res = null;
    for (let k = 0; k < 10 && !res; k++) res = plan(board, {supply, slot: slotTy, hold: holdTy, interleave: cfg.interleave * (1 - k * .07), maxSlot: cfg.maxSlot, cap, rng});
    if (!res){
      if (!spare) spare = {tiles, board, supply, rng};
      continue;
    }
    for (const t of board) t.type = res.assign.get(t.id);
    if (hz.includes('bats')) placeBadges(board, 'bat', 2, rng);
    if (hz.includes('coffin')) placeBadges(board, 'coffin', nCoffin, rng);
    return {tiles, guaranteed: true};
  }
  // 实在排不出保证走得通的路（多半是带下来的口袋太乱），就照张数随便发
  if (!spare) return null;
  const bag = [];
  for (const [ty, n] of Object.entries(spare.supply)) for (let i = 0; i < n; i++) bag.push(+ty);
  shuffled(bag, spare.rng).forEach((ty, i) => { spare.board[i].type = ty; });
  return {tiles: spare.tiles, guaranteed: false};
}

  if (f === 1) return 'ghoul';
  const pool = (z < 3 ? ROSTER[z] : ROSTER.flat()).filter(k => k !== run.lastFoe && !follow.includes(k) && (k !== 'worm' || hz.includes('lava')));

function relicOffers(n, rareP, rng){
  const ok = id => relicCount(id) < (RELICS[id].max || 1);
  const rare = Object.keys(RELICS).filter(id => ok(id) && RELICS[id].rare), common = Object.keys(RELICS).filter(id => ok(id) && !RELICS[id].rare);
  const out = [];
  while (out.length < n && (rare.length || common.length)){
    const from = (rng() < rareP && rare.length) || !common.length ? rare : common;
    out.push(from.splice(Math.floor(rng() * from.length), 1)[0]);
  }
  return out;
}

function digEnterFloor(f, kind){
  const run = G.run;
  Object.assign(run, {floor: f, kind, mod: null, room: null});
  run.deepest = Math.max(run.deepest || 1, f);
  run.fl = {total: 0, taps: 0, last: -99, cleared: false, snipped: false, hz: [], light: null, dark: 0, fogs: [], fogId: 0, lava: null, melted: 0, rubble: 0};
  run.charge = {shovel: 1, dynamite: 1};
  run.exits = digExits(run);
  const {slots, cap} = digCapFor(run);
  G.slots = slots;
  G.cap = cap;
  G.rule = null;
  // 乌鸦、替罪羊在发牌之前就算好，保证“能清空”的路线照着落地后真实的口袋来算
  if (has('dog')){
    const cnt = new Map();
    for (const t of G.slot) if (!t.wild) cnt.set(t.type, (cnt.get(t.type) || 0) + 1);
    const lone = G.slot.filter(t => !t.wild && cnt.get(t.type) === 1);
    for (const t of lone) t.status = 'gone';
    G.slot = G.slot.filter(t => t.status === 'slot');
    run.fl.dog = lone.length;
  }
  run.fl.wild = has('wild') && G.slot.length < cap - 1;
  const carry = G.tiles.filter(t => t.status === 'slot' || t.status === 'hold');
  // 掉下来的时候，口袋里烧着的火灭了
  for (const t of carry) if (t.bomb > 0) t.bomb = 0;
  let board = [];
  if (!ROOMS.has(kind)){
    let slotTy = G.slot.filter(t => !t.wild).map(t => t.type);
    const holdTy = G.hold.flat().map(t => t.type);
    // 替罪羊落地就会顶替口袋里的第一对，这一对不用再给它配牌
    if (run.fl.wild){
      const cnt = new Map();
      for (const ty of slotTy) cnt.set(ty, (cnt.get(ty) || 0) + 1);
      for (const [ty, c] of cnt) if (c >= 2){ let k = 2; slotTy = slotTy.filter(x => !(x === ty && k-- > 0)); break; }
    }
    const hz = hazardsFor(run, f, kind);
    // 跟下来的怪：普通层最多两只，恶魔层一只；Boss 的巢穴它们不敢进
    const fol = kind === 'boss' ? [] : (run.followers || []).slice(0, kind === 'normal' ? 2 : 1);
    run.fl.scared = kind === 'boss' ? (run.followers || []).map(o => FOES[o.kind].n) : [];
    const spawn = fol.length < 2 || kind !== 'normal' ? pickFoe(run, f, kind, hz, fol.map(o => o.kind)) : null;
    const built = digBuild(run, f, kind, null, slotTy, holdTy, cap, (run.seed + f * 104729) >>> 0, run.rubble || 0, hz, spawn === 'wraith' ? 2 : 3);
    board = built ? built.tiles : [];
    run.fl.hz = hz;
    run.fl.rubble = board.filter(t => t.rubble).length;
    run.rubble = 0;
    if (hz.includes('light')) run.fl.light = LIGHT_MAX;
    const h = board.find(t => t.hatch);
    if (hz.includes('lava') && h) run.fl.lava = lavaFor(f, h);
    // 怪：上一层跟下来的先上，再来这一层自己的（最多两只；恶魔层、Boss 层只跟下来一只，恶魔和 Boss 一定在）
    const triples = Math.floor(board.filter(t => !t.hatch).length / 3);
    const foes = fol.map(o => Object.assign({}, o, {left: moveEvery(FOES[o.kind].moves[o.mi]) + 1, follow: true}));
    if (spawn){
      foes.push(newFoe(spawn, f, triples));
      run.lastFoe = spawn;
    }
    run.foes = foes;
    run.target = 0;
    run.followers = [];
  } else {
    // 篝火边歇脚：跑掉的怪还在后面，等你下一层再跟上来
    run.foes = [];
    run.room = newRoom(kind, run);
  }
  const tiles = board.slice();
  for (const t of carry){
    Object.assign(t, {id: tiles.length, x: -40, y: -40, z: -9, covers: [], coveredBy: [], pile: false, fan: null, chain: 0});
    tiles.push(t);
  }
  G.tiles = tiles;
  G.history = [];
  G.level = f;
  G.aim = null;
  G.armed = null;
  G.label = `${floorName(f)} · ${kind === 'boss' ? FOES[bossOf(f)].n : KINDS[kind].n}`;
  run.fl.total = board.filter(t => !t.hatch).length;
}
// 岩浆从离出口最远的那条边漫过来；先给几步缓一缓，越往下漫得越快
function lavaFor(f, h){
  const cx = h.x + .5, cy = h.y + .5, d = {top: cy, bottom: BH - cy, left: cx, right: BW - cx};
  const edge = Object.keys(d).sort((a, b) => d[b] - d[a])[0];
  return {edge, pos: 0, next: 9, every: Math.max(4, 7 - Math.floor(Math.max(0, f - 11) / 2))};
}

// 金羊顶替：口袋里有一对、又有金羊，就凑成一组
function digWildCheck(){
  const live = G.slot.filter(s => !s.pending), w = live.find(s => s.wild);
  if (!w) return false;
  const cnt = new Map();
  for (const s of live) if (!s.wild) cnt.set(s.type, (cnt.get(s.type) || 0) + 1);
  for (const [ty, c] of cnt){
    if (c < 2) continue;
    const pair = live.filter(s => !s.wild && s.type === ty).slice(0, 2);
    w.joinType = ty;
    for (const s of [...pair, w]) s.pending = true;
    G.pending += 3;
    const ep = G.epoch;
    setTimeout(() => settle(ep), REDUCED ? 220 : 340);
    return true;
  }
  return false;
}

/* ---- 点牌：洞口要连点两下；锁住的牌点不动；小铲子、炸药先点宝物再点牌 ---- */
function digTap(t){
  const run = G.run;
  if (G.aim){
    if (t.status !== 'board' || t.hatch || !isFree(t)){ toast('要点一张露着的牌'); return true; }
    digUseActive(G.aim, t);
    return true;
  }
  if (t.status === 'board' && !t.hatch && t.chain > 0 && isFree(t)){
    replay(t.el, 'nope');
    Sound.chain();
    toast(`这张被锁住了：凑成一组就解开（最多再锁 ${t.chain} 步）`);
    return true;
  }
  if (t.status !== 'board' || !t.hatch) return false;
  if (!isFree(t)){ nudge(t); return true; }
  if (G.pending){ toast('等这一组消完'); return true; }
  if (!run.exits.length && !run.endless && run.floor >= FLOOR_END && !run.foes.some(f => f.hp > 0)){ digVictory(null); return true; }
  if (t.sealed){
    const b = run.foes.find(f => FOES[f.kind].boss && f.hp > 0);
    replay(t.el, 'nope');
    Sound.bump();
    toast(b ? `${FOES[b.kind].n}还活着，出口被它封住了` : '出口封住了');
    return true;
  }
  const now = performance.now();
  if (G.armed === t && now - G.armedAt < 4000){
    G.armed = null;
    digDive(t);
    return true;
  }
  G.armed = t;
  G.armedAt = now;
  const alive = run.foes.filter(f => f.hp > 0);
  const dest = run.exits.length ? `下一层：${floorName(run.floor + 1)} · ${nextName(run.floor + 1)}` : '往下跳';
  const warn = alive.length ? ` · ${alive.map(f => FOES[f.kind].n).join('、')}没打死，会跟着你掉下去` : '';
  toast(`再点一下跳下去 · ${dest}${warn}`, 3200);
  Sound.tap();
  render();
  return true;
}

function stepWorld(){
  const run = G.run, fl = run.fl;
  fl.taps++;
  G.armed = null;
  if (fl.dark > 0) fl.dark--;
  for (const t of G.tiles) if (t.chain > 0 && t.status === 'board' && --t.chain === 0) Sound.chain();
  const ash = [];
  for (const t of G.tiles) if (t.burn > 0){ if (t.status !== 'board') t.burn = 0; else if (isFree(t) && --t.burn === 0) ash.push(t); }
  if (ash.length) burnAway(ash);
  if (fl.fogs.length){
    for (const c of fl.fogs) c.left--;
    fl.fogs = fl.fogs.filter(c => c.left > 0);
  }
  if (fl.light != null && !(fl.dark > 0) && --fl.light <= 0){
    fl.light = 7;
    darken(3, '烛火烧完了，眼前一片漆黑！', null);
  }
  if (fl.lava && --fl.lava.next <= 0){
    fl.lava.next = fl.lava.every;
    lavaAdvance();

function digAfterSettle(groups){
  const run = G.run;

  for (const g of Object.values(groups)){
    const mid = g[Math.floor(g.length / 2)];
    run.stats.triples++;
    n++;
    let w = 1;
    if (has('socks') && run.fl.taps - run.fl.last <= 3) w *= 2;

  if (n){

  if (n && has('bell')){
    run.bell = (run.bell || 0) + n;

// 凑成一组砍哪只：点过头像的那只；没点过、或者它已经倒了，就砍排在最前面的
function targetFoe(){

}
function hitFoe(n, at){

function foeDie(f){

// Boss 还活着，却再也凑不出一组（牌被烧光、口袋撑破时搭档掉了……）：它召来一批新牌，免得这一层卡死
function bossRefill(){
  const run = G.run;

  if (!boss) return;
  const cnt = new Map(), mine = new Set();
  for (const t of G.tiles){
    if (t.pending || t.wild || !((t.status === 'board' && !t.hatch) || t.status === 'slot' || t.status === 'hold')) continue;

  }

  const add = [];
  for (const ty of mine) for (let k = cnt.get(ty); k < 3; k++) add.push(ty);
  for (const ty of shuffled([...Array(NTYPE).keys()].filter(t => !mine.has(t)), Math.random).slice(0, 2)) add.push(ty, ty, ty);
  for (const ty of new Set(add)) dropTiles(ty, add.filter(x => x === ty).length, '');

// 欠着的奖励（恶魔、Boss 的宝物、打穿十五层）：对话框、掉层动画都不在的时候再拿出来；玩家选了才算领走，

// 骨头：从怪那里飞进口袋；凑够三根也算一组
function spitBones(f, n){

    const t = {id: G.tiles.length, x: -40, y: -40, z: -9, pile: false, fan: null, type: BONE, status: 'slot', pending: false, covers: [], coveredBy: [], el: null, art: null, shown: -1, si: 0, hc: 0, hd: 0, inAt: G.moves};

function checkTriple(ty){

function crumbleBones(){

// 锁：挑能跟你口袋里配上的那几张锁；凑成一组全断，最多锁 6 步
function chainTiles(n){

  for (const s of G.slot) if (!s.pending) cnt.set(s.type, (cnt.get(s.type) || 0) + 1);
  const free = shuffled(G.tiles.filter(t => t.status === 'board' && !t.hatch && isFree(t) && !(t.chain > 0)), Math.random);
  free.sort((a, b) => (cnt.get(b.type) || 0) - (cnt.get(a.type) || 0));

function breakChains(){

  if (n) Sound.chain();
}
// 往牌堆上砸东西（泥土、石头、Boss 召来的牌）：先一块盖住一张露着的牌，牌不够了就落在空地上——一定落满 n 块
function dropTiles(ty, n, say){
  const run = G.run, s3 = v => Math.round(v * 3) / 3, cl = (v, a, b) => Math.max(a, Math.min(b, v));
  const anchors = shuffled(G.tiles.filter(t => t.status === 'board' && !t.hatch && !t.pile), Math.random).sort((a, b) => isFree(b) - isFree(a));
  const placed = [];
  for (let i = 0, tries = 0; placed.length < n && tries < 300; tries++){
    const a = anchors[i++];
    const x = s3(a ? cl(a.x + (Math.random() - .5) * .5, 0, 6) : Math.random() * 6), y = s3(a ? cl(a.y + (Math.random() - .5) * .5, 0, 6.67) : Math.random() * 6.67);
    if (placed.some(p => Math.abs(p.x - x) < .999 && Math.abs(p.y - y) < .999)) continue;
    const t = {id: G.tiles.length, x: -40, y: -40, z: -9, pile: false, fan: null, type: ty, status: 'board', pending: false, covers: [], coveredBy: [], el: null, art: null, shown: -1, si: 0, hc: 0, hd: 0};
    G.tiles.push(t);
    placeOnTop(t, x, y);
    placed.push(t);
  }
  if (!placed.length) return '';
  run.fl.total += placed.length;
  computeHeights(G.tiles);
  for (const t of placed){
    stage.appendChild(tileEl(t));

  }

  return say;

// 把一张牌挪到 (x, y, z)：先拆掉它原来的上下关系，再跟新位置上下的牌接上
function relink(t, x, y, z){
  for (const b of t.coveredBy){ const i = b.covers.indexOf(t); if (i >= 0) b.covers.splice(i, 1); }
  for (const b of t.covers){ const i = b.coveredBy.indexOf(t); if (i >= 0) b.coveredBy.splice(i, 1); }
  t.covers = [];
  t.coveredBy = [];
  Object.assign(t, {x, y, z, pile: false, fan: null});
  for (const b of G.tiles){
    if (b === t || b.z <= -9 || b.z === z || Math.abs(b.x - x) > .999 || Math.abs(b.y - y) > .999) continue;
    if (b.z < z){ t.covers.push(b); b.coveredBy.push(t); } else { b.covers.push(t); t.coveredBy.push(b); }
  }
}
// 放到 (x, y) 那摞的最上面
function placeOnTop(t, x, y){
  const under = G.tiles.filter(b => b !== t && b.status === 'board' && Math.abs(b.x - x) < .999 && Math.abs(b.y - y) < .999);
  relink(t, x, y, 1 + Math.max(0, ...under.map(b => b.z)));
}
// 偷牌：口袋里最后放进去的那张，飞回牌堆最上面
function stealTile(){

  G.slot.splice(G.slot.indexOf(t), 1);
  const anchors = G.tiles.filter(u => u.status === 'board' && !u.hatch && !u.pile && isFree(u));
  const a = anchors.length ? pickOne(anchors, Math.random) : {x: 3, y: 3};
  t.status = 'board';
  placeOnTop(t, a.x, a.y);
  computeHeights(G.tiles);
  return `把你口袋里的「${tyName(t.type)}」偷回了牌堆上`;
}
// 点火：口袋里落单的那张先烧；口袋空着就点一张露着的牌，拿进口袋才开始倒数
function igniteTile(){

  const cands = G.slot.filter(s => !s.pending && !s.wild && !(s.bomb > 0));

  }

// 钻洞（鼠王）：露着的牌，加上把它们拿走以后就会露出来的那一层，图案一起洗乱——露出来的图案真的会变
function burrow(){

  const pool = [...top, ...under];
  if (pool.length < 2) return '想钻进牌堆，可是没剩几张牌了';

    }

  }

  for (let i = 0; i < 4; i++) Sound.tone(1900 + Math.random() * 700, .05, 'square', .012, .05 + i * .09);
  return `钻进了牌堆：露着的牌和下面一层，${pool.length} 张全被洗乱了`;
}
// 一窝老鼠从牌桌左边窜到右边
function ratsFx(){

// 喷火（地狱犬）：挑一排露着的牌（最好是你口袋里正缺的那几种）点着，3 步之内不拿走就烧成灰
function breathFire(){
  const free = G.tiles.filter(t => t.status === 'board' && !t.hatch && isFree(t) && !(t.burn > 0) && !(t.chain > 0));
  if (!free.length) return '';
  const need = new Set(G.slot.filter(s => !s.pending).map(s => s.type));
  let row = null, best = -1;
  for (const c of free){
    const band = free.filter(t => Math.abs(t.y - c.y) < .5);
    const sc = band.length + band.filter(t => need.has(t.type)).length * 1.5 + Math.random() * .5;
    if (sc > best){ best = sc; row = band; }

function burnAway(list){
  for (const t of list){ t.status = 'gone'; t.ash = true; t.burn = 0; t.chain = 0; }
  G.run.fl.burned = (G.run.fl.burned || 0) + list.length;
  Sound.flame();
  say(`${list.length} 张牌烧成了灰`);
  badgeCheck();
}
// 一道火从牌桌一边扫过那一排
function flameFx(row){
  if (REDUCED || !row.length) return;
  const U = L.unit, y = Math.min(...row.map(t => t.y)), f = mk('i', 'breath');
  Object.assign(f.style, {left: (L.boardX - U * .3) + 'px', top: (L.boardY + (y - .1) * U) + 'px', width: (U * (BW + .6)) + 'px', height: (U * 1.2) + 'px'});
  stage.appendChild(f);
  setTimeout(() => f.remove(), 900);
}
// 巫妖传送出口：挑一个还被压着、离现在远一点的底层位置
function moleMove(){
  const h = G.tiles.find(t => t.hatch && t.status === 'board');
  if (!h) return '';
  const seen = new Set(), cands = [];
  for (const t of G.tiles){
    if (t.status !== 'board' || t.hatch || t.pile || t.z > 2) continue;
    const key = Math.round(t.x * 3) + ',' + Math.round(t.y * 3);
    if (seen.has(key) || Math.hypot(t.x - h.x, t.y - h.y) < 2.2) continue;
    seen.add(key);
    if (coneAt(G.tiles, t.x, t.y, true).size >= 3) cands.push(t);
  }
  if (!cands.length) return '想把出口传送走，可是没地方了';
  const p = pickOne(cands, Math.random);
  relink(h, p.x, p.y, -1);
  computeHeights(G.tiles);
  G.armed = null;
  if (!REDUCED) replay(h.el, 'back');
  return '把出口传送到了别处';
}

/* ---- 险境：漆黑、浓雾、岩浆、蝙蝠窝和棺材 ---- */
function darken(steps, msg, at){
  const fl = G.run.fl;
  fl.dark = Math.max(fl.dark, steps);
  Sound.snuff();
  batsFx(at);
  if (msg) say(msg);
}
function fogCloud(x, y, r, steps, msg){
  const fl = G.run.fl;
  fl.fogId = (fl.fogId || 0) + 1;
  fl.fogs.push({id: fl.fogId, x, y, r, left: steps});
  Sound.fog();
  if (msg) say(msg);
}
// 雾吐在露着的牌最密的地方
function fogSpot(){
  const free = G.tiles.filter(t => t.status === 'board' && !t.hatch && isFree(t));
  let best = null, bn = -1;
  for (const t of free){
    const n = free.filter(u => Math.hypot(u.x - t.x, u.y - t.y) < 1.8).length + Math.random() * .5;
    if (n > bn){ bn = n; best = t; }
  }
  return best;
}
// 被压着的蝙蝠窝、棺材一露出来就发作
function badgeCheck(){
  for (const t of G.tiles){
    if (!t.badge || t.status !== 'board' || !isFree(t)) continue;
    const kind = t.badge;
    t.badge = null;
    if (kind === 'bat') darken(3, '牌底下扑出一窝蝙蝠，烛火灭了！', t);
    else fogCloud(t.x + .5, t.y + .5, 2.1, 6, '棺材盖一掀，涌出一团浓雾');
  }
}
// 牌的中心离岩浆那条边有多远（以牌宽为单位）
function lavaDepth(t, lv){
  const cx = t.x + .5, cy = t.y + .5;
  return lv.edge === 'top' ? cy : lv.edge === 'bottom' ? BH - cy : lv.edge === 'left' ? cx : BW - cx;
}
// 岩浆往前漫一排：吞掉的牌掉进下一层；漫到出口，人就被逼着掉下去
function lavaAdvance(){
  const run = G.run, lv = run.fl.lava;
  if (!lv) return;
  lv.pos++;
  const melt = G.tiles.filter(t => t.status === 'board' && !t.hatch && lavaDepth(t, lv) < lv.pos);
  for (const t of melt){ t.status = 'gone'; t.melted = true; t.chain = 0; t.badge = null; }
  run.fl.melted += melt.length;
  Sound.lava();
  if (melt.length) say(`岩浆往前漫了一排，吞掉了 ${melt.length} 张牌`);
  badgeCheck();
  const h = G.tiles.find(t => t.hatch && t.status === 'board');
  if (h && !h.sealed && lavaDepth(h, lv) < lv.pos + .5 && !run.fl.forced){
    run.fl.forced = true;
    say('岩浆漫到了出口，地面塌了！');
    const ep = G.epoch;
    setTimeout(() => forceFall(ep), 900);
  }
}
// 被岩浆逼着掉下去：正在消一组、开着对话框的话等一等再掉
function forceFall(ep){
  if (ep !== G.epoch || G.mode !== 'dig' || G.over) return;
  const h = G.tiles.find(t => t.hatch && t.status === 'board');
  if (!h) return;
  if (G.pending || G.zooming || !scrim.hidden) return void setTimeout(() => forceFall(ep), 400);
  digDive(h, true);
}

/* ---- 怪和险境的动效 ---- */
// 怪头像在牌桌里的位置（骨头从这里飞出来）
function foeOrigin(f){
  const row = dgFoes.children[G.run.foes.indexOf(f)];

}
function foeFx(f, type, n, at){

// 一群蝙蝠从牌堆里扑出来，飞过整个牌桌
function batsFx(at){
  if (REDUCED) return;
  const U = L.unit, ox = at ? L.boardX + (at.x + .5) * U : L.boardX + 3.5 * U, oy = at ? L.boardY + (at.y + .5) * U : L.boardY - U;

/* ---- 篝火：Boss 前歇一歇（点亮蜡烛或者烧掉口袋，二选一），旁边的商人收灵魂 ---- */
function roomRender(){
  const run = G.mode === 'dig' ? G.run : null, R = run && run.room;
  if (!R){ roomEl.hidden = true; return; }
  roomEl.hidden = false;
  roomEl.className = 'room r-camp' + (roomEl.classList.contains('driven') ? ' driven' : '');
  const head = mk('div', 'room-head'), ht = mk('div'), h = mk('h3'), sub = mk('p');
  ht.append(h, sub);
  h.textContent = '篝火';
  sub.textContent = R.used ? (R.used === 'rest' ? '歇了一会儿，点亮了一根蜡烛' : '口袋里的牌都烧掉了') : `下一层是${nextName(run.floor + 1)}，先歇一歇`;
  const fire = mk('i', 'fire');
  fire.style.backgroundImage = 'var(--da-camp)';
  head.append(fire, ht);
  const opts = mk('div', 'camp-opts');
  const rest = mk('button', 'btn primary');
  rest.type = 'button';
  rest.textContent = run.hearts >= run.maxHearts ? '蜡烛都亮着' : '歇一歇：点亮蜡烛';
  rest.disabled = !!R.used || run.hearts >= run.maxHearts;
  rest.addEventListener('click', () => { R.used = 'rest'; run.hearts = Math.min(run.maxHearts, run.hearts + 1); Sound.tool(); render(); roomRender(); });
  const n = G.slot.length + G.hold.flat().length;
  const burn = mk('button', 'btn ghost');
  burn.type = 'button';
  burn.textContent = n ? `烧掉口袋 ${n} 张` : '烧掉口袋';
  burn.disabled = !!R.used || !n;
  burn.addEventListener('click', () => {
    R.used = 'burn';
    for (const t of [...G.slot, ...G.hold.flat()]){ t.status = 'gone'; if (t.px !== undefined) burst(t.px + L.cell * .46, t.py + L.cell * .46); }
    G.slot = [];
    G.hold = [[], [], []];
    Sound.boom();
    render();
    roomRender();
  });
  opts.append(rest, burn);
  // 商人
  const shop = mk('p', 'shop-note');
  shop.textContent = `商人：手里有 ${run.wool} 个灵魂${has('coupon') ? ' · 黑市徽章打七折' : ''}`;
  const cards = mk('div', 'cards');
  R.goods.forEach((g, i) => {
    const sold = R.sold.includes(i);
    const buy = price => {
      if (run.wool < price) return toast('灵魂不够');
      run.wool -= price;
      R.sold.push(i);
      Sound.coin();
      if (g.t === 'relic') digGain(g.id);
      if (g.t === 'tool'){ G.tools[g.id]++; toast(`「${TOOL_NAMES[g.id]}」多了一次`); }
      render();
      roomRender();
    };
    let card;
    if (g.t === 'relic'){ const pr = relicPrice(g.id); card = relicCard(g.id, pr, () => buy(pr), sold || run.wool < pr); }
    else { const pr = itemPrice(7); card = itemCard(`var(--da-t${g.id})`, TOOL_NAMES[g.id], '道具多一次', pr, () => buy(pr), sold || run.wool < pr); }
    if (sold) card.classList.add('sold');
    cards.appendChild(card);
  });
  // 出口
  const exits = mk('div', 'exits');
  run.exits.forEach((x, i) => {
    const b = mk('button', 'exit');
    b.type = 'button';
    const ic = mk('i');
    ic.style.setProperty('--k', `var(--da-${nextArt(run.floor + 1)})`);
    const lab = mk('span');
    lab.textContent = `往下跳 · ${nextName(run.floor + 1)}`;
    b.append(ic, lab);
    b.setAttribute('aria-label', `跳下去，下一层：${floorName(run.floor + 1)}，${nextName(run.floor + 1)}`);
    b.addEventListener('click', () => { if (!G.zooming && !G.pending) digDive(i); });
    exits.appendChild(b);
  });
  roomEl.replaceChildren(head, opts, shop, cards, exits);
}

/* ---- 掉进下一层：出口蓄力开裂 → 地面塌陷 → 冲进竖井往下掉 → 砸到下一层 ----
   牌、地面、房间面板用同一台 3D 镜头（camFrame / camPlane）；光、竖井、飞过的灰尘火星、冲击波画在一张盖满全屏的画布上。
   整段按时间轴走（毫秒）：0 蓄力 · 350 塌陷 · 1100 闪光冲进竖井 · 1500 换层 · 2050 看见底 · 2500 落地 · 3200 站稳 */
const SEQ = {collapse: 350, flash: 1100, swap: 1500, approach: 2050, impact: 2500, settle: 3200};
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const lerp3 = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${a == null ? 1 : Math.max(0, Math.min(1, a)).toFixed(3)})`;
// 每一段竖井：岩层三种颜色轮着来、井底透上来的光、飞过去的是灰尘还是碎骨头还是火星
const SHAFT = [
  {bands: ['#4a3a30', '#5e4b3d', '#30251e'], light: [255, 170, 90], parts: 'dust'},
  {bands: ['#2c3540', '#3d4958', '#1c232b'], light: [160, 222, 235], parts: 'bone'},
  {bands: ['#4c130a', '#71200f', '#2b0805'], light: [255, 112, 40], parts: 'ember'},
  {bands: ['#2c0606', '#480a0a', '#150202'], light: [255, 52, 16], parts: 'ember'}
].map(z => Object.assign(z, {rgb: z.bands.map(hexRgb)}));
const fxCanvas = mk('canvas', 'fxc');
fxCanvas.hidden = true;
fxCanvas.setAttribute('aria-hidden', 'true');
document.body.appendChild(fxCanvas);
const landCard = mk('div', 'landcard');
landCard.hidden = true;
landCard.setAttribute('aria-hidden', 'true');
landCard.addEventListener('animationend', e => { if (e.target === landCard) landCard.hidden = true; });
stage.appendChild(landCard);
const pitEl = mk('div', 'pit');   // 地面从出口开始塌出来的黑洞
zoneEl.appendChild(pitEl);
const appEl = document.querySelector('.app');
const TAU2 = Math.PI * 2;
const hash = (a, b) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
let D = null;   // 正在往下掉的那一段

function camHead(c){
  return `translate(${c.sx.toFixed(1)}px,${c.sy.toFixed(1)}px) perspective(${P3}px) translateZ(${c.k.toFixed(1)}px) rotateX(${c.tilt.toFixed(2)}deg) rotateZ(${c.yaw.toFixed(2)}deg) `;
}
function camFrame(list, c, per){
  const a = c.tilt * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
  const w = c.yaw * Math.PI / 180, cw = Math.cos(w), sw = Math.sin(w), ts = L.unit * .92, hs = (ts / 2).toFixed(1);
  const head = camHead(c), out = [];
  stage.style.setProperty('--fe', (1 - Math.min(1, c.tilt / 20)).toFixed(3));
  for (const t of list){
    if (!t.el) continue;
    const p = boardPose(t), o = per(t);
    const X = p.x - c.tx + (o.dx || 0), Y = p.y - c.ty + (o.dy || 0), Z = (t.z + 1) * c.gap + (o.dz || 0);
    const x1 = (X + ts / 2) * cw - (Y + ts / 2) * sw, y1 = (X + ts / 2) * sw + (Y + ts / 2) * cw;
    const zc = y1 * sn + Z * cs + c.k;
    const op = (o.op == null ? 1 : o.op) * (1 - seg(zc, P3 - 430, P3 - 170));
    // 翻滚绕着牌的中心转；出口的盖子绕上边翻开
    const sp = o.spin ? ` translate(${hs}px,${hs}px) rotateX(${o.spin.rx.toFixed(1)}deg) rotateY(${o.spin.ry.toFixed(1)}deg) rotateZ(${o.spin.rz.toFixed(1)}deg) translate(-${hs}px,-${hs}px)` : '';
    t.el.style.transform = head + `translate3d(${X.toFixed(1)}px,${Y.toFixed(1)}px,${Z.toFixed(1)}px)` + sp + (o.hinge ? ` rotateX(${o.hinge.toFixed(1)}deg)` : '');
    t.el.style.opacity = op < .999 ? Math.max(0, op).toFixed(3) : '';
    t.el.style.visibility = op < .002 ? 'hidden' : '';
    out.push([zc + (t.z + 1) * 3, t]);   // 层压扁了以后，上层还是要盖在下层上面
  }
  out.sort((u, v) => u[0] - v[0]);
  const n = Math.max(1, out.length - 1);
  out.forEach(([, t], i) => { t.el.style.zIndex = 10 + Math.round(i / n * 270); });
  camPlane(zoneEl, L.boardX - 6, L.boardY - 2, c, -3);
  if (!bed.hidden) camPlane(bed, L.boardX - 4, Math.round(L.boardY + L.unit * 7.5), c, -2);
}
// 地面、房间面板这种平放着的大块：放在 (lx, ly)，和牌用同一台镜头；tail 是贴在它自己身上的额外变换
function camPlane(el, lx, ly, c, Z, tail){
  el.style.transformOrigin = '0 0';
  el.style.transform = `translate(${(-lx).toFixed(1)}px,${(-ly).toFixed(1)}px) ` + camHead(c) + `translate3d(${(lx - c.tx).toFixed(1)}px,${(ly - c.ty).toFixed(1)}px,${Z.toFixed(1)}px)` + (tail || '');
}
const boardMid = () => ({x: L.boardX + 3.5 * L.unit, y: L.boardY + 4.1 * L.unit});
// 地面塌出来的洞：几个圆叠在一起，边缘一圈被底下的光照亮
function pitPaint(t){
  const S = D, U = L.unit, R = U * Math.max(0, (t - SEQ.collapse - 220) / 48);
  if (!R){ pitEl.style.opacity = '0'; return; }
  const cx = S.hx - (L.boardX - 6), cy = S.hy - (L.boardY - 2), lit = SHAFT[S.fromZone].light, cores = [], rims = [];
  for (const b of S.blobs){
    const x = cx + b.dx * R * .35, y = cy + b.dy * R * .35, r = R * b.k;
    cores.push(`radial-gradient(circle at ${x.toFixed(1)}px ${y.toFixed(1)}px,#040202 0 ${r.toFixed(1)}px,rgba(4,2,2,0) ${(r + 1.5).toFixed(1)}px)`);
    rims.push(`radial-gradient(circle at ${x.toFixed(1)}px ${y.toFixed(1)}px,${rgba(lit, .95)} 0 ${(r + 2).toFixed(1)}px,${rgba(lit, 0)} ${(r + U * .45).toFixed(1)}px)`);
  }
  pitEl.style.background = cores.concat(rims).join(',');
  pitEl.style.opacity = '1';
}
// ① 出口附近的牌发抖 → 牌堆立起来 → 地面从出口往外塌、牌一圈圈翻滚着掉进黑洞；镜头凑近出口，盖子翻开
function collapseFrame(t){
  const S = D, U = L.unit, m = boardMid(), h = S.tile;
  const c1 = seg(t, 0, 700), c2 = seg(t, 650, SEQ.flash), toH = seg(t, 120, 900);
  const zoom = Math.exp(Math.log(1.45) * seg(t, 150, 900) + Math.log(2.6 / 1.45) * seg(t, 880, SEQ.flash));
  const cam = {
    tilt: S.tdir * (26 * c1 + 18 * c2), yaw: -9 * S.tdir * seg(t, 0, 1000), gap: S.gmax * seg(t, 100, 600) * (1 - .6 * c2),
    tx: mix(m.x, S.hx, toH), ty: mix(m.y, S.hy, toH), sx: m.x, sy: m.y + U * .3 * c1, k: P3 * (1 - 1 / zoom)
  };
  camFrame(S.old, cam, u => {
    if (u === h) return {hinge: 105 * seg(t, 380, 680), op: 1 - seg(t, 600, 780)};
    const f = u.fx, near = Math.max(0, 1 - f.d / 3);
    const amp = seg(t, 0, 300) * (1 - seg(t, 330, 460)) * near * 2.4;
    const lt = Math.max(0, Math.min(1, (t - SEQ.collapse - 30 - f.d * 48) / 620)), g = lt * lt;
    return {
      dx: Math.sin(t * .09 + f.j) * amp + f.ox * U * .5 * g, dy: Math.cos(t * .11 + f.j) * amp + f.oy * U * .5 * g, dz: -U * f.fall * g,
      spin: g > 0 ? {rx: f.rx * g, ry: f.ry * g, rz: f.rz * g} : null, op: 1 - seg(lt, .55, 1)
    };
  });
  pitPaint(t);
  // 房间的面板跟着地面一起倒下去，再翻着掉进洞里
  if (S.roomOut){
    const g = Math.pow(Math.max(0, Math.min(1, (t - 420) / 640)), 2), pw = (U * BW - 4) / 2, ph = (U * BH - 6) / 2;
    camPlane(roomEl, L.boardX + 2, L.boardY + 4, cam, 2 - U * 14 * g, ` translate(${pw.toFixed(1)}px,${ph.toFixed(1)}px) rotateX(${(-50 * g).toFixed(1)}deg) rotateZ(${(18 * g).toFixed(1)}deg) translate(${(-pw).toFixed(1)}px,${(-ph).toFixed(1)}px)`);
    roomEl.style.opacity = (1 - seg(t, 800, 1060)).toFixed(3);
  }
}
// ④ 井底的新一层迎面冲上来：一路转正、一层层拍扁，砸到底的那一下从中间往外一圈圈弹起来
function landFrame(t){
  const S = D, U = L.unit, m = boardMid(), ti = t - SEQ.impact;
  const p = Math.max(0, Math.min(1, (t - SEQ.approach) / (SEQ.impact - SEQ.approach)));
  const zoom = 1 / (1 / .26 - (1 / .26 - 1) * p) * (ti > 0 ? 1 + .06 * Math.sin(Math.PI * Math.min(1, ti / 240)) : 1);
  const back = seg(t, SEQ.impact, SEQ.impact + 320);
  const cam = {
    tilt: mix(48, 9, sm(p)) * (1 - back), yaw: S.roll * (1 - seg(t, SEQ.approach - 250, SEQ.impact)), gap: S.gmaxN * Math.pow(1 - p, .8),
    tx: m.x, ty: m.y, sx: m.x, sy: m.y + U * 1.2 * (1 - sm(p)), k: P3 * (1 - 1 / zoom)
  };
  const bounce = d => { const tau = (ti - d * 30) / 1000; return tau > 0 ? U * .8 * Math.exp(-6.5 * tau) * Math.sin(17 * tau) : 0; };
  const op = seg(t, SEQ.approach - 60, SEQ.approach + 140);
  // 上一层塌下来的碎牌：落地之后才一张张砸下来
  camFrame(S.fresh, cam, u => {
    const f = u.fx || {d: 0, j: 0};
