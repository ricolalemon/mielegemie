<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="三消小游戏，一共 6 关，每一副牌都保证有解；九种摆法、五种外观，按住或倾斜手机看清牌是怎么叠的。">
<title>咩了个咩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@900&family=Silkscreen&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 四套外观，靠 <html data-skin="…"> 切换。每套都自己画背景，不跟随系统深浅色。
   默认（毛线）：靛蓝粗毛衣上的实心绣 */
:root{
  color-scheme:dark;
  --bg:#22366b;
  --ink:#fff4de;
  --ink-soft:#c3cde8;
  --tile:#f5ead2;
  --tile-hi:rgba(255,255,255,.28);
  --dim:brightness(.52) saturate(.55);
  --btn:#f5ead2;
  --btn-ink:#2b2f45;
  --btn-soft:#5a5c6e;
  --btn-edge:#c9b288;
  --tray:#1d2e5e;
  --tray-2:#15224a;
  --tray-line:rgba(240,181,69,.72);
  --tray-cell:rgba(0,0,0,.2);
  --thread:#f0b545;
  --track:rgba(195,205,232,.16);
  --accent:#bf3b2c;
  --accent-deep:#842419;
  --accent-ink:#fff;
  --badge:#f0b545;
  --badge-ink:#1b2344;
  --paper:#f7eed9;
  --paper-ink:#2b2f45;
  --paper-soft:#5a5c6e;
  --paper-edge:#c9b288;
  --ghost-line:rgba(43,47,69,.2);
  --scrim:rgba(8,12,30,.62);
  --focus:#ffd772;
  --pip-off:rgba(195,205,232,.45);
  --pip-on:#f0b545;
  --warn:#f06a52;
  --warn-ink:#ffb4a4;
  --bed:rgba(8,14,40,.16);
  --shelf:rgba(240,181,69,.55);
  --toast:#15224a;
  --toast-ink:#fff4de;
  --brand-shadow:0 3px 0 #111c43;
  --font-display:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Silkscreen",ui-monospace,"SF Mono",Menlo,monospace;
}
/* 掌机：绿色液晶屏，四阶绿，方块像素 */
:root[data-skin="pixel"]{
  color-scheme:light;
  --bg:#a3bd4f;
  --ink:#1c3318;
  --ink-soft:#35552a;
  --tile:#e2edb3;
  --tile-hi:rgba(255,255,255,0);
  --dim:none;
  --btn:#e2edb3;
  --btn-ink:#1c3318;
  --btn-soft:#1c3318;
  --btn-edge:#1c3318;
  --tray:#8eaa40;
  --tray-2:#8eaa40;
  --tray-line:#1c3318;
  --tray-cell:rgba(28,51,24,.12);
  --thread:#1c3318;
  --track:rgba(28,51,24,.28);
  --accent:#1c3318;
  --accent-deep:#0b170a;
  --accent-ink:#d6e5a0;
  --badge:#1c3318;
  --badge-ink:#d6e5a0;
  --paper:#c7da85;
  --paper-ink:#1c3318;
  --paper-soft:#2f4b24;
  --paper-edge:#1c3318;
  --ghost-line:#1c3318;
  --scrim:rgba(28,51,24,.5);
  --focus:#1c3318;
  --pip-off:rgba(28,51,24,.3);
  --pip-on:#1c3318;
  --warn:#1c3318;
  --warn-ink:#1c3318;
  --bed:rgba(28,51,24,.08);
  --shelf:#1c3318;
  --toast:#1c3318;
  --toast-ink:#d6e5a0;
  --brand-shadow:3px 3px 0 rgba(28,51,24,.25);
}
/* 孔版：荧光粉 + 蓝两色油墨，故意套色不准 */
:root[data-skin="riso"]{
  color-scheme:light;
  --bg:#ebe9e3;
  --ink:#1b2a86;
  --ink-soft:#44509a;
  --tile:#fbfaf6;
  --tile-hi:rgba(255,255,255,0);
  --dim:grayscale(1) brightness(.8) contrast(.85);
  --btn:#fbfaf6;
  --btn-ink:#1b2a86;
  --btn-soft:#0078bf;
  --btn-edge:#0078bf;
  --tray:#0078bf;
  --tray-2:#006aa9;
  --tray-line:#ff48b0;
  --tray-cell:rgba(255,255,255,.16);
  --thread:#ff48b0;
  --track:rgba(0,120,191,.28);
  --accent:#ff48b0;
  --accent-deep:#0078bf;
  --accent-ink:#141844;
  --badge:#ff48b0;
  --badge-ink:#141844;
  --paper:#fbfaf6;
  --paper-ink:#141844;
  --paper-soft:#3e4575;
  --paper-edge:#0078bf;
  --ghost-line:#0078bf;
  --scrim:rgba(40,44,70,.42);
  --focus:#ff48b0;
  --pip-off:rgba(0,120,191,.35);
  --pip-on:#0078bf;
  --warn:#e0237a;
  --warn-ink:#c81d6c;
  --bed:rgba(0,120,191,.06);
  --shelf:#ff48b0;
  --toast:#1b2a86;
  --toast-ink:#fbfaf6;
  --brand-shadow:3px 2px 0 #ff48b0;
  --font-display:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--bg)}
body{min-height:100%;margin:0;overflow-x:hidden;overflow-x:clip;background-color:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.icon-btn:focus-visible,.tool:focus-visible,.btn:focus-visible,.skin-opt:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.dialog .btn:focus-visible,.dialog .skin-opt:focus-visible{outline-color:var(--paper-ink)}
.num{font-family:var(--font-num);font-weight:400;letter-spacing:.02em}

.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px 22px;display:flex;flex-direction:column;gap:10px}

/* 顶栏 */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.lvl{position:relative;display:inline-flex;align-items:baseline;gap:4px;padding:6px 12px 5px;border-radius:4px;background:var(--btn);color:var(--btn-ink);
  font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 var(--btn-edge),0 3px 0 1px rgba(0,0,0,.28)}
.lvl b{font-family:var(--font-num);font-weight:400;font-size:17px;line-height:1;color:var(--accent)}
.brand{margin:0;text-align:center;font-family:var(--font-display);font-weight:400;font-size:clamp(21px,6.2vw,32px);line-height:1.05;
  letter-spacing:.08em;white-space:nowrap;color:var(--ink);text-shadow:var(--brand-shadow)}
.acts{display:flex;gap:6px}
@media (max-width:380px){.bar{gap:6px}.lvl{padding-inline:9px}.acts{gap:3px}.acts .icon-btn{width:31px;height:31px}.acts .icon-btn svg{width:18px;height:18px}}
.icon-btn{width:36px;height:36px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
  background:var(--btn);color:var(--btn-ink);
  box-shadow:inset 0 0 0 3px var(--btn),inset 0 0 0 4.5px rgba(120,90,50,.3),0 3px 0 var(--btn-edge),0 3px 0 1px rgba(0,0,0,.28)}
.icon-btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 3px var(--btn),inset 0 0 0 4.5px rgba(120,90,50,.3),0 1px 0 var(--btn-edge)}
.icon-btn span{display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:400px){
  .acts{gap:5px}
  .icon-btn{width:33px;height:33px}
  .icon-btn svg{width:17px;height:17px}
}

/* 进度线 */
.rail{display:flex;align-items:center;gap:12px}
.thread{position:relative;flex:1;height:26px}
.thread::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;
  background:repeating-linear-gradient(90deg,var(--track) 0 2px,transparent 2px 9px)}
.sewn{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:6px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--thread) 0 6px,transparent 6px 9px);transition:width .6s cubic-bezier(.3,.7,.3,1)}
.needle{position:absolute;top:50%;left:0;width:40px;height:10px;margin-top:-5px;transition:left .6s cubic-bezier(.3,.7,.3,1)}
.needle svg{display:block;width:100%;height:100%}
.count{margin:0;font-size:14px;font-weight:700;white-space:nowrap;color:var(--ink-soft)}
.count .num{color:var(--ink);font-size:15px}

/* 牌桌 */
.stage{position:relative;isolation:isolate;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.stage.tilting .tile.onboard{transition:none}
/* 牌摞里被压住的牌只露出一窄条；有硬投影的外观里，上一张的影子会正好盖住这一条，所以只留边框 */
:root[data-skin="pixel"] .tile.pile.blocked .face{box-shadow:inset 0 0 0 2px #1c3318}
:root[data-skin="riso"] .tile.pile.blocked .face{box-shadow:inset 0 0 0 1.5px #0078bf}
:root[data-skin="bauhaus"] .tile.pile.blocked .face{box-shadow:inset 0 0 0 2.5px #151515}
:root[data-skin="type"] .tile.pile.blocked .face{box-shadow:inset 0 0 0 1.5px #111}
/* 捻开看层次时只看结构：被压住的牌一律扣成背面，松手后再翻回来 */
.stage.tilting .tile.blocked.onboard .art{opacity:0}
/* 每日挑战「蒙眼」：口袋里的牌扣着，只露出一个缝线方框 */
.stage .tile.facedown .art{opacity:0}
#trough.bombs i.dead{opacity:1;background:linear-gradient(45deg,transparent 43%,rgba(0,0,0,.6) 43% 57%,transparent 57%),linear-gradient(-45deg,transparent 43%,rgba(0,0,0,.6) 43% 57%,transparent 57%),radial-gradient(circle,#2a1a10 30%,#6b3a1c 58%,var(--tray-cell) 75%);box-shadow:none}
/* 定时炸弹：牌角上的倒计时，快炸了会变红跳动 */
.fuse{position:absolute;top:-10%;right:-10%;z-index:2;display:grid;place-items:center;width:44%;height:44%;border-radius:50%;
  background:#2b2f45;color:#fff4de;font:400 calc(var(--ts) * .25)/1 var(--font-num);box-shadow:0 0 0 calc(var(--ts) * .035) var(--tile),0 2px 4px rgba(0,0,0,.35)}
.fuse::before{content:"";position:absolute;top:-16%;right:6%;width:22%;height:26%;border-radius:40%;background:#f0b545;box-shadow:0 0 5px 2px rgba(240,181,69,.75)}
.fuse.hot{background:var(--accent);animation:pulse .7s ease-in-out infinite}
.stage .tile.facedown .face::after{content:"";position:absolute;inset:20%;border-radius:18%;border:2px dashed var(--paper-soft);opacity:.45}
.peek{width:30px;height:30px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;
  background:var(--btn);color:var(--btn-ink);box-shadow:0 2px 0 var(--btn-edge),0 2px 0 1px rgba(0,0,0,.2);
  touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.peek svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.peek.on{background:var(--accent);color:var(--accent-ink);box-shadow:none;transform:translateY(2px)}
.peek:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
:root[data-skin="pixel"] .peek,:root[data-skin="bauhaus"] .peek,:root[data-skin="type"] .peek{border-radius:0}
.bed{position:absolute;z-index:0;border-radius:12px;background:var(--bed);pointer-events:none}
.shelf{position:absolute;z-index:0;border:2px dashed var(--shelf);border-radius:12px}
.meter{position:absolute;z-index:0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.pips{display:flex;gap:3px}
.pips i{display:block;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--pip-off)}
.pips i.on{background:var(--pip-on);box-shadow:none}
.meter.hot{color:var(--warn-ink)}
.meter.hot .pips i.on{background:var(--warn)}

/* 七格口袋 */
.trough{position:absolute;z-index:0;display:grid;grid-template-columns:repeat(7,1fr);padding:var(--pad);border-radius:calc(var(--cell) * .24);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px),linear-gradient(180deg,var(--tray),var(--tray-2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 0 rgba(5,9,28,.55),0 14px 26px rgba(0,0,0,.32)}
.trough::before{content:"";position:absolute;inset:4px;border:2px dashed var(--tray-line);border-radius:calc(var(--cell) * .18);pointer-events:none}
.trough i{display:block;margin:calc(var(--cell) * .05);border-radius:calc(var(--cell) * .14);background:var(--tray-cell);box-shadow:inset 0 2px 5px rgba(0,0,0,.38)}

/* 牌 */
.tile{position:absolute;left:0;top:0;width:var(--ts);height:var(--ts);margin:0;padding:0;border:0;background:none;transform-origin:0 0;
  transition:transform .26s cubic-bezier(.3,.75,.3,1);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tile:focus{outline:none}
.face{position:absolute;inset:0;border-radius:16%;
  background:radial-gradient(circle at 28% 18%,var(--tile-hi),rgba(255,255,255,0) 58%),var(--tile);
  box-shadow:inset 0 0 0 1px rgba(120,86,40,.2),0 calc(var(--ts) * .07) 0 #c9b288,0 calc(var(--ts) * .07 + 1.5px) 0 rgba(6,10,30,.55);
  transition:filter .2s,translate .15s}
.art{position:absolute;inset:7%;background:center/contain no-repeat}
/* 图案图片由脚本按当前外观画好，放进 --ic-N 变量 */
.ic-0{background-image:var(--ic-0)}.ic-1{background-image:var(--ic-1)}.ic-2{background-image:var(--ic-2)}.ic-3{background-image:var(--ic-3)}
.ic-4{background-image:var(--ic-4)}.ic-5{background-image:var(--ic-5)}.ic-6{background-image:var(--ic-6)}.ic-7{background-image:var(--ic-7)}
.ic-8{background-image:var(--ic-8)}.ic-9{background-image:var(--ic-9)}.ic-10{background-image:var(--ic-10)}.ic-11{background-image:var(--ic-11)}
.ic-12{background-image:var(--ic-12)}.ic-13{background-image:var(--ic-13)}.ic-14{background-image:var(--ic-14)}.ic-15{background-image:var(--ic-15)}
.tile.blocked{cursor:default}
.tile.blocked .face{filter:var(--dim)}
.tile.hide{visibility:hidden}
.tile:focus-visible .face{outline:3px solid var(--focus);outline-offset:2px}
.stage .tile.inslot{transition:transform .3s cubic-bezier(.3,1.35,.5,1)}
.stage.instant .tile{transition:none}
.stage.dealing .tile .face{animation:drop .5s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:var(--d,0ms)}
.stage .tile.nope .face{animation:nope .25s ease}
.stage .tile.mix .face{animation:wob .4s ease}
.stage .tile.hint .face{animation:hint .55s ease}
.stage .tile.shake .face{animation:shake .42s ease}
.stage .tile.flip .face{animation:flip .36s ease-in-out both;animation-delay:var(--fd,0ms)}
.stage .tile.back .face{animation:back .28s cubic-bezier(.3,1.4,.5,1)}
.stage .tile.pending .face{filter:brightness(1.12)}
.stage .tile.gone{pointer-events:none}
.stage .tile.gone .face{animation:poof .3s ease forwards}
.stage .tile.leaving{pointer-events:none}
.stage .tile.leaving .face{animation:leave .26s ease-in forwards}
/* ---------- 深渊 ---------- */
/* 出口：一块黑铜色的牌，中间一个往外冒红光的洞，洞里画着下一层是什么；底下一行小字 */
.stage .tile.hatch .face{background:radial-gradient(circle at 50% 50%,#050101 0 30%,rgba(255,80,30,.85) 33%,#5a1a10 37%,rgba(0,0,0,0) 40%),radial-gradient(circle at 30% 18%,rgba(255,220,180,.35),rgba(255,220,180,0) 55%),linear-gradient(155deg,#9a6a35,#3d2414);
  box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.55),0 0 14px 2px rgba(255,70,20,.35),0 calc(var(--ts) * .07) 0 #241309,0 calc(var(--ts) * .07 + 1.5px) 0 rgba(0,0,0,.7)}
.tile.hatch .art{inset:24%;background-image:var(--k)}
.stage .tile.hatch.sealed .face{background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.35),rgba(255,255,255,0) 55%),linear-gradient(155deg,#b9c0cf,#7d8597);box-shadow:inset 0 0 0 1.5px rgba(40,44,60,.5),0 calc(var(--ts) * .07) 0 #5b6273,0 calc(var(--ts) * .07 + 1.5px) 0 rgba(6,10,30,.55)}
.tile.hatch.sealed .art{inset:14%}
.stage .tile.hatch.armed .face{animation:pulse .6s ease-in-out infinite;box-shadow:0 0 0 3px #ffb08a,0 0 18px 8px rgba(255,60,20,.9)}
.hlab{position:absolute;left:50%;top:calc(100% + 1px);z-index:3;transform:translateX(-50%);padding:1px 5px;border-radius:6px;white-space:nowrap;pointer-events:none;
  background:rgba(20,4,2,.82);color:#ffb59a;font:700 calc(var(--ts) * .2)/1.25 var(--font-body)}
.tile.blocked .hlab{opacity:.75}
/* 藏宝图：压着洞口的牌描金边 */
.tile.cone.onboard .face{outline:2px solid rgba(255,216,98,.95);outline-offset:-2px}
/* 透视眼镜：牌堆半透明，被压住的牌不变暗 */
.stage.xray .tile.onboard:not(.hatch) .face{opacity:.8}
.stage.xray .tile.blocked .face{filter:brightness(.9)}
/* 小铲子、炸药瞄准中 */
.stage.aiming .tile.onboard:not(.blocked):not(.hatch) .face{outline:2.5px dashed #ff6b55;outline-offset:2px}
/* 特殊牌：钥匙、落石、替罪羊 */
.ic-16{background-image:var(--ic-16)}.ic-17{background-image:var(--ic-17)}.ic-18{background-image:var(--ic-18)}
.ic-16{--ch:"钥"}.ic-17{--ch:"石"}.ic-18{--ch:"金"}
.stage .tile.drop .face{animation:rockDrop .5s cubic-bezier(.4,0,.6,1.3) both}
@keyframes rockDrop{from{transform:translateY(-150px) rotate(-20deg);opacity:0}60%{opacity:1}}
/* 牌的厚度：平放时看不见，牌堆立起来时从牌的边上垂下去 */
.side{position:absolute;display:none;pointer-events:none;background:linear-gradient(#d6be93,#a3855a)}
.side.f{left:3%;right:3%;top:calc(100% - 2px);height:calc(var(--ts) * .2);transform-origin:50% 0;transform:rotateX(-90deg);border-radius:0 0 calc(var(--ts) * .08) calc(var(--ts) * .08)}
.side.l{top:4%;bottom:4%;left:1px;width:calc(var(--ts) * .2);transform-origin:0 50%;transform:rotateY(90deg);background:linear-gradient(90deg,#d6be93,#a3855a)}
.side.r{top:4%;bottom:4%;right:1px;width:calc(var(--ts) * .2);transform-origin:100% 50%;transform:rotateY(-90deg);background:linear-gradient(-90deg,#d6be93,#a3855a)}
.stage.three .tile.onboard{transform-style:preserve-3d}
.stage.three .tile.onboard .side{display:block}
.stage.three .tile.hatch.onboard .side{background:#2a160b}
.stage.three .tile.onboard:not(.hatch) .face{box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 calc(var(--ts) * .07 * var(--fe, 1)) 0 var(--tile-edge, #c9b288)}
.stage.three .side{background:linear-gradient(var(--tile-side, #d6be93),var(--tile-edge, #a3855a))}
.stage.zooming{overflow:visible}
body.diving{overflow:clip}
body.hideui .bar,body.hideui .rail,body.hideui .digbar,body.hideui .tools,body.hideui .stage>.trough,body.hideui .stage>.meter,body.hideui .stage>.shelf,body.hideui .stage .tile:not(.onboard){opacity:0}
body.uidrop .bar,body.uidrop .rail,body.uidrop .digbar,body.uidrop .tools,body.uidrop .stage>.trough,body.uidrop .stage>.meter{animation:uiDrop .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes uiDrop{from{opacity:0;transform:translateY(-16px)}}
.stage.three .hlab{display:none}
.zone .pit{position:absolute;inset:0;pointer-events:none;opacity:0}
.stage.zooming .tile{transition:none!important}
/* 每一段的底色：地窖、墓穴、地狱、深渊 */
.zone{position:absolute;z-index:0;border-radius:22px;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.07),inset 0 -18px 34px rgba(0,0,0,.28);transition:background .6s}
.zone{overflow:hidden}
/* 地窖：湿冷的石墙，头顶两盏蜡烛的暖光 */
.zone.z0{background:radial-gradient(60% 40% at 12% -4%,rgba(255,170,70,.24),rgba(0,0,0,0) 70%),radial-gradient(60% 40% at 88% -4%,rgba(255,170,70,.2),rgba(0,0,0,0) 70%),repeating-linear-gradient(0deg,rgba(0,0,0,.42) 0 2px,transparent 2px 36px),repeating-linear-gradient(90deg,rgba(0,0,0,.3) 0 2px,transparent 2px 72px),linear-gradient(180deg,#2b2420,#110d0c)}
/* 墓穴：墙上一排排放骨头的壁龛，冷冷的蓝光 */
.zone.z1{background:radial-gradient(80% 50% at 50% -6%,rgba(150,200,215,.18),rgba(0,0,0,0) 70%),radial-gradient(ellipse 13px 16px at 50% 58%,rgba(0,0,0,.55) 0 60%,rgba(0,0,0,0) 64%) 0 0/44px 52px,radial-gradient(ellipse 15px 18px at 50% 58%,rgba(200,215,220,.07) 0 70%,rgba(0,0,0,0) 74%) 0 0/44px 52px,linear-gradient(180deg,#1b2026,#0a0c0f)}
/* 地狱：黑里透红，底下是岩浆的光，地面裂着缝 */
.zone.z2{background:radial-gradient(110% 55% at 50% 112%,rgba(255,80,20,.5),rgba(0,0,0,0) 65%),repeating-linear-gradient(118deg,transparent 0 38px,rgba(255,90,30,.08) 38px 40px,transparent 40px 77px),linear-gradient(180deg,#230707,#0d0202)}
/* 深渊：几乎全黑，只有底下一圈暗红在一明一暗 */
.zone.z3{background:radial-gradient(120% 60% at 50% 115%,rgba(220,30,10,.55),rgba(0,0,0,0) 65%),linear-gradient(180deg,#110303,#000);animation:throb 2.4s ease-in-out infinite}
@keyframes throb{50%{filter:brightness(1.35)}}
/* 灰尘、冷光、火星：叠在牌桌底色上 */
.zone::before,.zone::after{content:"";position:absolute;inset:-40% -10%;pointer-events:none}
.zone.z0::before{background:radial-gradient(circle,rgba(255,200,120,.5) 0 1px,transparent 1.8px) 0 0/60px 80px,radial-gradient(circle,rgba(255,200,120,.32) 0 1px,transparent 1.6px) 30px 40px/60px 80px;animation:dustFall 16s linear infinite}
.zone.z1::before{background:radial-gradient(circle,rgba(170,215,225,.5) 0 1.4px,transparent 2.4px) 0 0/90px 110px,radial-gradient(circle,rgba(170,215,225,.3) 0 1px,transparent 2px) 45px 60px/90px 110px;animation:wispUp 16s linear infinite}
.zone.z2::before,.zone.z3::before{background:radial-gradient(circle,rgba(255,150,60,.85) 0 1.4px,transparent 2.4px) 0 0/70px 90px,radial-gradient(circle,rgba(255,90,30,.7) 0 1px,transparent 2px) 33px 47px/70px 90px;animation:emberUp 6s linear infinite}
.zone.z3::after{background:radial-gradient(circle,rgba(255,60,20,.7) 0 1.2px,transparent 2.2px) 20px 10px/55px 70px;animation:emberUp 4s linear infinite}
@keyframes fogDrift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
@keyframes dustFall{to{transform:translate(24px,80px)}}
@keyframes wispUp{to{transform:translateY(-110px)}}
@keyframes emberUp{to{transform:translateY(-90px)}}
/* 掉进下一层的过场：全屏画布画竖井、光和冲击波；层数迎面飞过来；落地时砸下一块标题 */
.fxc{position:fixed;left:0;top:0;z-index:40;pointer-events:none}
.fxc[hidden]{display:none}
.fall{position:fixed;inset:0;z-index:41;display:grid;place-content:center;justify-items:center;gap:16px;pointer-events:none;text-align:center;perspective:500px;--glow:255,90,30}
.fall.z1,.landcard.z1{--glow:110,205,235}
.fall.z3,.landcard.z3{--glow:255,40,20}
.fall[hidden]{display:none}
.fall b,.fall em{display:block;font:900 min(58px,15vw)/1 "Noto Serif SC",serif;font-style:normal;letter-spacing:.14em;padding-left:.14em;color:#f8ecd8;opacity:0;
  text-shadow:0 0 3px rgba(0,0,0,.9),0 0 26px rgba(var(--glow),.75),0 0 4px rgba(255,235,210,.7),0 5px 0 rgba(0,0,0,.55)}
.fall.big em{font-size:min(70px,16vw);letter-spacing:.32em;padding-left:.32em;color:#fff3e8;text-shadow:0 0 3px rgba(0,0,0,.9),0 0 34px rgba(var(--glow),.95),0 0 80px rgba(var(--glow),.55),0 5px 0 rgba(0,0,0,.6)}
.fall.big b{font-size:24px;letter-spacing:.5em;padding-left:.5em}
.fall.rush b,.fall.rush em{animation:rushIn 1.3s both}
.fall.rush.big b{animation-delay:.12s}
@keyframes rushIn{
  0%{transform:translateZ(-1700px);opacity:0;animation-timing-function:cubic-bezier(.15,.55,.35,1)}
  22%{opacity:1}
  72%{transform:translateZ(-60px);opacity:1;animation-timing-function:cubic-bezier(.7,0,1,.5)}
  100%{transform:translateZ(470px);opacity:0}}
.landcard{position:absolute;left:0;right:0;z-index:640;display:grid;justify-items:center;gap:10px;pointer-events:none;text-align:center;--glow:255,80,30}
.landcard[hidden]{display:none}
.landcard b{font:900 min(48px,12.5vw)/1 "Noto Serif SC",serif;letter-spacing:.16em;padding-left:.16em;color:#f8ecd8;text-shadow:0 0 22px rgba(var(--glow),.7),0 4px 0 rgba(0,0,0,.65)}
.landcard span{font:900 16px/1 "Noto Serif SC",serif;letter-spacing:.5em;padding:9px 30px 9px calc(30px + .5em);color:#ffe6d6;text-shadow:0 0 10px rgba(var(--glow),.75);
  background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.75) 20%,rgba(0,0,0,.75) 80%,rgba(0,0,0,0))}
.landcard.slam{animation:slam 1.3s both}
.landcard.slam span{animation:slamSub 1.3s both}
@keyframes slam{
  0%{transform:scale(2.6);opacity:0;animation-timing-function:cubic-bezier(.55,0,1,.45)}
  9%{transform:scale(.9);opacity:1;animation-timing-function:cubic-bezier(.2,.6,.4,1)}
  18%{transform:scale(1.04)}
  27%{transform:none}
  76%{transform:none;opacity:1;animation-timing-function:ease-in}
  100%{transform:translateY(-16px);opacity:0}}
@keyframes slamSub{0%,12%{clip-path:inset(0 50%)}34%,100%{clip-path:inset(0 0)}}
/* 蜡烛、宝物、灵魂一排；Boss 一行 */
.digbar{display:flex;flex-direction:column;gap:6px}
.dg-row{display:flex;align-items:center;gap:10px;min-height:30px}
.dg-hearts{display:flex;align-items:center;gap:1px;flex:none}
.dg-hearts b{margin-left:3px;font:400 14px/1 var(--font-num);color:var(--ink)}
.dg-hearts i{width:21px;height:21px;background:var(--da-heart) center/contain no-repeat}
.dg-hearts i.empty{background-image:var(--da-heartE);opacity:.75}
.dg-hearts.hit{animation:shake .45s ease}
.dg-relics{flex:1;display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.dg-relic{position:relative;width:29px;height:29px;padding:0;border:0;border-radius:8px;cursor:pointer;touch-action:manipulation;
  background:var(--btn) center/74% no-repeat;box-shadow:0 2px 0 var(--btn-edge),0 2px 0 1px rgba(0,0,0,.22)}
.dg-relic b{position:absolute;right:-5px;bottom:-5px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;display:grid;place-items:center;
  background:var(--badge);color:var(--badge-ink);font:400 9px/1 var(--font-num)}
.dg-relic.ready{box-shadow:0 0 0 2px #ffd862,0 0 10px 3px rgba(255,216,98,.75)}
.dg-relic.spent{opacity:.45}
.dg-relic.on{background-color:#ffd862;transform:translateY(2px)}
.dg-relic:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.dg-wool{display:flex;align-items:center;gap:4px;flex:none;font:400 17px/1 var(--font-num);color:var(--ink)}
.dg-wool i{width:23px;height:23px;background:var(--da-wool) center/contain no-repeat}
.dg-wool.bump b{display:inline-block;animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
/* 险境的小牌子：烛火、漆黑、岩浆 */
.dg-haz{display:flex;gap:4px;flex:none}
.dg-haz:empty{display:none}
.haz{display:flex;align-items:center;gap:2px;height:26px;padding:0 8px 0 3px;border:0;border-radius:999px;background:rgba(0,0,0,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);
  color:var(--ink);font:400 14px/1 var(--font-num);cursor:pointer;touch-action:manipulation}
.haz i{width:20px;height:20px;background:center/contain no-repeat}
.haz.low{color:#ffb08a;box-shadow:inset 0 0 0 1.5px rgba(255,90,40,.75);animation:pulse .8s ease-in-out infinite}
.haz.dark{color:#d5c8ff;background:#000;box-shadow:inset 0 0 0 1.5px rgba(160,140,255,.5)}
/* 怪：一只一行。头像、名字和血条，右边是下一招和还剩几步 */
.dg-foes{display:flex;flex-direction:column;gap:5px}
.dg-foes[hidden]{display:none}
.dg-foes.two{flex-direction:row}
.dg-foes.two .foe{flex:1;gap:5px}
.dg-foes.two .foe-pic{width:30px;height:30px}
.dg-foes.two .intent span,.dg-foes.two .foe-mid small{display:none}
.dg-foes.two .foe-mid b{font-size:13px}
.foe{position:relative;display:flex;align-items:center;gap:7px;width:100%;min-width:0;padding:3px 5px 3px 3px;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;text-align:left;
  background:linear-gradient(90deg,rgba(64,10,6,.78),rgba(26,6,5,.62));box-shadow:inset 0 0 0 1px rgba(255,110,60,.3);color:var(--ink);font:inherit}
.foe.elite{box-shadow:inset 0 0 0 1.5px rgba(255,80,40,.65),0 0 12px rgba(255,50,20,.2)}
.foe.boss{background:linear-gradient(90deg,rgba(110,10,6,.85),rgba(40,4,3,.7));box-shadow:inset 0 0 0 1.5px rgba(255,70,30,.85),0 0 16px rgba(255,40,10,.35)}
.foe:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.foe-pic{width:36px;height:36px;flex:none;border-radius:10px;background:#251f21 center/80% no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),0 2px 0 #000}
.foe-mid{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 6px}
.foe-mid b{min-width:0;font:900 15px/1.1 "Noto Serif SC",serif;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foe-mid small{font:400 12px/1 var(--font-num);color:#f0c9b4}
.foe-mid .hp{grid-column:1/-1;height:8px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.foe-mid .hp u{display:block;height:100%;width:100%;background:linear-gradient(#ff7a45,#c3261a);box-shadow:inset 0 1px 0 rgba(255,220,180,.5);transition:width .35s .2s cubic-bezier(.3,.7,.3,1)}
.intent{display:flex;align-items:center;gap:3px;flex:none;padding:3px 4px 3px 4px;border-radius:11px;background:rgba(0,0,0,.5);font-size:12.5px;font-weight:700;color:#f6dccb;white-space:nowrap}
.intent i{width:22px;height:22px;flex:none;background:center/contain no-repeat}
.intent em{display:grid;place-items:center;min-width:21px;height:21px;padding:0 3px;border-radius:11px;background:#7d1a14;color:#fff;font:400 13px/1 var(--font-num);font-style:normal}
.intent.soon{box-shadow:inset 0 0 0 1.5px #ff5a3a}
.intent.soon em{background:#ff3b1f;animation:pulse .5s ease-in-out infinite}
.foe.hit .foe-pic{animation:foeHit .42s ease}
.foe.act .foe-pic{animation:foeAct .5s cubic-bezier(.3,1.6,.5,1)}
.foe.act .intent{animation:pulse .45s ease}
.foe.dead .intent,.foe.dead .hp-n{visibility:hidden}
.foe.target{box-shadow:inset 0 0 0 2px #ffd06a,0 0 12px rgba(255,200,90,.35)}
.foe.target .foe-pic::after{content:"";position:absolute;left:-5px;top:-5px;width:17px;height:17px;border-radius:50%;background:#2a1a08 var(--da-sword) center/80% no-repeat;box-shadow:0 0 0 1.5px #ffd06a}
.foe-pic{position:relative}
.foe.dead{opacity:.5}
.foe.dying .foe-pic{animation:foeDie .9s ease forwards}
@keyframes foeHit{0%{filter:brightness(3.2) saturate(0)}25%{transform:translateX(-5px) rotate(-8deg)}55%{transform:translateX(4px) rotate(5deg)}100%{transform:none;filter:none}}
@keyframes foeAct{0%{transform:none}40%{transform:scale(1.3) translateY(4px);filter:brightness(1.6)}100%{transform:none}}
@keyframes foeDie{0%{filter:brightness(3)}35%{transform:scale(1.2) rotate(-10deg)}100%{transform:scale(.3) rotate(25deg);opacity:0;filter:grayscale(1)}}
.foe .dmg{position:absolute;left:28px;top:-6px;z-index:2;font:400 19px/1 var(--font-num);color:#ffd06a;text-shadow:0 2px 0 #4a1a04,0 0 8px rgba(255,90,30,.85);pointer-events:none;animation:woolUp .8s ease-out forwards}
.slash{position:fixed;left:0;top:0;z-index:70;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,#fff 0 22%,#ffd06a 38%,rgba(255,110,40,.65) 58%,rgba(255,60,20,0) 72%);box-shadow:0 0 18px 7px rgba(255,120,40,.6)}
/* 烛火越少越暗；漆黑的时候牌上的图案全看不见，提灯照得见露着的牌 */
.shade{position:absolute;z-index:286;pointer-events:none;border-radius:22px;--a:0;opacity:1;transition:background .5s;
  background:radial-gradient(ellipse 75% 60% at 50% 45%,rgba(0,0,0,calc(var(--a) * .78)),rgba(0,0,0,var(--a)) 80%)}
.shade[hidden]{display:none}
.shade.flicker{animation:flicker 1.7s steps(1) infinite}
@keyframes flicker{0%,100%{opacity:1}12%{opacity:.55}16%{opacity:1}54%{opacity:.75}58%{opacity:1}}
.stage.dark .tile.onboard .art,.stage.dark .tile.onboard .badge{opacity:0;transition:opacity .35s}
.stage.dark.lamp .tile.onboard:not(.blocked) .art{opacity:1}
.stage.dark.lamp .shade{--a:.6!important}
/* 浓雾：一团团慢慢翻滚；雾里的牌看不清 */
.foglayer{position:absolute;inset:0;z-index:290;pointer-events:none}
.fog{position:absolute;border-radius:50%;pointer-events:none;filter:blur(8px);animation:fogIn .8s cubic-bezier(.2,.8,.3,1) both,fogRoll 7s ease-in-out infinite alternate;
  background:radial-gradient(circle at 40% 42%,rgba(196,208,216,.94) 0 26%,rgba(160,176,188,.82) 44%,rgba(130,146,158,.45) 60%,rgba(130,146,158,0) 72%),
    radial-gradient(circle at 68% 62%,rgba(222,230,236,.72) 0 18%,rgba(222,230,236,0) 44%),radial-gradient(circle at 28% 70%,rgba(184,196,206,.6) 0 16%,rgba(184,196,206,0) 40%)}
.fog.thin{opacity:.55;transition:opacity .5s}
.fog.bye{animation:fogOut .8s ease forwards}
.stage.lamp .fog{opacity:.6}
@keyframes fogIn{from{transform:scale(.25) rotate(var(--r,0deg));opacity:0}to{transform:scale(1) rotate(var(--r,0deg));opacity:1}}
@keyframes fogRoll{to{transform:scale(1.06) rotate(calc(var(--r,0deg) + 25deg)) translateX(3%)}}
@keyframes fogOut{to{transform:scale(1.35);opacity:0}}
.stage .tile.fogged .art,.stage .tile.fogged .badge{opacity:0}
.stage.lamp .tile.fogged:not(.blocked) .art{opacity:1}
/* 岩浆：从一条边往里漫，前沿发光 */
.zone .lava{position:absolute;pointer-events:none;transition:height .55s cubic-bezier(.3,.7,.3,1),width .55s cubic-bezier(.3,.7,.3,1);
  background:radial-gradient(circle at 20% 30%,rgba(255,230,140,.95) 0 5%,rgba(255,230,140,0) 11%) 0 0/54px 54px,
    radial-gradient(circle at 70% 60%,rgba(255,170,60,.9) 0 8%,rgba(255,170,60,0) 15%) 0 0/76px 66px,
    linear-gradient(var(--lv,180deg),#5a0a04,#c3260f 45%,#ff7a1f);animation:lavaFlow 2.6s linear infinite}
.zone .lava[hidden]{display:none}
.lava.e-top{left:0;right:0;top:0;height:var(--d);--lv:0deg;box-shadow:0 4px 16px 4px rgba(255,100,20,.8)}
.lava.e-bottom{left:0;right:0;bottom:0;height:var(--d);--lv:180deg;box-shadow:0 -4px 16px 4px rgba(255,100,20,.8)}
.lava.e-left{top:0;bottom:0;left:0;width:var(--d);--lv:-90deg;box-shadow:4px 0 16px 4px rgba(255,100,20,.8)}
.lava.e-right{top:0;bottom:0;right:0;width:var(--d);--lv:90deg;box-shadow:-4px 0 16px 4px rgba(255,100,20,.8)}
@keyframes lavaFlow{to{background-position:54px 27px,-76px 33px,0 0}}
.stage .tile.gone.melt .face{animation:melt .65s ease-in forwards}
@keyframes melt{0%{filter:sepia(1) saturate(5) brightness(1.4) hue-rotate(-25deg)}100%{transform:translateY(12px) scale(.3) rotate(28deg);opacity:0;filter:sepia(1) saturate(6) brightness(1.8) hue-rotate(-25deg)}}
.stage .tile.scorch .face{animation:scorch .8s ease-in-out infinite}
@keyframes scorch{50%{transform:translateY(-1px) rotate(-1.5deg);box-shadow:0 0 0 2px rgba(255,100,30,.9),0 0 14px 4px rgba(255,80,20,.65)}}
/* 锁住的牌：一把锁加两道铁链 */
.stage .tile.chained .face::before{content:"";position:absolute;inset:-4%;z-index:3;pointer-events:none;
  background:var(--da-lock) 50% 52%/46% no-repeat,linear-gradient(35deg,transparent 0 44%,rgba(190,198,215,.95) 44% 50%,rgba(90,96,110,.95) 50% 54%,transparent 54%),
    linear-gradient(-35deg,transparent 0 44%,rgba(190,198,215,.95) 44% 50%,rgba(90,96,110,.95) 50% 54%,transparent 54%)}
.stage .tile.clank .face{animation:nope .3s ease}
/* 上一层塌下来的碎牌：有裂纹，颜色发灰 */
:root[data-hell] .stage .tile.rubble .face{background:linear-gradient(118deg,transparent 0 47%,rgba(50,34,26,.55) 47% 49%,transparent 49%),linear-gradient(64deg,transparent 0 63%,rgba(50,34,26,.45) 63% 64.6%,transparent 64.6%),
  radial-gradient(circle at 28% 18%,var(--tile-hi),rgba(255,255,255,0) 58%),radial-gradient(circle at 72% 88%,rgba(0,0,0,.18),rgba(0,0,0,0) 60%),#c9bba7}
/* 蝙蝠窝、棺材的记号：牌的左上角 */
.badge{position:absolute;left:-9%;top:-9%;z-index:2;width:44%;height:44%;border-radius:50%;pointer-events:none;
  background:#1a0f0f center/78% no-repeat;box-shadow:0 0 0 1.5px rgba(255,110,60,.75),0 0 8px 2px rgba(255,60,20,.5)}
.badge[hidden]{display:none}
.tile.blocked .badge{filter:brightness(2.2)}
/* 扑出来的蝙蝠 */
.batfx{position:absolute;z-index:296;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;background:var(--da-bats) center/contain no-repeat;animation:batFly .95s cubic-bezier(.3,.6,.4,1) both}
@keyframes batFly{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.15);opacity:0}}
/* 地狱犬喷火：烧着的牌冒火苗、右下角写着还剩几步；烧完变灰没了 */
.stage .tile.burning .face{box-shadow:0 0 0 2px rgba(255,120,40,.95),0 0 14px 5px rgba(255,80,20,.75)!important;animation:scorch .5s ease-in-out infinite}
.stage .tile.burning .face::after{content:"";position:absolute;left:8%;right:8%;top:-34%;height:62%;z-index:3;pointer-events:none;background:var(--da-flame) 50% 100%/62% no-repeat;transform-origin:50% 100%;animation:lick .45s steps(2) infinite}
@keyframes lick{50%{transform:scaleY(1.18) scaleX(.9)}}
.burnc{position:absolute;right:-8%;bottom:-8%;z-index:4;display:grid;place-items:center;width:40%;height:40%;border-radius:50%;pointer-events:none;
  background:#ff5a1f;color:#fff;font:400 calc(var(--ts) * .24)/1 var(--font-num);box-shadow:0 0 0 1.5px #5a1206,0 0 8px 2px rgba(255,90,30,.8)}
.burnc[hidden]{display:none}
.stage .tile.gone.ash .face{animation:ash .75s ease-in forwards}
@keyframes ash{0%{filter:brightness(1.8) sepia(1) saturate(5) hue-rotate(-20deg)}35%{filter:brightness(.35) grayscale(1)}100%{transform:translateY(-10px) scale(.55);opacity:0;filter:brightness(.25) grayscale(1)}}
.breath{position:absolute;z-index:297;pointer-events:none;border-radius:40%;filter:blur(3px);
  background:linear-gradient(90deg,rgba(255,60,10,0),rgba(255,90,20,.85) 20%,rgba(255,200,90,.95) 50%,rgba(255,90,20,.85) 80%,rgba(255,60,10,0));animation:breath .85s cubic-bezier(.3,.6,.4,1) both}
@keyframes breath{0%{clip-path:inset(0 100% 0 0);opacity:1}45%{clip-path:inset(0 0 0 0);opacity:1}100%{clip-path:inset(0 0 0 0);opacity:0}}
/* 深渊规则：四页 */
.rules-tabs{position:sticky;top:-22px;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:0 0 10px;padding:3px;border-radius:12px;background:var(--paper);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 6px 10px -6px rgba(0,0,0,.6)}
.rules-tabs button{border:0;border-radius:9px;padding:8px 0;background:none;color:var(--paper-soft);font:700 14px/1 var(--font-body);cursor:pointer;touch-action:manipulation}
.rules-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rules-tabs button:focus-visible{outline:2px solid var(--paper-ink);outline-offset:1px}
.rules-pane{text-align:left}
.rules-pane .rules-note{margin:0 0 6px;font-size:12.5px;line-height:1.55}
.rules-pane h4{margin:12px 0 2px;font:900 14px/1.2 "Noto Serif SC",serif;letter-spacing:.14em;color:var(--paper-ink)}
.rule-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--ghost-line,rgba(127,127,127,.2))}
.rule-row > i{width:36px;height:36px;flex:none;border-radius:9px;background:#251f21 center/78% no-repeat;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5)}
.rule-row > div{min-width:0}
.rule-row b{display:block;font-size:14px;line-height:1.35;color:var(--paper-ink)}
.rule-row small{display:block;margin-top:2px;font-size:12.5px;line-height:1.5;color:var(--paper-soft)}
.rule-row.owned b{color:#ffd06a}
.rule-move{display:flex;gap:5px;align-items:flex-start;margin-top:3px;font-size:12.5px;line-height:1.45;color:var(--paper-soft)}
.rule-move i{width:17px;height:17px;flex:none;margin-top:1px;background:center/contain no-repeat}
.rule-row > i.mini-rubble{background:linear-gradient(118deg,transparent 0 47%,rgba(50,34,26,.7) 47% 50%,transparent 50%),linear-gradient(64deg,transparent 0 62%,rgba(50,34,26,.6) 62% 64.5%,transparent 64.5%),#c9bba7;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 3px 0 #6e5a44}
/* 钻洞的老鼠 */
.ratfx{position:absolute;z-index:296;width:24px;height:24px;margin:-12px 0 0 -12px;pointer-events:none;background:var(--da-mouse) center/contain no-repeat;animation:ratRun .75s cubic-bezier(.4,0,.6,1) both}
@keyframes ratRun{0%{transform:translate(0,0);opacity:0}12%{opacity:1}35%{transform:translate(calc(var(--dx) * .35),-4px)}65%{transform:translate(calc(var(--dx) * .65),3px)}88%{opacity:1}100%{transform:translate(var(--dx),0);opacity:0}}
/* 掉下去的时候不画这些 */
body.diving .foglayer,body.diving .shade,body.diving .batfx,body.diving .ratfx,body.diving .breath{display:none}
.ic-19{background-image:var(--ic-19)}.ic-20{background-image:var(--ic-20)}
.ic-19{--ch:"骨"}.ic-20{--ch:"土"}
/* 房间：宝箱、黑市、篝火 */
.room{position:absolute;z-index:320;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 10px 10px;border-radius:20px;overflow:auto;
  background:var(--paper);color:var(--paper-ink);text-align:center;box-shadow:0 8px 0 var(--paper-edge),0 8px 0 1px rgba(0,0,0,.3),0 22px 44px rgba(0,0,0,.4);
  transform-origin:50% 100%;transition:transform .65s cubic-bezier(.5,0,.7,.4),opacity .55s}
.room.driven{transition:none}
.room-head h3{margin:0;font:400 26px/1.1 var(--font-display);letter-spacing:.08em}
.room-head p{margin:2px 0 0;font-size:12.5px;color:var(--paper-soft);line-height:1.45}
.chest,.fire{width:46px;height:46px;flex:none;border:0;background:center/contain no-repeat;cursor:pointer}
.r-camp{gap:6px}
.r-camp .room-head{display:flex;align-items:center;gap:10px;text-align:left}
.r-camp .room-head h3{font-size:22px}
.shop-note{margin:2px 0 -2px;font-size:12px;color:var(--paper-soft)}
.r-camp .card small{-webkit-line-clamp:2}
.r-camp .card i{width:28px;height:28px}
.r-camp .exit i{width:42px;height:42px}
.chest{animation:hop 1s ease-in-out infinite}
.fire{animation:pulse 1.4s ease-in-out infinite}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 3px 7px;border:0;border-radius:12px;cursor:pointer;touch-action:manipulation;
  background:var(--tile);color:var(--paper-ink);font:inherit;box-shadow:0 3px 0 var(--paper-edge),0 3px 0 1px rgba(0,0,0,.12);animation:rise .3s cubic-bezier(.2,.8,.3,1) both}
.card i{width:34px;height:34px;flex:none;background:center/contain no-repeat}
.card b{font-size:13px}
.card small{font-size:10.5px;line-height:1.3;color:var(--paper-soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dialog .card small{-webkit-line-clamp:4}
.card .price{margin-top:2px;padding:2px 8px;border-radius:999px;background:var(--paper-ink);color:var(--paper);font:400 11px/1.3 var(--font-num)}
.card:disabled{cursor:default;opacity:.45}
.card.sold{visibility:hidden}
.card:focus-visible{outline:3px solid var(--paper-ink);outline-offset:2px}
.dialog .cards{margin-top:2px}
.boss-pic{display:block;width:104px;height:104px;margin:0 auto;border-radius:50%;background:#f5ead2 center/72% no-repeat;box-shadow:inset 0 0 0 4px var(--paper-edge);animation:hop 1.1s ease-in-out infinite}
.room-skip{border:0;background:none;color:var(--paper-soft);font:700 13px/1.2 var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.camp-opts{display:flex;gap:8px;width:100%}
.camp-opts .btn{flex:1;min-height:40px;padding:6px 8px;font-size:13.5px}
.room .btn:disabled{opacity:.42;cursor:default;box-shadow:none;transform:none}
.exits{display:flex;gap:22px;justify-content:center;flex:none;margin-top:auto}
.exit{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;color:var(--paper-ink);font:700 13px/1.2 var(--font-body)}
.exit i{width:50px;height:50px;border-radius:16%;background:var(--k) center/46% no-repeat,radial-gradient(circle at 50% 50%,#2a1a0c 0 32%,#6b4316 33% 37%,rgba(0,0,0,0) 38%),linear-gradient(155deg,#ffd862,#eba51f);
  box-shadow:inset 0 0 0 1.5px rgba(160,95,0,.45),0 5px 0 #b8781b}
.exit:active i{transform:translateY(3px);box-shadow:inset 0 0 0 1.5px rgba(160,95,0,.45),0 2px 0 #b8781b}
.exit:focus-visible i{outline:3px solid var(--paper-ink);outline-offset:3px}
/* 消一组飘出来的灵魂数、鼠群跑过的风 */
.woolfx{position:absolute;z-index:960;pointer-events:none;font:400 16px/1 var(--font-num);color:#ffd862;text-shadow:0 2px 0 #7a4b0a;animation:woolUp .9s ease-out forwards}
@keyframes woolUp{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
.gust{position:absolute;z-index:700;pointer-events:none;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 48%,transparent 66%) no-repeat;background-size:60% 100%;animation:gust .8s ease-out forwards}
@keyframes gust{from{background-position:-80% 0;opacity:1}to{background-position:180% 0;opacity:.2}}

/* ---------- 深渊的暗色：进了这个模式整页都换掉，越往下越红 ---------- */
:root[data-hell]{
  color-scheme:dark;
  --bg:#0a0909;--ink:#e8dccb;--ink-soft:#9d9284;
  --tile:#e3dccd;--tile-hi:rgba(255,255,255,.16);--tile-edge:#6c6356;--tile-side:#8e8474;--dim:brightness(.42) saturate(.4);
  --btn:#262123;--btn-ink:#e8dccb;--btn-soft:#b3a593;--btn-edge:#0c0a0b;
  --tray:#1b1617;--tray-2:#0e0b0c;--tray-line:rgba(160,150,135,.45);--tray-cell:rgba(0,0,0,.4);
  --thread:#9d9284;--track:rgba(232,220,203,.12);
  --accent:#8f1d18;--accent-deep:#430b09;--accent-ink:#f6e7d2;
  --badge:#a3382a;--badge-ink:#f6e7d2;
  --paper:#1b1718;--paper-ink:#eadfcd;--paper-soft:#a99c8c;--paper-edge:#050404;
  --ghost-line:rgba(234,223,205,.22);--scrim:rgba(0,0,0,.74);--focus:#e0563a;
  --pip-off:rgba(232,220,203,.28);--pip-on:#d4532f;--warn:#ff4a2a;--warn-ink:#ff9c84;
  --bed:rgba(0,0,0,.35);--shelf:rgba(163,56,42,.6);--toast:#1e0807;--toast-ink:#f3e2cc;
  --brand-shadow:0 0 14px rgba(200,40,20,.6),0 3px 0 #000;
}
/* 地窖：烛光的暖黄 */
:root[data-hell="0"]{--thread:#e0a24a;--pip-on:#f0b860;--tray-line:rgba(224,162,74,.5);--tile:#e6dccb;--tile-edge:#6e5a44;--tile-side:#8a7358;--brand-shadow:0 0 14px rgba(255,160,60,.45),0 3px 0 #000}
/* 墓穴：冷的骨白和青灰 */
:root[data-hell="1"]{--thread:#9fd8d0;--pip-on:#a8e3da;--tray-line:rgba(150,210,200,.45);--tile:#dcdcd6;--tile-edge:#556066;--tile-side:#76838a;--brand-shadow:0 0 14px rgba(150,210,220,.45),0 3px 0 #000}
/* 地狱：火光 */
:root[data-hell="2"]{--thread:#e0502a;--pip-on:#ff6a3a;--tray-line:rgba(230,80,40,.65);--tile:#e5cdb5;--tile-edge:#6b2a1a;--tile-side:#8c3c24;--bg:#0b0303}
/* 深渊 */
:root[data-hell="3"]{--thread:#ff3b1f;--pip-on:#ff3b1f;--tray-line:rgba(255,50,20,.75);--tile:#dcc3ab;--tile-edge:#4a120a;--tile-side:#6b1c10;--bg:#050101}
:root[data-hell] .face{background:radial-gradient(circle at 28% 18%,var(--tile-hi),rgba(255,255,255,0) 58%),radial-gradient(circle at 72% 88%,rgba(0,0,0,.14),rgba(0,0,0,0) 60%),var(--tile);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.35),0 calc(var(--ts) * .07) 0 var(--tile-edge),0 calc(var(--ts) * .07 + 1.5px) 0 rgba(0,0,0,.75)}
:root[data-hell] .tile .art{filter:saturate(.78) contrast(1.04)}
:root[data-hell] .brand,:root[data-hell] .dialog h2,:root[data-hell] .room-head h3{font-family:"Noto Serif SC",serif;font-weight:900;letter-spacing:.1em}
:root[data-hell] .brand{color:#eadbc3;min-width:0;overflow:hidden;font-size:clamp(15px,4.3vw,26px);letter-spacing:.02em}
:root[data-hell] .lvl b{color:#ff7a55}
:root[data-hell] .trough{background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 6px),linear-gradient(180deg,var(--tray),var(--tray-2));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 6px 0 #000,0 14px 26px rgba(0,0,0,.6)}
:root[data-hell] .dg-relic{background-color:#2e2729}
:root[data-hell] .card{background:#2a2426;color:var(--paper-ink);box-shadow:0 3px 0 #000,0 3px 0 1px rgba(255,255,255,.04)}
:root[data-hell] .card .price{background:#8f1d18;color:#f6e7d2}
:root[data-hell] .room{box-shadow:0 8px 0 #000,0 0 0 1px rgba(255,255,255,.05),0 22px 44px rgba(0,0,0,.7)}
:root[data-hell] .exit i{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.55),0 0 14px 2px rgba(255,70,20,.35),0 5px 0 #241309;
  background:var(--k) center/46% no-repeat,radial-gradient(circle at 50% 50%,#050101 0 30%,rgba(255,80,30,.85) 33%,#5a1a10 37%,rgba(0,0,0,0) 40%),linear-gradient(155deg,#9a6a35,#3d2414)}
:root[data-hell] .boss-pic{background-color:#2a2426;box-shadow:inset 0 0 0 4px #000,0 0 24px 4px rgba(255,40,10,.45)}
:root[data-hell] .toast{top:calc(6px + env(safe-area-inset-top,0px));border-radius:14px;padding:7px 14px;font-size:13px;line-height:1.45;box-shadow:0 0 0 1px rgba(255,90,40,.35),0 8px 24px rgba(0,0,0,.6)}
:root[data-hell] .woolfx{color:#ffd06a;text-shadow:0 2px 0 #4a1a04,0 0 8px rgba(255,120,40,.6)}
/* 主菜单里深渊那一项：不管在哪个模式，都是一块黑底红边的牌子 */
.home-list .home-item.hell-item{background:radial-gradient(120% 140% at 50% 120%,rgba(160,30,15,.45),rgba(0,0,0,0) 60%),#140c0c;color:#eadbc3;box-shadow:inset 0 0 0 2px #5a1712,0 4px 0 #000}
.home-list .home-item.hell-item span:first-child{font:900 24px/1.1 "Noto Serif SC",serif;letter-spacing:.4em;text-indent:.4em;color:#f0dcc0;text-shadow:0 0 10px rgba(255,60,20,.5)}
.home-list .home-item.hell-item .hi-sub{color:#c9a99a}
.home-list .home-item.hell-item.primary{box-shadow:inset 0 0 0 2px #b8442e,0 4px 0 #000}
/* 整页的底：地窖的灰尘、墓穴的冷光、地狱的火光 */
.hellfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.hellfx[hidden]{display:none}
.hellfx::before{content:"";position:absolute;inset:-30% -10%}
.hellfx.z0::before{background:radial-gradient(circle,rgba(255,200,120,.32) 0 1px,transparent 1.8px) 0 0/80px 110px,radial-gradient(circle,rgba(255,200,120,.2) 0 1px,transparent 1.6px) 40px 55px/80px 110px;animation:dustFall 22s linear infinite}
.hellfx.z1::before{background:radial-gradient(circle,rgba(170,215,225,.32) 0 1.4px,transparent 2.4px) 0 0/120px 150px;animation:wispUp 24s linear infinite}
.hellfx.z2::before,.hellfx.z3::before{background:radial-gradient(circle,rgba(255,140,50,.75) 0 1.3px,transparent 2.3px) 0 0/90px 120px,radial-gradient(circle,rgba(255,80,20,.55) 0 1px,transparent 2px) 45px 60px/90px 120px;animation:emberUp 7s linear infinite}
/* ---- 动效 ---- */
.tile.flying{z-index:900!important;transition:none!important}
.spark{position:absolute;z-index:950;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;pointer-events:none}
.spark.confetti{width:8px;height:12px;margin:-6px 0 0 -4px;border-radius:2px}
:root[data-skin="pixel"] .spark,:root[data-skin="bauhaus"] .spark,:root[data-skin="type"] .spark{border-radius:0}
.trough.shake{animation:shake .42s ease}
/* 每日挑战「少一格」：第 7 格用线缝死；「定时炸弹」炸坏的格子是焦黑的 */
#trough i.dead{opacity:.75;background:linear-gradient(45deg,transparent 44%,var(--tray-line) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--tray-line) 44% 56%,transparent 56%),var(--tray-cell);box-shadow:none}
.tool .n.bump{animation:bump .35s cubic-bezier(.3,1.6,.5,1)}
.dlg-actions .btn{animation:rise .32s cubic-bezier(.2,.8,.3,1) both;animation-delay:calc(var(--i, 0) * 55ms + 120ms)}
@media (hover:hover){
  .tile.onboard:not(.blocked):hover .face{translate:0 -2px}
}


/* 道具 */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;
  background:var(--btn);color:var(--btn-ink);box-shadow:0 5px 0 var(--btn-edge),0 5px 0 1px rgba(0,0,0,.3);
  font-family:var(--font-display);font-size:18px;line-height:1.1;letter-spacing:.1em}
.tool svg{width:24px;height:24px;fill:none;stroke:var(--btn-soft);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--btn-edge),0 2px 0 1px rgba(0,0,0,.3)}
.tool .n{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;display:grid;place-items:center;
  background:var(--badge);color:var(--badge-ink);font:400 12px/1 var(--font-num);letter-spacing:0;box-shadow:0 0 0 2.5px var(--bg)}
.tool:disabled{cursor:default;opacity:.42;filter:grayscale(.8)}
.tool:disabled .n{display:none}

/* 弹窗 */
/* 主菜单：盖在牌桌上，背后的牌桌虚化 */
.home{position:fixed;inset:0;z-index:45;display:grid;place-items:center;overflow:auto;padding:24px 16px;
  padding-block:calc(24px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--scrim);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.home-card{width:min(360px,100%);padding:22px 22px 18px;border-radius:20px;background:var(--paper);color:var(--paper-ink);text-align:center;
  box-shadow:0 8px 0 var(--paper-edge),0 8px 0 1px rgba(0,0,0,.3),0 22px 44px rgba(0,0,0,.45);animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}
.home-title{margin:4px 0 2px;font:400 46px/1.05 var(--font-display);letter-spacing:.08em}
.dialog .home-sub,.home-sub{margin:0 0 18px;color:var(--paper-soft);font-size:14px}
.home-list{display:flex;flex-direction:column;gap:10px}
.home-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:100%}
.home-item .hi-sub{font-size:12.5px;font-weight:400;line-height:1.45;opacity:.85;text-wrap:balance}
.home-foot{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:16px}
.home-foot button{padding:7px 14px;border:0;border-radius:999px;background:transparent;color:var(--paper-soft);font:700 14px/1.2 var(--font-body);box-shadow:inset 0 0 0 1.5px var(--ghost-line);cursor:pointer}
.home-foot button:focus-visible,.home-item:focus-visible{outline:3px solid var(--paper-ink);outline-offset:2px}
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px 16px;background:var(--scrim)}
.dialog{position:relative;width:min(350px,100%);max-height:100%;overflow:auto;padding:22px 22px 20px;border-radius:18px;background:var(--paper);color:var(--paper-ink);text-align:center;
  box-shadow:0 8px 0 var(--paper-edge),0 8px 0 1px rgba(0,0,0,.3),0 22px 44px rgba(0,0,0,.45);animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}
.dlg-art{display:grid;place-items:center;margin-bottom:4px}
.dlg-art .art{position:static;display:block;width:88px;height:88px}
.dlg-art .hop{animation:hop .9s ease-in-out infinite}
.dlg-art .sad{transform:rotate(-12deg) translateY(4px);filter:saturate(.6)}
.dlg-art .herd{display:flex;align-items:flex-end;gap:2px}
.dlg-art .herd .art{width:48px;height:48px;animation:hop .8s ease-in-out infinite;animation-delay:calc(var(--k, 0) * 120ms)}
.dlg-art .herd .art:nth-child(3){width:64px;height:64px}
:root[data-skin="type"] .dlg-art .herd .art{width:40px;height:48px;font-size:36px!important}
:root[data-skin="type"] .dlg-art .herd .art:nth-child(3){width:52px;height:64px;font-size:48px!important}
.final-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.final-stats div{display:flex;flex-direction:column;gap:2px;padding:7px 4px;border-radius:8px;box-shadow:inset 0 0 0 1.5px var(--ghost-line)}
.final-stats span{font-size:12px;color:var(--paper-soft)}
.final-stats b{font:400 14px/1 var(--font-num);color:var(--paper-ink);font-variant-numeric:tabular-nums}
:root[data-skin="pixel"] .final-stats div,:root[data-skin="bauhaus"] .final-stats div,:root[data-skin="type"] .final-stats div{border-radius:0}
.dialog h2{margin:2px 0 8px;font:400 29px/1.15 var(--font-display);letter-spacing:.06em;text-wrap:balance}
.dialog p{margin:0 0 16px;color:var(--paper-soft);line-height:1.65}
.dialog ul{margin:0 0 16px;padding-left:1.2em;text-align:left;color:var(--paper-soft);line-height:1.65;display:flex;flex-direction:column;gap:6px}
.dlg-extra{margin:0 0 16px}
/* 每日挑战排行榜 */
.board-tabs{display:flex;justify-content:center;gap:6px;margin:0 0 10px}
.board-tabs button{padding:6px 16px;border:0;border-radius:999px;background:transparent;color:var(--paper-soft);font:700 14px/1.2 var(--font-body);box-shadow:inset 0 0 0 1.5px var(--ghost-line);cursor:pointer}
.board-tabs button[aria-pressed="true"]{background:var(--paper-ink);color:var(--paper);box-shadow:none}
.dialog .board-note{margin:0 0 8px;font-size:13px;line-height:1.5}
.board-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:min(42vh,330px);overflow:auto;text-align:left}
.board-list li{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto auto;align-items:baseline;gap:8px;padding:8px 10px;border-radius:9px;box-shadow:inset 0 0 0 1.5px var(--ghost-line);font-variant-numeric:tabular-nums}
.board-list .rk{font:400 15px/1 var(--font-num);color:var(--paper-soft);text-align:center}
.board-list li:nth-child(-n+3) .rk{color:var(--accent)}
.board-list .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--paper-ink)}
.board-list .tm{font:400 15px/1 var(--font-num);color:var(--paper-ink)}
.board-list .mv{min-width:3.2em;text-align:right;font-size:12px;color:var(--paper-soft)}
.board-list li.me{background:var(--paper-ink);box-shadow:none}
.board-list li.me .rk,.board-list li.me .nm,.board-list li.me .tm,.board-list li.me .mv{color:var(--paper)}
.board-list li.gap{display:block;padding:0;box-shadow:none;text-align:center;color:var(--paper-soft)}
.board-link{margin:10px 0 0;padding:4px;border:0;background:none;color:var(--paper-soft);font:700 13px/1.2 var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.name-field{display:block;width:100%;box-sizing:border-box;padding:11px 12px;border:0;border-radius:10px;background:var(--tile);color:var(--paper-ink);font:700 17px/1.2 var(--font-body);text-align:center;box-shadow:inset 0 0 0 1.5px var(--ghost-line)}
.name-field:focus-visible{outline:3px solid var(--paper-ink);outline-offset:2px}
.dialog .name-err{margin:8px 0 0;min-height:1.3em;font-size:13px;color:var(--accent)}
.dlg-actions{position:relative;display:flex;flex-direction:column;gap:10px}
.btn{position:relative;border:0;border-radius:12px;padding:12px 14px;font:700 16px/1.25 var(--font-body);cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.ghost{background:transparent;color:var(--paper-ink);box-shadow:inset 0 0 0 2px var(--ghost-line)}

/* 换风格 */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin-opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 10px;border:0;border-radius:12px;background:transparent;color:var(--paper-ink);
  box-shadow:inset 0 0 0 2px var(--ghost-line);cursor:pointer;touch-action:manipulation}
.skin-opt[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
.sw{display:grid;place-items:center;width:100%;height:66px;margin-bottom:4px;border-radius:8px}
.sw-tile{display:grid;place-items:center;width:44px;height:44px}
.sw-tile img{display:block;width:80%;height:80%}
.sk-name{font-weight:700;font-size:15px}
.sk-desc{font-size:12px;line-height:1.4;color:var(--paper-soft)}

.toast{position:fixed;left:50%;top:calc(116px + env(safe-area-inset-top,0px));z-index:60;max-width:calc(100% - 32px);
  transform:translate(-50%,-12px);opacity:0;pointer-events:none;padding:8px 16px;border-radius:999px;
  background:var(--toast);color:var(--toast-ink);border:0;box-shadow:0 8px 20px rgba(0,0,0,.35);
  font-size:14px;font-weight:700;text-align:center;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- 掌机的形状：全部方角、硬投影，被压住的牌用网点而不是变暗 ---- */
:root[data-skin="pixel"] .face{border-radius:0;box-shadow:inset 0 0 0 2px #1c3318,inset 4px 4px 0 rgba(255,255,255,.4),inset -4px -4px 0 rgba(28,51,24,.16),3px 3px 0 #1c3318}
:root[data-skin="pixel"] .tile.blocked .face::after{content:"";position:absolute;inset:0;
  background:conic-gradient(#1c3318 25%,transparent 0 50%,#1c3318 0 75%,transparent 0) 0 0/4px 4px;opacity:.5}
:root[data-skin="pixel"] .art{image-rendering:pixelated}
:root[data-skin="pixel"] .lvl,:root[data-skin="pixel"] .icon-btn{border-radius:0;box-shadow:inset 0 0 0 2px #1c3318,3px 3px 0 #1c3318}
:root[data-skin="pixel"] .icon-btn:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 2px #1c3318,1px 1px 0 #1c3318}
:root[data-skin="pixel"] .tool{border-radius:0;box-shadow:inset 0 0 0 2px #1c3318,4px 4px 0 #1c3318}
:root[data-skin="pixel"] .tool:active:not(:disabled){transform:translate(3px,3px);box-shadow:inset 0 0 0 2px #1c3318,1px 1px 0 #1c3318}
:root[data-skin="pixel"] .tool .n,:root[data-skin="pixel"] .pips i,:root[data-skin="pixel"] .toast,:root[data-skin="pixel"] .bed,
:root[data-skin="pixel"] .shelf,:root[data-skin="pixel"] .btn,:root[data-skin="pixel"] .skin-opt,:root[data-skin="pixel"] .sw{border-radius:0}
:root[data-skin="pixel"] .trough{border-radius:0;background:var(--tray);box-shadow:inset 0 0 0 3px #1c3318,4px 4px 0 #1c3318}
:root[data-skin="pixel"] .trough::before{display:none}
:root[data-skin="pixel"] .trough i{border-radius:0;background:var(--tray-cell);box-shadow:inset 0 0 0 2px rgba(28,51,24,.3)}
:root[data-skin="pixel"] .dialog{border-radius:0;box-shadow:inset 0 0 0 3px #1c3318,6px 6px 0 #1c3318}
:root[data-skin="pixel"] .btn.primary{box-shadow:4px 4px 0 rgba(28,51,24,.35)}
:root[data-skin="pixel"] .needle{display:none}
:root[data-skin="pixel"] .sewn{height:6px;margin-top:-3px;border-radius:0;background:repeating-linear-gradient(90deg,var(--thread) 0 6px,transparent 6px 8px)}
:root[data-skin="pixel"] .meter.hot .pips i.on{animation:blink .6s steps(1) infinite}


/* ---- 孔版的形状：纸片 + 蓝线框 + 粉色错位的影子 ---- */
:root[data-skin="riso"] .face{border-radius:10%;background:var(--tile);box-shadow:inset 0 0 0 1.5px #0078bf,3px 3px 0 #ff48b0}
:root[data-skin="riso"] .brand{font-weight:900;letter-spacing:.02em}
:root[data-skin="riso"] .dialog h2{font-weight:900;letter-spacing:.02em;text-shadow:2px 2px 0 rgba(255,72,176,.7)}
:root[data-skin="riso"] .tool{font-weight:900;letter-spacing:.04em;border-radius:10px;box-shadow:inset 0 0 0 1.5px #0078bf,4px 4px 0 #ff48b0}
:root[data-skin="riso"] .tool:active:not(:disabled){transform:translate(3px,3px);box-shadow:inset 0 0 0 1.5px #0078bf,1px 1px 0 #ff48b0}
:root[data-skin="riso"] .lvl{background:#ff48b0;color:#141844;border-radius:3px;box-shadow:3px 3px 0 #0078bf}
:root[data-skin="riso"] .lvl b{color:#141844}
:root[data-skin="riso"] .icon-btn{box-shadow:inset 0 0 0 1.5px #0078bf,3px 3px 0 #ff48b0}
:root[data-skin="riso"] .icon-btn:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 1.5px #0078bf,1px 1px 0 #ff48b0}
:root[data-skin="riso"] .trough{border-radius:10px;background:radial-gradient(circle,rgba(255,255,255,.22) 1px,rgba(255,255,255,0) 1.6px) 0 0/6px 6px,var(--tray);box-shadow:5px 5px 0 #ff48b0}
:root[data-skin="riso"] .trough::before{border:2px solid var(--tray-line);border-radius:8px;transform:translate(2px,1px)}
:root[data-skin="riso"] .trough i{border-radius:6px;background:var(--tray-cell);box-shadow:none}
:root[data-skin="riso"] .dialog{border-radius:12px;box-shadow:inset 0 0 0 2px #0078bf,7px 7px 0 #ff48b0}
:root[data-skin="riso"] .btn.primary{box-shadow:4px 4px 0 #0078bf}
:root[data-skin="riso"] .toast{border-radius:6px;box-shadow:4px 4px 0 #ff48b0}
:root[data-skin="riso"] .needle{display:none}
:root[data-skin="riso"] .sewn{height:5px;margin-top:-2.5px;border-radius:0;background:var(--thread);box-shadow:2px 1px 0 rgba(0,120,191,.6)}

/* ================= 前卫三套 ================= */

/* 构成：包豪斯 / 构成主义，只用红黄蓝黑和几何形 */
:root[data-skin="bauhaus"]{
  color-scheme:light;
  --bg:#e9e7e1;
  --ink:#151515;
  --ink-soft:#3d3d3d;
  --tile:#ffffff;
  --tile-hi:rgba(255,255,255,0);
  --dim:none;
  --btn:#ffffff;
  --btn-ink:#151515;
  --btn-soft:#151515;
  --btn-edge:#151515;
  --tray:#151515;
  --tray-2:#151515;
  --tray-line:#d6322b;
  --tray-cell:rgba(255,255,255,.06);
  --thread:#151515;
  --track:rgba(21,21,21,.25);
  --accent:#d6322b;
  --accent-deep:#151515;
  --accent-ink:#fff;
  --badge:#151515;
  --badge-ink:#fff;
  --paper:#ffffff;
  --paper-ink:#151515;
  --paper-soft:#3d3d3d;
  --paper-edge:#151515;
  --ghost-line:#151515;
  --scrim:rgba(21,21,21,.45);
  --focus:#1e4fa3;
  --pip-off:rgba(21,21,21,.35);
  --pip-on:#151515;
  --warn:#d6322b;
  --warn-ink:#d6322b;
  --bed:rgba(21,21,21,.05);
  --shelf:#151515;
  --toast:#151515;
  --toast-ink:#fff;
  --brand-shadow:none;
  --font-display:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
/* 铅字：不要图，只要字；纯黑白 */
:root[data-skin="type"]{
  color-scheme:light;
  --bg:#f3f3f0;
  --ink:#111111;
  --ink-soft:#4a4a4a;
  --tile:#ffffff;
  --tile-hi:rgba(255,255,255,0);
  --dim:contrast(.35) brightness(1.3);
  --btn:#ffffff;
  --btn-ink:#111111;
  --btn-soft:#111111;
  --btn-edge:#111111;
  --tray:#111111;
  --tray-2:#111111;
  --tray-line:#ffffff;
  --tray-cell:rgba(255,255,255,.07);
  --thread:#111111;
  --track:rgba(17,17,17,.25);
  --accent:#111111;
  --accent-deep:#5a5a5a;
  --accent-ink:#ffffff;
  --badge:#111111;
  --badge-ink:#ffffff;
  --paper:#ffffff;
  --paper-ink:#111111;
  --paper-soft:#4a4a4a;
  --paper-edge:#111111;
  --ghost-line:#111111;
  --scrim:rgba(17,17,17,.45);
  --focus:#111111;
  --pip-off:rgba(17,17,17,.3);
  --pip-on:#111111;
  --warn:#111111;
  --warn-ink:#111111;
  --bed:rgba(17,17,17,.04);
  --shelf:#111111;
  --toast:#111111;
  --toast-ink:#ffffff;
  --brand-shadow:none;
  --font-display:"Noto Serif SC","Songti SC","SimSun",serif;
}

/* ---- 构成的形状 ---- */
:root[data-skin="bauhaus"] .face{border-radius:0;box-shadow:inset 0 0 0 2.5px #151515,4px 4px 0 #151515}
:root[data-skin="bauhaus"] .tile.blocked .face::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(21,21,21,.6) 0 2px,rgba(21,21,21,0) 2px 6px)}
:root[data-skin="bauhaus"] .brand{font-weight:900;letter-spacing:0;transform:rotate(-4deg);padding-bottom:5px;
  background:linear-gradient(#d6322b,#d6322b) 50% 100%/72% 6px no-repeat}
:root[data-skin="bauhaus"] .lvl{background:#151515;color:#fff;border-radius:0;box-shadow:none}
:root[data-skin="bauhaus"] .lvl b{color:#f2c230}
:root[data-skin="bauhaus"] .icon-btn{box-shadow:inset 0 0 0 2.5px #151515}
:root[data-skin="bauhaus"] .icon-btn:active{transform:translateY(1px)}
:root[data-skin="bauhaus"] .tool{border-radius:0;font-weight:900;letter-spacing:.06em;box-shadow:inset 0 0 0 2.5px #151515,5px 5px 0 #151515}
:root[data-skin="bauhaus"] .tool svg{stroke:currentColor}
:root[data-skin="bauhaus"] #toolOut{background:#d6322b;color:#fff}
:root[data-skin="bauhaus"] #toolUndo{background:#f2c230;color:#151515}
:root[data-skin="bauhaus"] #toolShuffle{background:#1e4fa3;color:#fff}
:root[data-skin="bauhaus"] .tool:active:not(:disabled){transform:translate(4px,4px);box-shadow:inset 0 0 0 2.5px #151515,1px 1px 0 #151515}
:root[data-skin="bauhaus"] .tool .n{border-radius:50%;box-shadow:0 0 0 2.5px var(--bg)}
:root[data-skin="bauhaus"] .trough{border-radius:0;background:var(--tray);box-shadow:6px 6px 0 #1e4fa3}
:root[data-skin="bauhaus"] .trough::before{inset:auto auto -14px -14px;width:30px;height:30px;border:0;border-radius:50%;background:#f2c230}
:root[data-skin="bauhaus"] .trough i{border-radius:0;background:var(--tray-cell);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
:root[data-skin="bauhaus"] .dialog{border-radius:0;box-shadow:inset 0 0 0 3px #151515,9px 9px 0 #1e4fa3}
:root[data-skin="bauhaus"] .dialog h2{font-weight:900;letter-spacing:0}
:root[data-skin="bauhaus"] .btn,:root[data-skin="bauhaus"] .skin-opt,:root[data-skin="bauhaus"] .sw,:root[data-skin="bauhaus"] .toast,
:root[data-skin="bauhaus"] .shelf,:root[data-skin="bauhaus"] .bed{border-radius:0}
:root[data-skin="bauhaus"] .btn.primary{box-shadow:4px 4px 0 #151515}
:root[data-skin="bauhaus"] .needle{display:none}
:root[data-skin="bauhaus"] .sewn{height:6px;margin-top:-3px;border-radius:0;background:#151515}


/* ---- 铅字的形状：牌上印一个字，一半的牌黑底反白 ---- */
:root[data-skin="type"] body::before{content:"咩";position:fixed;right:-14vmin;bottom:-22vmin;z-index:0;pointer-events:none;
  font:900 118vmin/1 "Noto Serif SC","Songti SC",serif;color:transparent;-webkit-text-stroke:1.5px rgba(17,17,17,.06)}
:root[data-skin="type"] .face{border-radius:0;box-shadow:inset 0 0 0 1.5px #111,3px 3px 0 #111}
:root[data-skin="type"] .art{inset:0;background:none;display:grid;place-items:center;font-size:calc(var(--ts) * .6);line-height:1;color:#111;
  font-family:"Noto Serif SC","Songti SC",serif;font-weight:900}
:root[data-skin="type"] .art::before{content:var(--ch)}
:root[data-skin="type"] .dlg-art .art{width:88px;height:88px;font-size:72px!important}
:root[data-skin="type"] .ic-1,:root[data-skin="type"] .ic-2,:root[data-skin="type"] .ic-3,:root[data-skin="type"] .ic-11{font-family:"Noto Sans SC",sans-serif;font-weight:900}
:root[data-skin="type"] .ic-0,:root[data-skin="type"] .ic-8,:root[data-skin="type"] .ic-9,:root[data-skin="type"] .ic-14{font-family:"Ma Shan Zheng","KaiTi",serif;font-weight:400;font-size:calc(var(--ts) * .66)}
:root[data-skin="type"] .ic-4,:root[data-skin="type"] .ic-5,:root[data-skin="type"] .ic-12{font-family:"ZCOOL QingKe HuangYou",sans-serif;font-weight:400;font-size:calc(var(--ts) * .64)}
:root[data-skin="type"] .tile:is([data-ty="1"],[data-ty="3"],[data-ty="6"],[data-ty="9"],[data-ty="11"],[data-ty="12"],[data-ty="14"]) .face{background:#111}
:root[data-skin="type"] .tile:is([data-ty="1"],[data-ty="3"],[data-ty="6"],[data-ty="9"],[data-ty="11"],[data-ty="12"],[data-ty="14"]) .art{color:#fff}
:root[data-skin="type"] .brand{font-weight:900;letter-spacing:-.02em;font-size:clamp(23px,6.8vw,34px)}
:root[data-skin="type"] .dialog h2{font-weight:900;letter-spacing:0}
:root[data-skin="type"] .lvl{background:#111;color:#fff;border-radius:0;box-shadow:none}
:root[data-skin="type"] .lvl b{color:#fff}
:root[data-skin="type"] .icon-btn{box-shadow:inset 0 0 0 1.5px #111}
:root[data-skin="type"] .icon-btn:active{transform:translateY(1px)}
:root[data-skin="type"] .tool{border-radius:0;font-family:"Noto Serif SC",serif;font-weight:900;letter-spacing:.2em;box-shadow:inset 0 0 0 1.5px #111,4px 4px 0 #111}
:root[data-skin="type"] .tool:active:not(:disabled){transform:translate(3px,3px);box-shadow:inset 0 0 0 1.5px #111,1px 1px 0 #111}
:root[data-skin="type"] .trough{border-radius:0;background:var(--tray);box-shadow:5px 5px 0 rgba(17,17,17,.25)}
:root[data-skin="type"] .trough::before{border:1px solid rgba(255,255,255,.6);border-radius:0}
:root[data-skin="type"] .trough i{border-radius:0;background:var(--tray-cell);box-shadow:none}
:root[data-skin="type"] .dialog{border-radius:0;box-shadow:inset 0 0 0 2px #111,8px 8px 0 #111}
:root[data-skin="type"] .btn,:root[data-skin="type"] .skin-opt,:root[data-skin="type"] .sw,:root[data-skin="type"] .toast,
:root[data-skin="type"] .shelf,:root[data-skin="type"] .bed,:root[data-skin="type"] .tool .n,:root[data-skin="type"] .pips i{border-radius:0}
:root[data-skin="type"] .btn.primary{box-shadow:4px 4px 0 rgba(17,17,17,.3)}
:root[data-skin="type"] .needle{display:none}
:root[data-skin="type"] .sewn{height:4px;margin-top:-2px;border-radius:0;background:#111}
:root[data-skin="type"] .meter.hot .pips i.on{animation:blink .6s steps(1) infinite}
/* 铅字用的字 */
/* 字形尽量错开：只有花、菇带草字头；简单的字用装饰字体，复杂的字用清楚的宋体、黑体 */
.ic-0{--ch:"心"}.ic-1{--ch:"星"}.ic-2{--ch:"花"}.ic-3{--ch:"卜"}.ic-4{--ch:"叶"}.ic-5{--ch:"羊"}.ic-6{--ch:"线"}.ic-7{--ch:"鱼"}
.ic-8{--ch:"手"}.ic-9{--ch:"水"}.ic-10{--ch:"菇"}.ic-11{--ch:"瓜"}.ic-12{--ch:"音"}.ic-13{--ch:"梨"}.ic-14{--ch:"雨"}.ic-15{--ch:"樱"}

/* 换风格面板的分组标题 */
.skin-group{grid-column:1/-1;margin:4px 0 -2px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--paper-soft)}
.sw-char{font-size:28px;line-height:1}


@keyframes drop{from{transform:translateY(-38px) rotate(var(--r,0deg)) scale(.9);opacity:0}70%{opacity:1}to{transform:none;opacity:1}}
@keyframes hint{0%,100%{transform:none}30%{transform:translateY(-5px)}60%{transform:translateY(0)}80%{transform:translateY(-2px)}}
@keyframes flip{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0)}}
@keyframes back{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-7px)}35%{transform:translateX(6px)}55%{transform:translateX(-4px)}75%{transform:translateX(2px)}}
@keyframes leave{to{transform:translateY(26px) scale(.86);opacity:0}}
@keyframes bump{50%{transform:scale(1.35)}}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
@keyframes poof{0%{transform:scale(1);opacity:1}40%{transform:scale(1.14) rotate(-6deg);opacity:1}100%{transform:scale(.2) rotate(35deg);opacity:0}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes nope{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes wob{50%{transform:rotate(10deg) scale(.88)}}
@keyframes pop{from{transform:scale(.86);opacity:0}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{50%{opacity:.2}}
@media (prefers-reduced-motion: reduce){
  .tile{transition-duration:.01s}
  .stage.dealing .tile .face,.stage .tile.mix .face,.stage .tile.nope .face,.stage .tile.hint .face,
  .stage .tile.shake .face,.stage .tile.flip .face,.stage .tile.back .face,.trough.shake,.tool .n.bump,.dlg-actions .btn,.fuse.hot{animation:none}
  .stage .tile.inslot{transition-duration:.01s}
  .needle,.sewn{transition:none}
  .dialog,.dlg-art .hop,.dlg-art .herd .art,.meter.hot .pips i.on{animation:none}
}
</style>
</head>
<body>

<main class="app">
  <header class="bar" id="bar">
    <div class="lvl"><span id="lvlPre">第</span><b id="lvlNum">1</b><span id="lvlPost">关</span></div>
    <h1 class="brand">咩了个咩</h1>
    <div class="acts">
      <button class="icon-btn" id="btnHome" type="button" aria-label="主菜单">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10v8.5h11V10"/><path d="M10.2 18.5v-4.3h3.6v4.3"/></svg>
      </button>
      <button class="icon-btn" id="btnSkin" type="button" aria-label="换个风格">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17c1 0 1.6-.7 1.6-1.5 0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1 0-.8.7-1.5 1.5-1.5h1.9a4.8 4.8 0 0 0 4.8-4.8c0-3.9-4-7-9-7z"/><path d="M7.6 11.2v.1M10 7.4v.1M14.3 7.4v.1"/></svg>
      </button>

(() => {

/* ---------- 刺绣图案：每个图案是 11×11 的针脚格 ---------- */

const ICONS = [

  {n: '梨', m: ['.....N.....', '.....NGG...', '....ggg....', '....ggg....', '...ggggg...', '..ggggggg..', '.gWggggggg.', '.gWggggggg.', '.ggggggggg.', '..ggggggg..', '...ggggg...']},
  {n: '雨云', m: ['...........', '....LLL....', '...LWWWL...', '.LLWWWWWLL.', 'LWWWWWWWWWL', 'LWWWWWWWWWL', '.LLLLLLLLL.', '...........', '..S..S..S..', '.S..S..S...', '...........']},
  {n: '樱桃', m: ['......GG...', '.....G.G...', '....G...G..', '...G....G..', '..G.....G..', '.rrr...rrr.', 'rPrrr.rPrrr', 'rrrrr.rrrrr', 'rrrrr.rrrrr', '.rrr...rrr.', '...........']}
