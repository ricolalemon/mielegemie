<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="三消小游戏，每一副牌都保证有解；九种摆法、七种外观，按住或倾斜手机看清牌是怎么叠的。">
<title>咩了个咩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@900&family=Silkscreen&family=ZCOOL+QingKe+HuangYou&display=swap">
<style>
/* 四套外观，靠 <html data-skin="…"> 切换。每套都自己画背景，不跟随系统深浅色。
   默认（毛线）：靛蓝毛衣上的十字绣 */
:root{
  color-scheme:dark;
  --bg:#22366b;
  --ink:#fff4de;
  --ink-soft:#c3cde8;
  --tile:#f5ead2;
  --tile-hi:rgba(255,255,255,.28);
  --dim:brightness(.48) saturate(.5);
  --btn:#f5ead2;
  --btn-ink:#2b2f45;
  --btn-soft:#5a5c6e;
  --btn-edge:#c9b288;
  --tray:#1d2e5e;
  --tray-2:#15224a;
  --tray-line:rgba(240,181,69,.72);
  --tray-cell:rgba(0,0,0,.2);
  --thread:#f0b545;
  --track:rgba(195,205,232,.16);
  --accent:#bf3b2c;
  --accent-deep:#842419;
  --accent-ink:#fff;
  --badge:#1d2e5e;
  --badge-ink:#fff4de;
  --paper:#f7eed9;
  --paper-ink:#2b2f45;
  --paper-soft:#5a5c6e;
  --paper-edge:#c9b288;
  --ghost-line:rgba(43,47,69,.2);
  --scrim:rgba(8,12,30,.62);
  --focus:#ffd772;
  --pip-off:rgba(195,205,232,.45);
  --pip-on:#f0b545;
  --warn:#f06a52;
  --warn-ink:#ffb4a4;
  --bed:rgba(8,14,40,.16);
  --shelf:rgba(240,181,69,.55);
  --toast:#15224a;
  --toast-ink:#fff4de;
  --brand-shadow:0 3px 0 #111c43;
  --font-display:"ZCOOL QingKe HuangYou","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Silkscreen",ui-monospace,"SF Mono",Menlo,monospace;
}
/* 掌机：绿色液晶屏，四阶绿，方块像素 */
:root[data-skin="pixel"]{
  color-scheme:light;
  --bg:#a3bd4f;
  --ink:#1c3318;
  --ink-soft:#35552a;
  --tile:#d6e5a0;
  --tile-hi:rgba(255,255,255,0);
  --dim:none;
  --btn:#d6e5a0;
  --btn-ink:#1c3318;
  --btn-soft:#1c3318;
  --btn-edge:#1c3318;
  --tray:#8eaa40;
  --tray-2:#8eaa40;
  --tray-line:#1c3318;
  --tray-cell:rgba(28,51,24,.12);
  --thread:#1c3318;
  --track:rgba(28,51,24,.28);
  --accent:#1c3318;
  --accent-deep:#0b170a;
  --accent-ink:#d6e5a0;
  --badge:#1c3318;
  --badge-ink:#d6e5a0;
  --paper:#c7da85;
  --paper-ink:#1c3318;
  --paper-soft:#2f4b24;
  --paper-edge:#1c3318;
  --ghost-line:#1c3318;
  --scrim:rgba(28,51,24,.5);
  --focus:#1c3318;
  --pip-off:rgba(28,51,24,.3);
  --pip-on:#1c3318;
  --warn:#1c3318;
  --warn-ink:#1c3318;
  --bed:rgba(28,51,24,.08);
  --shelf:#1c3318;
  --toast:#1c3318;
  --toast-ink:#d6e5a0;
  --brand-shadow:3px 3px 0 rgba(28,51,24,.25);
}
/* 青花：白瓷蓝釉，放在朱漆桌面上 */
:root[data-skin="porcelain"]{
  --bg:#3a1611;
  --ink:#f7ede0;
  --ink-soft:#dcc0ad;
  --tile:#f6f7f3;
  --tile-hi:rgba(255,255,255,.95);
  --dim:brightness(.5) saturate(.75);
  --btn:#f6f7f3;
  --btn-ink:#1b2d63;
  --btn-soft:#244a9e;
  --btn-edge:#bcc6d2;
  --tray:#2a120d;
  --tray-2:#0e0504;
  --tray-line:rgba(216,172,92,.8);
  --tray-cell:rgba(255,255,255,.035);
  --thread:#d8ac5c;
  --track:rgba(220,192,173,.2);
  --accent:#1f47a3;
  --accent-deep:#122c6b;
  --accent-ink:#fff;
  --badge:#1f47a3;
  --badge-ink:#fff;
  --paper:#f6f7f3;
  --paper-ink:#1b2440;
  --paper-soft:#4b556f;
  --paper-edge:#bcc6d2;
  --ghost-line:rgba(27,36,64,.2);
  --scrim:rgba(22,6,4,.62);
  --focus:#f1d08a;
  --pip-off:rgba(220,192,173,.4);
  --pip-on:#d8ac5c;
  --warn:#ef7a5c;
  --warn-ink:#ffc2ad;
  --bed:rgba(0,0,0,.18);
  --shelf:rgba(216,172,92,.6);
  --toast:#1b0b08;
  --toast-ink:#f7ede0;
  --brand-shadow:0 2px 0 rgba(0,0,0,.45);
  --font-display:"Ma Shan Zheng","STKaiti","KaiTi",serif;
}
/* 孔版：荧光粉 + 蓝两色油墨，故意套色不准 */
:root[data-skin="riso"]{
  color-scheme:light;
  --bg:#ebe9e3;
  --ink:#1b2a86;
  --ink-soft:#44509a;
  --tile:#fbfaf6;
  --tile-hi:rgba(255,255,255,0);
  --dim:grayscale(1) brightness(.8) contrast(.85);
  --btn:#fbfaf6;
  --btn-ink:#1b2a86;
  --btn-soft:#0078bf;
  --btn-edge:#0078bf;
  --tray:#0078bf;
  --tray-2:#006aa9;
  --tray-line:#ff48b0;
  --tray-cell:rgba(255,255,255,.16);
  --thread:#ff48b0;
  --track:rgba(0,120,191,.28);
  --accent:#ff48b0;
  --accent-deep:#0078bf;
  --accent-ink:#141844;
  --badge:#ff48b0;
  --badge-ink:#141844;
  --paper:#fbfaf6;
  --paper-ink:#141844;
  --paper-soft:#3e4575;
  --paper-edge:#0078bf;
  --ghost-line:#0078bf;
  --scrim:rgba(40,44,70,.42);
  --focus:#ff48b0;
  --pip-off:rgba(0,120,191,.35);
  --pip-on:#0078bf;
  --warn:#e0237a;
  --warn-ink:#c81d6c;
  --bed:rgba(0,120,191,.06);
  --shelf:#ff48b0;
  --toast:#1b2a86;
  --toast-ink:#fbfaf6;
  --brand-shadow:3px 2px 0 #ff48b0;
  --font-display:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;background:var(--bg)}
body{min-height:100%;margin:0;overflow-x:hidden;overflow-x:clip;background-color:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.icon-btn:focus-visible,.tool:focus-visible,.btn:focus-visible,.skin-opt:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.dialog .btn:focus-visible,.dialog .skin-opt:focus-visible{outline-color:var(--paper-ink)}
.num{font-family:var(--font-num);font-weight:400;letter-spacing:.02em}

.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding-inline:16px;padding-block:12px 22px;display:flex;flex-direction:column;gap:10px}

/* 顶栏 */
.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.lvl{position:relative;display:inline-flex;align-items:baseline;gap:4px;padding:6px 12px 5px;border-radius:4px;background:var(--btn);color:var(--btn-ink);
  font-weight:700;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 var(--btn-edge),0 3px 0 1px rgba(0,0,0,.28)}
.lvl b{font-family:var(--font-num);font-weight:400;font-size:17px;line-height:1;color:var(--accent)}
.brand{margin:0;text-align:center;font-family:var(--font-display);font-weight:400;font-size:clamp(21px,6.2vw,32px);line-height:1.05;
  letter-spacing:.08em;white-space:nowrap;color:var(--ink);text-shadow:var(--brand-shadow)}
.acts{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;
  background:var(--btn);color:var(--btn-ink);
  box-shadow:inset 0 0 0 3px var(--btn),inset 0 0 0 4.5px rgba(120,90,50,.3),0 3px 0 var(--btn-edge),0 3px 0 1px rgba(0,0,0,.28)}
.icon-btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 3px var(--btn),inset 0 0 0 4.5px rgba(120,90,50,.3),0 1px 0 var(--btn-edge)}
.icon-btn span{display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:400px){
  .acts{gap:5px}
  .icon-btn{width:33px;height:33px}
  .icon-btn svg{width:17px;height:17px}
}

/* 进度线 */
.rail{display:flex;align-items:center;gap:12px}
.thread{position:relative;flex:1;height:26px}
.thread::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;
  background:repeating-linear-gradient(90deg,var(--track) 0 2px,transparent 2px 9px)}
.sewn{position:absolute;left:0;top:50%;height:3px;margin-top:-1.5px;width:6px;border-radius:2px;
  background:repeating-linear-gradient(90deg,var(--thread) 0 6px,transparent 6px 9px);transition:width .6s cubic-bezier(.3,.7,.3,1)}
.needle{position:absolute;top:50%;left:0;width:40px;height:10px;margin-top:-5px;transition:left .6s cubic-bezier(.3,.7,.3,1)}
.needle svg{display:block;width:100%;height:100%}
.count{margin:0;font-size:14px;font-weight:700;white-space:nowrap;color:var(--ink-soft)}
.count .num{color:var(--ink);font-size:15px}

/* 牌桌 */
.stage{position:relative;isolation:isolate;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.stage.tilting .tile.onboard{transition:none}
/* 捻开看层次时只看结构：被压住的牌一律扣成背面，松手后再翻回来 */
.stage.tilting .tile.blocked.onboard .art{opacity:0}
.peek{width:30px;height:30px;padding:0;border:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;
  background:var(--btn);color:var(--btn-ink);box-shadow:0 2px 0 var(--btn-edge),0 2px 0 1px rgba(0,0,0,.2);
  touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.peek svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.peek.on{background:var(--accent);color:var(--accent-ink);box-shadow:none;transform:translateY(2px)}
.peek:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
:root[data-skin="pixel"] .peek,:root[data-skin="bauhaus"] .peek,:root[data-skin="type"] .peek{border-radius:0}
.bed{position:absolute;z-index:0;border-radius:12px;background:var(--bed);pointer-events:none}
.shelf{position:absolute;z-index:0;border:2px dashed var(--shelf);border-radius:12px}
.meter{position:absolute;z-index:0;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.pips{display:flex;gap:3px}
.pips i{display:block;width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--pip-off)}
.pips i.on{background:var(--pip-on);box-shadow:none}
.meter.hot{color:var(--warn-ink)}
.meter.hot .pips i.on{background:var(--warn)}

/* 七格口袋 */
.trough{position:absolute;z-index:0;display:grid;grid-template-columns:repeat(7,1fr);padding:var(--pad);border-radius:calc(var(--cell) * .24);
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 5px),linear-gradient(180deg,var(--tray),var(--tray-2));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.1),0 6px 0 rgba(5,9,28,.55),0 14px 26px rgba(0,0,0,.32)}
.trough::before{content:"";position:absolute;inset:4px;border:2px dashed var(--tray-line);border-radius:calc(var(--cell) * .18);pointer-events:none}
.trough i{display:block;margin:calc(var(--cell) * .05);border-radius:calc(var(--cell) * .14);background:var(--tray-cell);box-shadow:inset 0 2px 5px rgba(0,0,0,.38)}

/* 牌 */
.tile{position:absolute;left:0;top:0;width:var(--ts);height:var(--ts);margin:0;padding:0;border:0;background:none;transform-origin:0 0;
  transition:transform .26s cubic-bezier(.3,.75,.3,1);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.tile:focus{outline:none}
.face{position:absolute;inset:0;border-radius:16%;
  background:radial-gradient(circle at 28% 18%,var(--tile-hi),rgba(255,255,255,0) 58%),var(--tile);
  box-shadow:inset 0 0 0 1px rgba(120,86,40,.2),0 calc(var(--ts) * .07) 0 #c9b288,0 calc(var(--ts) * .07 + 1.5px) 0 rgba(6,10,30,.55);
  transition:filter .2s}
.art{position:absolute;inset:9%;background:center/contain no-repeat}
/* 图案图片由脚本按当前外观画好，放进 --ic-N 变量 */
.ic-0{background-image:var(--ic-0)}.ic-1{background-image:var(--ic-1)}.ic-2{background-image:var(--ic-2)}.ic-3{background-image:var(--ic-3)}
.ic-4{background-image:var(--ic-4)}.ic-5{background-image:var(--ic-5)}.ic-6{background-image:var(--ic-6)}.ic-7{background-image:var(--ic-7)}
.ic-8{background-image:var(--ic-8)}.ic-9{background-image:var(--ic-9)}.ic-10{background-image:var(--ic-10)}.ic-11{background-image:var(--ic-11)}
.ic-12{background-image:var(--ic-12)}.ic-13{background-image:var(--ic-13)}.ic-14{background-image:var(--ic-14)}.ic-15{background-image:var(--ic-15)}
.tile.blocked{cursor:default}
.tile.blocked .face{filter:var(--dim)}
.tile.hide{visibility:hidden}
.tile:focus-visible .face{outline:3px solid var(--focus);outline-offset:2px}
.stage.instant .tile{transition:none}
.stage.dealing .tile .face{animation:drop .5s cubic-bezier(.2,.9,.3,1.15) both;animation-delay:var(--d,0ms)}
.stage .tile.nope .face{animation:nope .25s ease}
.stage .tile.mix .face{animation:wob .4s ease}
.stage .tile.pending .face{animation:pulse .25s ease both}
.stage .tile.gone{pointer-events:none}
.stage .tile.gone .face{animation:poof .32s ease forwards}

/* 道具 */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 9px;border:0;border-radius:14px;cursor:pointer;touch-action:manipulation;
  background:var(--btn);color:var(--btn-ink);box-shadow:0 5px 0 var(--btn-edge),0 5px 0 1px rgba(0,0,0,.3);
  font-family:var(--font-display);font-size:18px;line-height:1.1;letter-spacing:.1em}
.tool svg{width:24px;height:24px;fill:none;stroke:var(--btn-soft);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tool:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--btn-edge),0 2px 0 1px rgba(0,0,0,.3)}
.tool .n{position:absolute;top:-8px;right:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;display:grid;place-items:center;
  background:var(--badge);color:var(--badge-ink);font:400 12px/1 var(--font-num);letter-spacing:0;box-shadow:0 0 0 2.5px var(--bg)}
.tool:disabled{cursor:default;opacity:.42;filter:grayscale(.8)}
.tool:disabled .n{display:none}

/* 弹窗 */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px 16px;background:var(--scrim)}
.dialog{position:relative;width:min(350px,100%);max-height:100%;overflow:auto;padding:22px 22px 20px;border-radius:18px;background:var(--paper);color:var(--paper-ink);text-align:center;
  box-shadow:0 8px 0 var(--paper-edge),0 8px 0 1px rgba(0,0,0,.3),0 22px 44px rgba(0,0,0,.45);animation:pop .28s cubic-bezier(.2,.9,.3,1.3)}
.dlg-art{display:grid;place-items:center;margin-bottom:4px}
.dlg-art .art{position:static;display:block;width:88px;height:88px}
.dlg-art .hop{animation:hop .9s ease-in-out infinite}
.dlg-art .sad{transform:rotate(-12deg) translateY(4px);filter:saturate(.6)}
.dialog h2{margin:2px 0 8px;font:400 29px/1.15 var(--font-display);letter-spacing:.06em;text-wrap:balance}
.dialog p{margin:0 0 16px;color:var(--paper-soft);line-height:1.65}
.dialog ul{margin:0 0 16px;padding-left:1.2em;text-align:left;color:var(--paper-soft);line-height:1.65;display:flex;flex-direction:column;gap:6px}
.dlg-extra{margin:0 0 16px}
.dlg-actions{position:relative;display:flex;flex-direction:column;gap:10px}
.btn{position:relative;border:0;border-radius:12px;padding:12px 14px;font:700 16px/1.25 var(--font-body);cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.ghost{background:transparent;color:var(--paper-ink);box-shadow:inset 0 0 0 2px var(--ghost-line)}

/* 换风格 */
.skins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.skin-opt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 10px;border:0;border-radius:12px;background:transparent;color:var(--paper-ink);
  box-shadow:inset 0 0 0 2px var(--ghost-line);cursor:pointer;touch-action:manipulation}
.skin-opt[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
.sw{display:grid;place-items:center;width:100%;height:66px;margin-bottom:4px;border-radius:8px}
.sw-tile{display:grid;place-items:center;width:44px;height:44px}
.sw-tile img{display:block;width:80%;height:80%}
.sk-name{font-weight:700;font-size:15px}
.sk-desc{font-size:12px;line-height:1.4;color:var(--paper-soft)}

.toast{position:fixed;left:50%;top:calc(116px + env(safe-area-inset-top,0px));z-index:60;max-width:calc(100% - 32px);
  transform:translate(-50%,-12px);opacity:0;pointer-events:none;padding:8px 16px;border-radius:999px;
  background:var(--toast);color:var(--toast-ink);border:0;box-shadow:0 8px 20px rgba(0,0,0,.35);
  font-size:14px;font-weight:700;text-align:center;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- 掌机的形状：全部方角、硬投影，被压住的牌用网点而不是变暗 ---- */
:root[data-skin="pixel"] .face{border-radius:0;box-shadow:inset 0 0 0 2px #1c3318,3px 3px 0 #1c3318}
:root[data-skin="pixel"] .tile.blocked .face::after{content:"";position:absolute;inset:0;
  background:conic-gradient(#1c3318 25%,transparent 0 50%,#1c3318 0 75%,transparent 0) 0 0/4px 4px;opacity:.5}
:root[data-skin="pixel"] .art{image-rendering:pixelated}
:root[data-skin="pixel"] .lvl,:root[data-skin="pixel"] .icon-btn{border-radius:0;box-shadow:inset 0 0 0 2px #1c3318,3px 3px 0 #1c3318}
:root[data-skin="pixel"] .icon-btn:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 2px #1c3318,1px 1px 0 #1c3318}
:root[data-skin="pixel"] .tool{border-radius:0;box-shadow:inset 0 0 0 2px #1c3318,4px 4px 0 #1c3318}
:root[data-skin="pixel"] .tool:active:not(:disabled){transform:translate(3px,3px);box-shadow:inset 0 0 0 2px #1c3318,1px 1px 0 #1c3318}
:root[data-skin="pixel"] .tool .n,:root[data-skin="pixel"] .pips i,:root[data-skin="pixel"] .toast,:root[data-skin="pixel"] .bed,
:root[data-skin="pixel"] .shelf,:root[data-skin="pixel"] .btn,:root[data-skin="pixel"] .skin-opt,:root[data-skin="pixel"] .sw{border-radius:0}
:root[data-skin="pixel"] .trough{border-radius:0;background:var(--tray);box-shadow:inset 0 0 0 3px #1c3318,4px 4px 0 #1c3318}
:root[data-skin="pixel"] .trough::before{display:none}
:root[data-skin="pixel"] .trough i{border-radius:0;background:var(--tray-cell);box-shadow:inset 0 0 0 2px rgba(28,51,24,.3)}
:root[data-skin="pixel"] .dialog{border-radius:0;box-shadow:inset 0 0 0 3px #1c3318,6px 6px 0 #1c3318}
:root[data-skin="pixel"] .btn.primary{box-shadow:4px 4px 0 rgba(28,51,24,.35)}
:root[data-skin="pixel"] .needle{display:none}

:root[data-skin="type"] .btn,:root[data-skin="type"] .skin-opt,:root[data-skin="type"] .sw,:root[data-skin="type"] .toast,

.ic-0{--ch:"心"}.ic-1{--ch:"星"}.ic-2{--ch:"花"}.ic-3{--ch:"萝"}.ic-4{--ch:"草"}.ic-5{--ch:"羊"}.ic-6{--ch:"线"}.ic-7{--ch:"鱼"}
.ic-8{--ch:"套"}.ic-9{--ch:"水"}.ic-10{--ch:"菇"}.ic-11{--ch:"瓜"}.ic-12{--ch:"音"}.ic-13{--ch:"梨"}.ic-14{--ch:"雨"}.ic-15{--ch:"桃"}

/* 换风格面板的分组标题 */
.skin-group{grid-column:1/-1;margin:4px 0 -2px;text-align:left;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--paper-soft)}

@keyframes glitch{
  0%,84%,100%{transform:none;clip-path:none;text-shadow:-2px 0 0 #ff2bd6,2px 0 0 #00f0ff}
  86%{transform:translateX(-3px);clip-path:inset(18% 0 44% 0);text-shadow:-5px 0 0 #ff2bd6,4px 0 0 #00f0ff}
  88%{transform:translateX(4px);clip-path:inset(56% 0 8% 0)}
  90%{transform:translateX(-1px);clip-path:none;text-shadow:3px 0 0 #ff2bd6,-3px 0 0 #00f0ff}

}

@keyframes drop{from{transform:translateY(-38px) scale(.9);opacity:0}to{transform:none;opacity:1}}

<script>
(() => {
'use strict';

const BW = 7, BH = 8.72, CAP = 7;
const ST = {board: 0, slot: 1, hold: 2, gone: 3};
const STN = ['board', 'slot', 'hold', 'gone'];

/* ---------- 十字绣图案：每个图案是 11×11 的针脚格 ---------- */
const PAL = {
  R: '#d8433b', r: '#9c2340', P: '#ee93b3', Y: '#eaa934', O: '#e8762c', o: '#b9521a',
  G: '#4c9445', g: '#a6c63d', W: '#ffffff', L: '#aab4c8', K: '#3a3740', U: '#8d56a8',
  u: '#c294d6', T: '#2b9c93', t: '#7fd0c4', B: '#3b5bb0', S: '#57aee0', N: '#93623a', n: '#d6ab74'
};
const ICONS = [
  {n: '爱心', m: ['...........', '.RRR...RRR.', 'RRPRR.RRRRR', 'RPRRRRRRRRR', 'RRRRRRRRRRR', '.RRRRRRRRR.', '..RRRRRRR..', '...RRRRR...', '....RRR....', '.....R.....', '...........']},
  {n: '星星', m: ['.....Y.....', '....YYY....', '....YYY....', 'YYYYYYYYYYY', '.YYYYYYYYY.', '..YYYYYYY..', '..YYYYYYY..', '.YYYY.YYYY.', '.YYY...YYY.', 'YY.......YY', '...........']},
  {n: '小花', m: ['...PP.PP...', '..PPPPPPP..', '.PPPYYYPPP.', '.PPYYYYYPP.', '.PPPYYYPPP.', '..PPPPPPP..', '...PP.PP...', '.....G.....', '.GG..G..GG.', '..GGGGGGG..', '.....G.....']},
  {n: '胡萝卜', m: ['...G.G.G...', '...GGGGG...', '....GGG....', '..OOOOOOO..', '..OOOOoOO..', '...OOOOO...', '...OoOOO...', '....OOO....', '....OoO....', '.....O.....', '.....O.....']},
  {n: '四叶草', m: ['..GG...GG..', '.GGGG.GGGG.', '.GGGGGGGGG.', '..GGGgGGG..', '.GGGGGGGGG.', '.GGGG.GGGG.', '..GG.G.GG..', '.....G.....', '......G....', '.......G...', '...........']},
  {n: '小羊', m: ['...........', '..LLLLLLL..', '.LWWWWWWWL.', 'LWWWWWWWWWL', 'LWWKKKKKWWL', 'KKWKKKKKWKK', '.K.KWKWK.K.', '...KKKKK...', '...KKKKK...', '....KPK....', '...........']},
  {n: '毛线团', m: ['...UUUUU...', '..UuUUUuU..', '.UUuUUuUUU.', 'UUUUuuUUUuU', 'UuUUUUuUuUU', 'UUuUUUUuUUU', 'UUUuUUuUUuU', '.UUUuuUUUU.', '..UUUUUuU..', '...UUUUU..u', '........uu.']},
  {n: '小鱼', m: ['...........', '...........', '....TTTTT..', 'T..TTTTTTT.', 'TT.TTTTTKTT', 'TTTTTtTTTTT', 'TT.TTtTTTT.', 'T..TTTTTTT.', '....TTTTT..', '...........', '...........']},
  {n: '手套', m: ['...........', '.....BBBB..', '....BBBBBB.', '....BBBBBB.', '..B.BBBBBB.', '.BBBBBBBBB.', '.BBBYBYBBB.', '..BBBBBBBB.', '...LLLLLLL.', '...LWLWLWL.', '...........']},
  {n: '水滴', m: ['.....S.....', '.....S.....', '....SSS....', '....SSS....', '...SSSSS...', '..SSSSSSS..', '..SWSSSSS..', '..SWSSSSS..', '..SSSSSSS..', '...SSSSS...', '....SSS....']},
  {n: '蘑菇', m: ['...........', '...NNNNN...', '..NNWNNNN..', '.NNNNNNWNN.', 'NNWNNNNNNNN', 'NNNNNNNNNNN', '...nnnnn...', '...nnnnn...', '...nnnnn...', '..nnnnnnn..', '...........']},
  {n: '西瓜', m: ['...........', '...........', 'RRRRRRRRRRR', 'WRRKRRRKRRW', 'GWRRRRRRRWG', '.GWRRKRRWG.', '..GWRRRWG..', '...GWWWG...', '....GGG....', '...........', '...........']},
  {n: '音符', m: ['...........', '......KK...', '......KKK..', '......K.KK.', '......K..K.', '......K....', '......K....', '...KKKK....', '..KKKKK....', '..KKKK.....', '...........']},
  {n: '梨', m: ['.....N.....', '.....NGG...', '....ggg....', '....ggg....', '...ggggg...', '..ggggggg..', '.gWggggggg.', '.gWggggggg.', '.ggggggggg.', '..ggggggg..', '...ggggg...']},
  {n: '雨云', m: ['...........', '....LLL....', '...LWWWL...', '.LLWWWWWLL.', 'LWWWWWWWWWL', 'LWWWWWWWWWL', '.LLLLLLLLL.', '...........', '..S..S..S..', '.S..S..S...', '...........']},
  {n: '樱桃', m: ['......GG...', '.....G.G...', '....G...G..', '...G....G..', '..G.....G..', '.rrr...rrr.', 'rPrrr.rPrrr', 'rrrrr.rrrrr', 'rrrrr.rrrrr', '.rrr...rrr.', '...........']}
];

function shade(hex, k){
  const v = parseInt(hex.slice(1), 16);
  const f = c => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
  return `rgb(${f(v >> 16)},${f((v >> 8) & 255)},${f(v & 255)})`;
}

// 先画所有针脚的影子，再画底针“\”，最后画面针“/”，像真的线交叉在布上
function stitchIcon(rows){
  const cell = 12, n = 11, size = cell * n, dpr = 2;
  const c = document.createElement('canvas');
  c.width = c.height = size * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  x.lineCap = 'round';
  const m = cell * .2, lw = cell * .3;
  const seg = (a, b, p, q) => { x.beginPath(); x.moveTo(a, b); x.lineTo(p, q); x.stroke(); };
  for (let pass = 0; pass < 3; pass++){
    for (let r = 0; r < n; r++){
      for (let q = 0; q < n; q++){
        const ch = rows[r][q];
        if (!ch || ch === '.') continue;
        const col = PAL[ch], x0 = q * cell, y0 = r * cell;
        if (pass === 0){
          x.strokeStyle = 'rgba(60,35,10,.24)';
          x.lineWidth = lw;
          seg(x0 + m, y0 + m + 1.3, x0 + cell - m, y0 + cell - m + 1.3);
          seg(x0 + cell - m, y0 + m + 1.3, x0 + m, y0 + cell - m + 1.3);
        } else if (pass === 1){
          x.strokeStyle = shade(col, -.2);
          x.lineWidth = lw;
          seg(x0 + m, y0 + m, x0 + cell - m, y0 + cell - m);
        } else {
          x.strokeStyle = col;
          x.lineWidth = lw;
          seg(x0 + cell - m, y0 + m, x0 + m, y0 + cell - m);
          x.strokeStyle = 'rgba(255,255,255,.32)';
          x.lineWidth = lw * .3;
          seg(x0 + cell - m - .9, y0 + m + .1, x0 + m + .1, y0 + cell - m - .9);
        }
      }
    }
  }
  return c.toDataURL('image/png');
}

// 靛蓝毛衣的平针纹理：每一针是一个 V
function knitTexture(){
  const w = 20, h = 17, cols = 4, rows = 4, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const c = document.createElement('canvas');
  c.width = w * cols * dpr;
  c.height = h * rows * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  x.fillStyle = '#1d2f64';
  x.fillRect(0, 0, w * cols, h * rows);
  const rnd = rngFrom(7), tone = [];
  for (let i = 0; i < cols * rows; i++) tone.push(rnd() * .04 - .02);
  for (let r = -1; r <= rows; r++){
    for (let q = -1; q <= cols; q++){
      const k = tone[((r % rows + rows) % rows) * cols + ((q % cols + cols) % cols)];
      for (const side of [-1, 1]){
        const cx = q * w + w / 2 + side * w * .22, cy = r * h + h * .5;
        const g = x.createLinearGradient(cx, cy - h * .55, cx, cy + h * .55);
        g.addColorStop(0, shade('#2b4482', k + .02));
        g.addColorStop(1, shade('#243a74', k));
        x.fillStyle = g;
        x.beginPath();
        x.ellipse(cx, cy, h * .58, w * .2, -side * 1.08, 0, Math.PI * 2);
        x.fill();
      }
    }
  }
  return {url: c.toDataURL('image/png'), w: w * cols, h: h * rows};
}

/* ---------- 另外三套外观的画法（共用同一套 11×11 图案） ---------- */
// 掌机和青花只有四个深浅：每种线色事先指定落在第几阶
const TONE = {R: 1, r: 0, P: 3, Y: 2, O: 1, o: 0, G: 1, g: 2, W: 3, L: 2, K: 0, U: 1, u: 2, T: 1, t: 3, B: 1, S: 2, N: 1, n: 2};
function gridCanvas(){
  const cell = 12, n = 11, size = cell * n, dpr = 2;
  const c = document.createElement('canvas');
  c.width = c.height = size * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  return {c, x, cell, n, size};
}

function pixelIcon(rows){
  const {c, x, cell, n} = gridCanvas();
  const shades = ['#1c3318', '#3b5c28', '#6d8e36', '#a9c262'];
  for (let r = 0; r < n; r++){
    for (let q = 0; q < n; q++){
      const ch = rows[r][q];
      if (ch === '.') continue;
      x.fillStyle = shades[TONE[ch]];
      x.fillRect(q * cell + .5, r * cell + .5, cell - 1, cell - 1);
    }
  }
  return c.toDataURL('image/png');
}

// 青花：先铺一层晕开的淡釉，再点上钴蓝；轮廓处加深一阶，像笔描的边
function blueIcon(rows){
  const {c, x, cell, n} = gridCanvas();
  const blues = ['#132d6e', '#2a52a8', '#6f91d6', '#d3def3'];
  const on = (r, q) => r >= 0 && q >= 0 && r < n && q < n && rows[r][q] !== '.';
  const dab = (q, r, rad) => { x.beginPath(); x.arc(q * cell + cell / 2, r * cell + cell / 2, rad, 0, Math.PI * 2); x.fill(); };
  x.filter = 'blur(1.4px)';
  x.globalAlpha = .4;
  for (let r = 0; r < n; r++){
    for (let q = 0; q < n; q++){
      if (!on(r, q)) continue;
      x.fillStyle = blues[Math.min(3, TONE[rows[r][q]] + 1)];
      dab(q, r, cell * .8);
    }
  }
  x.filter = 'blur(.4px)';
  x.globalAlpha = .92;
  for (let r = 0; r < n; r++){
    for (let q = 0; q < n; q++){
      if (!on(r, q)) continue;
      let s = TONE[rows[r][q]];
      if (s > 0 && (!on(r - 1, q) || !on(r + 1, q) || !on(r, q - 1) || !on(r, q + 1))) s--;
      x.fillStyle = blues[s];
      dab(q, r, cell * .6);
    }
  }
  x.filter = 'none';
  x.globalAlpha = 1;
  return c.toDataURL('image/png');
}

// 孔版：每种颜色拆成黄、粉、蓝三版油墨，各带颗粒、各自错开一点，再叠印
const INK = {y: '255,226,0', p: '255,72,176', b: '0,120,191'};
const RISO = {
  R: {p: 1, y: .75}, r: {p: 1, b: .45}, P: {p: .55}, Y: {y: 1, p: .2}, O: {y: 1, p: .65}, o: {y: 1, p: 1},
  G: {b: .8, y: 1}, g: {y: 1, b: .35}, W: {}, L: {b: .4}, K: {b: 1, p: .85}, U: {b: .8, p: .8}, u: {b: .35, p: .35},
  T: {b: .9, y: .45}, t: {b: .4, y: .25}, B: {b: 1, p: .25}, S: {b: .6}, N: {p: .6, y: .8, b: .5}, n: {y: .5, p: .28}
};
function risoIcon(rows, seed){
  const {c, x, cell, n, size} = gridCanvas();
  const rnd = rngFrom(seed * 131 + 7);
  const offs = {y: [0, 0], p: [1.4, -1], b: [-1.1, 1.2]};
  x.globalCompositeOperation = 'multiply';
  for (const k of ['y', 'p', 'b']){
    const lay = document.createElement('canvas');
    lay.width = lay.height = c.width;
    const lx = lay.getContext('2d');
    lx.scale(2, 2);
    let any = false;
    for (let r = 0; r < n; r++){
      for (let q = 0; q < n; q++){
        const ch = rows[r][q];
        const a = ch === '.' ? 0 : (RISO[ch][k] || 0);
        if (!a) continue;
        any = true;
        lx.fillStyle = `rgba(${INK[k]},${a})`;
        lx.fillRect(q * cell, r * cell, cell, cell);
      }
    }
    if (!any) continue;
    lx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 320; i++){
      lx.fillStyle = `rgba(0,0,0,${.25 + rnd() * .55})`;
      lx.fillRect(rnd() * size, rnd() * size, .7 + rnd() * 1.3, .7 + rnd() * 1.3);
    }
    x.drawImage(lay, offs[k][0] * (rnd() < .5 ? 1 : -1), offs[k][1], size, size);
  }
  x.globalCompositeOperation = 'source-over';
  return c.toDataURL('image/png');
}

// 构成：每种图案重新设计成红黄蓝黑的几何构成（坐标以 100 为边长）
function bauhausIcon(i){
  const {c, x, size} = gridCanvas();
  x.scale(size / 100, size / 100);
  const R = '#d6322b', Y = '#f2c230', B = '#1e4fa3', K = '#151515', W = '#ffffff';
  const circ = (cx, cy, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); };
  const rect = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  const tri = (pts, col) => { x.fillStyle = col; x.beginPath(); pts.forEach(([a, b], k) => (k ? x.lineTo(a, b) : x.moveTo(a, b))); x.closePath(); x.fill(); };
  const half = (cx, cy, r, a0, a1, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, r, a0, a1); x.closePath(); x.fill(); };
  const line = (a, b, p, q, w, col) => { x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'butt'; x.beginPath(); x.moveTo(a, b); x.lineTo(p, q); x.stroke(); };
  const ring = (cx, cy, r, w, col, a0 = 0, a1 = Math.PI * 2) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.arc(cx, cy, r, a0, a1); x.stroke(); };
  const PI = Math.PI;
  switch (i){
    case 0: circ(33, 40, 19, R); circ(67, 40, 19, R); tri([[15, 47], [85, 47], [50, 88]], R); break;
    case 1: tri([[50, 8], [88, 72], [12, 72]], Y); tri([[50, 92], [12, 28], [88, 28]], Y); circ(50, 50, 8, K); break;
    case 2: circ(50, 26, 17, B); circ(50, 74, 17, B); circ(26, 50, 17, B); circ(74, 50, 17, B); circ(50, 50, 13, Y); break;
    case 3: tri([[28, 30], [72, 30], [50, 94]], Y); rect(36, 44, 22, 4, K); rect(44, 60, 16, 4, K); rect(38, 8, 6, 20, K); rect(56, 8, 6, 20, K); break;
    case 4: circ(34, 34, 15, K); circ(66, 34, 15, K); circ(34, 66, 15, K); circ(66, 66, 15, K); rect(43, 43, 14, 14, R); break;
    case 5: circ(50, 46, 37, Y); rect(37, 38, 26, 44, K); circ(44, 52, 4, W); circ(56, 52, 4, W); break;
    case 6: circ(48, 48, 38, B); ring(48, 48, 26, 4, K, .2 * PI, 1.3 * PI); ring(48, 48, 13, 4, K, 1.1 * PI, 2.1 * PI); line(76, 76, 94, 94, 4, K); break;
    case 7: x.fillStyle = B; x.beginPath(); x.ellipse(44, 50, 30, 19, 0, 0, PI * 2); x.fill(); tri([[68, 50], [92, 30], [92, 70]], B); circ(32, 46, 4.5, W); break;
    case 8: rect(30, 20, 40, 52, K); circ(50, 20, 20, K); circ(24, 52, 10, K); rect(28, 72, 44, 14, Y); break;
    case 9: circ(50, 62, 27, B); tri([[50, 8], [26, 52], [74, 52]], B); circ(41, 62, 6, W); break;
    case 10: half(50, 56, 40, PI, 2 * PI, R); rect(40, 56, 20, 34, K); circ(34, 42, 5, W); circ(62, 34, 5, W); break;
    case 11: half(50, 30, 42, 0, PI, K); half(50, 30, 35, 0, PI, R); circ(38, 44, 3.5, K); circ(50, 52, 3.5, K); circ(62, 44, 3.5, K); break;
    case 12: circ(37, 72, 14, K); rect(45, 14, 6, 60, K); tri([[51, 14], [80, 28], [51, 40]], K); break;
    case 13: circ(50, 66, 26, Y); circ(50, 38, 16, Y); rect(48, 8, 5, 18, K); tri([[53, 16], [72, 8], [66, 22]], K); break;
    case 14: ring(32, 52, 14, 4, K); ring(51, 42, 17, 4, K); ring(69, 54, 13, 4, K); rect(18, 66, 64, 4, K); rect(32, 76, 4, 14, B); rect(49, 80, 4, 14, B); rect(66, 76, 4, 14, B); break;
    default: line(32, 56, 56, 14, 4, K); line(70, 52, 56, 14, 4, K); circ(32, 70, 16, R); circ(70, 66, 16, R); break;
  }
  return c.toDataURL('image/png');
}

// 故障：先画亮色像素，再把红绿蓝三个通道左右错开，最后切几条横带随机平移
const NEON = {K: '#d7d3ff', r: '#ff4f7b', o: '#ff8a3d', N: '#e0a071', B: '#6f8dff'};
function glitchIcon(rows, seed){
  const {c, x, cell, n} = gridCanvas();
  for (let r = 0; r < n; r++){
    for (let q = 0; q < n; q++){
      const ch = rows[r][q];
      if (ch === '.') continue;
      x.fillStyle = NEON[ch] || shade(PAL[ch], .15);
      x.fillRect(q * cell + .5, r * cell + .5, cell - 1, cell - 1);
    }
  }
  const W = c.width;
  const blank = () => { const k = document.createElement('canvas'); k.width = k.height = W; return k; };
  const channel = col => {
    const k = blank(), kx = k.getContext('2d');
    kx.drawImage(c, 0, 0);
    kx.globalCompositeOperation = 'multiply';
    kx.fillStyle = col;
    kx.fillRect(0, 0, W, W);
    kx.globalCompositeOperation = 'destination-in';
    kx.drawImage(c, 0, 0);
    return k;
  };
  const split = blank(), sx = split.getContext('2d');
  sx.globalCompositeOperation = 'lighter';
  sx.drawImage(channel('#ff0000'), -7, 0);
  sx.drawImage(channel('#00ff00'), 0, 0);
  sx.drawImage(channel('#0000ff'), 7, 0);
  const out = blank(), ox = out.getContext('2d');
  ox.drawImage(split, 0, 0);
  const rnd = rngFrom(seed * 97 + 5);
  for (let i = 0; i < 3; i++){
    const y = Math.floor(rnd() * W * .85), h = Math.floor(8 + rnd() * 22), dx = Math.round((rnd() - .5) * 30);
    ox.clearRect(0, y, W, h);
    ox.drawImage(split, 0, y, W, h, dx, y, W, h);
  }
  return out.toDataURL('image/png');
}

/* ---------- 偏好与音效 ---------- */
const PREF_KEY = 'mielegemie:v1';
const prefs = (() => {
  try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; }
})();
function savePrefs(p){
  Object.assign(prefs, p);
  try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
}

const Sound = {
  on: prefs.sound !== false,
  ctx: null,
  tone(f, d = .09, type = 'triangle', v = .05, at = 0){
    if (!this.on) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx;
      if (c.state === 'suspended') c.resume();
      const t0 = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f, t0);
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(v, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + d + .03);
    } catch (e) {}
  },
  tap(){ this.tone(540, .07); },
  bump(){ this.tone(170, .07, 'square', .02); },
  match(){ this.tone(660, .1, 'sine', .06); this.tone(880, .12, 'sine', .06, .07); this.tone(1320, .16, 'sine', .04, .14); },
  tool(){ this.tone(420, .1, 'sine', .05); this.tone(630, .12, 'sine', .04, .06); },
  lose(){ this.tone(260, .22, 'sawtooth', .025); this.tone(180, .34, 'sawtooth', .025, .16); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .2, 'triangle', .06, i * .11)); }
};

/* ---------- 随机数（同一个种子永远发出同一副牌） ---------- */
function rngFrom(seed){
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const newSeed = () => 1 + Math.floor(Math.random() * 2147483000);
// 新开一局：尽量不和上一局用同一种摆法
function freshSeed(level){
  let s = newSeed();
  for (let i = 0; level > 1 && i < 12 && archOf(s).id === prefs.lastArch; i++) s = newSeed();
  return s;
}
const pickOne = (arr, rng) => arr[Math.floor(rng() * arr.length)];
function shuffled(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 摆牌：坐标以一张牌的边长为 1 ---------- */
function introLayout(){
  const out = [];
  for (let z = 0; z < 3; z++)
    for (const y of [1.9, 3.15, 4.4])
      for (const x of [1.75, 3, 4.25]) out.push({x, y: y - (2 - z) * .17, z});
  return out;
}

const OFFSETS = [[0, 0], [.5, .5], [.5, 0], [0, .5]];
function layerShape(rng){
  const kind = pickOne(['rect', 'rect', 'twin', 'frame', 'diamond', 'cross'], rng);
  if (kind === 'rect'){
    const hw = pickOne([1, 1.5, 2, 2.5, 3], rng) + .01, top = .5 + rng() * 2, bot = 6.5 - rng() * 2;
    return (dx, dy, cy) => dx <= hw && cy >= top && cy <= bot;
  }
  if (kind === 'twin'){
    const inner = pickOne([.5, 1, 1.5], rng) - .01, outer = inner + pickOne([1.5, 2], rng) + .02;
    const top = .5 + rng() * 2.5, bot = 6.5 - rng() * 2.5;
    return (dx, dy, cy) => dx >= inner && dx <= outer && cy >= top && cy <= bot;
  }
  if (kind === 'frame'){
    const hw = pickOne([2.5, 3], rng) + .01, hh = pickOne([2.5, 3], rng) + .01;
    return (dx, dy) => dx <= hw && dy <= hh && (dx >= hw - 1.05 || dy >= hh - 1.05);
  }
  if (kind === 'diamond'){
    const a = pickOne([2.5, 3, 3.5], rng), b = pickOne([2.5, 3, 3.5], rng);
    return (dx, dy) => dx / a + dy / b <= 1.02;
  }
  const w = pickOne([.5, 1], rng) + .01;
  return (dx, dy) => dx <= w || dy <= w;
}

/* ---------- 九种摆法：每局先抽一种大轮廓，再在里面随机 ---------- */
const snap = v => Math.round(v * 2) / 2;

// 按左右对称生成一层；keep(dx, cy, cx) 决定某个位置要不要放牌
function symLayer(rng, z, ox, oy, keep, dens){
  const cols = ox ? 6 : 7, rows = oy ? 6 : 7, out = [];
  for (let r = 0; r < rows; r++){
    const y = r + oy, cy = y + .5;
    for (let c = 0; c < Math.ceil(cols / 2); c++){
      const x = c + ox, mx = cols - 1 - c + ox, cx = x + .5;
      if (!keep(Math.abs(cx - 3.5), cy, cx) || rng() > dens) continue;
      out.push({x, y, z});
      if (mx !== x) out.push({x: mx, y, z});
    }
  }
  return out;
}

// 方阵：每层随机一种形状，相邻两层错开半张
function buildBlock(rng, cfg){
  const out = [];
  let prev = 0, z = 0, tries = 0;
  while (z < cfg.maxLayers && out.length < cfg.target && tries++ < 80){
    let oi = 0;
    if (z > 0){
      oi = Math.floor(rng() * 4);
      if (oi === prev) oi = (oi + 1 + Math.floor(rng() * 3)) % 4;
    }
    const [ox, oy] = OFFSETS[oi];
    const shape = layerShape(rng);
    const layer = symLayer(rng, z, ox, oy, (dx, cy) => shape(dx, Math.abs(cy - 3.5), cy), cfg.density);
    if (layer.length < 6) continue;
    out.push(...layer);
    prev = oi;
    z++;
  }
  return out;
}

// 金字塔：一层比一层小，中间最深
function buildPyramid(rng, cfg){
  const out = [], w0 = pickOne([3, 3.5], rng), h0 = pickOne([2.5, 3, 3.5], rng);
  const rep = rng() < .6 ? 2 : 1, step = pickOne([.5, .6, .75], rng);
  let z = 0, lvl = 0;
  while (out.length < cfg.target && z < 18){
    const hw = w0 - lvl * step, hh = h0 - lvl * step;
    if (hw < .45 || hh < .45){ lvl = Math.max(0, lvl - 3); continue; }
    const [ox, oy] = z % 2 ? [.5, .5] : [0, 0];
    out.push(...symLayer(rng, z, ox, oy, (dx, cy) => dx <= hw + .01 && Math.abs(cy - 3.5) <= hh + .01, .93));
    z++;
    if (z % rep === 0) lvl++;
  }
  return out;
}

// 双塔：左右两根高柱，底下偶尔搭一道桥
function buildTowers(rng, cfg){
  const out = [], mid = pickOne([1.5, 2, 2.5], rng), w = pickOne([.5, 1], rng) + .01;
  const top = .5 + rng() * 1.5, bot = 6.5 - rng() * 1.5, bridge = rng() < .7;
  let z = 0;
  while (out.length < cfg.target && z < 20){
    const [ox, oy] = OFFSETS[[0, 1, 2, 1][z % 4]];
    out.push(...symLayer(rng, z, ox, oy, (dx, cy) =>
      (Math.abs(dx - mid) <= w && cy >= top && cy <= bot) || (bridge && z < 2 && Math.abs(cy - 3.5) <= .6), .92));
    z++;
  }
  return out;
}

// 回环：中空的方框，有时中心再立一根深柱
function buildRing(rng, cfg){
  const out = [], core = rng() < .55, th = pickOne([1, 1.5], rng), hh = pickOne([2.5, 3], rng) + .01;
  let z = 0;
  while (out.length < cfg.target && z < 16){
    const [ox, oy] = z % 2 ? [.5, .5] : [0, 0];
    const hw = 3 - (z % 3) * .5 + .01;
    out.push(...symLayer(rng, z, ox, oy, (dx, cy) => {
      const dy = Math.abs(cy - 3.5);
      return (dx <= hw && dy <= hh && (dx >= hw - th || dy >= hh - th)) || (core && dx <= .6 && dy <= .6);
    }, .9));
    z++;
  }
  return out;
}

// 群岛：散落的小堆，不对称；每个小堆的每一层都有自己的层号
function buildIslands(rng, cfg){
  const out = [], sizes = [[1, 1], [2, 1], [1, 2], [2, 2], [3, 2], [2, 3]];
  let z = 0, guard = 0;
  while (out.length < cfg.target && guard++ < 40){
    const [w, h] = pickOne(sizes, rng);
    const bx = snap(rng() * (6.5 - w)), by = snap(rng() * (7 - h));
    const depth = 3 + Math.floor(rng() * 5);
    for (let d = 0; d < depth; d++){
      const ox = d % 2 ? pickOne([.5, -.5], rng) : 0, oy = d % 2 ? pickOne([.5, 0], rng) : 0;
      for (let r = 0; r < h; r++){
        for (let c = 0; c < w; c++){
          const x = bx + c + ox, y = by + r + oy;
          if (x < 0 || x > 6 || y < 0 || y > 6.5 || rng() > .9) continue;
          out.push({x, y, z});
        }
      }
      z++;
    }
  }
  return out;
}

// 漩涡：一块牌沿着圆圈一层层挪位置往上盘
function buildSwirl(rng, cfg){
  const out = [], R = 1 + rng() * .9, dir = rng() < .5 ? 1 : -1, t0 = rng() * Math.PI * 2, dt = .55 + rng() * .35;
  const w = pickOne([3, 4], rng), h = pickOne([3, 4], rng);
  let z = 0;
  while (out.length < cfg.target && z < 26){
    const a = t0 + dir * z * dt;
    const x0 = snap(3.5 + R * Math.cos(a) - w / 2), y0 = snap(3.75 + R * .9 * Math.sin(a) - h / 2);
    for (let r = 0; r < h; r++){
      for (let c = 0; c < w; c++){
        const x = x0 + c, y = y0 + r;
        if (x < 0 || x > 6 || y < 0 || y > 6.5 || rng() > .9) continue;
        out.push({x, y, z});
      }
    }
    z++;
  }
  return out;
}

// 千层：九个位置各叠一摞很深的牌，全部朝同一个方向错开
function buildColumns(rng, cfg){
  const out = [], [ddx, ddy] = pickOne([[.055, 0], [0, .055], [.045, .035], [-.045, .035]], rng);
  const slots = [];
  for (const y of [0, 2.3, 4.6]) for (const x of [0, 2.4, 4.8]) slots.push([x + (ddx < 0 ? 1.16 : 0), y]);
  for (const [bx, by] of shuffled(slots, rng)){
    if (out.length >= cfg.target) break;
    const depth = 10 + Math.floor(rng() * 12);
    for (let d = 0; d < depth; d++) out.push({x: bx + d * ddx, y: by + d * ddy, z: d});
  }
  return out;
}

// 剪影：按轮廓叠，轮廓左右对称
const MASKS = [
  ['羊头', ['X.....X', 'XXXXXXX', '.XXXXX.', '.XXXXX.', '..XXX..', '..XXX..', '...X...']],
  ['爱心', ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...']],
  ['山', ['...X...', 'X..X..X', 'X..X..X', 'X..X..X', 'XXXXXXX', 'XXXXXXX', '.......']]
];
function buildMask(rng, cfg, meta){
  const [name, m] = pickOne(MASKS, rng);
  meta.label = '剪影·' + name;
  const on = (r, c) => r >= 0 && c >= 0 && r < 7 && c < 7 && m[r][c] === 'X';
  const out = [];
  let z = 0;
  while (out.length < cfg.target && z < 14){
    const [ox, oy] = [[0, 0], [.5, .5], [.5, 0], [0, .5]][z % 4];
    const dens = Math.max(.6, .95 - z * .04);
    const cols = ox ? 6 : 7, rows = oy ? 6 : 7;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < Math.ceil(cols / 2); c++){
        const ok = on(r, c) && (!ox || on(r, c + 1)) && (!oy || on(r + 1, c)) && (!ox || !oy || on(r + 1, c + 1));
        if (!ok || rng() > dens) continue;
        const mc = cols - 1 - c;
        out.push({x: c + ox, y: r + oy, z});
        if (mc !== c) out.push({x: mc + ox, y: r + oy, z});
      }
    }
    z++;
  }
  return out;
}

// 砖墙：一行错开半张，像砌砖；宽而浅
function buildBricks(rng, cfg){
  const out = [], top = snap(rng() * 1.5), bot = 6.5 - snap(rng() * 1.5);
  let z = 0;
  while (out.length < cfg.target && z < 10){
    const oy = (z % 4 >= 2) ? .5 : 0, holes = .05 + rng() * .15;
    for (let y = top + oy, row = 0; y <= bot; y += 1, row++){
      const ox = ((row + z) % 2) * .5, cols = ox ? 6 : 7;
      for (let c = 0; c < cols; c++){
        if (rng() < holes) continue;
        out.push({x: c + ox, y, z});
      }
    }
    z++;
  }
  return out;
}

const ARCHES = [
  {id: 'block', name: '方阵', build: buildBlock},
  {id: 'pyramid', name: '金字塔', build: buildPyramid},
  {id: 'towers', name: '双塔', build: buildTowers},
  {id: 'ring', name: '回环', build: buildRing},
  {id: 'islands', name: '群岛', build: buildIslands, flip: true},
  {id: 'swirl', name: '漩涡', build: buildSwirl, flip: true},
  {id: 'columns', name: '千层', build: buildColumns, flip: true},
  {id: 'mask', name: '剪影', build: buildMask},
  {id: 'bricks', name: '砖墙', build: buildBricks}
];
const archOf = seed => ARCHES[Math.floor(rngFrom((seed ^ 0x2c1b3c6d) >>> 0)() * ARCHES.length)];

// 底部的牌摞：0～3 摞，只有最上面一张能拿
function pilePlan(rng, amount){
  const r = rng();
  const n = r < .18 ? 0 : r < .42 ? 1 : r < .85 ? 2 : 3;
  const cap = [0, 24, 20, 11][n], out = [];
  for (let i = 0; i < n; i++){
    const each = Math.round(amount / n * (.75 + rng() * .45));
    out.push({slot: n === 1 ? 'mid' : n === 2 ? (i ? 'right' : 'left') : ['left', 'mid', 'right'][i], n: Math.max(4, Math.min(cap, each))});
  }
  return out;
}
function pilePositions(piles){
  const out = [];
  for (const p of piles){
    const x0 = p.slot === 'mid' ? (piles.length === 1 ? 3 - (p.n - 1) * .105 / 2 : 2.45) : 0;
    for (let i = 0; i < p.n; i++){
      const x = p.slot === 'right' ? 6 - i * .105 : p.slot === 'left' ? i * .105 : x0 + i * .105;
      out.push({x, y: 7.62, z: i});
    }
  }
  return out;
}

// 把主牌堆挪到牌桌正中（有牌摞时只用上面 7.5 格高）
function centerMain(pos, hasPiles){
  if (!pos.length) return pos;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of pos){
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x + 1);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y + 1);
  }
  const availH = hasPiles ? 7.5 : 8.6;
  const dx = (BW - (x1 - x0)) / 2 - x0, dy = Math.max(0, (availH - (y1 - y0)) / 2) - y0;
  return pos.map(p => ({x: p.x + dx, y: p.y + dy, z: p.z}));
}

function makeLayout(rng, cfg, arch){
  const piles = pilePlan(rng, cfg.piles * 2);
  const pileSum = piles.reduce((s, p) => s + p.n, 0);
  const meta = {label: arch.name};
  let main = arch.build(rng, {target: cfg.target + cfg.piles * 2 - pileSum, maxLayers: cfg.maxLayers, density: cfg.density}, meta);
  if (arch.flip){
    if (rng() < .5) main = main.map(p => ({x: 6 - p.x, y: p.y, z: p.z}));
    if (rng() < .5) main = main.map(p => ({x: p.x, y: 6.5 - p.y, z: p.z}));
  }
  main = centerMain(main, piles.length > 0);
  const extra = (3 - (main.length + pileSum) % 3) % 3;
  if (piles.length) piles[piles.length - 1].n += extra;
  else if (extra) main = main.sort((a, b) => a.z - b.z).slice(0, main.length - (3 - extra));
  return {pos: main.concat(pilePositions(piles)), label: meta.label};
}

function makeTiles(pos){
  const tiles = pos.map((p, id) => ({
    id, x: p.x, y: p.y, z: p.z, type: -1, status: 'board', pending: false,
    covers: [], coveredBy: [], el: null, art: null, shown: -1, si: 0, hc: 0, hd: 0
  }));
  for (let i = 0; i < tiles.length; i++){
    const a = tiles[i];
    for (let j = i + 1; j < tiles.length; j++){
      const b = tiles[j];
      if (a.z === b.z || Math.abs(a.x - b.x) > .999 || Math.abs(a.y - b.y) > .999) continue;
      const hi = a.z > b.z ? a : b, lo = hi === a ? b : a;
      hi.covers.push(lo);
      lo.coveredBy.push(hi);
    }
  }
  return tiles;
}

/* ---------- 保证有解：先模拟一条通关路线，再按路线给每张牌定图案 ----------
   每一步从“此刻没被压住”的牌里挑一张，决定它是什么图案，模拟把它放进口袋。
   只要模拟过程中口袋从不放满，这条路线就是一条真实可走的通关路线。 */
function plan(pool, o){
  const rng = o.rng, cap = Math.min(o.maxSlot, 6);
  const inPool = new Set(pool.map(t => t.id));
  const cnt = new Map(), free = [];
  for (const t of pool){
    let c = 0;
    for (const a of t.coveredBy) if (inPool.has(a.id)) c++;
    cnt.set(t.id, c);
    if (!c) free.push(t);
  }
  const supply = new Map(Object.entries(o.supply).map(([k, v]) => [Number(k), v]));
  const hold = o.hold.slice();
  const slot = new Map();
  let slotLen = 0;
  for (const ty of o.slot){ slot.set(ty, (slot.get(ty) || 0) + 1); slotLen++; }
  const assign = new Map(), order = [];
  let left = pool.length;
  const avail = ty => (supply.get(ty) || 0) + hold.filter(h => h === ty).length;

  while (left > 0 || hold.length){
    const twos = [], ones = [], opens = [];
    for (const [ty, c] of slot) if (avail(ty) > 0) (c === 2 ? twos : ones).push(ty);
    const seen = new Set(slot.keys());
    for (const ty of [...supply.keys(), ...hold]){
      if (seen.has(ty)) continue;
      seen.add(ty);
      if (avail(ty) > 0) opens.push(ty);
    }
    const canOpen = opens.length > 0 && slotLen + 1 <= cap;
    let ty;
    if (canOpen && (slotLen === 0 || rng() < o.interleave)){
      let w = 0;
      for (const t of opens) w += avail(t);
      let r = rng() * w;
      ty = opens[opens.length - 1];
      for (const t of opens){ r -= avail(t); if (r < 0){ ty = t; break; } }
    } else if (twos.length) ty = pickOne(twos, rng);
    else if (ones.length && slotLen + 1 < CAP) ty = pickOne(ones, rng);
    else if (canOpen) ty = pickOne(opens, rng);
    else return null;

    const hi = hold.indexOf(ty);
    if (hi >= 0){
      hold.splice(hi, 1);
      order.push(-1);
    } else {
      if (!free.length) return null;
      const i = Math.floor(rng() * free.length), t = free[i];
      free[i] = free[free.length - 1];
      free.pop();
      assign.set(t.id, ty);
      supply.set(ty, supply.get(ty) - 1);
      left--;
      order.push(t.id);
      for (const b of t.covers){
        if (!inPool.has(b.id)) continue;
        const c = cnt.get(b.id) - 1;
        cnt.set(b.id, c);
        if (!c) free.push(b);
      }
    }
    const c = (slot.get(ty) || 0) + 1;
    if (c === 3){ slot.delete(ty); slotLen -= 2; } else { slot.set(ty, c); slotLen++; }
    if (slotLen >= CAP) return null;
  }
  return {assign, order};
}

// 按真实规则把路线走一遍，确认能清空
function verify(tiles, order){
  const onBoard = new Set(tiles.map(t => t.id));
  const slot = [];
  for (const id of order){
    const t = tiles[id];
    if (!t || !onBoard.has(id) || t.coveredBy.some(a => onBoard.has(a.id))) return false;
    onBoard.delete(id);
    slot.push(t.type);
    if (slot.filter(x => x === t.type).length === 3){
      for (let k = 0; k < 3; k++) slot.splice(slot.indexOf(t.type), 1);
    } else if (slot.length >= CAP) return false;
  }
  return onBoard.size === 0 && slot.length === 0;
}

/* ---------- 关卡 ---------- */
function levelCfg(level){
  if (level <= 1) return {intro: true, interleave: 0, maxSlot: 3};
  const k = Math.min(level - 2, 4);
  return {
    intro: false, types: Math.min(12 + 2 * k, 16), target: 150 + 20 * k, maxLayers: 8 + k,
    density: .85, piles: 10 + 2 * k, interleave: .3 + .06 * k, maxSlot: k ? 5 : 4
  };
}

function buildLevel(level, seed){
  const cfg = levelCfg(level);
  for (let attempt = 0; attempt < 40; attempt++){
    const rng = rngFrom(seed + attempt * 7919);
    let pos, types;
    let label = '热身';
    if (cfg.intro){
      pos = introLayout();
      types = [0, 1, 4];
    } else {
      const lay = makeLayout(rng, cfg, archOf(seed));
      pos = lay.pos;
      label = lay.label;
      const tc = Math.max(10, Math.min(16, cfg.types + pickOne([-1, 0, 0, 1], rng)));
      types = shuffled(ICONS.map((_, i) => i), rng).slice(0, tc);
    }
    const tiles = makeTiles(pos);
    const supply = {};
    for (let i = 0; i < tiles.length / 3; i++){
      const ty = types[i % types.length];
      supply[ty] = (supply[ty] || 0) + 3;
    }
    const res = plan(tiles, {supply, slot: [], hold: [], interleave: cfg.interleave, maxSlot: cfg.maxSlot, rng});
    if (!res) continue;
    for (const t of tiles) t.type = res.assign.get(t.id);
    if (verify(tiles, res.order)) return {tiles, cfg, label};
  }
  return null;
}

/* ---------- 对局状态 ---------- */
const G = {
  level: 1, seed: 1, cfg: {intro: true}, tiles: [], slot: [], hold: [[], [], []],
  tools: {out: 1, undo: 1, shuffle: 1}, history: [], moves: 0,
  over: false, won: false, epoch: 0, pending: 0, acc: 0, t0: 0, running: false
};
const L = {unit: 40, cell: 40, pad: 6, boardX: 0, boardY: 2, trayX: 0, trayY: 0, trayW: 0, holdX: 0, holdY: 0};

function elapsed(){ return G.acc + (G.running ? performance.now() - G.t0 : 0); }
function startClock(){ if (!G.running){ G.t0 = performance.now(); G.running = true; } }
function stopClock(){ if (G.running){ G.acc += performance.now() - G.t0; G.running = false; } }
const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

const isFree = t => t.coveredBy.every(a => a.status !== 'board');

function layout(){
  const W = stage.clientWidth;
  const chrome = $('bar').offsetHeight + $('rail').offsetHeight + $('tools').offsetHeight + 80;
  const byH = (window.innerHeight - chrome - 22) / 11.2;
  const unit = Math.floor(Math.max(34, Math.min(60, W / BW, byH)));
  const cell = Math.floor(Math.min(unit, (W - 12) / 7.34));
  const pad = Math.max(6, Math.round(cell * .19));
  Object.assign(L, {unit, cell, pad});
  L.boardX = Math.round((W - unit * BW) / 2);
  L.boardY = 2;
  L.trayW = cell * 7 + pad * 2;
  L.trayX = Math.round((W - L.trayW) / 2);
  L.holdY = Math.round(L.boardY + unit * BH + 10);
  L.holdX = L.trayX + pad;
  L.trayY = L.holdY + cell + 10;
  const trayH = cell + pad * 2;
  stage.style.height = (L.trayY + trayH + 10) + 'px';
  stage.style.setProperty('--ts', (unit * .92).toFixed(2) + 'px');
  Object.assign(trough.style, {left: L.trayX + 'px', top: L.trayY + 'px', width: L.trayW + 'px', height: trayH + 'px'});
  trough.style.setProperty('--cell', cell + 'px');
  trough.style.setProperty('--pad', pad + 'px');
  Object.assign(shelf.style, {left: (L.holdX - 5) + 'px', top: (L.holdY - 5) + 'px', width: Math.round(cell * 3.16 + 10) + 'px', height: (cell + 10) + 'px'});
  Object.assign(meter.style, {right: Math.max(0, W - L.trayX - L.trayW + 2) + 'px', top: Math.round(L.holdY + cell / 2 - (meter.offsetHeight || 30) / 2) + 'px'});
  Object.assign(bed.style, {left: (L.boardX - 4) + 'px', top: Math.round(L.boardY + unit * 7.5) + 'px', width: (unit * BW + 8) + 'px', height: Math.round(unit * 1.2) + 'px'});
}

function render(){
  const {unit, cell, pad} = L, k = (cell / unit).toFixed(4);
  G.slot.forEach((t, i) => { t.si = i; });
  G.hold.forEach((col, c) => col.forEach((t, d) => { t.hc = c; t.hd = d; }));
  for (const t of G.tiles){
    const el = t.el;
    if (!el) continue;
    if (t.shown !== t.type){ t.art.className = 'art ic-' + t.type; el.dataset.ty = t.type; t.shown = t.type; }
    let x = 0, y = 0, s = 1, zi = 0, blocked = false;
    if (t.status === 'board'){
      const p = boardPose(t);
      x = p.x;
      y = p.y;
      s = p.s.toFixed(3);
      zi = 10 + Math.min(t.z, 280);
      blocked = !isFree(t);
    } else if (t.status === 'slot'){
      x = L.trayX + pad + (t.si + .04) * cell;
      y = L.trayY + pad + .01 * cell;
      s = k;
      zi = 400 + t.si;
    } else if (t.status === 'hold'){
      const col = G.hold[t.hc];
      x = L.holdX + (t.hc * 1.08 + .04) * cell;
      y = L.holdY - t.hd * 5;
      s = k;
      zi = 300 + t.hd;
      blocked = col[col.length - 1] !== t;
    }
    if (t.status !== 'gone'){
      el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${s})`;
      el.style.zIndex = zi;
      el.classList.remove('hide');
    }
    el.classList.toggle('blocked', blocked);
    el.classList.toggle('onboard', t.status === 'board');
    el.classList.toggle('gone', t.status === 'gone');
    el.classList.toggle('pending', t.pending);
    const live = (t.status === 'board' || t.status === 'hold') && !blocked;
    el.tabIndex = live ? 0 : -1;
    el.setAttribute('aria-label', ICONS[t.type].n + (t.status === 'slot' ? '，在口袋里' : blocked ? '，被压住了' : ''));
  }
  hud();
}

function hud(){
  const total = G.tiles.length;
  let left = 0;
  for (const t of G.tiles) if (t.status !== 'gone') left++;
  const p = total ? ((total - left) / total).toFixed(4) : 0;
  $('lvlNum').textContent = G.level;
  $('left').textContent = left;
  $('layoutName').textContent = G.cfg.intro ? '' : `${G.label} · `;
  $('needle').style.left = `calc((100% - 40px) * ${p})`;
  $('sewn').style.width = `calc((100% - 40px) * ${p} + 6px)`;
  const n = G.slot.length;
  $('meterText').textContent = `口袋 ${n}/7`;
  pips.forEach((pip, i) => pip.classList.toggle('on', i < n));
  meter.classList.toggle('hot', n >= 5);
  toolState('toolOut', 'nOut', G.tools.out, '移出');
  toolState('toolUndo', 'nUndo', G.tools.undo, '撤回');
  toolState('toolShuffle', 'nShuffle', G.tools.shuffle, '洗牌');
  shelf.hidden = !G.hold.some(c => c.length);
}
function toolState(id, nid, n, name){
  const b = $(id);
  b.disabled = n <= 0;
  $(nid).textContent = n;
  b.setAttribute('aria-label', n > 0 ? `${name}，还能用 ${n} 次` : `${name}，这一局已经用完`);
}

function mountTiles(deal){
  computeHeights(G.tiles);
  for (const el of stage.querySelectorAll('.tile')) el.remove();
  const frag = document.createDocumentFragment();
  const order = G.tiles.slice().sort((a, b) => a.y - b.y || a.x - b.x || a.z - b.z);
  const maxZ = Math.max(1, ...G.tiles.map(t => t.z));
  for (const t of order){
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'tile';
    const face = document.createElement('span');
    face.className = 'face';
    face.setAttribute('aria-hidden', 'true');
    const art = document.createElement('i');
    art.className = 'art';
    face.appendChild(art);
    el.appendChild(face);
    el.addEventListener('click', () => onTile(t));
    if (deal) el.style.setProperty('--d', Math.round(t.z / maxZ * 700 + Math.random() * 110) + 'ms');
    if (t.status === 'gone') el.classList.add('gone', 'hide');
    t.el = el;
    t.art = art;
    t.shown = -1;
    frag.appendChild(el);
  }
  stage.appendChild(frag);
  bed.hidden = !!G.cfg.intro || !G.tiles.some(t => Math.abs(t.y - 7.62) < .01);
  stage.classList.add('instant');
  stage.classList.toggle('dealing', !!deal);
  render();
  void stage.offsetWidth;
  stage.classList.remove('instant');
  clearTimeout(mountTiles.timer);
  if (deal) mountTiles.timer = setTimeout(() => stage.classList.remove('dealing'), 1500);
}

function startLevel(level, seed){
  let built = buildLevel(level, seed);
  for (let i = 0; !built && i < 3; i++){ seed = newSeed(); built = buildLevel(level, seed); }
  if (!built){ level = 1; seed = newSeed(); built = buildLevel(1, seed); }
  G.epoch++;
  Object.assign(G, {
    level, seed, cfg: built.cfg, tiles: built.tiles, label: built.label, slot: [], hold: [[], [], []],
    tools: {out: 1, undo: 1, shuffle: 1}, history: [], moves: 0,
    over: false, won: false, pending: 0, acc: 0, running: false
  });
  savePrefs(built.cfg.intro ? {level} : {level, lastArch: archOf(seed).id});
  closeDialog();
  mountTiles(true);
  startClock();
  toast(level === 1 ? '点亮着的牌，凑齐 3 张一样的就会消掉' : `第 ${level} 关 · ${G.label} · ${G.tiles.length} 张牌`);
  if (level >= 2 && !prefs.peekTold){
    savePrefs({peekTold: true});
    setTimeout(() => toast('看不清怎么叠的？按住口袋上方的层次按钮，或两指在牌堆上拖', 3600), 2300);
  }
}

/* ---------- 点牌 ---------- */
function onTile(t){
  if (G.over || G.won) return;
  if ((peekSrc && peekSrc !== 'gyro') || performance.now() - peekEndedAt < 350) return;
  if (t.status === 'board'){
    if (!isFree(t)) return nudge(t);
  } else if (t.status === 'hold'){
    const col = G.hold[t.hc];
    if (col[col.length - 1] !== t) return;
  } else return;
  if (G.slot.length >= CAP) return;

  snapshot();
  if (t.status === 'hold'){
    const col = G.hold[t.hc];
    col.splice(col.indexOf(t), 1);
  }
  t.status = 'slot';
  let at = G.slot.length;
  for (let i = G.slot.length - 1; i >= 0; i--){
    if (G.slot[i].type === t.type && !G.slot[i].pending){ at = i + 1; break; }
  }
  G.slot.splice(at, 0, t);
  G.moves++;
  Sound.tap();

  const same = G.slot.filter(s => s.type === t.type && !s.pending);
  if (same.length >= 3){
    for (const s of same.slice(0, 3)) s.pending = true;
    G.pending += 3;
    const ep = G.epoch;
    setTimeout(() => settle(ep), 250);
  } else if (G.slot.length >= CAP && !G.pending){
    render();
    lose();
    return;
  }
  render();
}

function settle(ep){
  if (ep !== G.epoch) return;
  const done = G.slot.filter(s => s.pending);
  if (!done.length) return;
  G.slot = G.slot.filter(s => !s.pending);
  for (const s of done){ s.pending = false; s.status = 'gone'; }
  G.pending = 0;
  Sound.match();
  render();
  if (G.tiles.every(t => t.status === 'gone')) win();
}

function nudge(t){
  const el = t.el;
  el.classList.remove('nope');
  void el.offsetWidth;
  el.classList.add('nope');
  Sound.bump();
}

/* ---------- 撤回用的快照 ---------- */
function snapshot(){
  G.history.push({
    st: G.tiles.map(t => (t.pending ? 3 : ST[t.status])),
    ty: G.tiles.map(t => t.type),
    slot: G.slot.filter(t => !t.pending).map(t => t.id),
    hold: G.hold.map(c => c.map(t => t.id))
  });
  if (G.history.length > 80) G.history.shift();
}
function restoreSnap(s){
  G.epoch++;
  G.pending = 0;
  G.tiles.forEach((t, i) => { t.status = STN[s.st[i]]; t.type = s.ty[i]; t.pending = false; });
  G.slot = s.slot.map(id => G.tiles[id]);
  G.hold = s.hold.map(c => c.map(id => G.tiles[id]));
}

/* ---------- 道具 ---------- */
function revive(){ if (G.over){ G.over = false; startClock(); } }
function busyToast(){ toast('等这一组消完再用道具'); }

function useOut(){
  if (G.won) return;
  if (G.pending) return busyToast();
  if (G.tools.out <= 0) return toast('「移出」这一局已经用过了');
  if (!G.slot.length) return toast('口袋是空的，没有牌可以移出');
  snapshot();
  G.slot.splice(0, 3).forEach((t, i) => { t.status = 'hold'; G.hold[i].push(t); });
  G.tools.out--;
  revive();
  Sound.tool();
  render();
}

function useUndo(){
  if (G.won) return;
  if (G.pending) return busyToast();
  if (G.tools.undo <= 0) return toast('「撤回」这一局已经用过了');
  if (!G.history.length) return toast('还没有可以撤回的一步');
  restoreSnap(G.history.pop());
  G.tools.undo--;
  revive();
  Sound.tool();
  render();
}

// 洗牌时也按“能走通”的方式重新分配图案，走不通才退回随机打乱
function reshuffle(pool){
  const supply = {};
  for (const t of pool) supply[t.type] = (supply[t.type] || 0) + 1;
  const res = plan(pool, {
    supply, slot: G.slot.map(t => t.type), hold: G.hold.flat().map(t => t.type),
    interleave: .2, maxSlot: 4, rng: Math.random
  });
  if (res){
    for (const t of pool) t.type = res.assign.get(t.id);
    return;
  }
  const types = shuffled(pool.map(t => t.type), Math.random);
  pool.forEach((t, i) => { t.type = types[i]; });
}

function useShuffle(){
  if (G.won) return;
  if (G.pending) return busyToast();
  if (G.tools.shuffle <= 0) return toast('「洗牌」这一局已经用过了');
  if (G.over) return toast('口袋已经满了，洗牌帮不上忙');
  const pool = G.tiles.filter(t => t.status === 'board');
  if (pool.length < 3) return toast('场上的牌不多了，不用洗');
  snapshot();
  reshuffle(pool);
  G.tools.shuffle--;
  pool.forEach(t => t.el.classList.remove('mix'));
  void stage.offsetWidth;
  pool.forEach(t => t.el.classList.add('mix'));
  Sound.tool();
  render();
}

/* ---------- 输赢 ---------- */
function lose(){
  G.over = true;
  stopClock();
  Sound.lose();
  const ep = G.epoch;
  setTimeout(() => { if (G.over && ep === G.epoch) showLose(); }, 450);
}
function showLose(){
  const left = G.tiles.filter(t => t.status !== 'gone').length;
  const actions = [];
  if (G.tools.out > 0) actions.push({label: '用「移出」腾出 3 格，接着玩', primary: true, run: () => { closeDialog(); useOut(); }});
  if (G.tools.undo > 0 && G.history.length) actions.push({label: '撤回最后一步', primary: !actions.length, run: () => { closeDialog(); useUndo(); }});
  actions.push({label: '重玩这一副牌', primary: !actions.length, run: () => startLevel(G.level, G.seed)});
  actions.push({label: '换一副新牌', run: () => startLevel(G.level, freshSeed(G.level))});
  openDialog({kind: 'lose', art: 'sad', title: '口袋满了', body: `7 格都塞满了，还没凑出 3 张一样的。场上还剩 ${left} 张牌。`, actions});
}

function win(){
  G.won = true;
  stopClock();
  Sound.win();
  const secs = Math.round(elapsed() / 1000), lv = G.level;
  const best = (prefs.best || {})[lv];
  const record = !best || secs < best;
  if (record) savePrefs({best: Object.assign({}, prefs.best, {[lv]: secs})});
  savePrefs({level: lv + 1});
  setTimeout(() => {
    if (lv === 1){
      openDialog({kind: 'win', art: 'hop', title: '热身完成', body: '第 2 关才是正题：牌多、压得深。放心，发牌前已经算好了一条能清空的路线。', actions: [
        {label: '进入第 2 关', primary: true, run: () => startLevel(2, freshSeed(2))}
      ]});
    } else {
      openDialog({kind: 'win', art: 'hop', title: `第 ${lv} 关通关！`,
        body: `用时 ${fmt(secs)}，点了 ${G.moves} 次。` + (record ? '这是你这一关最快的一次。' : `这一关最快 ${fmt(best)}。`),
        actions: [
          {label: `挑战第 ${lv + 1} 关`, primary: true, run: () => startLevel(lv + 1, freshSeed(lv + 1))},
          {label: `再来一副第 ${lv} 关`, run: () => startLevel(lv, freshSeed(lv))}
        ]});
    }
  }, 520);
}

/* ---------- 弹窗与提示 ---------- */
let dlgKind = '';
function openDialog(o){
  dlgKind = o.kind || '';
  const art = $('dlgArt');
  art.innerHTML = o.art ? `<div class="${o.art}"><i class="art ic-5"></i></div>` : '';
  art.hidden = !o.art;
  $('dlgTitle').textContent = o.title;
  const body = $('dlgBody');
  body.textContent = o.body || '';
  body.hidden = !o.body;
  const ul = $('dlgList');
  ul.replaceChildren(...(o.list || []).map(s => { const li = document.createElement('li'); li.textContent = s; return li; }));
  ul.hidden = !o.list;
  const ex = $('dlgExtra');
  ex.replaceChildren(...(o.extra ? [o.extra] : []));
  ex.hidden = !o.extra;
  const box = $('dlgActions');
  box.replaceChildren();
  for (const a of o.actions){
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + (a.primary ? 'primary' : 'ghost');
    b.textContent = a.label;
    b.addEventListener('click', a.run);
    box.appendChild(b);
  }
  scrim.hidden = false;
  const first = (o.extra && o.extra.querySelector('[aria-pressed="true"]')) || box.querySelector('button');
  if (first) first.focus({preventScroll: true});
}
function closeDialog(){ scrim.hidden = true; dlgKind = ''; }
const dismissable = () => dlgKind === 'help' || dlgKind === 'menu';
scrim.addEventListener('click', e => { if (e.target === scrim && dismissable()) closeDialog(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !scrim.hidden && dismissable()) closeDialog(); });

let toastTimer = 0;
function toast(msg, ms = 1900){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

function showHelp(){
  openDialog({kind: 'help', title: '怎么玩', list: [
    '只有亮着的牌能点。暗下去的牌被上面的牌压住了，要先把上面的拿走。',
    '点中的牌会收进下面的牛仔布口袋，凑齐 3 张一样的就会消掉。',
    '口袋只有 7 格，塞满了还凑不出 3 张，这一局就输了。',

  ], actions: [

}

/* ---------- 看层次：越高的牌往倾斜方向挪得越多，像把一叠牌捻开 ---------- */
const tilt = {x: 0, y: 0};
const peekBtn = $('btnPeek');
let peekSrc = null, peekEndedAt = -1e9, tiltRaf = 0, relaxRaf = 0, sweepRaf = 0;

// 每张牌底下最多压着几层（沿覆盖关系的最长链），决定它挪多远
function computeHeights(tiles){
  const memo = new Map();
  const h = t => {
    if (memo.has(t.id)) return memo.get(t.id);
    let m = 0;
    for (const c of t.covers) m = Math.max(m, h(c));
    memo.set(t.id, m + 1);
    return m + 1;
  };
  for (const t of tiles) t.h = h(t);
}
const lift = t => Math.min(t.h || 1, 12) * L.unit * .075;
const TILT_MAX = 2.4;
function boardPose(t){
  const k = lift(t);
  return {x: L.boardX + (t.x + .04) * L.unit + tilt.x * k, y: L.boardY + (t.y + .01) * L.unit + tilt.y * k, s: 1};
}

function applyTilt(){
  for (const t of G.tiles){
    if (t.status !== 'board' || !t.el) continue;
    const p = boardPose(t);
    t.el.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) scale(${p.s.toFixed(3)})`;
  }
}
function setTilt(x, y){
  const m = Math.hypot(x, y), f = m > TILT_MAX ? TILT_MAX / m : 1;
  tilt.x = x * f;
  tilt.y = y * f;
  if (!tiltRaf) tiltRaf = requestAnimationFrame(() => { tiltRaf = 0; applyTilt(); });
}
function startPeek(src){
  cancelAnimationFrame(relaxRaf);
  relaxRaf = 0;
  peekSrc = src;
  stage.classList.add('tilting');
  peekBtn.classList.toggle('on', src === 'button');
}
function endPeek(src){
  if (peekSrc !== src) return;
  peekSrc = null;
  if (src !== 'gyro') peekEndedAt = performance.now();
  peekBtn.classList.remove('on');
  cancelAnimationFrame(sweepRaf);
  sweepRaf = 0;
  const x0 = tilt.x, y0 = tilt.y, t0 = performance.now();
  const step = now => {
    if (peekSrc){ relaxRaf = 0; return; }
    const p = Math.min(1, (now - t0) / 260), e = 1 - Math.pow(1 - p, 3);
    setTilt(x0 * (1 - e), y0 * (1 - e));
    if (p < 1) relaxRaf = requestAnimationFrame(step);
    else { relaxRaf = 0; stage.classList.remove('tilting'); }
  };
  relaxRaf = requestAnimationFrame(step);
}

// 按住按钮：视角绕一圈慢慢转，每个方向都看得到
function sweep(){
  const t0 = performance.now();
  const step = now => {
    if (peekSrc !== 'button') return;
    const s = (now - t0) / 1000, amp = 1.7 * Math.min(1, s / .45), a = Math.PI / 4 + s * 1.5;
    setTilt(Math.cos(a) * amp, Math.sin(a) * amp);
    sweepRaf = requestAnimationFrame(step);
  };
  sweepRaf = requestAnimationFrame(step);
}
peekBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { peekBtn.setPointerCapture(e.pointerId); } catch (err) {}
  enableGyro();
  startPeek('button');
  sweep();
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => peekBtn.addEventListener(n, () => endPeek('button')));
peekBtn.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && !e.repeat){ e.preventDefault(); startPeek('button'); sweep(); }
});
peekBtn.addEventListener('keyup', e => { if (e.key === 'Enter' || e.key === ' ') endPeek('button'); });
peekBtn.addEventListener('contextmenu', e => e.preventDefault());

// 两根手指在牌堆上拖：跟着手指的方向倾斜
const touches = new Map();
let touchStart = null;
const touchMid = () => {
  let x = 0, y = 0;
  for (const p of touches.values()){ x += p.x; y += p.y; }
  return {x: x / touches.size, y: y / touches.size};
};
stage.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'touch') return;
  touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (touches.size === 2 && peekSrc !== 'button'){
    startPeek('touch');
    touchStart = touchMid();
  }
});
stage.addEventListener('pointermove', e => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
  if (peekSrc === 'touch' && touches.size >= 2){
    const m = touchMid();
    setTilt((m.x - touchStart.x) / 50, (m.y - touchStart.y) / 50);
  }
});
const dropTouch = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) endPeek('touch');
};
stage.addEventListener('pointerup', dropTouch);
stage.addEventListener('pointercancel', dropTouch);

// 陀螺仪：手机倾斜超过 7° 才开始动，拿稳时慢慢把当前角度当成“平放”
const gyro = {tried: false, b0: null, g0: null};
function onOrient(e){
  if (e.beta == null || e.gamma == null) return;
  if (gyro.b0 == null){ gyro.b0 = e.beta; gyro.g0 = e.gamma; }
  const f = d => Math.sign(d) * Math.min(TILT_MAX, Math.max(0, Math.abs(d) - 7) / 10);
  const tx = f(e.gamma - gyro.g0), ty = f(e.beta - gyro.b0);
  if (!tx && !ty){ gyro.b0 += (e.beta - gyro.b0) * .03; gyro.g0 += (e.gamma - gyro.g0) * .03; }
  if (peekSrc === 'button' || peekSrc === 'touch') return;
  if (tx || ty){
    if (peekSrc !== 'gyro') startPeek('gyro');
    setTilt(tx, ty);
  } else if (peekSrc === 'gyro') endPeek('gyro');
}
function enableGyro(){
  if (gyro.tried) return;
  gyro.tried = true;
  const D = window.DeviceOrientationEvent;
  if (!D) return;
  const on = () => window.addEventListener('deviceorientation', onOrient);
  // iPhone 要在点按的那一刻申请权限；其他设备直接监听
  if (typeof D.requestPermission === 'function') D.requestPermission().then(r => { if (r === 'granted') on(); }).catch(() => {});
  else on();
}
if (window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission !== 'function') enableGyro();

function relayout(){
  layout();
  stage.classList.add('instant');
  render();
  void stage.offsetWidth;
  stage.classList.remove('instant');
}
let rz = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(relayout); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => relayout());
setInterval(() => { $('clock').textContent = fmt(Math.floor(elapsed() / 1000)); }, 500);

/* ---------- 页面更新时保留对局 ---------- */
function serialize(){
  return {
    v: 1, level: G.level, seed: G.seed, n: G.tiles.length,
    st: G.tiles.map(t => (t.pending ? 3 : ST[t.status])), ty: G.tiles.map(t => t.type),
    slot: G.slot.filter(t => !t.pending).map(t => t.id), hold: G.hold.map(c => c.map(t => t.id)),
    tools: Object.assign({}, G.tools), moves: G.moves, ms: elapsed(), over: G.over, won: G.won
  };
}
function resume(s){
  if (!s || s.v !== 1 || s.won) return false;
  const built = buildLevel(s.level, s.seed);
  if (!built || built.tiles.length !== s.n) return false;
  G.epoch++;
  Object.assign(G, {
    level: s.level, seed: s.seed, cfg: built.cfg, tiles: built.tiles, label: built.label, slot: [], hold: [[], [], []],
    tools: s.tools, history: [], moves: s.moves, over: false, won: false, pending: 0, acc: s.ms || 0, running: false
  });
  restoreSnap(s);
  if (G.tiles.every(t => t.status === 'gone')) return false;
  mountTiles(false);
  if (s.over && G.slot.length >= CAP){ G.over = true; showLose(); } else startClock();
  return true;
}

  },

      bodyStyle.backgroundImage = `repeating-linear-gradient(0deg, rgba(255,255,255,.03) 0 1px, rgba(0,0,0,0) 1px 3px), url(${glitchTexture()}), radial-gradient(120% 90% at 50% 30%, rgba(70,40,170,.35), rgba(0,0,0,0) 70%)`;

    sw: {bg: '#f3f3f0', char: '羊', tile: 'background:#fff;box-shadow:inset 0 0 0 1.5px #111,3px 3px 0 #111;color:#111;font-family:"Ma Shan Zheng",serif'}

};
const iconCache = {};
const iconsFor = id => iconCache[id] || (iconCache[id] = ICONS.map((ic, i) => (SKINS[id].draw ? SKINS[id].draw(ic.m, i) : '')));
let skin = 'knit';

function applySkin(id){
  if (!SKINS[id]) id = 'knit';
  skin = id;
  document.documentElement.dataset.skin = id;
  iconsFor(id).forEach((u, i) => (u ? bodyStyle.setProperty(`--ic-${i}`, `url(${u})`) : bodyStyle.removeProperty(`--ic-${i}`)));
  SKINS[id].paint();
  savePrefs({skin: id});
}

function showSkins(){
  const wrap = document.createElement('div');
  wrap.className = 'skins';
  let lastGroup = '';
  for (const [id, sk] of Object.entries(SKINS)){
    if (sk.group !== lastGroup){
      const h = document.createElement('div');
      h.className = 'skin-group';
      h.textContent = sk.group;
      wrap.appendChild(h);
      lastGroup = sk.group;
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'skin-opt';
    b.setAttribute('aria-pressed', String(id === skin));
    b.setAttribute('aria-label', `${sk.name}：${sk.desc}`);
    const sw = document.createElement('span');
    sw.className = 'sw';
    sw.style.background = sk.sw.bg;
    const tile = document.createElement('span');
    tile.className = 'sw-tile';
    tile.style.cssText = sk.sw.tile;
    if (sk.sw.char){
      const ch = document.createElement('span');
      ch.className = 'sw-char';
      ch.textContent = sk.sw.char;
      tile.appendChild(ch);
    } else {
      const img = document.createElement('img');
      img.alt = '';
      img.src = iconsFor(id)[5];
      tile.appendChild(img);
    }
    sw.appendChild(tile);
    const nm = document.createElement('span');
    nm.className = 'sk-name';
    nm.textContent = sk.name;
    const ds = document.createElement('span');
    ds.className = 'sk-desc';
    ds.textContent = sk.desc;
    b.append(sw, nm, ds);
    b.addEventListener('click', () => {
      applySkin(id);
      closeDialog();
      relayout();
      toast(`换成「${sk.name}」了`);
    });
    wrap.appendChild(b);
  }
  openDialog({kind: 'menu', title: '换个风格', body: '只换外观，这一局的牌和进度都不变。', extra: wrap, actions: [{label: '关闭', run: closeDialog}]});
}

function boot(data){
  layout();
  syncSound();
  const lv = Math.min(Math.max(Number(prefs.level) || 1, 1), 99);
  if (!resume(data && data.game)) startLevel(lv, freshSeed(lv));
}
applySkin(prefs.skin);
try {
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({game: serialize()}));
} catch (e) {}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
