function shade(hex, k){
  const v = parseInt(hex.slice(1), 16);
  const f = c => Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k);
  return `rgb(${f(v >> 16)},${f((v >> 8) & 255)},${f(v & 255)})`;
}

// 实心绣：每一格填满线色、圆一点角，只留一道很淡的斜针。一格是一块，远看不会变成一片小点
function roundRectPath(x, a, b, w, hh, r){
  x.beginPath();
  x.moveTo(a + r, b); x.lineTo(a + w - r, b); x.quadraticCurveTo(a + w, b, a + w, b + r);
  x.lineTo(a + w, b + hh - r); x.quadraticCurveTo(a + w, b + hh, a + w - r, b + hh);
  x.lineTo(a + r, b + hh); x.quadraticCurveTo(a, b + hh, a, b + hh - r);
  x.lineTo(a, b + r); x.quadraticCurveTo(a, b, a + r, b);
  x.closePath();
}
function stitchIcon(rows){
  const {c, x, cell, n} = gridCanvas();
  const cells = [];
  for (let r = 0; r < n; r++){
    for (let q = 0; q < n; q++){
      if (rows[r][q] !== '.') cells.push([r, q, PAL[rows[r][q]]]);
    }
  }
  x.fillStyle = 'rgba(60,35,10,.16)';
  for (const [r, q] of cells) x.fillRect(q * cell, r * cell + 1.6, cell, cell);
  for (const [r, q, col] of cells){
    x.fillStyle = col;
    roundRectPath(x, q * cell + .35, r * cell + .35, cell - .7, cell - .7, 2.2);
    x.fill();
  }
  x.lineCap = 'round';
  x.lineWidth = 1.2;
  x.strokeStyle = 'rgba(255,255,255,.2)';
  for (const [r, q] of cells){
    x.beginPath();
    x.moveTo(q * cell + cell * .78, r * cell + cell * .22);
    x.lineTo(q * cell + cell * .22, r * cell + cell * .78);
    x.stroke();
  }
  return c.toDataURL('image/png');
}

// 靛蓝粗毛衣的平针纹理：每一针是一个 V，针脚放大 2.4 倍，一屏横着只有八针左右
function knitTexture(){
  const w = 48, h = 40.8, cols = 4, rows = 4, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const c = document.createElement('canvas');
  c.width = w * cols * dpr;
  c.height = h * rows * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  x.fillStyle = '#1e3066';
  x.fillRect(0, 0, w * cols, h * rows);
  const rnd = rngFrom(5), tone = [];
  for (let i = 0; i < cols * rows; i++) tone.push(rnd() * .04 - .02);
  for (let r = -1; r <= rows; r++){
    for (let q = -1; q <= cols; q++){
      const k = tone[((r % rows + rows) % rows) * cols + ((q % cols + cols) % cols)];
      for (const side of [-1, 1]){
        const cx = q * w + w / 2 + side * w * .22, cy = r * h + h * .5;
        const g = x.createLinearGradient(cx, cy - h * .55, cx, cy + h * .55);
        g.addColorStop(0, shade('#2f4a8c', k + .02));
        g.addColorStop(1, shade('#253d7c', k));
        x.fillStyle = g;
        x.beginPath();
        x.ellipse(cx, cy, h * .56, w * .19, -side * 1.08, 0, Math.PI * 2);
        x.fill();
      }
    }
  }
  return {url: c.toDataURL('image/png'), w: w * cols, h: h * rows};
}

/* ---------- 另外三套外观的画法（共用同一套 11×11 图案） ---------- */
// 掌机只有四个深浅：每种线色事先指定落在第几阶
const TONE = {R: 1, r: 0, P: 3, Y: 2, O: 1, o: 0, G: 1, g: 2, W: 3, L: 2, K: 0, U: 1, u: 2, T: 1, t: 3, B: 1, S: 2, N: 1, n: 2};
function gridCanvas(){
  const cell = 12, n = 11, size = cell * n, dpr = 2;
  const c = document.createElement('canvas');
  c.width = c.height = size * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  return {c, x, cell, n, size};
}

function pixelIcon(rows){
  const {c, x, cell, n} = gridCanvas();
  const shades = ['#0e200f', '#2f5b22', '#6d9636', '#a8c45a'];
  for (let r = 0; r < n; r++){
    for (let q = 0; q < n; q++){
      const ch = rows[r][q];
      if (ch === '.') continue;
      x.fillStyle = shades[TONE[ch]];
      x.fillRect(q * cell + .5, r * cell + .5, cell - 1, cell - 1);
    }
  }
  return c.toDataURL('image/png');
}

// 孔版：每种颜色拆成黄、粉、蓝三版油墨，各带颗粒、各自错开一点，再叠印
const INK = {y: '255,226,0', p: '255,72,176', b: '0,120,191'};
const RISO = {
  R: {p: 1, y: .75}, r: {p: 1, b: .45}, P: {p: .55}, Y: {y: 1, p: .2}, O: {y: 1, p: .65}, o: {y: 1, p: 1},
  G: {b: .8, y: 1}, g: {y: 1, b: .35}, W: {}, L: {b: .4}, K: {b: 1, p: .85}, U: {b: .8, p: .8}, u: {b: .35, p: .35},
  T: {b: .9, y: .45}, t: {b: .4, y: .25}, B: {b: 1, p: .25}, S: {b: .6}, N: {p: .6, y: .8, b: .5}, n: {y: .5, p: .28}
};
function risoIcon(rows, seed){
  const {c, x, cell, n, size} = gridCanvas();
  const rnd = rngFrom(seed * 131 + 7);
  const offs = {y: [0, 0], p: [1.4, -1], b: [-1.1, 1.2]};
  x.globalCompositeOperation = 'multiply';
  for (const k of ['y', 'p', 'b']){
    const lay = document.createElement('canvas');
    lay.width = lay.height = c.width;
    const lx = lay.getContext('2d');
    lx.scale(2, 2);
    let any = false;
    for (let r = 0; r < n; r++){
      for (let q = 0; q < n; q++){
        const ch = rows[r][q];
        const a = ch === '.' ? 0 : (RISO[ch][k] || 0);
        if (!a) continue;
        any = true;
        lx.fillStyle = `rgba(${INK[k]},${a})`;
        lx.fillRect(q * cell, r * cell, cell, cell);
      }
    }
    if (!any) continue;
    lx.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 170; i++){
      lx.fillStyle = `rgba(0,0,0,${.2 + rnd() * .45})`;
      lx.fillRect(rnd() * size, rnd() * size, .7 + rnd() * 1.3, .7 + rnd() * 1.3);
    }
    x.drawImage(lay, offs[k][0] * (rnd() < .5 ? 1 : -1), offs[k][1], size, size);
  }
  x.globalCompositeOperation = 'source-over';
  return c.toDataURL('image/png');
}

// 构成：每种图案重新设计成红黄蓝黑的几何构成（坐标以 100 为边长）
function bauhausIcon(i){
  const {c, x, size} = gridCanvas();
  x.scale(size / 100, size / 100);
  const R = '#d6322b', Y = '#f2c230', B = '#1e4fa3', K = '#151515', W = '#ffffff';
  const circ = (cx, cy, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill(); };
  const rect = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
  const tri = (pts, col) => { x.fillStyle = col; x.beginPath(); pts.forEach(([a, b], k) => (k ? x.lineTo(a, b) : x.moveTo(a, b))); x.closePath(); x.fill(); };
  const half = (cx, cy, r, a0, a1, col) => { x.fillStyle = col; x.beginPath(); x.moveTo(cx, cy); x.arc(cx, cy, r, a0, a1); x.closePath(); x.fill(); };
  const line = (a, b, p, q, w, col) => { x.strokeStyle = col; x.lineWidth = w; x.lineCap = 'butt'; x.beginPath(); x.moveTo(a, b); x.lineTo(p, q); x.stroke(); };
  const ring = (cx, cy, r, w, col, a0 = 0, a1 = Math.PI * 2) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.arc(cx, cy, r, a0, a1); x.stroke(); };
  const PI = Math.PI;
  switch (i){
    case 0: circ(33, 40, 19, R); circ(67, 40, 19, R); tri([[15, 47], [85, 47], [50, 88]], R); break;
    case 1: tri([[50, 8], [88, 72], [12, 72]], Y); tri([[50, 92], [12, 28], [88, 28]], Y); circ(50, 50, 8, K); break;
    case 2: circ(50, 26, 17, B); circ(50, 74, 17, B); circ(26, 50, 17, B); circ(74, 50, 17, B); circ(50, 50, 13, Y); break;
    case 3: tri([[28, 30], [72, 30], [50, 94]], Y); rect(36, 44, 22, 4, K); rect(44, 60, 16, 4, K); rect(38, 8, 6, 20, K); rect(56, 8, 6, 20, K); break;
    case 4: circ(34, 34, 15, K); circ(66, 34, 15, K); circ(34, 66, 15, K); circ(66, 66, 15, K); rect(43, 43, 14, 14, R); break;
    case 5: circ(50, 46, 37, Y); rect(37, 38, 26, 44, K); circ(44, 52, 4, W); circ(56, 52, 4, W); break;
    case 6: circ(48, 48, 38, B); ring(48, 48, 26, 4, K, .2 * PI, 1.3 * PI); ring(48, 48, 13, 4, K, 1.1 * PI, 2.1 * PI); line(76, 76, 94, 94, 4, K); break;
    case 7: x.fillStyle = B; x.beginPath(); x.ellipse(44, 50, 30, 19, 0, 0, PI * 2); x.fill(); tri([[68, 50], [92, 30], [92, 70]], B); circ(32, 46, 4.5, W); break;
    case 8: rect(30, 20, 40, 52, K); circ(50, 20, 20, K); circ(24, 52, 10, K); rect(28, 72, 44, 14, Y); break;
    case 9: circ(50, 62, 27, B); tri([[50, 8], [26, 52], [74, 52]], B); circ(41, 62, 6, W); break;
    case 10: half(50, 56, 40, PI, 2 * PI, K); rect(40, 56, 20, 34, R); circ(34, 42, 5, W); circ(62, 34, 5, W); break;
    case 11: half(50, 30, 42, 0, PI, K); half(50, 30, 35, 0, PI, R); circ(38, 44, 3.5, K); circ(50, 52, 3.5, K); circ(62, 44, 3.5, K); break;
    case 12: circ(37, 72, 14, K); rect(45, 14, 6, 60, K); tri([[51, 14], [80, 28], [51, 40]], K); break;
    case 13: circ(50, 66, 26, Y); circ(50, 38, 16, Y); rect(48, 8, 5, 18, K); tri([[53, 16], [72, 8], [66, 22]], K); break;
    case 14: ring(32, 52, 14, 4, K); ring(51, 42, 17, 4, K); ring(69, 54, 13, 4, K); rect(18, 66, 64, 4, K); rect(32, 76, 4, 14, B); rect(49, 80, 4, 14, B); rect(66, 76, 4, 14, B); break;
    default: line(32, 56, 56, 14, 4, K); line(70, 52, 56, 14, 4, K); circ(32, 70, 16, R); circ(70, 66, 16, R); break;
  }
  return c.toDataURL('image/png');
}

// 孔版纸张的颗粒
function grainTexture(){
  const S = 180, dpr = Math.min(window.devicePixelRatio || 1, 2);
  const c = document.createElement('canvas');
  c.width = c.height = S * dpr;
  const x = c.getContext('2d');
  x.scale(dpr, dpr);
  const rnd = rngFrom(11);
  for (let i = 0; i < 900; i++){
    x.fillStyle = rnd() < .5 ? `rgba(0,120,191,${.05 + rnd() * .12})` : `rgba(255,72,176,${.05 + rnd() * .12})`;
    x.fillRect(rnd() * S, rnd() * S, .6 + rnd() * 1.1, .6 + rnd() * 1.1);
  }
  for (let i = 0; i < 500; i++){
    x.fillStyle = `rgba(60,55,40,${.03 + rnd() * .05})`;
    x.fillRect(rnd() * S, rnd() * S, 1 + rnd() * 2, .5);
  }
  return c.toDataURL('image/png');
}

const $ = id => document.getElementById(id);
const stage = $('stage'), trough = $('trough'), shelf = $('shelf'), meter = $('meter');

/* ---------- 偏好与音效 ---------- */
const PREF_KEY = 'mielegemie:v1';
const prefs = (() => {
  try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (e) { return {}; }
})();
function savePrefs(p){
  Object.assign(prefs, p);
  try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
}

const Sound = {
  on: prefs.sound !== false,
  ctx: null,
  pitch: 1,   // 深渊里整体压低
  tone(f, d = .09, type = 'triangle', v = .05, at = 0){
    if (!this.on) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx;
      if (c.state === 'suspended') c.resume();
      const t0 = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f * this.pitch, t0);
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(v, t0 + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + d + .03);
    } catch (e) {}
  },
  tap(){ this.tone(540, .07); },
  bump(){ this.tone(170, .07, 'square', .02); },
  match(){ this.tone(660, .1, 'sine', .06); this.tone(880, .12, 'sine', .06, .07); this.tone(1320, .16, 'sine', .04, .14); },
  tool(){ this.tone(420, .1, 'sine', .05); this.tone(630, .12, 'sine', .04, .06); },
  lose(){ this.tone(260, .22, 'sawtooth', .025); this.tone(180, .34, 'sawtooth', .025, .16); },
  boom(){ this.tone(120, .32, 'sawtooth', .07); this.tone(62, .5, 'square', .05, .03); this.tone(40, .6, 'sine', .08, .05); },
  win(){ [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .2, 'triangle', .06, i * .11)); },
  // 白噪声过一个滤波器（从 f0 扫到 f1）：塌方、风声、落地的闷响
  noise(d, v, at = 0, f0 = 800, f1 = f0, type = 'lowpass', q = 1, atk = .02){
    if (!this.on) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx;
      if (c.state === 'suspended') c.resume();
      if (!this.nbuf){
        const b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), ch = b.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
        this.nbuf = b;
      }
      const t0 = c.currentTime + at, n = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
      n.buffer = this.nbuf;
      n.loop = true;
      fl.type = type;
      fl.Q.value = q;
      fl.frequency.setValueAtTime(f0, t0);
      fl.frequency.exponentialRampToValueAtTime(f1, t0 + d);
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(v, t0 + atk);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
      n.connect(fl); fl.connect(g); g.connect(c.destination);
      n.start(t0, Math.random() * 1.5);
      n.stop(t0 + d + .05);
    } catch (e) {}
  },
  // 音高一路滑下去
  slide(f0, f1, d, type = 'sine', v = .05, at = 0){
    if (!this.on) return;
    try {
      if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      const c = this.ctx;
      if (c.state === 'suspended') c.resume();
      const t0 = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
      o.type = type;
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(f1, t0 + d);
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(v, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + d + .03);
    } catch (e) {}
  },
  // 掉进下一层：地底轰隆隆、碎石往下掉 → 裂开 → 风声呼啸 → 砸到底；换了一段（墓穴、地狱）再敲一下低音
  rumble(){
    this.noise(1.2, .13, 0, 150, 70, 'lowpass', 1, .3);
    this.slide(56, 38, 1.1, 'sine', .06);
    for (let i = 0; i < 6; i++) this.noise(.07, .035, .25 + i * .12 + Math.random() * .05, 2600, 900, 'bandpass', 3, .004);
  },
  crack(){ this.noise(.2, .14, 0, 4200, 600, 'bandpass', .8, .003); this.slide(130, 42, .4, 'triangle', .08); this.noise(.7, .1, .04, 900, 110, 'lowpass', 1, .01); },
  whoosh(){ this.noise(1.45, .22, 0, 320, 2300, 'bandpass', 1.3, .4); this.noise(1.4, .13, 0, 220, 120, 'lowpass', 1, .25); this.slide(640, 150, 1.3, 'sine', .02); },
  impact(){ this.slide(120, 30, .75, 'sine', .11); this.noise(.8, .12, 0, 1500, 60, 'lowpass', 1, .003); this.noise(.12, .06, 0, 3200, 1500, 'bandpass', 1, .002); this.tone(70, .45, 'square', .02); },
  stinger(){ [220, 311, 440].forEach((f, i) => this.tone(f, 1.7 - i * .25, i ? 'sine' : 'triangle', .05 - i * .012, i * .03)); },
  // 深渊里打怪：砍中、怪出招、怪倒下；烛火灭、起雾、岩浆、锁链
  hit(){ this.noise(.12, .1, 0, 2600, 700, 'bandpass', 1.2, .003); this.tone(190, .12, 'square', .025); },
  growl(){ this.slide(120, 70, .38, 'sawtooth', .03); this.noise(.3, .045, 0, 420, 200, 'lowpass', 1, .03); },
  foeDie(){ this.slide(340, 55, .65, 'sawtooth', .035); this.noise(.55, .07, .08, 1300, 180, 'lowpass', 1, .01); },
  snuff(){ this.noise(.4, .08, 0, 1900, 260, 'bandpass', 1, .01); for (let i = 0; i < 5; i++) this.noise(.05, .035, .12 + i * .06, 3200, 2200, 'bandpass', 4, .003); },
  fog(){ this.noise(1.1, .055, 0, 300, 900, 'bandpass', .7, .4); },
  lava(){ this.noise(.7, .09, 0, 220, 90, 'lowpass', 1, .05); this.noise(.45, .03, .05, 3000, 5200, 'highpass', .7, .02); },
  chain(){ this.tone(980, .07, 'square', .02); this.tone(1470, .12, 'triangle', .018, .05); },
  flame(){ this.noise(.55, .1, 0, 500, 2600, 'bandpass', .8, .04); for (let i = 0; i < 5; i++) this.noise(.03, .03, .08 + i * .07 + Math.random() * .03, 4200, 3000, 'bandpass', 3, .002); },
  coin(){ this.tone(1320, .06, 'square', .02); this.tone(1760, .1, 'square', .018, .05); },
  hurt(){ this.tone(150, .26, 'sawtooth', .05); this.tone(92, .4, 'square', .04, .09); },
  wind(){ for (let i = 0; i < 6; i++) this.tone(300 + i * 70, .16, 'sine', .018, i * .04); },
  fanfare(){
    [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, .22, 'triangle', .06, i * .12));
    [523, 659, 784, 1047].forEach(f => this.tone(f, .9, 'sine', .035, .9));
  }
};

/* ---------- 背景音乐：四首可换，《老麦克唐纳有块地》《欢乐颂》《友谊地久天长》都早已是公版，《蹦蹦咩》是自己写的；全部现场合成 ---------- */
const Music = (() => {
  const VOL = .09;          // 比点牌的音效轻
  let out = null, master = null, send = null, noiseBuf = null, timer = 0, step = 0, next = 0, playing = false, swapTok = 0;
  const C = () => Sound.ctx;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  function vca(t, peak, a, hold, rel){
    const g = C().createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.setValueAtTime(peak, t + a + hold);
    g.gain.exponentialRampToValueAtTime(.0001, t + a + hold + rel);
    return g;
  }
  function osc(type, f, t, end){
    const o = C().createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    o.start(t);
    o.stop(end);
    return o;
  }
  function noise(t, end){
    const n = C().createBufferSource();
    n.buffer = noiseBuf;
    n.loop = true;
    n.start(t, Math.random() * .5);
    n.stop(end);
    return n;
  }
  function filt(type, f, q = 1){
    const b = C().createBiquadFilter();
    b.type = type;
    b.frequency.value = f;
    b.Q.value = q;
    return b;
  }
  function gain(v){
    const g = C().createGain();
    g.gain.value = v;
    return g;
  }
  function chain(...nodes){
    for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]);
  }

  // 乐器：大号、拨弦、梆子、鼓、沙锤、口哨、滑哨、长笛、弦乐、八音盒、电钢琴，还有小羊
  const I = {
    bass(t, m, dur, v, type, bright){
      const o = osc(type, mtof(m), t, t + dur + .1), f = filt('lowpass', bright, 3);
      f.frequency.setValueAtTime(bright, t);
      f.frequency.exponentialRampToValueAtTime(Math.max(200, bright * .2), t + .12);
      chain(o, f, vca(t, .32 * v, .004, Math.max(0, dur - .06), .06), out);
    },
    // 八音盒：基音加几个很轻的泛音，长长地衰减
    box(t, m, v){
      const f = mtof(m), end = t + 1.7;
      for (const [k, a, rel] of [[1, .22, 1.5], [2, .06, .6], [3.01, .03, .4], [4.2, .015, .25]]){
        chain(osc('sine', f * k, t, end), vca(t, a * v, .002, 0, rel), out);
      }
    },
    // 柔和的电钢琴和弦
    keys(t, ms, dur, v){
      for (const m of ms){
        const f = mtof(m), end = t + dur + .5, lp = filt('lowpass', 1600, .5), g2 = gain(.25);
        osc('triangle', f, t, end).connect(lp);
        osc('sine', f * 2.001, t, end).connect(g2);
        g2.connect(lp);
        chain(lp, vca(t, .045 * v, .02, dur * .6, dur * .4 + .35), out);
      }
    },
    snare(t, v){
      chain(noise(t, t + .2), filt('bandpass', 1900, .8), vca(t, .35 * v, .002, 0, .14), out);
      chain(osc('triangle', 185, t, t + .12), vca(t, .25 * v, .002, 0, .08), out);
    },
    hat(t, v){
      chain(noise(t, t + .3), filt('highpass', 7200, .7), vca(t, .16 * v, .001, 0, .035), out);
    },
    // 镲：噪声加几支不成和声的方波
    cymbal(t, v){
      chain(noise(t, t + .7), filt('highpass', 4200, .5), vca(t, .22 * v, .002, .02, .45), out);
      for (const f of [431, 587, 845, 1103]) chain(osc('square', f, t, t + .5), filt('highpass', 6000, .7), vca(t, .018 * v, .002, 0, .35), out);
    },
    cello(t, m, dur, v){
      chain(osc('sawtooth', mtof(m), t, t + dur + .4), filt('lowpass', 900, .7), vca(t, .14 * v, .08, Math.max(0, dur - .1), .3), out);
    },
    // 弦乐铺底：每个音两支微微跑调的锯齿波，慢慢进、慢慢收
    strings(t, ms, dur, v){
      for (const m of ms){
        const f = mtof(m), end = t + dur + .8, lp = filt('lowpass', 1500, .6);
        for (const det of [-.004, .004]) osc('sawtooth', f * (1 + det), t, end).connect(lp);
        const g = C().createGain();
        g.gain.setValueAtTime(.0001, t);
        g.gain.exponentialRampToValueAtTime(.03 * v, t + .3);
        g.gain.setValueAtTime(.03 * v, t + Math.max(.3, dur));
        g.gain.exponentialRampToValueAtTime(.0001, t + dur + .75);
        chain(lp, g, out);
      }
    },
    // 长笛：正弦波为主，带气声和慢慢起来的颤音
    flute(t, m, dur, v){
      const f = mtof(m), end = t + dur + .2, o = osc('sine', f, t, end), o2 = osc('triangle', f, t, end);
      const l = osc('sine', 5, t, end), dp = C().createGain();
      dp.gain.setValueAtTime(0, t);
      dp.gain.linearRampToValueAtTime(f * .006, t + Math.min(.4, dur));
      l.connect(dp);
      dp.connect(o.frequency);
      dp.connect(o2.frequency);
      const mix = gain(1), g2 = gain(.25);
      o.connect(mix);
      o2.connect(g2);
      g2.connect(mix);
      chain(mix, vca(t, .12 * v, .07, Math.max(0, dur - .08), .15), out);
      chain(noise(t, end), filt('bandpass', f, 12), vca(t, .04 * v, .05, Math.max(0, dur - .08), .12), out);
    },
    // 滑哨：一路滑上去
    slide(t, dur){
      const o = osc('sine', 520, t, t + dur + .05);
      o.frequency.exponentialRampToValueAtTime(1560, t + dur);
      const l = osc('sine', 7, t, t + dur + .05), d = gain(14);
      l.connect(d);
      d.connect(o.frequency);
      chain(o, vca(t, .13, .03, Math.max(0, dur - .06), .06), out);
    },
    kick(t, v){
      const o = osc('sine', 150, t, t + .32);
      o.frequency.exponentialRampToValueAtTime(44, t + .11);
      chain(o, vca(t, .95 * v, .003, .02, .24), out);
    },
    shaker(t, v){
      chain(noise(t, t + .1), filt('highpass', 5500, .7), vca(t, .07 * v, .006, 0, .05), out);
    },
    block(t, m, v){
      const f = mtof(m), o = osc('sine', f, t, t + .1);
      o.frequency.exponentialRampToValueAtTime(f * .94, t + .06);
      chain(o, vca(t, .3 * v, .001, 0, .06), out);
      chain(osc('triangle', f * 2.63, t, t + .05), vca(t, .06 * v, .001, 0, .025), out);
    },
    tuba(t, m, dur, v){
      const o = osc('sawtooth', mtof(m), t, t + dur + .1), lp = filt('lowpass', 260, 1.5);
      lp.frequency.setValueAtTime(260, t);
      lp.frequency.linearRampToValueAtTime(560, t + .05);
      chain(o, lp, vca(t, .5 * v, .03, dur * .5, dur * .4 + .05), out);
    },
    pizz(t, ms, v = 1){
      for (const m of ms){
        const f = mtof(m), lp = filt('lowpass', 2600, .8), g2 = gain(.3);
        osc('triangle', f, t, t + .3).connect(lp);
        osc('sawtooth', f, t, t + .3).connect(g2);
        g2.connect(lp);
        chain(lp, vca(t, .07 * v, .003, 0, .18), out);
      }
    },
    whistle(t, m, dur){
      const f = mtof(m), end = t + dur + .06, o = osc('sine', f * .97, t, end);
      o.frequency.exponentialRampToValueAtTime(f, t + .04);
      const l = osc('sine', 6, t, end), d = gain(f * .01);
      l.connect(d);
      d.connect(o.frequency);
      chain(o, vca(t, .16, .02, Math.max(0, dur - .05), .05), out);
      chain(noise(t, end), filt('bandpass', f * 2, 8), vca(t, .05, .02, Math.max(0, dur - .05), .05), out);
    },
    // 羊叫：锯齿波过三个元音共振峰，每秒抖十七下，开头嘴闭着像「m」
    baa(t, m, dur, v = 1){
      const f0 = mtof(m), end = t + dur + .06;
      const o = osc('sawtooth', f0 * 1.06, t, end);
      o.frequency.linearRampToValueAtTime(f0, t + .08);
      o.frequency.linearRampToValueAtTime(f0 * .9, end);
      const trem = osc('sine', 17, t, end), am = gain(.55), amDepth = gain(.45), wob = gain(f0 * .025);
      trem.connect(amDepth);
      amDepth.connect(am.gain);
      trem.connect(wob);
      wob.connect(o.frequency);
      const lp = filt('lowpass', 350, .7);
      lp.frequency.setValueAtTime(350, t);
      lp.frequency.exponentialRampToValueAtTime(5000, t + .07);
      o.connect(am);
      am.connect(lp);
      const sum = gain(1.6);
      for (const [f, q, lv] of [[560, 5, 1], [1750, 7, .7], [2600, 8, .3]]){
        const b = filt('bandpass', f, q), g = gain(lv);
        lp.connect(b);
        b.connect(g);
        g.connect(sum);
      }
      const env = C().createGain();
      env.gain.setValueAtTime(.0001, t);
      env.gain.exponentialRampToValueAtTime(.9 * v, t + .03);
      env.gain.setValueAtTime(.9 * v, t + Math.max(.035, dur * .7));
      env.gain.exponentialRampToValueAtTime(.0001, end);
      chain(sum, env, out);
    }
  };

  // 记谱：每小节 16 格，一格一个十六分音符。「.」休止，「-」延长上一个音，带「*」的音由小羊来唱
  function nm(x){
    const r = /^([A-G])(#|b)?(-?\d)$/.exec(x);
    return {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11}[r[1]] + (r[2] === '#' ? 1 : r[2] === 'b' ? -1 : 0) + (+r[3] + 1) * 12;
  }
  function bar(str){
    const tok = str.trim().split(/\s+/), ev = [];
    tok.forEach((x, i) => {
      if (x === '.') return;
      if (x === '-'){
        const e = ev[ev.length - 1];
        if (e && e.step + e.len === i) e.len++;
        return;
      }
      ev.push({step: i, m: nm(x.replace('*', '')), len: 1, baa: x[0] === '*'});
    });
    ev.forEach((e, k) => {
      const nx = k + 1 < ev.length ? ev[k + 1].step : 16;
      e.len = Math.max(e.len, Math.min(3, nx - e.step));
    });
    const at = {};
    for (const e of ev) at[e.step] = e;
    return at;
  }
  // 《老麦克唐纳有块地》：大号「嘭—嚓」、口哨唱主旋律，「这里咩咩、那里咩咩」换成小羊自己唱
  const VERSE = [
    'G5 - . . G5 - . . G5 - . . D5 - . .',
    'E5 - . . E5 - . . D5 - - - - - . .',
    'B5 - . . B5 - . . A5 - . . A5 - . .'
  ];
  const FARM = [
    ...VERSE, 'G5 - - - - - - - - - - - . . . .',
    ...VERSE, 'G5 - - - - - - - - - - . D5 . D5 .',
    '*G4 - - . *G4 - - . G5 - - . D5 . D5 .',
    '*G4 - - . *G4 - - . G5 - - - - - - .',
    'G5 . G5 . *G4 - - . G5 . G5 . *G4 - - .',
    'G5 . G5 . G5 . G5 . *G4 - - . *G4 - - .',
    ...VERSE, 'G5 - - - - - - - - - - - . . . .'
  ].map(bar);
  const HALVES = [[43, 43], [48, 43], [43, 38], [43, 43]];
  const CHORD = {43: [62, 67, 71], 48: [60, 64, 67], 38: [62, 66, 69]};
  function playFarm(b, s, t, d){
    const root = (b >= 8 && b < 12 ? (b === 11 ? [43, 38] : [43, 43]) : HALVES[b % 4])[s < 8 ? 0 : 1];
    if (s === 0 || s === 8){
      I.tuba(t, root, d * 3, s ? .9 : 1);
      I.kick(t, .45);
    }
    if (s === 4 || s === 12){
      I.pizz(t, CHORD[root]);
      I.block(t, 76, .45);
    }
    if (s % 2 === 0) I.shaker(t, s % 4 ? .7 : 1);
    const e = FARM[b][s];
    if (e){
      if (e.baa) I.baa(t, e.m, e.len * d * .95);
      else I.whistle(t, e.m, e.len * d);
    }
  }

  // 《欢乐颂》：长笛吹主旋律，拨弦和大提琴打拍子；后半段弦乐和小鼓加进来
  const JOY_A = [
    'E5 - - - E5 - - - F5 - - - G5 - - -',
    'G5 - - - F5 - - - E5 - - - D5 - - -',
    'C5 - - - C5 - - - D5 - - - E5 - - -'
  ];
  const JOY = [
    ...JOY_A, 'E5 - - - - - D5 - D5 - - - - - - -',
    ...JOY_A, 'D5 - - - - - C5 - C5 - - - - - - -',
    'D5 - - - D5 - - - E5 - - - C5 - - -',
    'D5 - - - E5 - F5 - E5 - - - C5 - - -',
    'D5 - - - E5 - F5 - E5 - - - D5 - - -',
    'C5 - - - D5 - - - G4 - - - - - - -',
    ...JOY_A, 'D5 - - - - - C5 - C5 - - - - - - -'
  ].map(bar);
  const HARM = {C: {root: 48, ch: [64, 67, 72]}, G: {root: 43, ch: [62, 67, 71]}};
  function playJoy(b, s, t, d){
    const plan = ['CC', 'GG', 'CC', 'CG', 'CC', 'GG', 'CC', 'GC', 'GC', 'GC', 'GG', 'CG', 'CC', 'GG', 'CC', 'GC'][b];
    const h = HARM[plan[s < 8 ? 0 : 1]], late = b >= 8;
    if (s === 0 || s === 8){
      I.cello(t, h.root - 12, d * 7, .7);
      I.kick(t, .4);

  const AULD = [
    'C5 - - - - - C5 - C5 - - - E5 - - -',
    'D5 - - - - - C5 - D5 - - - E5 - - -',
    'C5 - - - - - C5 - E5 - - - G5 - - -',
    'A5 - - - - - - - - - - - A5 - - -',
    'G5 - - - - - E5 - E5 - - - C5 - - -',

  const AULD_PLAN = ['C', 'G', 'C', 'F', 'C', 'G', 'FG', 'C'];
  const AULD_H = {C: [48, [55, 60, 64]], G: [43, [55, 59, 62]], F: [41, [53, 57, 60]]};
  function playAuld(b, s, t, d){

  // 深渊：不放曲子，只有低沉的嗡嗡声、远处的钟和风声；越往下越不和谐，地窖里有水滴，地狱里有火的噼啪和心跳
  let depth = 0;
  function playHell(b, s, t, d){

  }
  const MOODS = {hell: {name: '地府', bpm: 60, len: 4, gain: 1.25, reverb: .55, play: playHell}};
  let mood = '';
  // gain 让几首听起来一样响；reverb 是送去混响的量，只有八音盒那首用
  const SONGS = {
    farm: {name: '老麦克唐纳有块地', desc: '大号、口哨，小羊唱「咩咩」', bpm: 132, len: FARM.length, gain: 1, play: playFarm},
    joy: {name: '欢乐颂', desc: '长笛和弦乐，越来越亮', bpm: 116, len: JOY.length, gain: .9, play: playJoy},
    bounce: {name: '蹦蹦咩', desc: '口哨和滑哨，卡通片里跑来跑去', bpm: 126, len: BOUNCE.length, gain: .92, play: playBounce},
    auld: {name: '友谊地久天长', desc: '八音盒，慢、干净，带一点回声', bpm: 70, len: AULD.length, gain: 1.05, reverb: .45, play: playAuld}
  };
  let cur = SONGS[prefs.bgm] ? prefs.bgm : 'farm';

  const nowSong = () => (mood ? MOODS[mood] : SONGS[cur]);
  function pump(){
    const c = C(), song = nowSong(), d = 60 / song.bpm / 4;
    while (next < c.currentTime + .15){

      step++;
    }
  }
  function begin(){
    clearInterval(timer);

    step = 0;
    next = C().currentTime + .1;
    timer = setInterval(pump, 25);
    pump();
  }
  function setup(c){
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16;
    comp.knee.value = 8;
    comp.ratio.value = 4;
    comp.attack.value = .003;
    comp.release.value = .18;
    out = c.createGain();
    master = c.createGain();
    master.gain.value = 0;
    out.connect(comp);
    comp.connect(master);
    master.connect(c.destination);
    const len = c.sampleRate, d = (noiseBuf = c.createBuffer(1, len, len)).getChannelData(0), rnd = rngFrom(3);
    for (let i = 0; i < len; i++) d[i] = rnd() * 2 - 1;
    // 混响：一段慢慢衰减的噪声当作房间的回声
    const rlen = Math.floor(c.sampleRate * 2.4), ir = c.createBuffer(2, rlen, c.sampleRate), rr = rngFrom(11);

    }

    send = c.createGain();
    send.gain.value = 0;
    out.connect(send);
    send.connect(verb);

    // 浏览器要等玩家点一下才让出声，所以每次点屏幕都试着开一次
    start(){

    stop(){
      if (!playing) return;
      playing = false;
      swapTok++;
      clearInterval(timer);
      fade(0, .3);
    },
    songs: SONGS,
    get current(){ return cur; },
    set depth(z){ depth = z; },
    // 换气氛（深渊里不放曲子）：正在放就淡出再换
    mood(m){
      if (m === mood) return;
      mood = m;
      if (!playing) return;
      const tok = ++swapTok;
      clearInterval(timer);
      fade(0, .4);
      setTimeout(() => {
        if (tok !== swapTok || !playing) return;
        fade(VOL, 1.4);
        begin();
      }, 450);
    },
    // 换歌：正在放就先淡出，再从头放新的一首
    set(id){
      if (!SONGS[id] || id === cur) return;
      cur = id;
      if (!playing) return;
      const tok = ++swapTok;
      clearInterval(timer);
      fade(0, .25);
      setTimeout(() => {
        if (tok !== swapTok || !playing) return;
        fade(VOL, .6);
        begin();
      }, 300);

})();

/* ---------- 随机数（同一个种子永远发出同一副牌） ---------- */
function rngFrom(seed){
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const newSeed = () => 1 + Math.floor(Math.random() * 2147483000);
// 新开一局：尽量不和上一局用同一种摆法
function freshSeed(level){
  let s = newSeed();
  for (let i = 0; level > 1 && i < 12 && archOf(s).id === prefs.lastArch; i++) s = newSeed();
  return s;
}
const pickOne = (arr, rng) => arr[Math.floor(rng() * arr.length)];
function shuffled(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ---------- 摆牌：坐标以一张牌的边长为 1 ---------- */
function introLayout(){
  const out = [];
  for (let z = 0; z < 3; z++)
    for (const y of [1.9, 3.15, 4.4])
      for (const x of [1.75, 3, 4.25]) out.push({x, y: y - (2 - z) * .17, z});
  return out;
}

const OFFSETS = [[0, 0], [.5, .5], [.5, 0], [0, .5]];
function layerShape(rng){
  const kind = pickOne(['rect', 'rect', 'twin', 'frame', 'diamond', 'cross'], rng);
  if (kind === 'rect'){
    const hw = pickOne([1, 1.5, 2, 2.5, 3], rng) + .01, top = .5 + rng() * 2, bot = 6.5 - rng() * 2;
    return (dx, dy, cy) => dx <= hw && cy >= top && cy <= bot;
  }
  if (kind === 'twin'){
    const inner = pickOne([.5, 1, 1.5], rng) - .01, outer = inner + pickOne([1.5, 2], rng) + .02;
    const top = .5 + rng() * 2.5, bot = 6.5 - rng() * 2.5;
    return (dx, dy, cy) => dx >= inner && dx <= outer && cy >= top && cy <= bot;
  }
  if (kind === 'frame'){
    const hw = pickOne([2.5, 3], rng) + .01, hh = pickOne([2.5, 3], rng) + .01;
    return (dx, dy) => dx <= hw && dy <= hh && (dx >= hw - 1.05 || dy >= hh - 1.05);
  }
  if (kind === 'diamond'){
    const a = pickOne([2.5, 3, 3.5], rng), b = pickOne([2.5, 3, 3.5], rng);
    return (dx, dy) => dx / a + dy / b <= 1.02;
  }
  const w = pickOne([.5, 1], rng) + .01;
  return (dx, dy) => dx <= w || dy <= w;
}

/* ---------- 九种摆法：每局先抽一种大轮廓，再在里面随机 ---------- */
const snap = v => Math.round(v * 2) / 2;

// 按左右对称生成一层；keep(dx, cy, cx) 决定某个位置要不要放牌
function symLayer(rng, z, ox, oy, keep, dens){
  const cols = ox ? 6 : 7, rows = oy ? 6 : 7, out = [];
  for (let r = 0; r < rows; r++){
    const y = r + oy, cy = y + .5;
    for (let c = 0; c < Math.ceil(cols / 2); c++){
      const x = c + ox, mx = cols - 1 - c + ox, cx = x + .5;
      if (!keep(Math.abs(cx - 3.5), cy, cx) || rng() > dens) continue;
      out.push({x, y, z});
      if (mx !== x) out.push({x: mx, y, z});
    }
  }
  return out;
}

// 方阵：每层随机一种形状，相邻两层错开半张
function buildBlock(rng, cfg){
  const out = [];
  let prev = 0, z = 0, tries = 0;
  while (z < cfg.maxLayers && out.length < cfg.target && tries++ < 80){
    let oi = 0;
    if (z > 0){
      oi = Math.floor(rng() * 4);
      if (oi === prev) oi = (oi + 1 + Math.floor(rng() * 3)) % 4;
    }
    const [ox, oy] = OFFSETS[oi];
    const shape = layerShape(rng);
    const layer = symLayer(rng, z, ox, oy, (dx, cy) => shape(dx, Math.abs(cy - 3.5), cy), cfg.density);
    if (layer.length < 6) continue;
    out.push(...layer);
    prev = oi;
    z++;
  }
  return out;
}

// 金字塔：一层比一层小，中间最深
function buildPyramid(rng, cfg){
  const out = [], w0 = pickOne([3, 3.5], rng), h0 = pickOne([2.5, 3, 3.5], rng);
  const rep = rng() < .6 ? 2 : 1, step = pickOne([.5, .6, .75], rng);
  let z = 0, lvl = 0;
  while (out.length < cfg.target && z < 18){
    const hw = w0 - lvl * step, hh = h0 - lvl * step;
    if (hw < .45 || hh < .45){ lvl = Math.max(0, lvl - 3); continue; }
    const [ox, oy] = z % 2 ? [.5, .5] : [0, 0];
    out.push(...symLayer(rng, z, ox, oy, (dx, cy) => dx <= hw + .01 && Math.abs(cy - 3.5) <= hh + .01, .93));
    z++;
    if (z % rep === 0) lvl++;
  }
  return out;
}

// 双塔：左右两根高柱，底下偶尔搭一道桥
function buildTowers(rng, cfg){
  const out = [], mid = pickOne([1.5, 2, 2.5], rng), w = pickOne([.5, 1], rng) + .01;
  const top = .5 + rng() * 1.5, bot = 6.5 - rng() * 1.5, bridge = rng() < .7;
  let z = 0;
  while (out.length < cfg.target && z < 20){
    const [ox, oy] = OFFSETS[[0, 1, 2, 1][z % 4]];
    out.push(...symLayer(rng, z, ox, oy, (dx, cy) =>
      (Math.abs(dx - mid) <= w && cy >= top && cy <= bot) || (bridge && z < 2 && Math.abs(cy - 3.5) <= .6), .92));
    z++;
  }
  return out;
}

// 回环：中空的方框，有时中心再立一根深柱
function buildRing(rng, cfg){
  const out = [], core = rng() < .55, th = pickOne([1, 1.5], rng), hh = pickOne([2.5, 3], rng) + .01;
  let z = 0;
  while (out.length < cfg.target && z < 16){
    const [ox, oy] = z % 2 ? [.5, .5] : [0, 0];
    const hw = 3 - (z % 3) * .5 + .01;
    out.push(...symLayer(rng, z, ox, oy, (dx, cy) => {
      const dy = Math.abs(cy - 3.5);
      return (dx <= hw && dy <= hh && (dx >= hw - th || dy >= hh - th)) || (core && dx <= .6 && dy <= .6);
    }, .9));
    z++;
  }
  return out;
}

// 群岛：散落的小堆，不对称；每个小堆的每一层都有自己的层号
function buildIslands(rng, cfg){
  const out = [], sizes = [[1, 1], [2, 1], [1, 2], [2, 2], [3, 2], [2, 3]];
  let z = 0, guard = 0;
  while (out.length < cfg.target && guard++ < 40){
    const [w, h] = pickOne(sizes, rng);
    const bx = snap(rng() * (6.5 - w)), by = snap(rng() * (7 - h));
    const depth = 3 + Math.floor(rng() * 5);
    for (let d = 0; d < depth; d++){
      const ox = d % 2 ? pickOne([.5, -.5], rng) : 0, oy = d % 2 ? pickOne([.5, 0], rng) : 0;
      for (let r = 0; r < h; r++){
        for (let c = 0; c < w; c++){
          const x = bx + c + ox, y = by + r + oy;
          if (x < 0 || x > 6 || y < 0 || y > 6.5 || rng() > .9) continue;
          out.push({x, y, z});
        }
      }
      z++;
    }
  }
  return out;
}

// 漩涡：一块牌沿着圆圈一层层挪位置往上盘
function buildSwirl(rng, cfg){
  const out = [], R = 1 + rng() * .9, dir = rng() < .5 ? 1 : -1, t0 = rng() * Math.PI * 2, dt = .55 + rng() * .35;
  const w = pickOne([3, 4], rng), h = pickOne([3, 4], rng);
  let z = 0;
  while (out.length < cfg.target && z < 26){
    const a = t0 + dir * z * dt;
    const x0 = snap(3.5 + R * Math.cos(a) - w / 2), y0 = snap(3.75 + R * .9 * Math.sin(a) - h / 2);
    for (let r = 0; r < h; r++){
      for (let c = 0; c < w; c++){
        const x = x0 + c, y = y0 + r;
        if (x < 0 || x > 6 || y < 0 || y > 6.5 || rng() > .9) continue;
        out.push({x, y, z});
      }
    }
    z++;
  }
  return out;
}

// 千层：3×3 九摞，每摞叠得很深，下一张只露出窄窄一条（看得出颜色，认不全图案），再往下紧紧压在一起
function buildColumns(rng, cfg){
  // 竖着摊多露一点；往下露时上面那张的厚边会盖住一截，再补上这截
  const out = [], tight = .05, vertical = rng() < .5, back = rng() < .5;
  const open = !vertical ? .16 : back ? .28 : .20, sign = back ? -1 : 1;
  const slots = [];
  for (const y of [0, 2.3, 4.6]) for (const x of [0, 2.4, 4.8]) slots.push({x, y});
  for (const s of shuffled(slots, rng)){
    if (out.length >= cfg.target) break;
    const depth = 10 + Math.floor(rng() * 12);
    // 压在下面的牌轮到最上面时往外挪这么多，好照样露出再下一张的一条
    const slide = sign * (open - tight), fan = vertical ? {x: 0, y: slide} : {x: slide, y: 0};
    for (let d = 0; d < depth; d++){
      const off = sign * (Math.min(d, depth - 2) * tight + Math.max(0, d - (depth - 2)) * open);
      const p = vertical ? {x: s.x, y: s.y + off, z: d} : {x: s.x + off, y: s.y, z: d};
      if (d < depth - 1) p.fan = fan;
      out.push(p);
    }
  }
  return out;
}

// 剪影：按轮廓叠，轮廓左右对称
const MASKS = [
  ['羊头', ['X.....X', 'XXXXXXX', '.XXXXX.', '.XXXXX.', '..XXX..', '..XXX..', '...X...']],
  ['爱心', ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...']],
  ['山', ['...X...', 'X..X..X', 'X..X..X', 'X..X..X', 'XXXXXXX', 'XXXXXXX', '.......']]
];
function buildMask(rng, cfg, meta){
  const [name, m] = pickOne(MASKS, rng);
  meta.label = '剪影·' + name;
  const on = (r, c) => r >= 0 && c >= 0 && r < 7 && c < 7 && m[r][c] === 'X';
  const out = [];
  let z = 0;
  while (out.length < cfg.target && z < 14){
    const [ox, oy] = [[0, 0], [.5, .5], [.5, 0], [0, .5]][z % 4];
    const dens = Math.max(.6, .95 - z * .04);
    const cols = ox ? 6 : 7, rows = oy ? 6 : 7;
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < Math.ceil(cols / 2); c++){
        const ok = on(r, c) && (!ox || on(r, c + 1)) && (!oy || on(r + 1, c)) && (!ox || !oy || on(r + 1, c + 1));
        if (!ok || rng() > dens) continue;
        const mc = cols - 1 - c;
        out.push({x: c + ox, y: r + oy, z});
        if (mc !== c) out.push({x: mc + ox, y: r + oy, z});
      }
    }
    z++;
  }
  return out;
}

// 砖墙：一行错开半张，像砌砖；宽而浅
function buildBricks(rng, cfg){
  const out = [], top = snap(rng() * 1.5), bot = 6.5 - snap(rng() * 1.5);
  let z = 0;
  while (out.length < cfg.target && z < 10){
    const oy = (z % 4 >= 2) ? .5 : 0, holes = .05 + rng() * .15;
    for (let y = top + oy, row = 0; y <= bot; y += 1, row++){
      const ox = ((row + z) % 2) * .5, cols = ox ? 6 : 7;
      for (let c = 0; c < cols; c++){
        if (rng() < holes) continue;
        out.push({x: c + ox, y, z});
      }
    }
    z++;
  }
  return out;
}

// 图案、花纹：在 14×14 的半格上画轮廓（一张牌占 2×2 格），一层层往上叠。u、v 是格子中心在 -1～1 里的坐标
const TAU = Math.PI * 2;
const inCircle = (u, v, x, y, r) => (u - x) ** 2 + (v - y) ** 2 < r * r;
function inPoly(pts, u, v){
  let ins = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++){
    const [xi, yi] = pts[i], [xj, yj] = pts[j];
    if ((yi > v) !== (yj > v) && u < (xj - xi) * (v - yi) / (yj - yi) + xi) ins = !ins;
  }
  return ins;
}
const STAR = Array.from({length: 10}, (_, k) => { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? .45 : 1.02; return [Math.cos(a) * r, Math.sin(a) * r + .1]; });
// 图案：每层都是同一个轮廓，镂空的地方（铜钱的方孔、鱼和猫的眼睛）一直空着
const PICS = [
  ['铜钱', (u, v) => Math.hypot(u, v) < .98 && (Math.abs(u) > .3 || Math.abs(v) > .3)],
  ['星星', (u, v) => inPoly(STAR, u, v)],
  ['月牙', (u, v) => inCircle(u, v, 0, 0, .96) && !inCircle(u, v, .44, -.2, .74)],
  ['爱心', (u, v) => { const x = u * 1.2, y = -v * 1.2 + .28; return (x * x + y * y - 1) ** 3 - x * x * y ** 3 < 0; }],
  ['花朵', (u, v) => { const r = Math.hypot(u, v); return r < .48 + .5 * Math.abs(Math.cos(2.5 * Math.atan2(v, u))) && r > .2; }],
  ['小鱼', (u, v) => (((u + .16) / .68) ** 2 + (v / .48) ** 2 < 1 || (u > .3 && u < .99 && Math.abs(v) < (u - .3) * 1.1)) && !inCircle(u, v, -.5, -.1, .17)],
  ['猫咪', (u, v) => (inCircle(u, v, 0, .2, .74) || inPoly([[-.74, 0], [-.66, -.96], [-.16, -.46]], u, v) || inPoly([[.74, 0], [.66, -.96], [.16, -.46]], u, v)) && !inCircle(u, v, -.3, .14, .16) && !inCircle(u, v, .3, .14, .16)],
  ['葫芦', (u, v) => inCircle(u, v, 0, -.4, .42) || inCircle(u, v, 0, .4, .6) || (Math.abs(u) < .16 && v > -.99 && v < -.7)],
  ['苹果', (u, v) => (inCircle(u, v, -.27, .16, .64) || inCircle(u, v, .27, .16, .64) || ((u - .32) / .3) ** 2 + ((v + .8) / .16) ** 2 < 1) && !inCircle(u, v, 0, -.58, .2)],
  ['灯笼', (u, v) => (u / .86) ** 2 + (v / .64) ** 2 < 1 || (Math.abs(u) < .4 && Math.abs(v) < .86) || (Math.abs(u) < .16 && v >= .86)],
  ['云朵', (u, v) => inCircle(u, v, -.52, .22, .38) || inCircle(u, v, -.05, -.14, .5) || inCircle(u, v, .5, .14, .42) || (Math.abs(u) < .84 && v > .12 && v < .56)],
  ['蝴蝶结', (u, v) => inPoly([[-.98, -.7], [-.98, .7], [-.05, .12], [-.05, -.12]], u, v) || inPoly([[.98, -.7], [.98, .7], [.05, .12], [.05, -.12]], u, v) || (Math.abs(u) < .26 && Math.abs(v) < .3)]
];
// 花纹：每一层换一种（隔层错开），叠起来像编出来的
const WEAVES = [
  ['棋盘', (c, r, z) => (Math.floor(c / 4) + Math.floor(r / 4) + z) % 2 === 0],
  ['同心', (c, r, z) => Math.floor(Math.max(Math.abs(c - 6.5), Math.abs(r - 6.5)) / 2) % 2 === z % 2],
  ['斜纹', (c, r, z) => Math.floor((c + r + z * 2) / 4) % 2 === 0],
  ['菱格', (c, r, z) => Math.floor((Math.abs(c - 6.5) + Math.abs(r - 6.5)) / 3) % 2 === z % 2],
  ['波纹', (c, r, z) => Math.floor((r + 2.4 * Math.sin((c + z * 1.5) / 14 * TAU) + 20) / 4) % 2 === 0]
];
function gridOf(fn, z){
  const g = [];
  for (let r = 0; r < 14; r++){ let s = ''; for (let c = 0; c < 14; c++) s += fn((c + .5) / 7 - 1, (r + .5) / 7 - 1, c, r, z) ? 'X' : '.'; g.push(s); }
  return g;
}
function placeLayer(rng, g, ox, oy, dens){
  const on = (r, c) => r >= 0 && c >= 0 && r < 14 && c < 14 && g[r][c] === 'X', out = [];
  for (let y = oy; (y + 1) * 2 <= 14; y++)
    for (let x = ox; (x + 1) * 2 <= 14; x++)
      if (on(y * 2, x * 2) && on(y * 2, x * 2 + 1) && on(y * 2 + 1, x * 2) && on(y * 2 + 1, x * 2 + 1) && rng() < dens) out.push({x, y});
  return out;
}
// 最上面两层照完整的轮廓铺满（不缺牌），图案一眼看得出；下面的层随机少几张、一层层错开半张，凑够张数，多出来的从最底下拿掉
function stackGrids(rng, cfg, topGrid, lowGrid){
  const tops = [placeLayer(rng, topGrid(1), .5, .5, 1), placeLayer(rng, topGrid(0), 0, 0, 1)];
  const need = cfg.target - tops[0].length - tops[1].length, lows = [];
  let n = 0;
  for (let k = 0; n < need && k < 30; k++){
    const z = lows.length, [ox, oy] = OFFSETS[(z + k) % 4], l = placeLayer(rng, lowGrid(z), ox, oy, .9);
    if (!l.length) continue;
    lows.push(l); n += l.length;
  }
  for (let z = 0, extra = n - need; extra > 0 && z < lows.length; z++){
    const cut = Math.min(extra, lows[z].length - 1);
    lows[z] = shuffled(lows[z], rng).slice(cut);
    extra -= cut;
  }
  const out = [];
  lows.forEach((l, z) => { for (const p of l) out.push({x: p.x, y: p.y, z}); });
  tops.forEach((l, k) => { for (const p of l) out.push({x: p.x, y: p.y, z: lows.length + k}); });
  return out;
}
function buildPic(rng, cfg, meta){
  const [name, f] = pickOne(PICS, rng), g = gridOf(f, 0);
  meta.label = '图案·' + name;
  return stackGrids(rng, cfg, () => g, () => g);
}
function buildWeave(rng, cfg, meta){
  const [name, f] = pickOne(WEAVES, rng), gs = [0, 1, 2, 3].map(z => gridOf((u, v, c, r) => f(c, r, z), z));
  meta.label = '花纹·' + name;
  return stackGrids(rng, cfg, z => gs[z % 4], z => gs[z % 4]);
}

/* ---------- 分散的摆法：一摞摞分开放，中间留出空地 ---------- */
// 一摞：最上面那张在 (x, y)，往下每张朝 dir 挪一点：上面三张各露出一条，再往下压紧
function pushStack(out, x, y, depth, dir, open = .22, tight = .025){
  const maxOff = Math.min(depth - 1, 3) * open + Math.max(0, depth - 4) * tight;
  // 整摞（连同露出来的部分）都要在牌桌里
  x = Math.max(Math.max(0, -dir[0] * maxOff), Math.min(6 - Math.max(0, dir[0] * maxOff), x));
  y = Math.max(Math.max(0, -dir[1] * maxOff), Math.min(6.4 - Math.max(0, dir[1] * maxOff), y));
  for (let d = 0; d < depth; d++){
    const k = depth - 1 - d, off = Math.min(k, 3) * open + Math.max(0, k - 3) * tight;
    out.push({x: x + dir[0] * off, y: y + dir[1] * off, z: d});
  }
}
const unitVec = (dx, dy) => { const l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
// 把要摆的张数分给几摞，深浅不一
function depthsFor(rng, n, total){
  const w = Array.from({length: n}, () => .7 + rng() * .6), sw = w.reduce((a, b) => a + b, 0);
  return w.map(v => Math.max(3, Math.round(total * v / sw)));
}
// 散落：七到十摞随便散开，彼此离得远远的
function buildScatter(rng, cfg){
  const n = 7 + Math.floor(rng() * 4), pts = [];
  for (let g = 0; pts.length < n && g < 800; g++){
    const x = .2 + rng() * 5.6, y = .2 + rng() * 6;
    if (pts.every(p => Math.hypot(p.x - x, p.y - y) > 1.7)) pts.push({x, y});
  }
  const out = [], ds = depthsFor(rng, pts.length, cfg.target), dirs = [[0, 1], [1, 1], [-1, 1], [1, 0], [-1, 0], [0, -1]];
  pts.forEach((p, i) => pushStack(out, p.x, p.y, ds[i], unitVec(...pickOne(dirs, rng))));
  return out;
}
// 一圈：一圈小塔围着空的中心，底下的牌朝外（或朝里）露出来，像向日葵
function buildCircle(rng, cfg){
  const n = pickOne([8, 9, 10], rng), r = 2.05 + rng() * .25, out_ = rng() < .6 ? 1 : -1, a0 = rng() * TAU, core = rng() < .4;
  const out = [], ds = depthsFor(rng, n + (core ? 1 : 0), cfg.target);
  for (let i = 0; i < n; i++){
    const a = a0 + i / n * TAU, dx = Math.cos(a), dy = Math.sin(a);
    pushStack(out, 3 + dx * r, 3.2 + dy * r, ds[i], [dx * out_, dy * out_]);
  }
  if (core) pushStack(out, 3, 3.2, ds[n], [0, 1], .12);
  return out;
}
// 阶梯：沿对角线一级级往上；有时两道并排
function buildStairs(rng, cfg){
  const twin = rng() < .5, steps = twin ? 6 : 7, out = [], ds = depthsFor(rng, steps * (twin ? 2 : 1), cfg.target);
  for (let i = 0; i < steps; i++){
    const x = .2 + i * (twin ? .95 : .93), y = 6.1 - i * (twin ? .7 : .95);
    pushStack(out, x, y, ds[i], [0, 1]);
    if (twin) pushStack(out, x + .9, y - 2.3, ds[steps + i], [0, 1]);
  }
  return out;
}
// 三行：三四排小摞，排和排之间空开，上下两排朝不同方向露
function buildRows(rng, cfg){
  const rows = rng() < .5 ? 3 : 4, cols = pickOne([4, 5], rng), out = [], ds = depthsFor(rng, rows * cols, cfg.target);
  const gapX = 6 / (cols - 1), gapY = 6 / (rows - 1);
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++) pushStack(out, c * gapX, r * gapY + .1, ds[r * cols + c], [0, r % 2 ? -1 : 1]);
  return out;
}
// 扇面：一道弧线像孔雀开屏，底下的牌朝弧心露出来；弧心再放一摞
function buildFan(rng, cfg){
  const n = pickOne([7, 8, 9], rng), r = 2.9, cx = 3, cy = 4.5, out = [], ds = depthsFor(rng, n + 1, cfg.target);
  for (let i = 0; i < n; i++){
    const a = Math.PI * (1.08 + .84 * i / (n - 1)), dx = Math.cos(a), dy = Math.sin(a);
    pushStack(out, cx + dx * r, cy + dy * r * .95, ds[i], [-dx, -dy]);
  }
  pushStack(out, cx, cy + .6, ds[n], [0, 1], .14);
  return out;
}
// 格子窗：牌和牌之间留着缝，隔一层斜着错开半格，像窗格
function buildLattice(rng, cfg){
  const out = [], gap = pickOne([1.4, 1.5], rng);
  for (let z = 0; out.length < cfg.target && z < 20; z++){
    const o = z % 2 ? gap / 2 : 0;
    for (let y = o; y <= 6.4; y += gap)
      for (let x = o; x <= 6.01; x += gap)
        if (rng() < .94) out.push({x, y, z});
  }
  return out;
}
// 乱叠：照羊了个羊的办法——位置以 1/3 张为单位随手撒，同一层的牌不互相压，层和层之间随便压。
// 堆的样子有四种：一大堆（每层从一边往里收，越往上越挤）、两堆（左右各一堆）、漂（小范围每层随便挪一点，堆成歪歪扭扭的一坨）、长条（一条乱带子）
function buildMessy(rng, cfg, meta){
  const s3 = v => Math.round(v * 3) / 3, mode = pickOne(['heap', 'heap', 'twin', 'drift', 'band'], rng);
  meta.label = {heap: '乱叠·一大堆', twin: '乱叠·两堆', drift: '乱叠·漂', band: '乱叠·长条'}[mode];
  const box = (x0, y0, x1, y1) => ({x0, y0, x1, y1, side: Math.floor(rng() * 4)});
  const shrink = (b, step) => {
    if (b.side === 0) b.x0 += step; else if (b.side === 1) b.y1 -= step; else if (b.side === 2) b.x1 -= step; else b.y0 += step;
    b.side = (b.side + 1) % 4;
  };
  // 暗堆：像羊了个羊那样叠得很紧的一摞，只露出最上面一张，底下的只看得见一道道边
  const hidden = [], deep = () => 7 + Math.floor(rng() * 8), sides = (mode === 'heap' || mode === 'drift') && rng() < .75;
  const tight = (x, y, dir) => hidden.push({x, y, dir, n: deep()});
  if (sides){ tight(0, s3(rng() * 1.6), [0, 1]); tight(6, s3(rng() * 1.6), [0, 1]); }
  if (mode === 'twin' && rng() < .8) tight(2.83, s3(.4 + rng() * 1.6), [0, 1]);
  if (mode === 'band' && rng() < .8){ tight(s3(rng() * 2), 0, [1, 0]); tight(s3(3 + rng() * 1.6), 5.4, [-1, 0]); }
  const lo = sides ? 1.33 : 0, hi = sides ? 4.67 : 6;
  let boxes;
  if (mode === 'heap') boxes = [box(lo, 0, hi, 6.4)];
  // 两堆中间空出一张多，好放一摞暗牌；长条上下各留一行
  else if (mode === 'twin') boxes = [box(0, s3(rng() * 1.4), 1.67, s3(4.6 + rng() * 1.6)), box(4.33, s3(rng() * 1.4), 6, s3(4.6 + rng() * 1.6))];
  else if (mode === 'band'){ const y = s3(1.33 + rng() * .67); boxes = [box(0, y, 6, y + 2)]; }
  else boxes = [box(s3(lo + rng() * (sides ? .6 : 2.4)), s3(rng() * 2.6), 0, 0)];
  if (mode === 'drift'){ const b = boxes[0]; b.x1 = b.x0 + s3(Math.min(hi - b.x0, 3 + rng() * 1.2)); b.y1 = b.y0 + s3(3 + rng() * 1.2); }
  const out = [], step = pickOne([1 / 3, 2 / 3], rng);
  for (let z = 0; out.length < cfg.target && z < 44; z++){
    const b = boxes[z % boxes.length], layer = [];
    const room = (b.x1 - b.x0 + 1) * (b.y1 - b.y0 + 1), want = Math.max(3, Math.min(6 + Math.floor(rng() * 9), Math.floor(room * .45)));
    for (let g = 0; layer.length < want && g < want * 40; g++){
      const x = s3(b.x0 + rng() * (b.x1 - b.x0)), y = s3(b.y0 + rng() * (b.y1 - b.y0));
      if (layer.some(p => Math.abs(p.x - x) < 1 && Math.abs(p.y - y) < 1)) continue;
      layer.push({x, y, z});
    }
    out.push(...layer);
    if (mode === 'drift'){
      // 整块随便挪一点，别挪出牌桌
      const dx = s3((rng() - .5) * 1.4), dy = s3((rng() - .5) * 1.4), w = b.x1 - b.x0, h = b.y1 - b.y0;
      b.x0 = Math.max(lo, Math.min(hi - w, b.x0 + dx)); b.y0 = Math.max(0, Math.min(6.4 - h, b.y0 + dy)); b.x1 = b.x0 + w; b.y1 = b.y0 + h;
    } else if (mode === 'band'){
      if (b.side % 2 === 0) shrink(b, step); else b.side = (b.side + 1) % 4;
      if (b.x1 - b.x0 < 2.5){ b.x0 = s3(rng()); b.x1 = s3(5 + rng()); }
    } else {
      shrink(b, step);
      if (b.x1 - b.x0 < 1.5 || b.y1 - b.y0 < 1.5){ const w = mode === 'twin' ? 1.67 : Math.min(hi - lo, 4 + rng() * 2); b.x0 = mode === 'twin' ? (z % 2 ? 4.33 : 0) : s3(lo + rng() * (hi - lo - w)); b.x1 = s3(b.x0 + w); b.y0 = s3(rng() * 1.6); b.y1 = s3(4.4 + rng() * 2); }
    }
    if (z === 0) cfg = Object.assign({}, cfg, {target: cfg.target - hidden.reduce((a, h) => a + h.n, 0)});
  }
  const heap = out.slice(0, cfg.target);
  // 暗堆放在乱堆旁边，层号从 0 开始（和乱堆不重叠，谁压谁不受影响）
  for (const h of hidden) pushStack(heap, h.x, h.y, h.n, h.dir, .09, .09);
  return heap;
}

// 抽摆法：按权重抽。乱叠（照羊了个羊那样随手撒）最常见，约三分之一；分散的几种各两份；挤成一团的各一份
const SPREAD = new Set(['scatter', 'circle', 'stairs', 'rows', 'fan', 'lattice', 'islands', 'towers']);
const archW = a => a.w || (SPREAD.has(a.id) ? 2 : 1);
const ARCH_W = ARCHES.reduce((s, a) => s + archW(a), 0);
function archOf(seed){
  let r = rngFrom((seed ^ 0x2c1b3c6d) >>> 0)() * ARCH_W;
  for (const a of ARCHES){ r -= archW(a); if (r < 0) return a; }
  return ARCHES[ARCHES.length - 1];
}

  {name: '倒影', desc: '每一行右边那摞是左边那摞的倒影，同样的牌、顺序反过来', build: buildMirror, rule: {mirror: true}}
];


// 倒影：五行，每行左边一摞千层、右边是它的倒影（同样的牌，上下顺序反过来），两摞最上面那张隔着中线对着
function buildMirror(cfg, seed){
  const rng = rngFrom(seed), tight = .05, open = .16, rows = 5;
  const depths = Array.from({length: rows}, () => 10 + Math.floor(rng() * 8));
  while (depths.reduce((a, b) => a + b, 0) % 3) depths[Math.floor(rng() * rows)]++;
  const pos = [], stacks = [], twins = [];
  depths.forEach((n, r) => {
    const left = [], right = [];
    for (let d = 0; d < n; d++){
      const along = Math.min(d, n - 2) * tight + Math.max(0, d - (n - 2)) * open;
      const x = 2.3 - ((n - 2) * tight + open) + along, y = r * 1.45, slide = open - tight;
      left.push(pos.length);
      pos.push({x, y, z: d, fan: d < n - 1 ? {x: slide, y: 0} : null});
      right.push(pos.length);
      pos.push({x: 6 - x, y, z: d, fan: d < n - 1 ? {x: -slide, y: 0} : null});
    }
    stacks.push(left.slice().reverse(), right.slice().reverse());  // 从上往下
    for (let d = 0; d < n; d++) twins.push([left[d], right[n - 1 - d]]);
  });
  const tiles = makeTiles(centerMain(pos, false));
  const twin = new Map(twins.flatMap(([a, b]) => [[a, b], [b, a]]));
  const leftPool = stacks.filter((_, i) => i % 2 === 0).flat().map(id => tiles[id]);
  const cap = cfg.cap || CAP;
  for (let attempt = 0; attempt < 30; attempt++){
    // 只给左边配牌（按闯关的办法保证左边能清空），右边的图案跟着倒影定下来
    const kinds = shuffled(ICONS.map((_, i) => i), rng).slice(0, 12), supply = {};
    for (let i = 0; i < leftPool.length / 3; i++) supply[kinds[i % kinds.length]] = (supply[kinds[i % kinds.length]] || 0) + 3;
    const res = plan(leftPool, {supply, slot: [], hold: [], interleave: .35, maxSlot: 3, cap, rng});
    if (!res) continue;
    for (const t of leftPool) tiles[twin.get(t.id)].type = t.type = res.assign.get(t.id);
    // 一条保证走得通的路线：先照着拿完左边，再按相反的顺序拿右边（正好是右边从上往下）
    const order = res.order.concat(res.order.slice().reverse().map(id => twin.get(id)));
    if (verify(tiles, order, cap)) return {tiles, cfg, label: '倒影'};
  }
  return null;
}

// 底部的牌摞：0～3 摞，只有最上面一张能拿
function pilePlan(rng, amount){
  const r = rng();
  const n = r < .08 ? 0 : r < .25 ? 1 : r < .7 ? 2 : 3;
  const cap = [0, 24, 20, 11][n], out = [];
  for (let i = 0; i < n; i++){
    const each = Math.round(amount / n * (.75 + rng() * .45));
    out.push({slot: n === 1 ? 'mid' : n === 2 ? (i ? 'right' : 'left') : ['left', 'mid', 'right'][i], n: Math.max(4, Math.min(cap, each))});
  }
  return out;
}
function pilePositions(piles){
  const out = [];
  for (const p of piles){
    const x0 = p.slot === 'mid' ? (piles.length === 1 ? 3 - (p.n - 1) * .105 / 2 : 2.45) : 0;
    for (let i = 0; i < p.n; i++){
      const x = p.slot === 'right' ? 6 - i * .105 : p.slot === 'left' ? i * .105 : x0 + i * .105;
      out.push({x, y: 7.62, z: i, pile: true});
    }
  }
  return out;
}

// 把主牌堆挪到牌桌正中（有牌摞时只用上面 7.5 格高）
function centerMain(pos, hasPiles){
  if (!pos.length) return pos;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of pos){
    x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x + 1);
    y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y + 1);
  }
  const availH = hasPiles ? 7.5 : 8.6;
  const dx = (BW - (x1 - x0)) / 2 - x0, dy = Math.max(0, (availH - (y1 - y0)) / 2) - y0;
  return pos.map(p => Object.assign({}, p, {x: p.x + dx, y: p.y + dy}));
}

function makeLayout(rng, cfg, arch){
  const piles = cfg.fixedPiles ? cfg.fixedPiles.map(p => Object.assign({}, p)) : pilePlan(rng, cfg.piles * 2);
  const pileSum = piles.reduce((s, p) => s + p.n, 0);
  const meta = {label: arch.name};
  let main = arch.build(rng, Object.assign({}, cfg, {target: cfg.target + cfg.piles * 2 - pileSum}), meta);
  if (arch.flip){
    if (rng() < .5) main = main.map(p => ({x: 6 - p.x, y: p.y, z: p.z}));
    if (rng() < .5) main = main.map(p => ({x: p.x, y: 6.5 - p.y, z: p.z}));
  }
  main = centerMain(main, piles.length > 0);
  const extra = (3 - (main.length + pileSum) % 3) % 3;
  if (piles.length) piles[piles.length - 1].n += extra;
  else if (extra){
    main = main.sort((a, b) => a.z - b.z);
    // 千层每摞最上面那张是露出一条的，凑张数时从最底下拿，别把它拿走
    main = arch.trimBottom ? main.slice(3 - extra) : main.slice(0, main.length - (3 - extra));
  }
  return {pos: main.concat(pilePositions(piles)), label: meta.label};
}

function makeTiles(pos){
  const tiles = pos.map((p, id) => ({
    id, x: p.x, y: p.y, z: p.z, pile: !!p.pile, fan: p.fan || null, type: -1, status: 'board', pending: false,
    covers: [], coveredBy: [], el: null, art: null, shown: -1, si: 0, hc: 0, hd: 0
  }));
  for (let i = 0; i < tiles.length; i++){
    const a = tiles[i];
    for (let j = i + 1; j < tiles.length; j++){
      const b = tiles[j];
      if (a.z === b.z || Math.abs(a.x - b.x) > .999 || Math.abs(a.y - b.y) > .999) continue;
      const hi = a.z > b.z ? a : b, lo = hi === a ? b : a;
      hi.covers.push(lo);
      lo.coveredBy.push(hi);
    }
  }
  return tiles;
}

/* ---------- 保证有解：先模拟一条通关路线，再按路线给每张牌定图案 ----------
   每一步从“此刻没被压住”的牌里挑一张，决定它是什么图案，模拟把它放进口袋。
   只要模拟过程中口袋从不放满，这条路线就是一条真实可走的通关路线。 */
function plan(pool, o){
  const rng = o.rng, full = o.cap || CAP, cap = Math.min(o.maxSlot, full - 1);
  const inPool = new Set(pool.map(t => t.id));
  const cnt = new Map(), free = [];
  for (const t of pool){
    let c = 0;
    for (const a of t.coveredBy) if (inPool.has(a.id)) c++;
    cnt.set(t.id, c);
    if (!c) free.push(t);
  }
  const supply = new Map(Object.entries(o.supply).map(([k, v]) => [Number(k), v]));
  const hold = o.hold.slice();
  const slot = new Map();
  let slotLen = 0;
  for (const ty of o.slot){ slot.set(ty, (slot.get(ty) || 0) + 1); slotLen++; }
  const assign = new Map(), order = [];
  let left = pool.length;
  const avail = ty => (supply.get(ty) || 0) + hold.filter(h => h === ty).length;
  // 排队：口袋按先后排成一摞，只能接着凑最后开的那种，或者再开一种口袋里还没有的
  const stack = [];
  if (o.queue) for (const ty of o.slot){
    const top = stack[stack.length - 1];
    if (top && top.ty === ty) top.c++; else stack.push({ty, c: 1});
  }

  while (left > 0 || hold.length){
    const twos = [], ones = [], opens = [];
    for (const [ty, c] of slot) if (avail(ty) > 0) (c === 2 ? twos : ones).push(ty);
    const seen = new Set(slot.keys());
    for (const ty of [...supply.keys(), ...hold]){
      if (seen.has(ty)) continue;
      seen.add(ty);
      if (avail(ty) > 0) opens.push(ty);
    }
    const canOpen = opens.length > 0 && slotLen + 1 <= cap;
    const pickOpen = () => {
      let w = 0;
      for (const t of opens) w += avail(t);
      let r = rng() * w;
      for (const t of opens){ r -= avail(t); if (r < 0) return t; }
      return opens[opens.length - 1];
    };
    let ty;
    if (o.queue){
      const top = stack[stack.length - 1];
      if (top && avail(top.ty) > 0 && !(canOpen && rng() < o.interleave)) ty = top.ty;
      else if (canOpen) ty = pickOpen();
      else return null;
    } else if (canOpen && (slotLen === 0 || rng() < o.interleave)) ty = pickOpen();
    else if (twos.length) ty = pickOne(twos, rng);
    else if (ones.length && slotLen + 1 < full) ty = pickOne(ones, rng);
    else if (canOpen) ty = pickOne(opens, rng);
    else return null;

    const hi = hold.indexOf(ty);
    if (hi >= 0){
      hold.splice(hi, 1);
      order.push(-1);
    } else {
      if (!free.length) return null;
      const i = Math.floor(rng() * free.length), t = free[i];
      free[i] = free[free.length - 1];
      free.pop();
      assign.set(t.id, ty);
      supply.set(ty, supply.get(ty) - 1);
      left--;
      order.push(t.id);
      for (const b of t.covers){
        if (!inPool.has(b.id)) continue;
        const c = cnt.get(b.id) - 1;
        cnt.set(b.id, c);
        if (!c) free.push(b);
      }
    }
    const c = (slot.get(ty) || 0) + 1;
    if (c === 3){ slot.delete(ty); slotLen -= 2; } else { slot.set(ty, c); slotLen++; }
    if (o.queue){
      const top = stack[stack.length - 1];
      if (top && top.ty === ty){ if (++top.c === 3) stack.pop(); } else stack.push({ty, c: 1});
    }
    if (slotLen >= full) return null;
  }
  return {assign, order};
}

// 按真实规则把路线走一遍，确认能清空
function verify(tiles, order, full = CAP){
  const onBoard = new Set(tiles.map(t => t.id));
  const slot = [];
  for (const id of order){
    const t = tiles[id];
    if (!t || !onBoard.has(id) || t.coveredBy.some(a => onBoard.has(a.id))) return false;
    onBoard.delete(id);
    slot.push(t.type);
    if (slot.filter(x => x === t.type).length === 3){
      for (let k = 0; k < 3; k++) slot.splice(slot.indexOf(t.type), 1);
    } else if (slot.length >= full) return false;
  }
  return onBoard.size === 0 && slot.length === 0;
}

// 排队的规则：只有口袋最后三张一样才消
function verifyQueue(tiles, order, full = CAP){
  const slot = [];
  for (const id of order){
    slot.push(id < 0 ? null : tiles[id].type);
    const n = slot.length;
    if (n >= 3 && slot[n - 1] !== null && slot[n - 1] === slot[n - 2] && slot[n - 2] === slot[n - 3]) slot.length -= 3;
    else if (n >= full) return false;
  }
  return slot.length === 0;
}

// 定时炸弹：沿着算好的通关路线走一遍，看每张牌从进口袋到被消掉隔了几步；
// 只挑隔 2～8 步的牌当炸弹，倒数的数字再多留一两步，保证照这条路线走一颗都不会炸
function pickBombs(tiles, order, rng, count){
  const slot = [], at = new Map(), gone = new Map();
  order.forEach((id, i) => {
    const t = tiles[id];
    at.set(id, i);
    slot.push(t);
    const same = slot.filter(x => x.type === t.type);
    if (same.length === 3) for (const x of same){ gone.set(x.id, i); slot.splice(slot.indexOf(x), 1); }
  });
  const cands = shuffled(tiles.filter(t => {
    const d = gone.get(t.id) - at.get(t.id);
    return !t.pile && d >= 2 && d <= 8;
  }), rng);
  for (const t of cands.slice(0, count)) t.bomb = Math.min(9, gone.get(t.id) - at.get(t.id) + 1 + (rng() < .4 ? 1 : 0));
}

/* ---------- 关卡 ---------- */
function levelCfg(level){
  if (level <= 1) return {intro: true, interleave: 0, maxSlot: 3};
  const k = Math.min(level - 2, 4);
  return {
    intro: false, types: Math.min(12 + 2 * k, 16), target: 150 + 20 * k, maxLayers: 8 + k,
    density: .85, piles: 10 + 2 * k, interleave: .3 + .06 * k, maxSlot: k ? 5 : 4
  };
}

function buildLevel(level, seed){
  return buildWith(levelCfg(level), seed, archOf(seed));
}
function buildWith(cfg, seed, arch){
  for (let attempt = 0; attempt < 40; attempt++){
    const rng = rngFrom(seed + attempt * 7919);
    let pos, types;
    let label = '热身';
    if (cfg.intro){
      pos = introLayout();
      types = [0, 1, 4];
    } else {
      const lay = makeLayout(rng, cfg, arch);
      pos = lay.pos;
      label = lay.label;
      const tc = Math.max(10, Math.min(16, cfg.types + pickOne([-1, 0, 0, 1], rng)));
      types = shuffled(ICONS.map((_, i) => i), rng).slice(0, tc);
    }
    const tiles = makeTiles(pos);
    const supply = {};
    for (let i = 0; i < tiles.length / 3; i++){
      const ty = types[i % types.length];
      supply[ty] = (supply[ty] || 0) + 3;
    }
    const res = plan(tiles, {supply, slot: [], hold: [], interleave: cfg.interleave, maxSlot: cfg.maxSlot, cap: cfg.cap, queue: cfg.queue, rng});
    if (!res) continue;
    for (const t of tiles) t.type = res.assign.get(t.id);
    if (!verify(tiles, res.order, cfg.cap || CAP)) continue;
    if (cfg.queue && !verifyQueue(tiles, res.order, cfg.cap || CAP)) continue;
    if (cfg.bombs) pickBombs(tiles, res.order, rng, cfg.bombs);
    return {tiles, cfg, label};
  }
  return null;
}

function startClock(){ if (!G.running){ G.t0 = performance.now(); G.running = true; } }

const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const tf = (x, y, s) => `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(+s).toFixed(3)})`;

// 牌在牌堆、口袋、架子之间移动时走一道弧线：先抬起、在空中略放大，落下时轻轻一顿
function flyArc(t, x0, y0, s0, x1, y1, s1){
  const el = t.el;
  if (!el.animate) return;
  if (t.anim){ t.anim.cancel(); t.anim = null; }
  const lift = Math.min(64, 14 + Math.hypot(x1 - x0, y1 - y0) * .16), ms = Math.max(s0, s1) * 1.1;
  el.classList.add('flying');
  const shadow = k => `drop-shadow(0 ${(10 * k).toFixed(1)}px ${(12 * k).toFixed(1)}px rgba(0,0,0,${(.28 * k).toFixed(3)}))`;
  const a = el.animate([
    {transform: tf(x0, y0, s0), filter: shadow(0)},
    {transform: tf((x0 + x1) / 2, (y0 + y1) / 2 - lift, ms), filter: shadow(1), offset: .5},
    {transform: tf(x1, y1 + 2, s1 * 1.05), filter: shadow(.25), offset: .86},
    {transform: tf(x1, y1, s1), filter: shadow(0)}
  ], {duration: 320, easing: 'cubic-bezier(.3,.6,.35,1)'});
  t.anim = a;
  const done = () => { if (t.anim === a){ t.anim = null; el.classList.remove('flying'); } };
  a.onfinish = done;
  a.oncancel = done;
  setTimeout(() => { if (t.anim === a) el.classList.remove('flying'); }, 380);
}
